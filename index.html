data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAABwBQCdASoUABkAPu1srFEppaQiqAqpMB2JZgC2yYzQWzv5yheMrwfc/pKYbjq+91gGg3mgAP6x3HjXEVpjKNumF/aBTo/aMjkr7WWFtR17rWH1APfg4oVX6q0hooTE9KHQrPQvUbYTMMn/VvLPm1AVf+T7ws1M4sKtiglSCJwOihlgxBOq3D4JeLXPttEAGNbP8kZqChcgMSbLJ9/f0xHHqLxsXpYYzvL2P4bfGqqO8Bcp7tcyYyt04F53/mUPeQfblGxM/wAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спагетти 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 45 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пекорино романо (или пармезан) 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: Классические spaghetti al limone чаще всего готовят без сливок — соус строится на эмульсии из сливочного масла, сыра и крахмалистой воды от пасты. Я сознательно добавляю немного сливок: они делают эмульсию более стабильной, особенно если вместо пекорино используется пармезан, а соус получается невероятно шелковистым. Это не попытка исправить классику, просто одна из множества домашних итальянских вариаций.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Пекорино романо (или пармезан) заранее натереть на самой мелкой терке — сыр должен практически превратиться в воздушный порошок.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лимон тщательно вымыть. С помощью овощечистки снять 2 широкие полоски цедры и отложить их для подачи. Оставшуюся цедру натереть на микроплане сразу в сотейник или глубокую сковороду. Из лимона выжать сок и пока отставить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить к цедре сливки, прогреть почти до кипения (не кипятить) и снять с огня. Оставить на 5–10 минут, чтобы сливки успели впитать аромат лимона.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Затем вернуть сотейник на минимальный огонь и, постоянно работая венчиком, начать постепенно добавлять очень холодное сливочное масло, буквально по одному кубику за раз. Каждый следующий кусочек добавлять только после того, как предыдущий полностью вмешался в соус. Благодаря этому соус получится легким, шелковистым и не будет ощущаться жирным.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Тем временем довести до кипения большое количество хорошо подсоленной воды и отварить спагетти до состояния al dente. Лучше выбирать качественную пасту с длительным временем варки, она лучше удерживает соус.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Перед тем как слить воду, сохранить около стакана крахмалистой воды от варки.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Переложить спагетти прямо в лимонный соус. Добавить около 100 г воды от пасты и, постоянно перемешивая, постепенно всыпать натертый сыр. Активно перемешивать деревянной лопаткой или щипцами, пока вода, сыр, масло и сливки не превратятся в гладкую блестящую эмульсию, обволакивающую каждую спагеттину. Комкование сыра неизбежно, пусть вас это не пугает — продолжайте интенсивно, но аккуратно перемешивать. При необходимости добавить еще немного воды от пасты.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Влить 2–3 ст. л. лимонного сока, еще раз быстро перемешать и сразу же разложить пасту по тарелкам.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Полоски цедры, которые мы сохранили в самом начале, очень тонко нарезать и украсить ими спагетти. Щедро приправить свежемолотым черным перцем и подавать немедленно.</div></div></div></div>"},"622":{"id":622,"title":"Пицца с лососем","sub":"легенда Столешникового переулка","cat":"Паста и пицца","img":"thumb/0622_00_622_photo.webp","lq":"data:image/webp;base64,UklGRvYAAABXRUJQVlA4IOoAAACQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMoR8n4JxJswG5gF2AD1SVnnzlWZxaFhSFqFxsTSvKEqAAPdStpZn4c0yfmfCIkadZg0cPKnZbFaN8JtPAhMbsVy4/8RwWbRrz2WVBNRnrvFxBPyKRlisAwWYDafbZtURN79dWKXXYTVH2gQ5l4SlIHhQAy67GpZW5xyPWBxm1IeG9PGB8cj/7C4Tn1G+5I+A+7APdb9+RzEZxaDeCA/kEQFWj3zAo/dyfK8x0HK8cZ5rGNwAESWTsjhFUCac5A5MtGT7ysuqMsXSP0IYAAA=","w":360,"h":450,"q":"пицца с лососем легенда столешникового переулка на 2 пиццы диаметром 28 см тесто мука для пиццы 500 г вода 1 360 г дрожжи сухие 2 г вода 2 30 г соль 8 г не йодированная оливковое масло сливочное масло соус для пиццы томаты консервированные цельные 400 г соевый соус 1 ч л оливковое масло 1 ст л соль щепотка начинка маскарпоне 300 г бульон куриный 80 100 г уксус белый винный 1 ч л укроп горсть лосось с с подкопченый 400 г лук резанец горсть лимон соль белый перец пицца с лососем легенда столешникового переулка щёлкнуло у меня конечно внутри после того как рецепт был проработан без предисловия не обойтись denis simachev shop bar открылся в столешниковом переулке в тот же год что я поступила на факультет журналистики мгу и быстро стал центром всеобщего притяжения я только что приехала из маленького провинциального городка жила в общежитии и мечтала ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0622_00_622_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvYAAABXRUJQVlA4IOoAAACQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMoR8n4JxJswG5gF2AD1SVnnzlWZxaFhSFqFxsTSvKEqAAPdStpZn4c0yfmfCIkadZg0cPKnZbFaN8JtPAhMbsVy4/8RwWbRrz2WVBNRnrvFxBPyKRlisAwWYDafbZtURN79dWKXXYTVH2gQ5l4SlIHhQAy67GpZW5xyPWBxm1IeG9PGB8cj/7C4Tn1G+5I+A+7APdb9+RzEZxaDeCA/kEQFWj3zAo/dyfK8x0HK8cZ5rGNwAESWTsjhFUCac5A5MtGT7ysuqMsXSP0IYAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 2 пиццы диаметром ~28 см:</p><div class=\"iblock\"><p class=\"lbl\">тесто:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука для пиццы 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода (1) 360 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дрожжи сухие 2 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода (2) 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 8 г (не йодированная!)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">соус для пиццы:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консервированные цельные 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">начинка:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 80-100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый винный 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось с/с подкопченый 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Щёлкнуло у меня, конечно, внутри после того, как рецепт был проработан. Без предисловия не обойтись.</p>\n<p>Denis Simachev Shop&amp;Bar открылся в Столешниковом переулке в тот же год, что я поступила на факультет журналистики МГУ, и быстро стал центром всеобщего притяжения. Я только что приехала из маленького провинциального городка, жила в общежитии и мечтала стать господи боже главным редактором журнала Vogue. Сильно обделённой я себя не ощущала, но всё же мама присылала мне на месяц столько, сколько некоторые мои однокурсницы могли оставить за вечер в этом баре, и вот эта их баснословно дорогая по тем моим временам пицца с лососем была чем-то вроде символа мира, частью которого я так хотела стать — красивого, модного, самоуверенного, ну, в общем, очень московского.</p>\n<p>Потом — вжух! — журфак остался позади, пришла первая работа и первая зарплата, потом вторая, третья, и вот я работаю в “Афише” и хожу на классные вечеринки, знакома с кучей людей, и пицца с лососем на веранде Симача — это чисто классика субботним утром после особенно веселой ночи.</p>\n<p>И вот — год две тысячи двадцать пятый. Я на совсем другой сцене: в другой стране, с другими заботами, стою на своей кухне, растягиваю тесто, пытаюсь вспомнить, сливочная часть была из кремчиза или это было больше похоже на маскарпоне? Клянусь, я помню, как пахла горячая пицца, когда официант ставил её на стол, и вчера всё это внезапно вернулось разом: журфак, вечерние огни Москвы, шум тусовочного Столешникова, мои комплексы, юношеские слёзы по ночам из-за “несправедливости мира” и объятия знакомых людей, распахивающиеся при встрече.</p>\n<p>Я часто повторяю, что еда почти никогда не бывает для меня “просто едой”. Иногда она хранит и затем открывает крошечные дверцы: в прошлое, в старые версии себя, в города, которые ты когда-то называл домом. Вкус может вернуть радость, уверенность, память, вдохновение или то самое освобождающее чувство, что ты справилась тогда, а значит справишься и сейчас. И мне нравится думать, что когда вы будете готовить эту пиццу, в вас тоже что-то откликнется: свой Симачев, свой вечер, своя вера в себя.</p>\n<p>Ну а если нет — будет у вас, в конце концов, просто очень вкусная пицца с лососем 🙂</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Начать вечером накануне дня, когда захочется испечь пиццу. Налить 360 г воды (1) в большую миску, добавить дрожжи и муку, перемешать рукой или хлебным венчиком, доводя массу до полностью влажного состояния — без сухих вкраплений. Накрыть и оставить на 1 час при комнатной температуре.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Смешать воду (2) с солью и вылить эту смесь на тесто, смочить руки оливковым маслом и всё промешать. Накрыть, оставить на 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Вымешиваем! Принцип похож на <a class=\"xref\" href=\"#/r/624\">фокаччу</a>: слегка смочить руки холодной водой (или оливковым маслом, но мне больше нравится водой), “поднырнуть” ладонью под край теста, поднять его наверх и перекинуть к центру. Повернуть миску на 90 градусов и повторить. Сделать четыре такие складки и снова дать 15 минут отдыха.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Повторить складывание ещё раз и после этого сформировать мягкий шар. Переложить в слегка смазанную маслом миску или контейнер, плотно накрыть и убрать в холодильник на ночь.</div></div>\n<p>NEXT DAY</p>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Разогреть духовку до 250 градусов (режим: верх/низ). Тесто достать из холодильника, руками поделить на две части, из каждой сформировать приплющенный шар, присыпать немного семолиной, манкой или мукой и оставить на рабочей поверхности, отдыхать.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Продолжаем в комментариях</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Приготовить два соуса — томатный и сливочный. Для первого смешать в стакане для блендера томаты (без прилагающегося к ним сока в банке), соевый соус, оливковое масло и соль, пробить блендером импульсно, не до гладкого пюре. Отставить. Для сливочного объединить маскарпоне с куриным бульоном до состояния мягкого пластичного крема — консистенция должна напоминать густую сметану. Добавить уксус и укроп, соль, белый перец, перемешать и убрать в холодильник.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Подготовить противень или камень для пиццы. Тесто на весу растянуть руками в круг ~28 см. Можно сделать и прямоугольник, как вам больше нравится — тут сразу скажу, что в первый раз без опыта будет сложновато, поэтому перфекциониста отправляйте гулять, это всего лишь пицца! Самое важное, чтобы тесто было действительно тоненькое, иначе будет не пицца, а фокачча. Переложить на пергаментную бумагу, затем на противень или камень. Если образовались крупные пузыри, проткните их и пригладьте, иначе обуглятся от жара.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Распределить по тесту томатный соус, примерно 2-3 столовые ложки на пиццу и выпекать 15-20 минут, пока бортики не подрумянятся, а томатный слой не подсохнет.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Горячей пицце дать отдохнуть буквально 3-5 минут, затем распределить щедро сливочный соус и разложить красиво тонкие слайсы лосося.</div></div></div></div>"},"638":{"id":638,"title":"Макароны по-флотски","sub":"или казарече с мясным рагу","cat":"Паста и пицца","img":"thumb/0638_00_638_photo.webp","lq":"data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAABwBgCdASoUABkAPu1or1CppaQiqAqpMB2JbACxH2h+FftngBi8JOpw2AWucuy2UHqzvXyfRtZU6LMxXIgA/lv2nDJBH+I5VDpQSR7XQMfPyAVcAfeBZo9crBDYHoRDFPVdj7qloxaUhJJAgPHlmjT3lR13bUTb5dZAjYpluOa3+Y6xRkoZ9L88HEU6HddX1/aZljC02P2DzIJEODtElYEzS6gv3b4oqBqXbxdskdNIy/A9r1z+e4JTPcexMaVZQeSh71XwgzVcfmeUrRXy1yXe73IHll5fsc0dERU+iCWRK5x502USqM+pPxgcLpzi2e3n+/AWONW1QlSx32AbsrIE0TgAAA==","w":360,"h":449,"q":"макароны по-флотски или казарече с мясным рагу на 4 порции фарш говядина свинина 500 г морковь 1 шт сельдерей 1 стебель лук репчатый 1 шт бульон говяжий 600 г соевый соус 2 ст л вурстерширский соус 1 ст л мука 2 ст л без горки сливочное масло 20 г лавровый лист 1 шт тимьян 4 6 веточек паста казарече 300 г петрушка горсть свежемолотый черный перец соль макароны по флотски или казарече с мясным рагу особенно любимые моими детьми макароны по флотски в этой версии маленькая гастрономическая шутка с одной стороны всё ну очень по домашнему фарш лук морковка макароны блюдо из разряда разом накормил всех а с другой если чуть приглядеться то видно мы идём сложными путями через соус espagnole смесь лука моркови и сельдерея во французск","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0638_00_638_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAABwBgCdASoUABkAPu1or1CppaQiqAqpMB2JbACxH2h+FftngBi8JOpw2AWucuy2UHqzvXyfRtZU6LMxXIgA/lv2nDJBH+I5VDpQSR7XQMfPyAVcAfeBZo9crBDYHoRDFPVdj7qloxaUhJJAgPHlmjT3lR13bUTb5dZAjYpluOa3+Y6xRkoZ9L88HEU6HddX1/aZljC02P2DzIJEODtElYEzS6gv3b4oqBqXbxdskdNIy/A9r1z+e4JTPcexMaVZQeSh71XwgzVcfmeUrRXy1yXe73IHll5fsc0dERU+iCWRK5x502USqM+pPxgcLpzi2e3n+/AWONW1QlSx32AbsrIE0TgAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш (говядина+свинина) 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 1 стебель</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон говяжий 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстерширский соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 2 ст л (без горки)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 4-6 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паста казарече 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Особенно любимые моими детьми макароны по-флотски в этой версии — маленькая гастрономическая шутка. С одной стороны, всё ну очень по-домашнему: фарш, лук, морковка, макароны, блюдо из разряда “разом накормил всех”. А с другой, если чуть приглядеться, то видно — мы идём сложными путями через соус Espagnole.</p>\n<p>Смесь лука, моркови и сельдерея, во французской традиции называемую мирпуа (mirepoix), обжариваем на сливочном масле, затем вмешиваем муку и даём немного потемнеть — получается ру, основа для соуса. Следом в ход идёт насыщенный <a class=\"xref\" href=\"#/r/566\">говяжий бульон</a>, травы и томление, словом, тот же базовый каркас, что у эспаньоля, просто мы его упростили и пустили в работу вместе с фаршем. Добавили соевый и вурстерширский для глубины умами (ну а что, XXI век, гастрономия не стоит на месте) — и получили мясной соус с характером, бархатистый и насыщенный. Паста, хорошо этот соус удерживающая, здесь необходима, мне больше всего нравятся завитушки casarecce.</p>\n<p>В итоге “казарече с мясным рагу” становится чем-то средним между солдатской классикой и парижской школой. Блюдо вроде бы будничное, но внутри — благородная архитектура старого французского соуса. И вот этот контраст особенно мил моей душе: в тарелке простота и щедрость, но при этом безупречная техника и уважение к традициям высокой кухни.</p>\n<p>Соус великолепно морозится.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Установить чугунок или сковороду с высокими бортиками на сильный огонь, добавить немного оливкового масла, выложить фарш и обжарить его до уверенного румянца. Не жалеть времени, пусть появится та самая корочка, от которой появляется мясной вкус. В финале добавить соевый и вурстерширский соусы, поперчить, перемешать, переложить фарш в миску или тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Теперь — мирпуа. Лук очистить, морковь и сельдерей обмыть, очистить, всё нарезать мелким кубиком. В чугунок добавить кусочек сливочного масла, растопить, обжарить морковь, сельдерей и лук — до мягкости, около 7 минут. Добавить муку, прожарить её до орехового аромата и светло-коричневого оттенка — это наше упрощенное “ру”, которое потом сделает соус густым и бархатным.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Понемногу, например в три захода, влить бульон, каждый раз дожидаясь, пока масса согреется и немного загустеет. Вернуть фарш в чугунок, добавить лавровый лист и веточку тимьяна (или розмарина, если настроение более средиземноморское), перемешать и дать протомиться 20 минут (крышкой не накрываем, огонь — слабый). Попробовать в конце на соль, если нужно — досолить. В это же время в подсоленной воде сварить казарече до состояния al dente.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Что ж, осталось только смешать пасту с мясным соусом, дать настояться пару минут — и вуаля! Разложить по тарелкам и присыпать мелко нарезанной петрушкой или, по настроению, тертым пармезаном.</div></div></div></div>"},"652":{"id":652,"title":"Pasta con tonno","sub":"очень быстрая паста с тунцом","cat":"Паста и пицца","img":"thumb/0652_00_652_photo.webp","lq":"data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAACQBQCdASoUABkAPu1or1CppaQiqAqpMB2JbAC2yd0VhFN0TqF6gS/wn7eQaaboriTvP1MaAAD+YWn6nDLxNYZsC5ZFix/vDW/OjNTdmpexiZT6afiPmwT13C7OOhaZ5cZDivD/EgsftN2PSPJL6/qS1TtSAamXHFkXJMpiWWL+4iRKO6b8s0A+jM257+Xj8Ypw+0tYsDFns2eFem734OGv+0Ss3Hvyp182uwxszrOBzLETbfLBQGnQR0i/kIdEGsx73IC7ocW1ctmq4dQEMiyAaQAAAA==","w":360,"h":450,"q":"pasta con tonno очень быстрая паста с тунцом на 2 3 порции спагеттони 250 г тунец 240 г чеснок 2 зубчика анчоусы 4 филе помидор 2 шт каперсы 25 г 2 ст л петрушка 6 8 стеблей горчица зерненая 1 ч л соус соевый 1 ч л лимон 1 2 шт цедра вино белое сухое 40 г соль свежемолотый черный перец pasta con tonno очень быстрая паста с тунцом пожалуй в жизни каждого человека существуют гастрономические потрясения оставляющие на сердце глубокую рану которая тихонько ноет в течение долгих лет заставляя надолго забыть про существование какого то продукта или блюда так в течение десяти лет я не могла сдержать нервозное передергивание когда кто то упоминал при мне пасту с тунцом а всё пото","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0652_00_652_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAACQBQCdASoUABkAPu1or1CppaQiqAqpMB2JbAC2yd0VhFN0TqF6gS/wn7eQaaboriTvP1MaAAD+YWn6nDLxNYZsC5ZFix/vDW/OjNTdmpexiZT6afiPmwT13C7OOhaZ5cZDivD/EgsftN2PSPJL6/qS1TtSAamXHFkXJMpiWWL+4iRKO6b8s0A+jM257+Xj8Ypw+0tYsDFns2eFem734OGv+0Ss3Hvyp182uwxszrOBzLETbfLBQGnQR0i/kIdEGsx73IC7ocW1ctmq4dQEMiyAaQAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2-3 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спагеттони 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тунец 240 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы 4 филе</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидор 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 25 г (2 ст л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 6-8 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соус соевый 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вино белое сухое 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Пожалуй, в жизни каждого человека существуют гастрономические потрясения, оставляющие на сердце глубокую рану, которая тихонько ноет в течение долгих лет, заставляя надолго забыть про существование какого-то продукта или блюда. Так в течение десяти лет я не могла сдержать нервозное передергивание, когда кто-то упоминал при мне пасту с тунцом. А всё потому что однажды в какой-то голодный достаточно вечер мой сосед, с которым мы вскладчину снимали квартиру, решил приготовить эту пасту. Это было настолько плохо, что я (прямо скажем, не сильно искушенная тогда в гастрономическом плане) не смогла проглотить даже первую вилку. Это были пресные переваренные макароны, кусочки плохо обжаренного, а потому сильно пахнущего лука, сухой тунец, напоминающий текстурой и вкусом бумагу, и всё это в достаточно невнятном томатном соусе. Зафиналил воспоминание чудовищный запах рыбы, которым квартира воняла пахла еще пару дней.</p>\n<p>Преодолеть тот неудачный опыт мне помогла уверенность в своих силах и накопившийся опыт, который подтверждал, что любому продукту или блюду надо давать второй шанс. Когда я стала представлять, как выглядела бы моя идеальная паста с тунцом, в голову пришли спагетти алле вонголе — минималистичный соус, призванный не утопить, а подчеркнуть вкус моллюсков (в нашем случае тунца). Я взяла за основу классический “белый” соус — сливочное масло, чеснок, петрушку и белое вино, добавила анчоусы и соевый соус для усиления вкуса умами, тертый свежий томат и каперсы для оттеняющей кислинки, а также цедру лимона для освежающей цитрусовой ноты. Безусловно, я выбрала очень хороший тунец в оливковом масле и добавила его в самом конце, чтобы не подвергать его нежные белки тепловому воздействию. Получилось очень хорошо! А чтобы убедить вас попробовать, припасла под конец козырь для всех занятых и уставших после работы/дня с детьми. Уже со второго раза вы сможете приготовить эту пасту за пятнадцать, блин, минут! Очень вкусную, сытную, богатую белком и умеренную в плане жиров пасту за четверть часа. Погнали?</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В большую кастрюлю налить воду, добавить столовую ложку соли (без горки), довести воду до кипения и отварить пасту на одну минуту меньше, чем указано на упаковке (для спагеттони это будет 13-14 минут). Сохранить часть воды от варки пасты в конце, приблизительно 200 грамм.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Чеснок очистить и очень мелко нарезать, анчоусы обмыть и так же мелко нарезать. Помидоры натереть на крупной терке (делать это лучше сразу в глубокую тарелку, так как будет много сока; дополнительно очищать от кожицы не нужно, в конце она должна остаться у вас в руке), каперсы хорошо промыть под прохладной водой. Петрушку мелко нарубить, разделить на две части — одну (побольше) часть оставить для соуса, вторую для подачи. Банки с тунцом открыть и хорошо слить масло.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В большой сковороде разогреть оливковое (2 ст л) и сливочное (15 г) масла, добавить чеснок и обжарить его в течение пары минут, пока не зазолотится. Добавить анчоусы, петрушку (контролируйте количество на ваш вкус) и горчицу, обжаривать еще минуту, затем добавить томатное пюре, каперсы, влить соевый соус и вино, поперчить, увеличить огонь до средне-сильного и, периодически помешивая, уварить соус в течение 5-7 минут. Как вы видите по количеству, вино здесь опционально, его можно убрать, либо можно заменить одной столовой ложкой лимонного сока или яблочного уксуса, но по вкусу, конечно, будет чуть беднее.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Выключить огонь, добавить цедру лимона, тунец, быстро и аккуратно перемешать, затем добавить отваренную пасту и припасенную воду. Интенсивно, но аккуратно перемешивать пасту с помощью двух деревянных ложек или (если умеете) встряхивания сковороды в течение одной минуты. Сразу же подавать с долькой лимона, присыпав петрушкой.</div></div></div></div>"},"771":{"id":771,"title":"Мак-н-чиз","sub":"#pms","cat":"Паста и пицца","img":"thumb/0771_00_771_photo.webp","lq":"data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAABwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JQAXeqN4AKrL+hkj0KwSq5TTPsRzFkB/3JZ4gAJ0vyFTx083HWhx5sJTtCk6IKb25whzMuPGJB0XqfYl9TjnLGFUN76OchkGD4XZd2HxULffq9qILPgagatuQVMkKk0p1GEPadVkGnD9xOIJ/gLsk48lENzikda/A2NRPdTsS7xX5LHAcQLLlo6XwTWtocDaQpBwoTzTnVkwZ4HPwy7+x2cNL4Vn6tWpxj4zRo6K9dQYAIIwXyAAA","w":360,"h":450,"q":"мак-н-чиз #pms на 4 порции грюйер 70 г чеддер 100 г пармезан 55 г масло сливочное 35 г мука 20 г паста рожки 250 г молоко 400 г маскарпоне 60 г мускатный орех щепотка горчица дижонская 1 2 чл вурстерширский соус 1 ст л черный перец цуккини 1 шт лимонный сок 1 ч л для цуккини и 1 ч л для лосося слабосоленый лосось зеленый салат а ля французское бистро лук резанец для подачи пармезан для подачи pms мак н чиз со слабосоленым лососем цуккини и зеленым салатом давно хотела воссоздать это блюдо не раз и не два спасавшее мои непростые московский дни мы жили в москве рядом с рынком депо и вот в одном из корнеров подавали классические мак н чиз с неклассическими добавками я всегда выбирала версию с мелко нарезанным слабосоленым лососем и тончайшими ломтиками цуккини добавляла к этому ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0771_00_771_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAABwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JQAXeqN4AKrL+hkj0KwSq5TTPsRzFkB/3JZ4gAJ0vyFTx083HWhx5sJTtCk6IKb25whzMuPGJB0XqfYl9TjnLGFUN76OchkGD4XZd2HxULffq9qILPgagatuQVMkKk0p1GEPadVkGnD9xOIJ/gLsk48lENzikda/A2NRPdTsS7xX5LHAcQLLlo6XwTWtocDaQpBwoTzTnVkwZ4HPwy7+x2cNL4Vn6tWpxj4zRo6K9dQYAIIwXyAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">грюйер 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеддер 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 55 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 35 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паста “рожки” 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1/2 чл</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстерширский соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цуккини 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 1 ч л для цуккини и 1 ч л для лосося</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">слабосоленый лосось</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зеленый салат а-ля французское бистро</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец для подачи</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>#pms</p>\n<p>МАК-Н-ЧИЗ<br>со слабосоленым лососем, цуккини и зеленым салатом</p>\n<p>Давно хотела воссоздать это блюдо, не раз и не два спасавшее мои непростые московский дни. Мы жили в Москве рядом с рынком “Депо”, и вот в одном из корнеров подавали классические мак-н-чиз с неклассическими добавками - я всегда выбирала версию с мелко нарезанным слабосоленым лососем и тончайшими ломтиками цуккини. Добавляла к этому бокал примитиво, утирала слезы, и день уже не казался таким невыносимым. Конечно, регулярное заедание стресса едой - верный путь к РПП и лишнему весу, и я точно не призываю так делать ежедневно. Просто делюсь своим опытом и намекаю, что моё ментальное здоровье находится в порядке в том числе потому, что изредка я разрешаю себе опуститься на самое дно и вволю там пострадать. Потом я очень вкусно ем и начинаю всё заново, с новыми силами, здоровым оптимизмом и искренним предвкушением нового дня.</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Freezer friendly блюдо! Размораживается в микроволновке или на сковороде с (обязательно!) небольшим количеством воды и тщательным промешиванием. В случае, если замораживаете, желательно варить пасту на две минуты меньше, чем указано на пачке.</span></li></ul></div><div class=\"note\"><i class=\"bul\">📍</i>Важное замечание: для этого блюда подойдет любой сыр. Вот прямо абсолютно любой, который хотите взять, но имейте в виду, что от вида сыра будет прямо зависеть вкус мак-н-чиз. Общее количество сыра также может быть уменьшено в зависимости от ваших предпочтений. Мои фавориты - в рецепте.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сначала соус! Натереть сыр: чеддер и грюйер на крупной терке, пармезан на мелкой. В большой кастрюле на среднем огне растопить сливочное масло, добавить муку и обжаривать ее, помешивая венчиком, примерно полминуты. Затем в несколько этапов влить молоко, непрерывно помешивая и довести соус до кипения и загустения. Добавить грюйер, чеддер и пармезан и, продолжая помешивать, дождаться полного расплавления сыра. Добавить маскарпоне, горчицу, вурстерширский соус, мускатный орех, черный свежемолотый перец, перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Отварить пасту в подсоленной воде по инструкции на упаковке (al dente, рожки обычно варятся от 7 до 9 минут), слить воду, добавить в соус и тщательно перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Цуккини нарезать тонкими полосками (с помощью мандолины или овощечистки), сложить в миску, приправить оливковым маслом, солью и 1 ч л лимонного сока, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Подавать мак-н-чиз с зеленым салатом, ломтиками цуккини и слабосоленным лососем, декорировав луком-резанцом и тертым на микроплане пармезаном.</div></div><div class=\"outrop\"><p>❤️И не грусти, завтра точно будет лучше!</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0771_01_772_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0771_02_773_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0771_03_774_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0771_04_775_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0771_05_776_photo.webp\" alt=\"\"></figure></div>"},"802":{"id":802,"title":"Сливочная паста с запечёнными перцами","sub":"и перцем урфа","cat":"Паста и пицца","img":"thumb/0802_00_802_photo.webp","lq":"data:image/webp;base64,UklGRhoBAABXRUJQVlA4IA4BAADwBQCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMoR48LRbLQjeHXmqFQE4iACsq+ANymZEy756AAD928EtMVQ5yXCG4hLKCJWadkxPdm+bVvOzQoSzaNuU1HSdME8RVb2EuG940fR5tmzVN+zEJKhzAm4Yi/FRPZW1m8SG18hdsBjYBneKKXziI8DXFIU80TZkWx9ialfpFAoVw6n15pdHCX6JDL5yKX7jpYYMqdxeHrLFifjNr6vBf1EMNTn528JNYNe6bf2j0oeffUfANrFGgF7AIsKcI54Hk4vrEcXUTuSw/SLXvmTsY3THh0rdavhdUfrI6pJCsSrCi+DD3SoasZiF52BXdDv4rv8gAAA=","w":360,"h":450,"q":"сливочная паста с запечёнными перцами и перцем урфа на 3 порции паста 300 г болгарский перец 3 4 шт красные оранжевые желтые маскарпоне 100 г лук репч 1 2 шт чеснок гранул 1 2 ч л паприка в хлопьях 1 2 ч л перец урфа 1 2 ч л опционально винный уксус 1 ч л пармезан 40 г для сервировки соль сливочная паста с запечёнными перцами и перцем урфа pms сегодняшний рецепт яркость тепло и невероятная палитра вкусов из самых простых вещей запечённые до дивной дымности перцы сливочный маскарпоне и один важный нюанс знакомлю вас с маленькой магией перцем урфа мне нравится называть его так хотя у него много имён изот бибер урфа бибер черный чили и так далее урфа родом из юго восто","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0802_00_802_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhoBAABXRUJQVlA4IA4BAADwBQCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMoR48LRbLQjeHXmqFQE4iACsq+ANymZEy756AAD928EtMVQ5yXCG4hLKCJWadkxPdm+bVvOzQoSzaNuU1HSdME8RVb2EuG940fR5tmzVN+zEJKhzAm4Yi/FRPZW1m8SG18hdsBjYBneKKXziI8DXFIU80TZkWx9ialfpFAoVw6n15pdHCX6JDL5yKX7jpYYMqdxeHrLFifjNr6vBf1EMNTn528JNYNe6bf2j0oeffUfANrFGgF7AIsKcI54Hk4vrEcXUTuSw/SLXvmTsY3THh0rdavhdUfrI6pJCsSrCi+DD3SoasZiF52BXdDv4rv8gAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">паста 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">болгарский перец 3-4 шт (красные, оранжевые, желтые)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репч. 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранул. 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка в хлопьях 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец урфа 1-2 ч л (опционально)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">винный уксус 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 40 г + для сервировки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>#pms</p>\n<p>Сегодняшний рецепт — яркость, тепло и невероятная палитра вкусов из самых простых вещей: запечённые до дивной дымности перцы, сливочный маскарпоне и один важный нюанс. Знакомлю вас с маленькой магией — перцем урфа (мне нравится называть его так, хотя у него много имён: изот бибер, урфа бибер, черный чили и так далее). Урфа родом из юго-восточной Турции, из района Урфа (Şanlıurfa) — солнечного, пряного края. Этот перец медленно сушат на солнце днём и заворачивают в ткань на ночь, чтобы он слегка “вял” и томился в собственных ароматах. В результате урфа приобретает редкий характер: мягкую копчёность, фруктовые оттенки изюма и лёгкую терпкость. Он острый, но острота эта совершенно не похожа на то, что мы обычно понимаем под остротой. Она мягкая, не агрессивная, фруктовая, сладкая. Вкусовые качества урфы идеально сочетаются с болгарским перцем, получается нежность, тёплый бархатный шлейф. Вы легко можете исключить урфу и приготовить просто отличную пасту с запеченными перцами, а можете — отыскать редкий перец и, возможно, впервые получить удовольствие от острого блюда, как это однажды случилось со мной.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: Урфа входит в пятерку самых популярных пряностей Турции и продается там на каждом шагу — имейте в виду, что привезти из следующего отпуска!</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Болгарские перцы обмыть, отрезать плодоножку, убрать семена, наколоть вилкой и отправить в противне на самый верхний уровень духовки и самый мощный гриль на 20 минут (возможно, перцы обугляться раньше — следите, вам нужна подгоревшая шкурка). Достать, переложить в пакет или миску, накрыв тарелкой — перцы должны “пропотеть” около 10-15 минут, и затем с них легко можно снять кожицу. Обратите внимание, для рецепта нужно около 350 грамм мякоти, поэтому если у вас маленькие перцы, изначально запеките побольше.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук очистить и нарезать мелким кубиком. Очищенные от шкурки перцы нарезать небольшими кусочками. На среднем огне в сковороде разогреть 2 ст л оливкового масла, добавить лук и обжаривать в течение 7-10 минут, пока она не станет мягким и золотистым. Затем добавить чеснок, паприку, перец урфа и запеченные перцы, перемешать и обжарить ещё пару минут. Выключить огонь и слегка остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Отварить пасту в подсоленной воде до состояния аль денте (минус 2 минуты от времени на упаковке), перед тем, как откидывать пасту на дуршлаг, сохранить 100-150 мл воды.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В мини-комбайн или высокий стакан для блендера сложить остывшие перцы из сковородки, маскарпоне и уксус, пробить всё тщательно в течение 2-3 минут до однородной кремовой текстуры.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Пармезан натереть на микроплане. Вернуть соус в сковороду на средний огонь, добавить крахмальную воду из-под пасты (можно начать с 100 г, затем добавить больше, если соус будет густоват), прогреть в течение пары минут, затем добавить пармезан, перемешать, попробовать на соль и досолить, если нужно. Следом добавить пасту, перемешать, прогреть еще одну-две минуты и сразу же подавать на красивых тарелках, сдобрив свежемолотым черным перцем и пармезаном.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"257\" height=\"320\" src=\"thumb/0802_01_803_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"840":{"id":840,"title":"Cacio e pepe","sub":"римская классика","cat":"Паста и пицца","img":"thumb/0840_00_840_photo.webp","lq":"data:image/webp;base64,UklGRsQAAABXRUJQVlA4ILgAAACwBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYgC1G4CA2BcpFTkDqpaWn1wBVI6aYdQ2Uc76HAAA+RKYlr/rdez9bz0j2w10Pyr8YCNwKWuCdsx/dF+Qg7nmbPVf6DzuYxx5Q2aspngkD3aP27dTZG+8h419Vtfetrp9AaMzUDvV24Zgr33r7FZN5vJ54aHueGPZorTuivYzbQceciGxDadjZb15iUxinyLxcd6iLMvMvhxWRLWaYAAA","w":360,"h":450,"q":"cacio e pepe римская классика на 2 порции спагетти 250 г пекорино романо 100 г немного для сервировки черный перец оливковое масло 1 ст л крахмал 1 ч л cacio e pepe римская классика как же я люблю эти минималистичные итальянские рецепты в которых минимум ингредиентов и максимум вкуса есть всего два вида пасты которые я готова есть вечно классическая с томатным соусом и базиликом это любовь идущая из детства и римская качо э пепе вторая напоминает мне об одном из самых счастливых путешествий в жизни соло поездке в февральский рим именн","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0840_00_840_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsQAAABXRUJQVlA4ILgAAACwBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYgC1G4CA2BcpFTkDqpaWn1wBVI6aYdQ2Uc76HAAA+RKYlr/rdez9bz0j2w10Pyr8YCNwKWuCdsx/dF+Qg7nmbPVf6DzuYxx5Q2aspngkD3aP27dTZG+8h419Vtfetrp9AaMzUDvV24Zgr33r7FZN5vJ54aHueGPZorTuivYzbQceciGxDadjZb15iUxinyLxcd6iLMvMvhxWRLWaYAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спагетти 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пекорино романо 100 г (+ немного для сервировки)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал 1 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Как же я люблю эти минималистичные итальянские рецепты, в которых минимум ингредиентов и максимум вкуса! Есть всего два вида пасты, которые я готова есть вечно — классическая с томатным соусом и базиликом (это любовь, идущая из детства) и римская качо э пепе. Вторая напоминает мне об одном из самых счастливых путешествий в жизни — соло-поездке в февральский Рим. Именно тогда в легендарном Felice a Testaccio я попробовала не менее легендарную пасту с овечьим сыром и черным перцем (и увидела вживую Роберто Бениньи, кстати). Cacio e pepe олицетворяет принцип, о котором я говорила в рецепте Баскского чизкейка: чем меньше ингредиентов и больше впечатления “простого рецепта”, тем выше вероятность накосячить. Я часто видела в статьях, посвященных этой великой итальянской пасте фразы в духе “не пытайтесь приготовить её самостоятельно”. Но я скажу вам, что если (как обычно) посмотреть на рецепт с точки зрения химии, то можно увидеть свои потенциальные ошибки и просто их избежать.</p>\n<p>вот тут подробнее</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Варить пасту будем не по классике — в кастрюле, а в сковороде, чтобы вода была более насыщена крахмалом. Мало того, мы к ужасу настоящих римлян добавим крахмал отдельно, чтобы всё точно получилось.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пасту отварить по инструкции на упаковке минус две минуты (то есть если указано, что варить 13 минут, варите 11). Пока варится паста, натереть сыр на самой мелкой терке из всех возможных.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Установить дуршлаг над подходящей большой пластиковой миской, слить в нее воду. На сковороду, в которой варилась паста, влить столовую ложку оливкового масла, слегка его подогреть, а затем всыпать внушительное количество черного перца, крупно размолотого в ступке или мельнице. Я не указываю нужное количество, потому что абсолютно всегда добавляю перца на глаз и получаю разную по оттенкам пасту, мне это нравится. Если вам нужен ориентир, возьмите 1/2 ч л. Обжарить черный перец в течение полминуты до яркого аромата, затем выложить спагетти и хорошо все перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Воду, в которой варилась паста, перелить в какую-нибудь емкость, добавить одну чайную ложку кукурузного крахмала, быстро и тщательно перемешать. Дальше — ловкость рук и скорость. Перекладываем спагетти в горячую (ее подогрела вода от пасты) миску, добавляем небольшое количество воды, затем небольшое количество тертого сыра и очень быстро вымешиваем. Мешаем и наблюдаем, как медленно, но верно начинает плавиться сыр, образовывая с водой ту самую эмульсию, тот самый соус. Добавляем поочередно — воду, сыр, и интенсивно вымешиваем.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Тут должна сказать, что если у вас есть стационарный мощный блендер, можете наплевать на аутентичность и просто взбить воду с пекорино в бархатистый соус, а затем добавить его к спагетти, но кайфа от такого приготовления будет чуууточку меньше.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Выкладываем на тарелку, щедро натираем пекорино сверху, перчим, подаём. Удовлетворительно мычим и чувствуем, как пальцы сами складываются в тот-самый-жест🤌🏼</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0840_01_841_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"497":{"id":497,"title":"Фрикадельки","sub":"в лимонном соусе","cat":"Курица и птица","img":"thumb/0497_00_497_photo.webp","lq":"data:image/webp;base64,UklGRhgBAABXRUJQVlA4IAwBAABQBgCdASoUABkAPu1qr1CppaQiqAqpMB2JbACdM3bIg8AgwHWBIWpBz+fGpQkZHyzggHB3hjnvz9dNMAD85k0heApQ6pJSRHB1sXy9JCZXOyTQ4eCOl9dmbn7WK+lCT0tTEGFGkexNQtpIeH65ypTPFl9hYrtTPwel2U2EnY8rXXtB/U1R0jvOEbIzXbL5LgNuaOkEkwEIR7rW8UYXTQ6lfdxcYImWq3rTF2WcWoIsfM+F6bexHVz2jHIIksdqiU4KY97xOTfqQrlk6kIBUPn6b9XDv9Ycvu/v4W+mMhiLvPOxUfNLUuK6T809hvLnBlxEhzy+sSvr1WhO+YLHbF48ycp6S+vGR9e7scAA","w":360,"h":450,"q":"фрикадельки в лимонном соусе на 4 порции для фрикаделек куриный фарш 700 г я беру 50 бедро и 50 грудка белый хлеб 2 ломтика молоко 50 г чеснок гранулированный 1 4 ч л лук гранулированный 1 4 ч л петрушка 1 ст л лимон 1 2 шт цедра сушёный орегано 1 ч л желток 1 шт соль свежемолотый чёрный перец оливковое масло для соуса куриный бульон 350 г соевый соус 1 ст л лимон 2 шт сок 70 г и цедра 1 ч л сливочное масло 20 г холодное чеснок 1 зубчик каперсы мелкие 2 ст л крахмал кукурузный 1 ч л с горкой для подачи петрушка оливковое масло фрикадельки в лимонном соусе","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0497_00_497_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhgBAABXRUJQVlA4IAwBAABQBgCdASoUABkAPu1qr1CppaQiqAqpMB2JbACdM3bIg8AgwHWBIWpBz+fGpQkZHyzggHB3hjnvz9dNMAD85k0heApQ6pJSRHB1sXy9JCZXOyTQ4eCOl9dmbn7WK+lCT0tTEGFGkexNQtpIeH65ypTPFl9hYrtTPwel2U2EnY8rXXtB/U1R0jvOEbIzXbL5LgNuaOkEkwEIR7rW8UYXTQ6lfdxcYImWq3rTF2WcWoIsfM+F6bexHVz2jHIIksdqiU4KY97xOTfqQrlk6kIBUPn6b9XDv9Ycvu/v4W+mMhiLvPOxUfNLUuK6T809hvLnBlxEhzy+sSvr1WhO+YLHbF48ycp6S+vGR9e7scAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 4 порции:</p><div class=\"iblock\"><p class=\"lbl\">для фрикаделек:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриный фарш 700 г (я беру 50% бедро и 50% грудка)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый хлеб 2 ломтика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук гранулированный 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сушёный орегано 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый чёрный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриный бульон 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 2 шт (сок, ~70 г и цедра, ~1 ч. л.)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20 г холодное</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы мелкие 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 1 ч л с горкой</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для подачи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">С хлеба срезать корочки, залить молоком и оставить на 5–10 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Петрушку вымыть, обсушить и мелко порубить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Соединить размоченный хлеб, чеснок, лук, петрушку, желток, лимонную цедру, орегано, соль и свежемолотый чёрный перец. Добавить куриный фарш и аккуратно перемешать до однородности. Долго не вымешивать, чтобы фрикадельки остались нежными.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Сформировать небольшие фрикадельки размером с грецкий орех.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Разогреть сковороду с небольшим количеством оливкового масла и обжарить фрикадельки со всех сторон до уверенной золотистой корочки. Крайне важно не передержать их — жарить на сильном огне для корочки, но по бокам они могут оставаться розоватыми, дойдут до готовности в соусе, позднее. Переложить на тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В той же сковороде быстро обжарить чеснок до появления аромата. Влить куриный бульон и соевый соус, довести до кипения и уваривать на средне-сильном огне примерно наполовину.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Убавить огонь и начать добавлять лимонный сок небольшими порциями, примерно по 1 ч. л., каждый раз перемешивая и пробуя соус. Ориентироваться прежде всего на собственный вкус, а не на указанное количество сока. На этом этапе соус должен казаться чуть кислее, чем хотелось бы получить в итоге — сливочное масло далее смягчит кислоту.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Добавить лимонную цедру и каперсы. Убавить огонь до минимального.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Холодное сливочное масло нарезать небольшими кубиками и постепенно вмешать в соус, добавляя по несколько кубиков за раз и постоянно покачивая сковороду или перемешивая соус венчиком. Следующую порцию масла добавлять только после того, как предыдущая практически полностью соединилась с соусом. Не давать соусу кипеть, чтобы эмульсия не расслоилась.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Когда соус станет гладким, блестящим и слегка загустеет, попробовать и при необходимости дополнительно скорректировать кислоту лимонным соком.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Добавить к фрикаделькам крахмал и аккуратно перемешать, затем вернуть фрикадельки в сковороду, так же аккуратно перемешать и готовить ещё 5 минут на небольшом огне, периодически переворачивая и поливая их соусом.</div></div>\n<div class=\"step\"><span class=\"sn\">12</span><div class=\"st\">Переложить фрикадельки на большое блюдо вместе с соусом. Посыпать рубленой петрушкой, щедро полить хорошим оливковым маслом и сразу подавать с орзо, запечённым молодым картофелем или просто со свежим хлебом, чтобы собрать весь лимонный соус.</div></div></div></div>"},"514":{"id":514,"title":"Запеченные куриные бедра с овощами","sub":"","cat":"Курица и птица","img":"thumb/0514_00_514_photo.webp","lq":"data:image/webp;base64,UklGRuYAAABXRUJQVlA4INoAAADQBQCdASoUABkAPu1oqU+ppaOiKA1RMB2JbACdM2crinbG9FYLCasl1ky9STnmcNiLyiflI6EAAPxUEfwQffi8XDHpnSiv93IAs5m1PyTx8Fvvx5UCgafDc2OHxm2ABXcys5gogzyeFCry0h1cFr4fZ7tmMtogBOe7sCHwkPr9IzyNmYSmGrQM90EPqJEEL5kMCCSXc4vuIoE6dKU81Q8RL9a+OtVcUrHg4/YNZ4rEo1Vd7afc4ZNNeQT6YrCWw+Jl3+jW1IyzooEWpvkQTz7xdiOjvNqVSOAAAA==","w":360,"h":450,"q":"запеченные куриные бедра с овощами  на 4 порции куриные окорочка 4 шт картофель молодой 500 г перец сладкий красный 1 шт перец сладкий желтый 1 шт морковь 3 шт брокколи 200 250 г масло оливковое 4 ст л соевый соус 2 ст л бальзамический уксус 1 ст л кленовый сироп 1 ст л паприка в хлопьях 1 ч л итальянские травы 1 ч л лимон 1 шт цедра и сок соль свежемолотый черный перец петрушка тимьян для подачи запеченные куриные бедра с овощами в этом месяце мы уделяем особое внимание блюдам не требующих долгих часов у плиты и сложной предварительной подготовки и потому не можем обойти стороной запекание самый благодарный в этом смысле способ приготовления еды запечённая с овощами курица первое что приходит мне на ум если с самого утра дети не слезают с рук сил и фантазии ноль а вот желания п ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0514_00_514_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuYAAABXRUJQVlA4INoAAADQBQCdASoUABkAPu1oqU+ppaOiKA1RMB2JbACdM2crinbG9FYLCasl1ky9STnmcNiLyiflI6EAAPxUEfwQffi8XDHpnSiv93IAs5m1PyTx8Fvvx5UCgafDc2OHxm2ABXcys5gogzyeFCry0h1cFr4fZ7tmMtogBOe7sCHwkPr9IzyNmYSmGrQM90EPqJEEL5kMCCSXc4vuIoE6dKU81Q8RL9a+OtVcUrHg4/YNZ4rEo1Vd7afc4ZNNeQT6YrCWw+Jl3+jW1IyzooEWpvkQTz7xdiOjvNqVSOAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриные окорочка 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель молодой 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец сладкий красный 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец сладкий желтый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">брокколи 200-250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло оливковое 4 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кленовый сироп 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка в хлопьях 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">итальянские травы 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (цедра и сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка/тимьян для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>В этом месяце мы уделяем особое внимание блюдам, не требующих долгих часов у плиты и сложной предварительной подготовки, и потому не можем обойти стороной запекание — самый благодарный в этом смысле способ приготовления еды. Запечённая с овощами курица — первое, что приходит мне на ум, если с самого утра дети не слезают с рук, сил и фантазии ноль, а вот желания поесть чего-то уютного и согревающего при этом — вагон.</p>\n<p>У запекания курицы, при всей его кажущейся простоте, есть несколько принципиальных приёмов, игнорировать которые значит сознательно лишать себя лучшего результата. Главный из них — заблаговременное засаливание, то есть покрытие мяса солью с последующей паузой, во время которой запускается процесс обратного осмоса: сначала влага выходит на поверхность, а затем, растворив соль, возвращается обратно в волокна, унося её с собой и делая мясо не только равномерно приправленным, но и по-настоящему сочным.</p>\n<p>Не менее важно доставать куриное мясо из холодильника заранее, позволяя ему нагреться до комнатной температуры — благодаря этому мы избегаем резкого температурного контраста в духовке, который почти неизбежно приводит к пересушенной поверхности и сырой середине. Это мелочь, на которую мало кто обращает внимание, но именно из таких мелочей и складывается разница между просто ужином и хорошо приготовленным блюдом.</p>\n<p>Запечённая таким способом курица получается удивительно сочной внутри, с плотной, хрустящей кожей, источающей тёплый аромат бальзамика и соевого соуса, с мягкими карамельными нотами, возникающими в процессе запекания, а овощи, расположенные под решёткой, постепенно пропитываются куриными соками, жиром и приправами, становясь насыщенными и абсолютно самодостаточными по вкусу. Для тех, кто любит ужины чуть более сытные и основательные, уместным будет подать к нему простой нейтральный гарнир вроде булгура, риса или кускуса, который с благодарностью впитает все соки, оставшиеся на тарелке.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: если вы берёте качественный бальзамический уксус, плотный и густой, стоит сократить количество кленового сиропа до одной чайной ложки.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Куриные окорочка разделить острым ножом на бёдра и голени. Натереть солью, уделяя особое внимание пространству под кожей, слегка поперчить и оставить при комнатной температуре минимум на 30–40 минут (этот шаг можно вынести на вечер накануне запекания, но в любом случае важно достать курицу из холодильника за полчаса до отправки в духовку).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Духовку разогреть до 210 градусов (режим: конвекция). Картофель тщательно вымыть и разрезать пополам или на четвертинки. Морковь очистить и нарезать крупными брусками. Сладкий перец разрезать на широкие дольки. Брокколи разобрать на соцветия и нарезать кусочками сопоставимого размера.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В миске смешать оливковое масло, соевый соус, бальзамический уксус, кленовый сироп, паприку, итальянские травы и цедру одного лимона.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Овощи выложить в глубокую миску, полить примерно двумя третями соуса, тщательно перемешать и переложить на неглубокий противень в один слой, затем посолить и поперчить сверху. В ту же миску, где были овощи, переложить курицу, добавить оставшийся соус и хорошо перемешать, чтобы вся поверхность была им равномерно покрыта. Выложить курицу на решётку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Установить в духовке противень с овощами, сверху разместить решётку с курицей. Запекать 10 минут при температуре 210 градусов, затем снизить температуру до 180 градусов и готовить ещё около 20 минут. Если поверхность курицы начинает слишком активно темнеть, накрыть её фольгой, не прижимая к коже.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Окончание — в комментариях.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Дать блюду постоять 5 минут после духовки. Овощи сбрызнуть лимонным соком (в зависимости от вашего вкуса и величины/сочности лимона — половиной или целым), аккуратно перемешать деревянной лопаткой, чтобы они покрылись соками со дна противня, и можно сервировать. На большое блюдо выложить овощи, сверху — кусочки курицы, присыпать петрушкой или тимьяном и подавать сразу.</div></div></div></div>"},"521":{"id":521,"title":"Баттер чикен","sub":"индийский comfort food","cat":"Курица и птица","img":"thumb/0521_00_521_photo.webp","lq":"data:image/webp;base64,UklGRiQBAABXRUJQVlA4IBgBAADwBgCdASoUABkAPu1qr1CppaSiqAqpMB2JbACdMoR2foM6KFlTwA7tfBiZlZ6mwZHMNpKO7nbxy08JX48j3sUAAP66XitD/56Kvec8Epzi6elOF82g7aoD0YAzVe3QmCMQ1D3BcPh73qO5kSOmJPpnlgqMwAbqNyvZhPQE0MVs57gn5pMrTyILBvALHAZWtqQJgMbQhEht1XHKOB88khsnsrn0Ee1h+wbSPxMNDXyfbFo2IQlDalZvOZNHXvhjtKWaG6HJhR2nXpcZFlUkRCKInCvmBziArVmmsTMK+jFDw6qfip2ZF6ys+RAgBE8pciB00cArlebtyJfgx+xJbkQzJ9xUN1cVzr1nLrMz9+MboPb0yM8AAAAA","w":360,"h":450,"q":"баттер чикен индийский comfort food на 3 4 порции для маринада филе курицы 600 г соль 1 ч л гарам масала 1 ч л с горкой куркума 1 2 ч л кумин 1 2 ч л паприка копченая 1 ч л йогурт натуральный 120 г лимон 1 2 шт сок масло растительное 1 ст л для обжаривания масло растительное 2 ст л масло сливочное 40 г для соуса масло сливочное 20 г корица 1 палочка бадьян 1 звездочка лук репчатый 1 2 шт чеснок 1 зубчик имбирь кусочек 2х2 см кориандр молотый 1 ч л гарам масала 1 2 ч л кардамон молотый 1 2 ч л куркума 1 2 ч л перец урфа 1 4 или 1 2 ч л в зависимости от вашего восприятия остроты томаты консервированные 400 г бульон куриный 120 г томатная паста 30 г соевый соус 1 ст л сливки 30 80 г соль баттер чикен индийский comfort food второе пришествие murgh makhani в этот чат первое случилось во время месяца малышкового мишлена тогда версия была упрощённая по специям и усложнённая по мясу когда мне поступил уже кажется десятый вопрос мо","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0521_00_521_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRiQBAABXRUJQVlA4IBgBAADwBgCdASoUABkAPu1qr1CppaSiqAqpMB2JbACdMoR2foM6KFlTwA7tfBiZlZ6mwZHMNpKO7nbxy08JX48j3sUAAP66XitD/56Kvec8Epzi6elOF82g7aoD0YAzVe3QmCMQ1D3BcPh73qO5kSOmJPpnlgqMwAbqNyvZhPQE0MVs57gn5pMrTyILBvALHAZWtqQJgMbQhEht1XHKOB88khsnsrn0Ee1h+wbSPxMNDXyfbFo2IQlDalZvOZNHXvhjtKWaG6HJhR2nXpcZFlUkRCKInCvmBziArVmmsTMK+jFDw6qfip2ZF6ys+RAgBE8pciB00cArlebtyJfgx+xJbkQzJ9xUN1cVzr1nLrMz9+MboPb0yM8AAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 3-4 порции:</p><div class=\"iblock\"><p class=\"lbl\">для маринада:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">филе курицы 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарам масала 1 ч л (с горкой)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">йогурт натуральный 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло растительное 1 ст л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">+ для обжаривания:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло растительное 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 40 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">корица 1 палочка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бадьян 1 звездочка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь кусочек 2х2 см</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кориандр молотый 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарам масала 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кардамон молотый 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец урфа 1/4 или 1/2 ч л (в зависимости от вашего восприятия остроты)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консервированные 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Второе пришествие Murgh Makhani в этот чат — первое случилось во время месяца Малышкового Мишлена: тогда версия была упрощённая по специям и усложнённая по мясу. Когда мне поступил уже, кажется, десятый вопрос, можно ли в том рецепте использовать филе, я решила, что нам нужен баттер чикен именно для филе! 🙂</p>\n<p>Butter Chicken, или Murgh Makhani, появился в Дели в конце 1940-х — случайно, как и многие другие великие гастрономические находки (бонжурчики, миндальный круассан!). В ресторане Moti Mahal, где готовили курицу тандури, возникла вполне логичная проблема: куда девать обугленных цыплят, не распроданных в тот же день? Чтобы спасти блюдо, мясо срезали с костей и прогревали в пряном соусе из томатов и makhan — свежего взбитого сливочного масла (промежуточная форма между сливками и маслом — кто бывал в деревне и видывал такие “сливки-масло”, тот поймёт). Результат оказался поразительным: мягкое мясо в густом томатно-сливочном соусе с пряным теплом специй и той самой “утешительной”, комфортной текстурой, от которой не хочется отрываться. Так блюдо стало хитом — сначала в Индии, потом во всём мире и завоевало миллионы сердец, включая моё.</p>\n<p>Держим курс на ту самую бархатную курицу — без тандура и с филе, которое получится сочным, если довериться химии и следовать рецепту.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Курицу нарезать достаточно крупными кусочками, смешать с йогуртом, лимонным соком, специями и маслом. Дальше зависит от вашего филе — если у вас бедро, то маринаду хватит и часа, если грудка, то оставляйте минимум на всю ночь (максимум на сутки): кислота лимона и йогурта размягчит волокна, а специи передадут свой характер благодаря маслу — так вы убережёте курицу от пересушивания и сделаете её по-настоящему пряной.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Спустя время:<br>Лук, чеснок и имбирь очистить и мелко нарезать. Разогреть в хорошей сковороде с толстым дном (в идеале — чугунной) смесь растительного и сливочного масел и быстро обжарить кусочки курицы до лёгкой румяности, у меня выходит в два этапа. Скорее всего, им не нужно будет больше 2-3 минут с каждой стороны, я не заморачиваюсь тут с термометром и определяю готовность по нажатию (кусочек должен немного пружинить в центре, это знак, что мясо не пережарено, и дойдет до готовности позднее, уже в соусе). Как и всегда с курицей — не пережарьте! Переложить кусочки в тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В той же сковороде растопить ещё немного сливочного масла, добавить корицу и бадьян, повозить ими по маслу и дать ароматам раскрыться, примерно полминуты. Добавить лук, чеснок и имбирь, обжарить в течение 2-3 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Подсыпать специи (гарам масалу, кориандр, перец урфа, кардамон и куркуму), быстро перемешать. Добавить томатную пасту, перемешать, потом консервированные томаты, как всегда разбить лопаткой. Добавить бульон, соевый соус, довести до кипения, затем убавить огонь до средне-слабого и уваривать соус примерно 10–15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Убрать с огня, удалить корицу и бадьян, добавить сливки и пробивать соус блендером в течение 2-3 минут. Вернуть на средний огонь, добавить кусочки курицы и томить 7-10 минут. Подавать с рисом басмати или жасмин, лепешками наан и соусом райта. Украшать рубленной кинзой или петрушкой, но можно вообще не украшать, а просто скорее вкусно есть!</div></div></div></div>"},"522":{"id":522,"title":"Жареная курица","sub":"как будто вы в Техасе","cat":"Курица и птица","img":"thumb/0522_00_522_photo.webp","lq":"data:image/webp;base64,UklGRvoAAABXRUJQVlA4IO4AAABQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMzQ5akmfdoRLQ2EMJ8zu6/98XRQn8XrE7qCjFzLpAAD8spw52l/Xs1ne4U2+xwyh8JiT2CjNHXu8cA+JPSoytee7j2bDvQyj43T84y2ETIizL4xZW9yjHgbfUfJ3v7nk/DrIT8hfZrmgssfgeIkpIHimCEWic78mrpTjlV6ch37LeRWw45blU9T2LNsvo8m9NpRFyoJRWn7V7vkEa21edhCreye2JuJXgxpy02OcSlUrv3//8EFSZrNq4BmcsGBvhNSt1CnHHF/nf79qii9AwAAA","w":360,"h":450,"q":"жареная курица как будто вы в техасе на 4 6 порций окорочка куриные 2 кг кефир 500 г соль 1 ст л соевый соус 1 ст л рыбный соус 1 ст л чеснок гранулированный паприка копченая перец кайенский для панировки мука 400 г крахмал кукурузный 60 г соль 1 ч л чеснок гранулированный 1 2 ч л лук гранулированный 1 2 ч л паприка копченая 1 2 ч л орегано 1 2 ч л соевый соус несколько капель масло подсолнечное очищенное 2 л свежемолотый черный перец соль жареная курица как будто вы в техасе","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0522_00_522_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvoAAABXRUJQVlA4IO4AAABQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMzQ5akmfdoRLQ2EMJ8zu6/98XRQn8XrE7qCjFzLpAAD8spw52l/Xs1ne4U2+xwyh8JiT2CjNHXu8cA+JPSoytee7j2bDvQyj43T84y2ETIizL4xZW9yjHgbfUfJ3v7nk/DrIT8hfZrmgssfgeIkpIHimCEWic78mrpTjlV6ch37LeRWw45blU9T2LNsvo8m9NpRFyoJRWn7V7vkEa21edhCreye2JuJXgxpy02OcSlUrv3//8EFSZrNq4BmcsGBvhNSt1CnHHF/nf79qii9AwAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">окорочка куриные 2 кг</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кефир 500 г</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соль 1 ст л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">рыбный соус 1 ст л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чеснок гранулированный</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">паприка копченая</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">перец кайенский</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для панировки:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">мука 400 г</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">крахмал кукурузный 60 г</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соль 1 ч л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чеснок гранулированный 1/2 ч л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">лук гранулированный 1/2 ч л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">паприка копченая 1/2 ч л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">орегано 1/2 ч л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соевый соус несколько капель</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">масло подсолнечное очищенное 2 л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Окорочка разделить (разрезать по суставу) на голени и бедра. Срезать излишки кожи и при необходимости подровнять кусочки, придавая им аккуратную форму. Это необязательно, но благодаря этому курица будет выглядеть симпатичнее, а готовиться — равномернее.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Для маринада соединить кефир, соль, соевый и рыбный соусы, гранулированный чеснок, копченую паприку и кайенский перец (если используется). Перемешать до однородности.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Переложить курицу в маринад, тщательно перемешать, чтобы все куски гарантированно покрылись кефиром, накрыть и убрать в холодильник минимум на 8 часов, максимум — на 24.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Перед непосредственным обжариванием курицы достать ее из холодильника по меньшей мере за час. Это важно, так как холодные куски курицы могут сильно опускать температуру кипящего масла, и велик шанс получить напитанные жиром куски курицы вместо потрясающего хрустящего фритюра.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для панировки соединить муку, кукурузный крахмал, соль, гранулированные чеснок и лук, копченую паприку и орегано.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Добавить в мучную смесь несколько капель соевого соуса и быстро растереть пальцами, формируя небольшие влажные комочки. Их должно быть немного, не переусердствуйте.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Теперь важно подготовить две миски — одну с курицей в маринаде, вторую с панировкой, надеть перчатки, если вы не любите “грязную работу”, и запомнить правило: одна рука работает с одной миской, вторая с другой. То есть условно берете левой рукой кусочек курицы в маринаде, кладете его в миску с панировкой и этой рукой больше кусок не трогаете. Включается правая рука, которая уже обваливает курицу в панировке и затем перекладывает на решетку. Так одна рука остается “мокрой”, вторая — “сухой”.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Обваливать в панировке нужно достаточно тщательно, прихлопывая ее рукой. Если от кусочка отходит кожа, ее нужно отодвинуть и в это пространство также “вбить” панировку.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Разложить запанированные кусочки на решетке и оставить на 10–15 минут. Это тоже важное правило: за это время глютен впитает влагу и образует более крепкие связи, соответственно панировка закрепится на поверхности и не будет сваливаться.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Чугунок или чугунную сковороду наполнить маслом и поставить разогреваться до 180 градусов (это можно сделать в середине процесса панировки, чтобы все процессы сошлись по времени). Масла должно быть достаточно, чтобы кусочки курицы могли свободно жариться, не соприкасаясь с дном.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Жарить курицу небольшими партиями, не перегружая сковороду (я жарила по 4 бедра за раз) и поддерживая температуру масла в диапазоне от 165 до 175 градусов. Без термометра в этом процессе не обойтись, за температурой очень важно следить.</div></div>\n<div class=\"step\"><span class=\"sn\">12</span><div class=\"st\">Небольшие бедра и голени будут готовы в течение 8-10 минут. Проверять готовность можно тем же термометром, проткнув мясо. Если видите цифру 74 — все готово!</div></div>\n<div class=\"step\"><span class=\"sn\">13</span><div class=\"st\">Готовую курицу обязательно перекладывать на решетку с выстеленными снизу бумажными полотенцами, чтобы стекли излишки масла. Сразу же приправить свежемолотым черным перцем и по желанию солью (по желанию, так как маринад и панировка по рецепту уже достаточно соленые).</div></div>\n<div class=\"step\"><span class=\"sn\">14</span><div class=\"st\">Если вы готовите большую партию курицы к обеду или приходу гостей, приготовленные кусочки можно держать в духовке при температуре 90-100 градусов (режим верх/низ) до часа.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">охлажденное масло, использованное для фритюра, можно тщательно процедить через несколько слоев марли, а дальше хранить в прохладном темном месте и использовать от 2 до 4 раз (если масло сильно потемнело, лучше утилизировать).</span></li></ul></div></div>"},"580":{"id":580,"title":"Домашние куриные котлеты","sub":"как у бабушки","cat":"Курица и птица","img":"thumb/0580_00_580_photo.webp","lq":"data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMuN7TzMYiOAXPMd8MOvgEUs4nYlsl/vY1JV0NtVtVAAA/umuHQAliQoHFS7aSLky6exJcpMG9/JmokmvONwNRXW9tEEwMSHsI7yxBvdRyXxYdo5kBkTQkEl9GslOT1oG9KG66IObAiZ4hNbTqRd2sJfXuJBhwVdERNs7E6LaEtmkjO5X3DHQqNnfV4UcvOHc7soeTf8PYdzG1cGhtKRHYXOLBqtn775eUlLGclp3u0M5elAF8dtAQlD1Fl7oTZAVucp3/AxC+rr9dsKPqf8yA06Ag659o0bMAAA=","w":360,"h":450,"q":"домашние куриные котлеты как у бабушки на 3 4 порции куриное филе грудка 350 г куриное филе бедро 300 г белый хлеб 75 г три ломтика тостового без корочек сливки 30 130 г желток 1 шт лук репчатый 1 шт оливковое масло 1 ст л соль белый перец мускатный орех для ароматизации сливочное масло 20 30 г чеснок 2 зубчика тимьян 1 ч л или 2 3 веточки домашние куриные котлеты как у бабушки","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0580_00_580_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMuN7TzMYiOAXPMd8MOvgEUs4nYlsl/vY1JV0NtVtVAAA/umuHQAliQoHFS7aSLky6exJcpMG9/JmokmvONwNRXW9tEEwMSHsI7yxBvdRyXxYdo5kBkTQkEl9GslOT1oG9KG66IObAiZ4hNbTqRd2sJfXuJBhwVdERNs7E6LaEtmkjO5X3DHQqNnfV4UcvOHc7soeTf8PYdzG1cGhtKRHYXOLBqtn775eUlLGclp3u0M5elAF8dtAQlD1Fl7oTZAVucp3/AxC+rr9dsKPqf8yA06Ag659o0bMAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3–4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриное филе (грудка) 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриное филе (бедро) 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый хлеб 75 г (~три ломтика тостового без корочек)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 130 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для ароматизации:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20–30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 1 ч л (или 2–3 веточки)</span
