 подарить организму полезные пробиотики, которые поддерживают микробиом. Сегодня ферментируем черри!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Помидоры вымыть, несколько раз проколоть кожицу зубочисткой (я использую иглу-тестер для бисквита) — так рассол сможет проникать внутрь.<br>В банку положить чеснок, эстрагон, специи и плотно уложить черри.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Смешать воду с солью, хорошо размешать до полного растворения. Залить рассолом помидоры так, чтобы они были полностью покрыты. Обязательно использовать гнёт, чтобы плоды не всплывали (в противном случае велика вероятность порчи). Самый простой способ — банка, наполненная водой.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Оставить емкость с помидорами при комнатной температуре на 2 суток. По прошествии этих двух дней влить уксус, аккуратно перемешать и оставить ещё на 2–3 дня при той же температуре. На поверхности может появиться лёгкая пена — это не плесень, всё нормально: идут молочнокислые процессы. Попробовать: если вкус стал ярким, кисло-пряным и “живым” — можно убирать в холодильник. Я перекладываю помидоры в контейнер, заливаю рассолом и герметично закрываю крышкой. В холоде ферментация замедляется, а аромат стабилизируется. Хранить в холодильнике до 1 месяца.</div></div></div></div>"},"810":{"id":810,"title":"Быстрое варенье из клубники и ревеня","sub":"с апельсином и ванилью","cat":"Заготовки","img":"thumb/0810_00_810_photo.webp","lq":"data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAACwBQCdASoUABkAPu1or1CppaQiqAqpMB2JagCxHuIsdBm7QKCENs5eBg0ajDEVS+5qKeuTGQAA/HWEXiHB3gH6WrmT+Mfqg88ImAivSxRIeNoKodA9TYEJDu4RRCJsJWDl2oWqd2E7TlI0GkDlGLg2V73Hn1/PpTDz8oZNTapR8M8+ydRKAhN2uMtwerLskLqKeHn3SPZCodGZIFfg4RdOlk0z3TMtJJwSd8kVF3lYT3js9NFw/fdOAU6InNIHe5Kn1aBadorOn+xyDgWcsLKif6nM4vqO0/FCblyxBnPe3JEM8gAAAA==","w":360,"h":450,"q":"быстрое варенье из клубники и ревеня с апельсином и ванилью  ревень 1 кг клубника 1 кг апельсин 2 шт ванильный сахар 20 г сахар 400 г быстрое варенье из клубники и ревеня с апельсином и ванилью так это внеплановоевещание по итогам моих проработок пирога всегда знала что клубника дружит с ванилью и апельсиновой цедрой но когда добавила к этим двум ревень сочетание стало проситься в разряд идеальных так как прибавилась нежная очень деликатная кислинка сначала сделала конфитюр но потом попробовала переделать на мотив варе","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0810_00_810_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAACwBQCdASoUABkAPu1or1CppaQiqAqpMB2JagCxHuIsdBm7QKCENs5eBg0ajDEVS+5qKeuTGQAA/HWEXiHB3gH6WrmT+Mfqg88ImAivSxRIeNoKodA9TYEJDu4RRCJsJWDl2oWqd2E7TlI0GkDlGLg2V73Hn1/PpTDz8oZNTapR8M8+ydRKAhN2uMtwerLskLqKeHn3SPZCodGZIFfg4RdOlk0z3TMtJJwSd8kVF3lYT3js9NFw/fdOAU6InNIHe5Kn1aBadorOn+xyDgWcsLKif6nM4vqO0/FCblyxBnPe3JEM8gAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">ревень 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">клубника 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">апельсин 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ванильный сахар 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 400 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Так, это #внеплановоевещание по итогам моих проработок пирога. Всегда знала, что клубника дружит с ванилью и апельсиновой цедрой, но когда добавила к этим двум ревень, сочетание стало проситься в разряд идеальных, так как прибавилась нежная, очень деликатная кислинка. Сначала сделала конфитюр, но потом попробовала переделать на мотив варенья и получилось ещё лучше (хотя это субъективно, конфитюр тоже классный, но вот эти кусочки клубники и ревень, распадающийся на волокна, мммм). Получилось очень вкусно и ароматно. Предупрежу, что это не варенье для консервации, так как мне не хочется убивать вкус сахаром ради хранения, поэтому давайте договоримся — сварите партию, разлейте по баночкам и раздайте близким, наказав хранить в холодильнике.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Ревень очень хорошо обмыть и нарезать на небольшие кусочки 2-3 см в длину (кстати, готовый замороженный тоже подойдёт). Клубнику также обмыть, удалить плодоножку и нарезать на половинки (клубнику только свежую, сезонную и ароматную — иначе толку мало). Сложить всё в кастрюлю. Добавить цедру от одного и сок от двух апельсинов, ванильный и обычный сахар, перемешать и поставить на средний огонь. Когда смесь закипит, убавить огонь до минимального и держать на плите один час без крышки, несколько раз перемешивая в процессе. Наблюдайте — да, нам нужно легкое булькание, но оно должно быть заметно, поэтому если что, корректируйте нагрев. В финале накрыть крышкой и убрать в холод на ночь, а с утра ещё раз перемешать и разлить по красивым баночкам.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Если хотите конфитюр, то можно не дожидаться остывания, а тщательно пробить всё блендером в течение двух-трёх минут и затем разливать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">К булочкам, блинам, вафлям, граноле и просто из красивой розеточки. В паре со сметаной или греческим йогуртом или без всего. Великолепно!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0810_01_811_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0810_02_812_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0810_03_813_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0810_04_814_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0810_05_815_photo.webp\" alt=\"\"></figure></div>"},"830":{"id":830,"title":"Конфитюр из нектаринов и лаванды","sub":"","cat":"Заготовки","img":"thumb/0830_00_830_photo.webp","lq":"data:image/webp;base64,UklGRswAAABXRUJQVlA4IMAAAADwBACdASoUABkAPu1usFIppiSiqAgBMB2JZACB4QR/92MsLDs3rBWYqAWOSPr2liAA/gB4aHrwkkCJNVv/Ho0g+R1xE2bPMBNZuwHVgbBS+orZ9HeHA8rV8c6QSbyWQaCf8HRwDmKP6EIqR/qu8tKuF05T9ro271P1+ZBqwjLEGCyr7Z8he3x2Psf71UWeIKR5jN0GKn5pQn5gCBtTl6pCYcy57/I9bRHmJxAwFlKdHA+uVXPEUyHHLf8nLIAAAAA=","w":360,"h":450,"q":"конфитюр из нектаринов и лаванды  на 6 баночек по 230 мл нектарины 1 2 кг должно получиться примерно 1 кг мякоти лаванда 4 веточки свежей или 1 ч л сушёной кулинарной или аптечной сахар 550 г пектин nh 8 г или 4 г если не любите густые конфитюры лимон 1 шт note если у вас нет пектина nh можно заменить его на пектин hm в простонародье жёлтый пектин цитрусовый или яблочный но нужно изменить граммовку 10 12 грамм и порядок работы отобрать 20 30 г сахара от общей массы и смешать его с пектином добавить этот сахар с пектином в холодное пюре до нагрева тщательно размешать венчиком затем нагревать а оставшийся сахар всыпать уже после закипания варить 4 5 минут конфитюр из нектаринов и лаванды","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0830_00_830_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRswAAABXRUJQVlA4IMAAAADwBACdASoUABkAPu1usFIppiSiqAgBMB2JZACB4QR/92MsLDs3rBWYqAWOSPr2liAA/gB4aHrwkkCJNVv/Ho0g+R1xE2bPMBNZuwHVgbBS+orZ9HeHA8rV8c6QSbyWQaCf8HRwDmKP6EIqR/qu8tKuF05T9ro271P1+ZBqwjLEGCyr7Z8he3x2Psf71UWeIKR5jN0GKn5pQn5gCBtTl6pCYcy57/I9bRHmJxAwFlKdHA+uVXPEUyHHLf8nLIAAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 баночек по 230 мл:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">нектарины 1,2 кг (должно получиться примерно 1 кг мякоти)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лаванда 4 веточки свежей (или 1 ч л сушёной, кулинарной или аптечной)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 550 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пектин NH 8 г (или 4 г, если не любите густые конфитюры)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">📌</i><span class=\"tx\">NOTE: если у вас нет пектина NH, можно заменить его на пектин HM — в простонародье жёлтый пектин (цитрусовый или яблочный), но нужно изменить граммовку (10-12 грамм) и порядок работы:</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">отобрать 20–30 г сахара от общей массы и смешать его с пектином</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">добавить этот сахар с пектином в холодное пюре (до нагрева!), тщательно размешать венчиком</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">затем нагревать, а оставшийся сахар всыпать уже после закипания, варить 4-5 минут</span></li></ul></div></div></aside><div class=\"main\"><p>Такой пектин требует высокой температуры и кислоты для активации, так что не забудьте добавить лимон в самом конце, чтобы сохранить аромат, но обеспечить желирование.</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Нектарины промыть и снять кожицу: для этого можно сделать надрезы крест-накрест, залить кипятком и оставить на одну минуту. Затем слить горячую воду и залить ледяной — ещё на пару минут. Кожица должна сойти легко.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Освободить фрукты от кожицы и косточек, полученную мякоть пюрировать блендером и ещё раз взвесить. Если объём получился меньше 1 кг, скорректировать количество сахара пропорционально.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В кастрюлю с мякотью добавить цветки лаванды, постепенно вмешать половину сахара и поставить на средний огонь. Как только пюре начнёт испаряться (пойдёт пар), всыпать вторую половину сахара, перемешанную с пектином — тонкой струйкой или “дождиком”, непрерывно помешивая венчиком.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Довести до кипения, проварить две минуты, скрупулёзно снимая пенку (обязательный пункт для красивого конфитюра 🙂).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Снять с огня, добавить сок лимона. Если хочется гладкую текстуру — можно процедить через мелкое сито, удаляя лаванду. Или оставить как есть — с ароматными вкраплениями.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Разлить горячим по заранее стерилизованным банкам, плотно закрыть крышками, перевернуть вверх дном. Хранить до 6 месяцев в закрытых банках в прохладном, тёмном месте и до 2–3 недель после открытия — при условии, что вы используете чистую ложку и держите банку в холодильнике.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0830_01_831_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0830_02_832_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0830_03_833_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0830_04_834_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0830_05_835_photo.webp\" alt=\"\"></figure></div>"},"836":{"id":836,"title":"Конфитюр из клубники и лайма","sub":"","cat":"Заготовки","img":"thumb/0836_00_836_photo.webp","lq":"data:image/webp;base64,UklGRuoAAABXRUJQVlA4IN4AAABQBQCdASoUABkAPu1qrFCppaQiqAqpMB2JbACdMzQ6SdHAgPL9H9/6KUl5O4SEzCGDt8AA/di/TQBaY58FiW5nUO2hJsG2pFtGghOayVEJCiVK/HtZdxnNnyh95o0LFeSLZ6LrsAr1hwJZ1zwCZsSF2LDB1zz553iM40s35HDMkawaGQ4xlSF5ExQVGGuS2NdSF8ezAQHfh66+eaq/OQeZqayIr6/04NmGElY3N1dU8PLclTa4/uCTVHcffwfyTsqol3uUosrCJI7UDF2aamkuT72wsKUIYhoJ0OAYAAA=","w":360,"h":450,"q":"конфитюр из клубники и лайма  на 6 баночек по 230 мл клубника 1 кг сахар 500 г пектин nh 10 г или 6 г если не любите густые конфитюры 1 лайм note если у вас нет пектина nh можно заменить его на пектин hm в простонародье жёлтый пектин цитрусовый или яблочный но нужно изменить граммовку 12 14 грамм и порядок работы отобрать 20 30 г сахара от общей массы и смешать его с пектином добавить этот сахар с пектином в холодное клубничное пюре до нагрева тщательно размешать венчиком затем нагревать а оставшийся сахар всыпать уже после закипания варить 4 5 минут конфитюр из клубники и лайма","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0836_00_836_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuoAAABXRUJQVlA4IN4AAABQBQCdASoUABkAPu1qrFCppaQiqAqpMB2JbACdMzQ6SdHAgPL9H9/6KUl5O4SEzCGDt8AA/di/TQBaY58FiW5nUO2hJsG2pFtGghOayVEJCiVK/HtZdxnNnyh95o0LFeSLZ6LrsAr1hwJZ1zwCZsSF2LDB1zz553iM40s35HDMkawaGQ4xlSF5ExQVGGuS2NdSF8ezAQHfh66+eaq/OQeZqayIr6/04NmGElY3N1dU8PLclTa4/uCTVHcffwfyTsqol3uUosrCJI7UDF2aamkuT72wsKUIYhoJ0OAYAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 баночек по 230 мл:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">клубника 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пектин NH 10 г (или 6 г, если не любите густые конфитюры)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">1 лайм</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">📌</i><span class=\"tx\">NOTE: если у вас нет пектина NH, можно заменить его на пектин HM — в простонародье жёлтый пектин (цитрусовый или яблочный), но нужно изменить граммовку (12-14 грамм) и порядок работы:</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">отобрать 20–30 г сахара от общей массы и смешать его с пектином</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">добавить этот сахар с пектином в холодное клубничное пюре (до нагрева!), тщательно размешать венчиком</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">затем нагревать, а оставшийся сахар всыпать уже после закипания, варить 4-5 минут</span></li></ul></div></div></aside><div class=\"main\"><p>Такой пектин требует высокой температуры и кислоты для активации, так что не забудьте добавить лайм в самом конце, чтобы сохранить аромат, но обеспечить желирование.</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Клубнику тщательно промыть, перебрать, удалить плодоножки, переложить в кастрюлю и пюрировать блендером, добавить половину сахара и поставить на средний огонь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Когда от клубники начнет исходить пар, всыпать вторую половину сахара, перемешанную с пектином (тонкой струйкой, непрерывно помешивая венчиком). Довести до кипения, проварить две минуты, скрупулезно снимая пенку.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Снять с огня, добавить сок и цедру одного лайма, разлить горячим по заранее стерилизованным банкам, плотно закрыть крышками, перевернуть вверх дном до остывания. Хранить до 6 месяцев в закрытых банках в прохладном, тёмном месте и до 2–3 недель после открытия — при условии, что вы используете чистую ложку и держите банку в холодильнике. Однако помните — цедра лайма будет со временем давать конфитюру аптечную нотку, так что лучше не хранить его очень долго.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0836_01_837_photo.webp\" alt=\"\"></figure></div>"},"838":{"id":838,"title":"Конфитюр из малины и маракуйи","sub":"","cat":"Заготовки","img":"thumb/0838_00_838_photo.webp","lq":"data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAAAQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JagC1GxnhGN0DufMFhcXRRp4szC26KXEHXv9dX6x8bAAA/vQrf+BG3zN71Vs0iiYl9P9mRKWwBu9SH4WBaOFHSkvS8kI2L4dR0kkZ2oEcpH1uSmrGEPHuFEbGlhFYthy3V+RNZ13hqLHOx3pzDVZHR39ZG+1XSukJLULetK/sDlyghEgqeCPYsLKQPwuHy6prYF3WT2ZryfN5V7iT9QeWybX1SGR8TkKWMb9fTAEZH9ntiz7f17i8gWZgeQxAx5FYHyAA","w":360,"h":450,"q":"конфитюр из малины и маракуйи  конфитюр из малины и маракуйи на 6 баночек по 230 мл малина 1 2 кг или готовое качественное пюре из сезонной ягоды 1 кг плоды маракуйи 8 штук для насыщенного вкуса 4 штуки для легкой нотки сахар 550 г пектин nh 14 г или 8 г если не любите густые конфитюры note если у вас нет пектина nh можно заменить его на пектин hm в простонародье жёлтый пектин цитрусовый или яблочный но ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0838_00_838_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAAAQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JagC1GxnhGN0DufMFhcXRRp4szC26KXEHXv9dX6x8bAAA/vQrf+BG3zN71Vs0iiYl9P9mRKWwBu9SH4WBaOFHSkvS8kI2L4dR0kkZ2oEcpH1uSmrGEPHuFEbGlhFYthy3V+RNZ13hqLHOx3pzDVZHR39ZG+1XSukJLULetK/sDlyghEgqeCPYsLKQPwuHy6prYF3WT2ZryfN5V7iT9QeWybX1SGR8TkKWMb9fTAEZH9ntiz7f17i8gWZgeQxAx5FYHyAA) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">на 6 баночек по 230 мл:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">малина 1,2 кг (или готовое качественное пюре из сезонной ягоды 1 кг)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">плоды маракуйи 8 штук для насыщенного вкуса (4 штуки для легкой нотки)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 550 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пектин NH 14 г (или 8 г, если не любите густые конфитюры)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">📌</i><span class=\"tx\">NOTE: если у вас нет пектина NH, можно заменить его на пектин HM — в простонародье жёлтый пектин (цитрусовый или яблочный), но нужно изменить граммовку (16-18 грамм) и порядок работы:</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">отобрать 20–30 г сахара от общей массы и смешать его с пектином</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">добавить этот сахар с пектином в холодное малиновое пюре (до нагрева!), тщательно размешать венчиком</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">затем нагревать, а оставшийся сахар всыпать уже после закипания, варить 4-5 минут</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Малину перебрать, удалить плохие ягоды, переложить в кастрюлю и пюрировать блендером. Пропустить полученное пюре через сито, чтобы избавиться от большого количества косточек, вернуть в кастрюлю, добавить половину сахара и поставить на средний огонь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Когда от малины начнет исходить пар, всыпать вторую половину сахара, перемешанную с пектином (тонкой струйкой, непрерывно помешивая венчиком), добавить мякоть маракуйи. Довести до кипения, проварить три минуты, скрупулезно снимая пенку.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Снять с огня, разлить горячим по заранее стерилизованным банкам, плотно закрыть крышками, перевернуть вверх дном. Хранить до 6 месяцев в закрытых банках в прохладном, тёмном месте и до 2–3 недель после открытия — при условии, что вы используете чистую ложку и держите банку в холодильнике.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0838_01_839_photo.webp\" alt=\"\"></figure></div>"},"493":{"id":493,"title":"Лимончелло","sub":"домашний лимонный ликёр","cat":"Напитки","img":"thumb/0493_00_493_photo.webp","lq":"data:image/webp;base64,UklGRqIAAABXRUJQVlA4IJYAAACwBACdASoUABkAPu1mqk8ppaOiKA1RMB2JQBTiggtTOO3v1oSL1mKFAFT1pn1gAP6DmFOCfHwPEeQwOZj7r+UQClx2x+xjwA7705T/NSjR98u+GleB1rUdS+r1pzf4iprxTPRVPZRbaxLTQRxqjNRknuImcjxNJ+bB+vLkuEn3aH+nLGoc7AhP4WGZny8EKETwaLNQAAA=","w":360,"h":450,"q":"лимончелло домашний лимонный ликёр примерно на 1 5 л лимоны 1 кг обязательно органические спирт пищевой 95 96 500 г сахар 450 г вода 750 г лимончелло домашний лимонный ликёр","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0493_00_493_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRqIAAABXRUJQVlA4IJYAAACwBACdASoUABkAPu1mqk8ppaOiKA1RMB2JQBTiggtTOO3v1oSL1mKFAFT1pn1gAP6DmFOCfHwPEeQwOZj7r+UQClx2x+xjwA7705T/NSjR98u+GleB1rUdS+r1pzf4iprxTPRVPZRbaxLTQRxqjNRknuImcjxNJ+bB+vLkuEn3aH+nLGoc7AhP4WGZny8EKETwaLNQAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">примерно на 1,5 л:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимоны 1 кг (обязательно органические)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">спирт пищевой 95–96% 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 450 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 750 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Лимоны вымыть и обсушить. Ножом-экономкой снять с них цедру, стараясь захватывать как можно меньше белой части. Затем для уверенности пройтись по внутренней стороне каждой полоски цедры острым ножом и максимально срезать оставшийся белый слой. Не халтурьте на этом этапе, иначе у лимончелло будет неприятная горечь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Цедру сложить в большую чистую банку, залить спиртом, плотно закрыть и оставить на 2 недели в тёмном месте при комнатной температуре. Можно держать цедру и меньше, и больше, от 5 дней до месяца, на мой взгляд подходящий цвет и аромат появляется примерно уже через 12-14 дней.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Смешать 550 г воды с сахаром, поставить на средний огонь и прогреть, помешивая, до полного растворения сахара (кипятить не нужно). Полностью остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Лимонный спирт процедить через мелкое сито, следом влить настоянный спирт в холодный сахарный сироп и перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Оставшиеся 200 г воды налить в банку с цедрой, плотно закрыть и очень хорошо взболтать, затем процедить эту воду в лимончелло и ещё раз хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Разлить лимончелло по чистым бутылкам, плотно закрыть и убрать в холодильник. Желательно дать ему постоять хотя бы несколько дней: сразу после смешивания вкус может показаться довольно резким. Чем дольше будет стоять, тем мягче будет результат.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Подавать лимончелло очень холодным, небольшими порциями, в ледяных рюмках после плотного обеда — идеально!</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Хранить в плотно закрытой бутылке в холодильнике до 6 месяцев или в морозильной камере до года.</div></div></div></div>"},"507":{"id":507,"title":"Беллини","sub":"с персиковым сорбетом","cat":"Напитки","img":"thumb/0507_00_507_photo.webp","lq":"data:image/webp;base64,UklGRsAAAABXRUJQVlA4ILQAAAAwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZQDE2A65VS0LGuinRXDqBc2RgKaUS7ncAAD7EaOr6Gf8mciZSTykiuAisIIe6hOZ16IM9jnOj+Li4C/SOp9tsqwTlOLcSzy0FqZGOD19J0HW7jXw4L2VOd/lFpyCuE+XadMGRoDPS4pVBM5AEbUMON+hzJxtch2xne+0nlg77iHAnMX72TN4HeG/bnb0Dj7WVHqYznOGiLQAAAA=","w":360,"h":450,"q":"беллини с персиковым сорбетом на 2 бокала просекко 250 г персиковый сорбет 120 г тонкие ломтики свежего персика для подачи беллини с персиковым сорбетом","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0507_00_507_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsAAAABXRUJQVlA4ILQAAAAwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZQDE2A65VS0LGuinRXDqBc2RgKaUS7ncAAD7EaOr6Gf8mciZSTykiuAisIIe6hOZ16IM9jnOj+Li4C/SOp9tsqwTlOLcSzy0FqZGOD19J0HW7jXw4L2VOd/lFpyCuE+XadMGRoDPS4pVBM5AEbUMON+hzJxtch2xne+0nlg77iHAnMX72TN4HeG/bnb0Dj7WVHqYznOGiLQAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 бокала:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">просекко 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">персиковый сорбет 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тонкие ломтики свежего персика для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Соединить просекко и сорбет в шейкере. Если шейкера нет, отлично подойдет небольшой термос или бутылка с плотно закрывающейся крышкой.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Быстро встряхивать 15–20 секунд, пока сорбет полностью не соединится с просекко, а сверху не появится густая пенка.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Сразу же разлить беллини по охлажденным бокалам и украсить каждый тонким ломтиком свежего персика.</div></div></div></div>"},"611":{"id":611,"title":"Горячий шоколад","sub":"chocolat chaud à l’ancienne","cat":"Напитки","img":"thumb/0611_00_611_photo.webp","lq":"data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JQBdiP/xbJRYgrf1owOuV8CzSBG4QQh1h6jJAAPcfIqSilqxVmSPjg3EdNKhRlfA70QEw5Pc6MntBzIkW12h43/RsxGdJvzYzdV48pnvjLdo9UKqkQeNJrIPSo4CJYaHcoa/ntevqCq4EaCkVy+dtQkEcOvx7vBxUGXqXQlP7f+dFy/zPkT10yunu+pYnJyTaRJrJfuNsFQ9p3mWTpeYTRcjWpDfj/CBckP5U+eh0Ktrwkiqc1RsTduJ/CNWZZ+3weHYBgPElwLtvyAA=","w":360,"h":450,"q":"горячий шоколад chocolat chaud à l’ancienne на 2 3 чашки молоко цельное 300 г сливки 30 115 г горький шоколад 70 80 г молочный шоколад 55 г пудра ванили 1 4 ч л мускатный орех щепотка для сервировки сливки 30 100 г какао щепотка горячий шоколад chocolat chaud l ancienne в детстве я обожала фильмы про анжелику помните такие красивые женщины пышные платья париж восемнадцатого века любовь приключения вот это всё в одном из фильмов анжелика открывает салон где подаёт горячий шоколад для девочки из маленького города ахтубинска в разгар девяностых это звучало абсолютно нереально волшебно шоколадный салооон чуть ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0611_00_611_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JQBdiP/xbJRYgrf1owOuV8CzSBG4QQh1h6jJAAPcfIqSilqxVmSPjg3EdNKhRlfA70QEw5Pc6MntBzIkW12h43/RsxGdJvzYzdV48pnvjLdo9UKqkQeNJrIPSo4CJYaHcoa/ntevqCq4EaCkVy+dtQkEcOvx7vBxUGXqXQlP7f+dFy/zPkT10yunu+pYnJyTaRJrJfuNsFQ9p3mWTpeYTRcjWpDfj/CBckP5U+eh0Ktrwkiqc1RsTduJ/CNWZZ+3weHYBgPElwLtvyAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2-3 чашки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко цельное 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 115 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горький шоколад 70% 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молочный шоколад 55 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пудра ванили 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для сервировки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">какао щепотка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>В детстве я обожала фильмы про Анжелику, помните такие? Красивые женщины, пышные платья, Париж восемнадцатого века, любовь, приключения, вот это всё. В одном из фильмов Анжелика открывает салон, где подаёт горячий шоколад. Для девочки из маленького города Ахтубинска в разгар девяностых это звучало абсолютно нереально, волшебно — шоколадный салооон. Чуть позже в магазины ворвались яркие желтые пачки растворимого Несквика, и я была на сто процентов уверена, что вот он — тот самый напиток из фильма. Играла в ролевые игры, конечно, воображала.</p>\n<p>О том, что горячий шоколад — это вовсе не какао с сахаром, а практически десерт, густой и насыщенный, я узнала сильно позже, впервые приехав в Париж. Его подавали в серебряном кофейнике, с ложечкой и взбитыми сливками в красивой креманке, такая невероятная красота, почти ритуал. Ещё через несколько лет я приехала в Париж снимать программу про французский кондитерский мир, и в одном из эпизодов пила горячий шоколад с наследником знаменитой шоколадной династии — Пьером Клюзелем. Это вновь изменило мои представления об этом напитке. В Un Dimanche à Paris горячий шоколад был невероятно бархатным, с отчётливой мягкостью молочного шоколада и тонкими ароматами пряностей, которые не звучали “в лоб”, а будто водили сложный вкусовой хоровод вместе с шоколадом.</p>\n<p>Рецепт, разумеется, был засекречен (а как иначе), и всё, что мне удалось понять из разговора: напиток готовят из молока и сливок, используют несколько видов шоколада и обязательно добавляют смесь пряностей. Создавая рецепт для Клуба, я, конечно, опиралась именно на тот опыт — и на то детское ощущение чуда, которое когда-то началось с фильма про Анжелику.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В сотейнике соединить молоко, сливки, пудру ванили и щепотку свеженатёртого мускатного ореха. Нагреть на среднем огне до активного пара, не доводя до кипения. Снять с огня, накрыть крышкой и оставить настаиваться на 15 минут — за это время молоко впитает аромат пряностей и станет глубже.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Шоколад (напомню, что для напитка нужно брать самый лучший из тех, что можете себе позволить — это напрямую влияет и на вкус, и на текстуру) поломать на небольшие кусочки, чтобы он быстрее и равномернее растопился.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Вернуть молочно-сливочную смесь на огонь, снова прогреть до горячего состояния. Добавить шоколад, снять с огня и оставить на 1–2 минуты — дать ему спокойно начать таять. Затем тщательно перемешать венчиком и пробить погружным блендером до гладкой, устойчивой эмульсии.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Поставить шоколад обратно на слабый огонь и уваривать 8–10 минут, помешивая, до плотной, бархатной консистенции. Сначала напиток будет очень жидким как какао, но время, температура и движения сделают свое дело, не переживайте. Процедить через мелкое сито, чтобы текстура стала идеально шелковистой.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Сливки для подачи взбить до мягких пиков. Подавать горячий шоколад в прогретой и самой красивой чашке, что у вас есть, отдельно — креманку со взбитыми сливками. Перед подачей можно также слегка присыпать поверхность какао — это не для вкуса, а для настроения. Régalez-vous!</div></div></div></div>"},"528":{"id":528,"title":"Продукты с началом прикорма","sub":"что появилось в доме и осталось","cat":"Малышковый Мишлен","img":"thumb/0528_00_528_photo.webp","lq":"data:image/webp;base64,UklGRm4AAABXRUJQVlA4IGIAAADwAwCdASoUABsAPu1mq02ppaQjMAgBMB2JZQC06A7raE4Qtk63BMQAAPcEYHGrIVz4jkudp4d3xnLU9zHzsKsKuOyTbNiNQPf4DSYsJLgItAWHK4KNVnGLZXOSAT+sM6XYAA==","w":360,"h":480,"q":"продукты с началом прикорма что появилось в доме и осталось продукты появившиеся в моём доме с началом прикорма решила что месяц малышкового мишлена будет неполным без этого списка с прикормом изменился обогатился не только рацион нашей семьи но и вся гастроэкосистема дома появились смешные приспособления формы для сосисок фигурные ножи формочки для фруктов и овощей масла с эко шмеко названиями какие то странные баночки делюсь своими находками что появилось задержалось и стало частью моей кухни масла","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_00_528_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_01_529_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_02_530_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_03_531_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_04_532_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0528_05_533_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Продукты, появившиеся в моём доме с началом прикорма</p>\n<p>Решила, что месяц Малышкового Мишлена будет неполным без этого списка. С прикормом изменился (=обогатился) не только рацион нашей семьи, но и вся гастроэкосистема дома. Появились смешные приспособления (формы для сосисок, фигурные ножи, формочки для фруктов и овощей), масла с эко-шмеко-названиями, какие-то странные баночки. Делюсь своими находками: что появилось, задержалось и стало частью моей кухни.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">МАСЛА</span></li></ul>\n<p>(холодный отжим, только в тёмных бутылках, не храним у плиты, лучше — в прохладной кладовке или на крайний случай в холодильнике)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Масло авокадо</span></li></ul>\n<p>Первое и любимое, готовлю на нём чаще всего. Бледно-зелёное, с лёгким травяным привкусом. Напоминает оливковое, но мягче. Удобно для зелени и салатов, когда хочется масла без яркости. Плюс: можно жарить и не переживать, температура дымления — рекордные 270 °C! Содержит мононенасыщенные жиры и витамин Е. Словом, то, что нужно растущему (и не очень))) мозгу.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Гхи</span></li></ul>\n<p>Классика аюрведы, а с недавних пор и наших завтраков. Гхи — это мееееедленно и долго топлёное сливочное масло без молочных белков, с легким карамельным ароматом. Жарку переносит отлично (дымление 250 °C). Часто кладу ложечку в тёплую рисовую кашу и картофельное пюре — сразу же включаются режимы “дом”, “мама”, “уют”.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Кокосовое</span></li></ul>\n<p>Нежное, слегка сладкое, идеально для запекания, каш или крем-супов. Не окисляется, хорошо усваивается, вкус нейтральный (если рафинированное). В каши — чудо как хорошо, и лучший вариант для жарки сладкого (температура дымления - 230) — сырников, оладушков, панкейков и блинов.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">СУПЕРФУДЫ-ПОСЫПКИ</span></li></ul>\n<p>(столько пользы, что хочется посыпать всё — и не только детское)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Семена конопли</span></li></ul>\n<p>Звучит эффектно, но это пищевая конопля — keine Panik, психоактивных веществ нет. Кремовые мягкие зёрнышки, богаты белком, омега-3, омега-6, железом, магнием и цинком. По текстуре — как молодые орешки. Добавляю в каши, супы, на тосты — почти не чувствуются, а питательная ценность растёт мгновенно.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Воздушный киноа</span></li></ul>\n<p>Лука зовёт их “мини-попкорн”. Крошечные хлопья, похрустывающие — мой способ добавить текстуру в мягкие блюда. Посыпаю каши, йогурты, фрукты, урбеч. Полезная замена сухарикам — хрустит, не мешает, обогащает.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Семена чиа</span></li></ul>\n<p>Маленькие чёрные или белые, богаты омега-3, кальцием, антиоксидантами. В жидкости образуют гель — отлично к йогурту или творожку. Важно не переборщить, не давать ложками в сухом виде и следить за консистенцией десерта — при избытке могут вызвать у малыша ощущение удушья и напугать.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Семена льна</span></li></ul>\n<p>Источник растительных омега-3 и клетчатки. Молотые семена льна легко усваиваются, добавляю в каши, выпечку, смузи. Помогают мягко наладить пищеварение.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ПАСТЫ И УРБЕЧИ</span></li></ul>\n<p>(орехи и семена, перемолотые в мягкую пасту без сахара и добавок)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Миндальный</span></li></ul>\n<p>Нежный, сливочный, с естественной сладостью. В кашу, на банан, в печёные яблоки. Богат кальцием и магнием. Мой фаворит в теплых кашах с фруктовым компоте (яблочным, грушевым, сливовым). Настоящий десерт! Неспроста урбеч из обжаренного миндаля мой сын называет “ореховым шоколадом”.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Кешью</span></li></ul>\n<p>Мягкий, маслянистый, сливочный. Добавляю в супы-пюре и салатные заправки — делает вкус глубже, особенно с морковью, тыквой и авокадо.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Арахисовый</span></li></ul>\n<p>Самый “народный”. Главное — без соли и сахара, 100% арахис. Использую дозировано: арахис — не самый полезный и питательный из орехов. Хорошо сочетается с френч-тостами, вафлями, яблоком, бататом.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Тахини (кунжутный урбеч)</span></li></ul>\n<p>Кремообразная паста из молотого кунжута, богатая кальцием и полезными жирами. Отлично подходит для добавления в соусы и заправки, намазывания на хлебцы или, конечно, к хумусу. Всегда есть в холодильнике. Совет: чтобы не разочароваться, покупайте импортную пасту, израильскую или ливанскую с хорошими отзывами.</p></div>"},"844":{"id":844,"title":"Гречка умами","sub":"","cat":"Малышковый Мишлен","img":"thumb/0844_00_844_photo.webp","lq":"data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JQBOmXDH/H1o5+jv8jPRkuVUzbWyeamwKhbBfgmYAAPdxY/EOL7+Z3XI0DqVUjEZYi9cIpmig3jGHTPcxdreKgim66cnJ3qzdxAX7KqunX5RcBNkkOCXpnhcLC6VEg/00HrAkvsFHZwUqt8YPLh2PZbSo7PpLZrp2GDRjOon4BQ8/rZRN/NgZULLcVKED4WyuDCVhwssEdZHNTO59AcPQuWzlPl+Ahd9J5CTpYvFAgQ7A7EaoAAAA","w":360,"h":450,"q":"гречка умами  на 5 6 порций гречка 200 г фарш говядина свинина 500 г шампиньоны 400 г лук репчатый 1 шт чеснок 2 зубчика тимьян 5 веточек оливковое масло 2 ст л сливочное масло 15 г белые грибы суш 15 г бульон куриный говяжий 500 г соевый соус 40 г или 20 если вы употребляете мало соли бальзамический уксус 2 ст л вурстшерский соус 1 ст л черный перец пармезан лук резанец для мм малышкового мишлена гречка отваренная в несолёной воде семена конопли гречка умами onepot когда я прорабатывала план на этот месяц то желая сделать свою любимую гречку с мясом и грибами какой то более изысканной вписала в меню слово гречотто хорошо что прежде чем давать рецепт все свои идеи я тестирую результат меня не порадовал этому блюду не пошла на пользу ризоттовая кремовость и в итоге я делала всё заново откатив рецепт к базовым настройкам если в","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0844_00_844_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JQBOmXDH/H1o5+jv8jPRkuVUzbWyeamwKhbBfgmYAAPdxY/EOL7+Z3XI0DqVUjEZYi9cIpmig3jGHTPcxdreKgim66cnJ3qzdxAX7KqunX5RcBNkkOCXpnhcLC6VEg/00HrAkvsFHZwUqt8YPLh2PZbSo7PpLZrp2GDRjOon4BQ8/rZRN/NgZULLcVKED4WyuDCVhwssEdZHNTO59AcPQuWzlPl+Ahd9J5CTpYvFAgQ7A7EaoAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 5-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">гречка 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш говядина/свинина 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шампиньоны 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 5 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белые грибы суш. 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный/говяжий 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 40 г (или 20, если вы употребляете мало соли)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстшерский соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для ММ (Малышкового Мишлена):</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">гречка, отваренная в несолёной воде</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">семена конопли</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>#onepot</p>\n<p>Когда я прорабатывала план на этот месяц, то, желая сделать свою любимую гречку с мясом и грибами какой-то более изысканной, вписала в меню слово “гречотто”. Хорошо, что прежде чем давать рецепт, все свои идеи я тестирую! Результат меня не порадовал. Этому блюду не пошла на пользу ризоттовая кремовость, и в итоге я делала всё заново, откатив рецепт к базовым настройкам. Если вы любите гречку, и у вас есть чугунок, то могу пообещать, что блюдо войдет в ваш постоянный арсенал.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Белые грибы замочить в горячем бульоне и оставить на 15-20 минут (можно и на ночь). Тем временем обмыть, обсушить и нарезать кубиком шампиньоны (удобнее всего отрезать ножку вместе с нижней частью шляпки, затем резать кубиком обе части). Лук и чеснок очистить и нарезать мелким кубиком. Для следующего шага отложить в нужном количестве нарезанные лук и шампиньоны.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Для Малышкового Мишлена:<br>В чугунке (или отдельной небольшой сковородке) на среднем огне разогреть 1 ч л масла (авокадо, кокосовое или гхи). В течение 2-3 минут обжарить до мягкости лук, затем добавить шампиньоны и обжаривать 7-10 минут, периодически помешивая деревяной лопаткой или силиконовой спатулой. Переложить в тарелку и следом обжарить небольшое количество фарша в течение 5 минут, пока не пропадёт розовый цвет. Добавить к луку с грибами, перемешать, держать в тепле.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Белые грибы достать из бульона, отжать, нарезать небольшими кусочками. В чугунок добавить оливковое и сливочное масло, растопить на среднем огне. Добавить нарезанный лук и чеснок, обжаривать в течение 3-5 минут. Когда лук станет мягким и золотистым, добавить белые грибы, обжаривать ещё 3-5 минут. Следом - шампиньоны и листики тимьяна, и здесь важный момент. Шампиньоны должны очень хорошо зажариться. Чтобы достичь этой цели, сперва им надо избавиться от влаги, а затем постепенно начать золотиться. Не торопитесь здесь, только Очень Хорошо Обжаренные грибы обладают значительным вкусом. На это должно уйти около 10 минут, может больше, но лучше не меньше. Когда всё будет готово, освободить чугунок, переложив содержимое в тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Не добавляя масло, на средне-сильном огне обжарить фарш в течение 5-7 минут, разбивая его деревянной лопаткой на маленькие кусочки. Добавить смесь грибов из предыдущего шага, хорошо перемешать. Влить бальзамический уксус, соевый и вурстшерский соусы (можно заранее объединить их в чашке), поперчить, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Всыпать в чугунок гречку, перемешать, добавить горячий бульон, в котором отмокали грибы. Если бульон не покрыл всю гречку, то долить еще немного воды, чтобы над гречкой был небольшой слой воды. Убедиться, что вода нагрелась и кипит. Закрыть крышкой, убавить огонь до минимума (у меня 3 из 9) и забыть на 25 минут.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: С точки зрения правильной текстуры гречки здесь действительно лучше всего подходит чугунок, так как чугун прекрасно удерживает тепло и помогает гречке готовиться, одновременно с этим не позволяя воде быстро выкипать. Если вы готовите в кастрюле или на сковороде, следите за уровнем воды и готовностью гречки - возможно, придется подливать и готовить чуть дольше.</div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Выключить огонь, оставить под крышкой еще на 5-10 минут. Подавать, щедро посыпав пармезаном, свежемолотым черным перцем и украсив луком-резанцом. Наде (8 месяцев) я смешиваю отварную гречку со сделанной в самом начале заготовкой и посыпаю семенами конопли. Варианты подачи - в следующем посте.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">На второй день гречка становится еще вкуснее, до третьего никогда не доживает :)</span></li></ul></div></div>"},"855":{"id":855,"title":"Курица карри с лимонным рисом","sub":"murgh makhani","cat":"Малышковый Мишлен","img":"thumb/0855_00_855_photo.webp","lq":"data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAACQBQCdASoUABsAPu1osFAppaSiqAqpMB2JQBWEJpk4ADE/sFLGyPdL+YCLCLEaZvgvlH2HEAD504wPluJdhaftMLEpFc75H+Pr+K6q+wsj7U+3Cix33Rixl5c1r3mUXc33hKJf/ri3piFmBzYBnSDog1TWS3/JWTemBwgtyrRcKUjYojK0Bz4aHo1R1vBWXtH9BZq2G/WtC19Zae1L+mxmTjLvRcvAnFTpbzEtC4SVIBv7fP+Q4BJcYAcq+NHZkVwRUPHNLdjimY+R4bgxOelUp1v/9jqCo/a8wbmqSPPyhwAA","w":360,"h":480,"q":"курица карри с лимонным рисом murgh makhani на 4 5 порций курица голени 1200 г 10 шт греческий йогурт 240 г лимон 1 шт сок гарам масала 2 ч л лук 1 шт карри 6 ч л куркума 2 ч л имбирь 1 ч л кардамон 1 ч л корица 1 ч л чеснок 1 2 ч л масло гхи авокадо 40 г томаты консервированные целые без кожи 400 г соев соус 2 ст л бульон 100 г томатная паста 15 г 1 ст л сливки 30 120 г для лимонного риса рис басмати 190 г лимон 1 2 шт цедра и сок майоран орегано базилик 2 3 веточки опционально вода 240 г оливковое масло 1 ст л курица карри с лимонным рисом murgh makhani жила была в отдаленном уже 2012 году девочка саша и была она вегетарианкой работала в афише с работы в квартиру на бауманке возвращалась с тульской на трамвае номер три каждый день проезжая мимо дома в котором через несколько лет откроет с мужем немцем эклерную выходила на остановке улица воронцово поле и брела до своего любимого кафе джаганнат","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"600\" height=\"800\" src=\"img/0855_00_855_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAACQBQCdASoUABsAPu1osFAppaSiqAqpMB2JQBWEJpk4ADE/sFLGyPdL+YCLCLEaZvgvlH2HEAD504wPluJdhaftMLEpFc75H+Pr+K6q+wsj7U+3Cix33Rixl5c1r3mUXc33hKJf/ri3piFmBzYBnSDog1TWS3/JWTemBwgtyrRcKUjYojK0Bz4aHo1R1vBWXtH9BZq2G/WtC19Zae1L+mxmTjLvRcvAnFTpbzEtC4SVIBv7fP+Q4BJcYAcq+NHZkVwRUPHNLdjimY+R4bgxOelUp1v/9jqCo/a8wbmqSPPyhwAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-5 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица (голени) 1200 г (10 шт)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">греческий йогурт 240 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарам масала 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук 1 шт</span></li><li><i class=\"bul\">⭐️“</i><span class=\"tx\">карри” 6 ч л (куркума 2 ч л, имбирь 1 ч л, кардамон 1 ч л, корица 1 ч л, чеснок 1/2 ч л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло гхи/авокадо 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консервированные целые без кожи 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соев.соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста 15 г (1 ст л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 120 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для лимонного риса:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">рис басмати 190 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">лимон 1/2 шт (цедра и сок)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">майоран/орегано/базилик 2-3 веточки (опционально)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">вода 240 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">оливковое масло 1 ст л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Жила-была в отдаленном уже 2012 году девочка Саша, и была она вегетарианкой. Работала в “Афише”, с работы в квартиру на Бауманке возвращалась с Тульской на трамвае номер три, каждый день проезжая мимо дома, в котором через несколько лет откроет с мужем-немцем эклерную. Выходила на остановке “Улица Воронцово поле” и брела до своего любимого кафе Джаганнат. Почти каждый день брала там одно и то же - плошку риса, панир махани, две самосы и клюквенный морс (или манго ласси, когда хотелось шикануть). В порции было несколько кусков панира, может пять, может шесть. Вот самое счастье было доесть уже всё почти до конца и внезапно обнаружить, что под рисом спрятался еще один кубик сыра в насыщенно-пряном томатном соусе. Через пару лет вегетарианство из моей жизни ушло, а вместе с ним и Джаганнат, и волшебный рис, утопающий в сливочно-красном соусе.</p>\n<p>Спустя целых десять лет, в 2022, в жизнь мою вместе с материнством пришел прикорм. В поисках вдохновения я часто серфила интернет и Pinterest, и однажды увидела фотографию симпатичной тарелочки с куриной ножкой, рисом, каким-то густым оранжевым соусом и соцветиями брокколи. Раздобыв все ингредиенты и как обычно в процессе переделав полрецепта под себя, стояла я рядом с кастрюлькой, помешивая красивый соус. Запах стоял чудесный - пряный, сливочный, азиатский. Раньше я никогда не готовила курицу карри с добавлением томатов, и не могла понять, почему аромат мне настолько знаком. А потом случилась первая ложка, и у меня почти выступили слезы. Это был тот самый, обожаемый мной махани, название которого я никогда не запоминала. И всё в голове разом пронеслось — и двадцатилетняя я, проверяющая, хватит ли мне сегодня на манго ласси, и Афиша, и комната моя на Бауманской и соседка-крутой-продюсер (Тая, ты вроде тоже в клубе, привет!), и дом по адресу Новокузнецкая 18 с надписью «Кафе-кондитерская» из окна трамвая и мои запредельные, в духе “ха, ну немыслимо же”, мечты иметь однажды такое же, и столешница с пятнышком, и важный пост, написанный за ней с мокрыми щеками, и долгожданное розовощёкое счастье и первая ложка яблочного пюре, а затем и куриная ножка в насыщенно-пряном томатном соусе. А кто-то говорит, всего лишь еда!</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: рецепт даётся именно в контексте Малышкового Мишлена - количество пряностей подобрано таким образом, чтобы вкус соуса был насыщенным, но не ярким и не острым. Если вы готовите для себя, смело умножайте специи на два. Я не беру для соуса готовую смесь “карри”, потому что чаще всего она не позволяет варьировать остроту, но если хотите - можно взять и её. Вместо обычных сливок можно взять кокосовые, но вкус поменяется.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В большой миске смешать венчиком греческий йогурт, сок одного лимона и гарам масала, поместить в маринад курицу и оставить на один час (максимум на ночь). Если готовите для себя, то прежде чем опускать в маринад, хорошо натрите курицу солью и перцем.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Для лимонного риса снять цедру с половины лимона, выжать сок, мелко нарубить зелень. Рис промыть холодной водой несколько раз, пока вода не станет прозрачной. В кастрюле разогреть одну ложку оливкового масла, добавить цедру и травы, обжарить в течение одной минуты. Всыпать рис, обжарить в течение одной минуты, затем влить воду, перемешать и довести до кипения на сильном огне. Как только вода закипит, убавить огонь до минимума (у меня 3 из 9), накрыть крышкой и оставить на огне на 15 минут. По прошествии этого времени, не открывая крышку, дать рису настояться еще 5-10 минут. В конце добавить лимонный сок и посолить, если нужно (я не солю рис)⤵️</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук очистить и нарезать мелким кубиком. В чугунке или сковороде с толстым дном и высокими стенками разогреть масло гхи/авокадо на среднем огне. Добавить лук и обжаривать, помешивая, в течение десяти минут, пока он не станет мягким. Добавить все пряности, перемешать и обжаривать еще 2 минуты. Влить томаты, разбить деревянной лопаткой плоды, чтобы из них вышел сок, добавить томатную пасту, соевый соус и довести до кипения. Следом — куриные ножки вместе с маринадом, влить бульон, аккуратно и тщательно перемешать, снова довести до кипения, затем убавить огонь, накрыть крышкой и томить 45 минут. Каждые 15 минут я аккуратно перемешиваю ножки, чтобы они готовились равномерно.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">По прошествии этого времени вытащить курицу, влить сливки, пробить соус погружным блендером до однородности, довести до кипения, вернуть ножки, хорошо перемешать, чтобы соус покрыл курицу. Затем выключить огонь и дать блюду настояться минимум десять минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подавать курицу, щедро полив соусом лимонный рис, с зеленым салатом или соцветиями брокколи. Для красоты можно присыпать хлопьями сладкой паприки.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0855_01_856_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0855_02_857_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0858_00_858_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0858_01_859_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0858_02_860_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0858_03_861_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0858_04_862_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0858_05_863_photo.webp\" alt=\"\"></figure></div>"},"864":{"id":864,"title":"Фриттата","sub":"с курицей, артишоками, шпинатом, сладкой паприкой и сыром","cat":"Малышковый Мишлен","img":"thumb/0864_00_864_photo.webp","lq":"data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAADwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JagCdMxL//tAZdxmYIljPxCXuCQE4AbYCindGjemAQADNzoNnO3bsQPI3eB1JmutAg0XXF1SgUdTCCfPR8AodXKw+qeq/gHX16TxrNC6NQAqgHZXhfDvCMeRTY7JZ0x4ebIL4XsQtYmo9QzLEXWvQa/JHqAm8oMYdj+4xxq9qrouM82YQgYoGsNP5YSQVmFCT3Q9jVxiBf5Is1bS8DTKhvylwVqKSJ205rmpRVNF2YU1o6LGHDumrnMSrVfNanZ3J2VvkUAdU1iEsAAA=","w":360,"h":450,"q":"фриттата с курицей, артишоками, шпинатом, сладкой паприкой и сыром на 4 порции яйца 6 шт молоко 120 г куриная грудка отварная 170 г артишоки в масле 180 г шпинат свежий 70 г лук репчатый 1 2 шт перец болгарский красный 1 шт маленький или половинка крупного грюйер 100 г оливковое масло 2 ст л соевый соус 1 ст л 1 ст л воды соль черный перец петрушка для малышкового мишлена яйца 4 шт молоко 80 г куриная грудка отварная 100 г овощи например брокколи 100 г моцарелла 40 60 г мускатный орех щепотка фриттата с курицей артишоками шпинатом сладкой паприкой и сыром фриттата итальянский омлет с начинкой запекаемый в духовке на манер пирога ровно как гречневая лапша из предыдущего рецепта появилась в моём арсенале во времена когда лука был малышом я тогда каждый день отваривала для него разные овощи запекала курицу и рыбу и фриттата была изящным способом оживить вчерашнюю еду я запол","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0864_00_864_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAADwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JagCdMxL//tAZdxmYIljPxCXuCQE4AbYCindGjemAQADNzoNnO3bsQPI3eB1JmutAg0XXF1SgUdTCCfPR8AodXKw+qeq/gHX16TxrNC6NQAqgHZXhfDvCMeRTY7JZ0x4ebIL4XsQtYmo9QzLEXWvQa/JHqAm8oMYdj+4xxq9qrouM82YQgYoGsNP5YSQVmFCT3Q9jVxiBf5Is1bS8DTKhvylwVqKSJ205rmpRVNF2YU1o6LGHDumrnMSrVfNanZ3J2VvkUAdU1iEsAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 6 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриная грудка (отварная) 170 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">артишоки в масле 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шпинат свежий 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец болгарский красный 1 шт (маленький или половинка крупного)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">грюйер 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л + 1 ст л воды</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для Малышкового Мишлена:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">яйца 4 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">молоко 80 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">куриная грудка (отварная) 100 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">овощи (например, брокколи) 100 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">моцарелла 40-60 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">мускатный орех щепотка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Фриттата, итальянский омлет с начинкой, запекаемый в духовке на манер пирога, ровно как гречневая лапша из предыдущего рецепта, появилась в моём арсенале во времена, когда Лука был малышом. Я тогда каждый день отваривала для него разные овощи, запекала курицу и рыбу, и фриттата была изящным способом “оживить” вчерашнюю еду. Я заполняла силиконовые формочки остатками, заливала яичной смесью, присыпала сыром, ставила в духовку - и через двадцать минут были готовы вкусные и симпатичные мини-омлетики. Для Клуба я придумала жизнерадостную  версию с артишоками, но думаю, вы поняли: фриттата - простор для фантазии и спасение ваших leftovers. Сегодня может быть с курицей, завтра с лососем, послезавтра с беконом, а на следующей неделе - овощная или с четырьмя видами сыра. Прекрасна как завтрак выходного дня или ланч, просто добавьте зеленый салат и углеводов для сытости - например, ломоть ремесленного хлеба с домашней рикоттой или плошку булгура с оливковым маслом и лимонным соком.</p></div><p>(на 8 мини-фриттат)</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 170 градусов (режим: конвекция). Сыр натереть на крупной тёрке. Подготовить все ингредиенты для начинки - лук и болгарский перец очистить от шелухи и семян, артишоки откинуть на дуршлаг и дать маслу максимально стечь, шпинат хорошо промыть и обсушить. Лук, перец и куриную грудку нарезать мелким кубиком, артишоки крупно нарубить (если попадаются жесткие листья, уберите и выбросьте).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В высоком пластиковом стакане соединить яйца, молоко и соль, пробить все погружным блендером до однородной текстуры.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Сковороду диаметром 28 см установить на средний огонь. Добавить оливковое масло, подождать немного, пока оно нагреется, затем добавить нарезанный лук и, помешивая, обжарить его в течение 3 минут - он должен пожелтеть и стать прозрачным. Добавить болгарский перец и обжаривать еще около 7 минут. Следом - куриное филе кубиками, артишоки, шпинат, соевый соус с водой. Обжаривать начинку еще около 3-5 минут, чтобы шпинат слегка увял, а ингредиенты полноценно поделились друг с другом ароматами. Поперчить, перемешать, залить яичной смесью, добавить тертый сыр и еще раз хорошо перемешать всё, пока яйца не успели схватиться.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Держать фриттату на огне около 2-3 минут, затем переставить в духовку и запекать 15-20 минут (проверять готовность, так как духовки у всех разные). Дать пару минут остыть, прежде чем перекладывать на тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для малышни я взбиваю яйца с молоком, раскладываю по силиконовым формочкам начинку, заливаю яичной смесью, присыпаю тертой моцареллой и добавляю сверху щепотку мускатного ореха. Выпекаю 15-20 минут, опять же в зависимости от духовки. Прежде чем доставать, следует немного остудить - 5-10 минут (иначе легко “не выпадут”).</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Сегодня подаю с зеленым салатом и клубникой с каплей оливкового масла и качественного бальзамика, присыпав семенами конопли. Весна в тарелках, радость в душе 🙂</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"449\" src=\"thumb/0864_01_865_photo.webp\" alt=\"\"></figure></div>"},"494":{"id":494,"title":"Спагетти с креветками","sub":"в томатном соусе с кокосовым молоком (а-ля Том-Ям)","cat":"Малышковый Мишлен","img":"thumb/0494_00_494_photo.webp","lq":"data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAAAwBgCdASoUABkAPu1qsFAppaSiqAqpMB2JbACdMoHggGe+aHChNpJSWt1oCRIcpNnIHRJ3hP3FslQAAOJXYy2RW3GdUF7//bQpyvXoyfJI1X2Z9pWeKe4N1xpr7IqXV3hh1wfvTkDez4v3BkX96gACDA1YJfRl0tFcrTsGvE0BQcmiBv6DeCY93UxftdlYUSVwjdXV4IfpgxTSExhmaNKKbzVia5c7nAu8x0nHrwERT6v8Q/aMomFsiqvHdz8WHf9psV0gjiYB682lgGC+Yujgu4h/6ErUKT9ehqFF8kzB6cAA","w":360,"h":450,"q":"спагетти с креветками в томатном соусе с кокосовым молоком (а-ля том-ям) на 3 взрослые и 1 детскую порции спагетти 340 г креветки 450 г масло авокадо гхи 30 г томаты консерв 400 г кокосовое молоко 240 г бульон куриный 100 г лук репч 1 шт чеснок гранулированный 1 2 ч л или 1 2 зубчика в зависимости от вашего вкуса лемонграсс лимонная трава 1 шт паприка копченая 1 ч л соевый соус 15 г петрушка или кинза 1 ст л лайм для взрослой версии оливковое масло 1 ст л сливочное масло 30 г соевый соус 15 г рыбный соус 30 г белое вино 60 г перец чили 1 2 шт без семечек или целый если любите поострее пармезан чёрный молотый перец спагетти с креветками в томатном соусе с кокосовым молоком а ля том ям ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0494_00_494_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAAAwBgCdASoUABkAPu1qsFAppaSiqAqpMB2JbACdMoHggGe+aHChNpJSWt1oCRIcpNnIHRJ3hP3FslQAAOJXYy2RW3GdUF7//bQpyvXoyfJI1X2Z9pWeKe4N1xpr7IqXV3hh1wfvTkDez4v3BkX96gACDA1YJfRl0tFcrTsGvE0BQcmiBv6DeCY93UxftdlYUSVwjdXV4IfpgxTSExhmaNKKbzVia5c7nAu8x0nHrwERT6v8Q/aMomFsiqvHdz8WHf9psV0gjiYB682lgGC+Yujgu4h/6ErUKT9ehqFF8kzB6cAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3 взрослые и 1 детскую порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спагетти 340 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">креветки 450 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло авокадо/гхи 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консерв. 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кокосовое молоко 240 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репч. 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/2 ч л (или 1-2 зубчика в зависимости от вашего вкуса)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лемонграсс (лимонная трава) 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка или кинза 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лайм</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для взрослой версии:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">сливочное масло 30 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">соевый соус 15 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">рыбный соус 30 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">белое вино 60 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">перец чили 1/2 шт без семечек (или целый, если любите поострее)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">чёрный молотый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Лук очистить и нарезать мелким кубиком. Лемонграсс обмыть и разрезать пополам. Установить большую сковороду с высокими бортиками на средний огонь, добавить масло авокадо или гхи и выждать с минуту, пока масло нагреется. Затем добавить лук, гранулированный чеснок (можно обычный чеснок, 1-2 зубчика на ваш вкус, я не люблю его чистить и резать, и стараюсь использовать по минимуму), лемонграсс разрезом вниз и обжарить в течение 7-10 минут, пока лук не станет мягким и золотистым. Добавить консервированные томаты (если цельные, размять их и разделить деревянной лопаткой на несколько кусочков), копченую паприку, влить соевый соус, куриный бульон и довести до кипения, затем убавить огонь до минимального и дать потомиться в сковороде без крышки 10-15 минут. Если вы готовите не для малыша, то вместе с копченой паприкой добавляем перец чили, соевый (итого не 15, а 30 грамм) и рыбные соусы и вливаем белое вино.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В большой кастрюле отварить спагетти (если не для малышей, то воду хорошо подсолить) в соответствии с инструкцией на пачке, убавив время варки на 1 минуту.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Предварительно размороженные креветки бросить в кипящую воду и отварить в течение 2-3 минут. Как только порозовеют и примут форму буквы С - вылавливайте. Форма буквы О = переварили. Не стоит переживать, что креветки будут сырые - они доготовятся в соусе позднее.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: Так как это рецепт, адаптированный под питание детей, креветки я отвариваю. Для взрослой версии можно пойти другим путём - тщательно обсушить креветки бумажным полотенцем и быстро обжарить на очень горячей сковороде и смеси оливкового и сливочного масел. Помните про форму буквой С!</div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Из уваренного томатного соуса убрать лемонграсс (утилизировать), смешать с кокосовым молоком и пюрировать с помощью блендера. Мне неудобно делать это в сковороде, поэтому я переливаю соус в высокий стакан, пюрирую, а затем возвращаю в сковороду на огонь. Проверить на соль, если готовите для себя!</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Добавить креветки, перемешать, затем спагетти и нарубленную мелко петрушку или кинзу. Тщательно и при этом аккуратно смешать пасту с соусом. Удобнее всего делать это кухонными щипцами или просто с помощью двух ложек. Накрыть крышкой и оставить на две минуты на минимальном огне.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Малышам подавать пасту, нарезав креветки в соответствии с возрастом. Взрослым - с тертым пармезаном, свежемолотым черным перцем и долькой лайма.</div></div><div class=\"outrop\"><p>📎 В качестве зеленой составляющей к этому обеду я подаю бланшированную стручковую фасоль с кунжутным маслом, соевым соусом и лепестками миндаля, подробный рецепт будет в следующем месяце, но как можно догадаться из описания, ничего сложного в нём нет 🙂</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0494_01_495_photo.webp\" alt=\"\"></figure></div>"},"784":{"id":784,"title":"Ланчбокс","sub":"для детского сада","cat":"Малышковый Мишлен","img":"thumb/0784_00_784_photo.webp","lq":"data:image/webp;base64,UklGRrgAAABXRUJQVlA4IKwAAAAQBQCdASoUABkAPu1qrFEppaQ/qAqr8B2JQBOmbDn/DymDo1v7+00nMG9bLylraG7wAO1a0wi2/CBGCjxyhVi1Y6pimXjR+JXdZrOFPDrd4NrMTQHqiFdqbSm3ke07kgaHSIILM7UlrCMQ++LrF4ftMeCxsG5D0co9Wb1/JrmRqLk5fXqjcrvLEOBNEeun6HOMvQYm8tFc4tviQ3BY8bJHGj/Xf9HNMl6wAAAA","w":360,"h":450,"q":"ланчбокс для детского сада  сэндвичи куда без них чаще всего делаю со сливочным сыром индейкой и гаудой чеддером либо просто с сыром меняю только сами булочки для разнообразия зерновой хлеб пшеничные булочки ролл из тортильи без хлеба просто рулетики ветчины кубики сыра или они же нанизанные на шпажки вафли и панкейки йогурты с наполнителями йогурт урбеч миндальный арахисовый кешью посыпка семена чиа семена конопли кокосовая стружка воздушный киноа иногда просто добавляю к йогурту ложку домашнего варенья или консервированных фруктов например манго к йогурту с семенами чиа каша что то похрустеть классика десерты ланчбокс для детского сада больше фото в комментариях ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0784_00_784_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrgAAABXRUJQVlA4IKwAAAAQBQCdASoUABkAPu1qrFEppaQ/qAqr8B2JQBOmbDn/DymDo1v7+00nMG9bLylraG7wAO1a0wi2/CBGCjxyhVi1Y6pimXjR+JXdZrOFPDrd4NrMTQHqiFdqbSm3ke07kgaHSIILM7UlrCMQ++LrF4ftMeCxsG5D0co9Wb1/JrmRqLk5fXqjcrvLEOBNEeun6HOMvQYm8tFc4tviQ3BY8bJHGj/Xf9HNMl6wAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">сэндвичи, куда без них! чаще всего делаю со сливочным сыром, индейкой и гаудой/чеддером, либо просто с сыром, меняю только сами булочки для разнообразия:</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">зерновой хлеб</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">пшеничные булочки</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">ролл из тортильи</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">без хлеба: просто рулетики ветчины, кубики сыра или они же, нанизанные на шпажки</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">вафли и панкейки</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">йогурты с наполнителями</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟡</i><span class=\"tx\">йогурт</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">урбеч (миндальный, арахисовый, кешью)</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">посыпка (семена чиа, семена конопли, кокосовая стружка, воздушный киноа). иногда просто добавляю к йогурту ложку домашнего варенья или консервированных фруктов (например, манго, к йогурту с семенами чиа).</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">каша</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">что-то похрустеть</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">классика</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">десерты</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>(больше фото - в комментариях)</p></div><div class=\"note\"><i class=\"bul\">📍</i>tip: подсмотрела когда-то давно сэндвич с сыром маскарпоне и клубникой, внесла в наш рацион, добавляю каплю кленового сиропа и семена конопли</div>\n<p>самые любимые - банановые, но иногда экспериментирую с овощами (бататом, цуккини, шпинатом). делаю сразу много и морожу, размораживаю утром в духовке.</p>\n<p>никогда не покупаю готовые йогурты из-за скрытого сахара, в арсенале только простые греческие. но есть любимый лайфхак, как менять йогурты день ото дня:</p>\n<p>Лукас всегда завтракает кашей перед садиком, и если вдруг день начался так себе и был отказ, просто перекладываю его кашу в ланчбокс, не забыв бурно присыпать ягодами и посыпками (для магии иногда использую кондитерскую разноцветную посыпку как для куличей)</p>\n<p>маленькие детские крендельки без соли, кукурузные палочки, яблочные или банановые чипсы - покупаю две-три разновидности и всегда храню под рукой на случаи “ноль фантазии”, “ноль времени”, “ноль сил”</p>\n<p>нарезанные фрукты, овощи и ягоды - всегда. стараюсь резать одни и те же овощи/фрукты по-разному и часто прибегаю к фигурным вырубкам, чтобы был интерес попробовать на вкус (например, болгарский перец каадратиками и палочками, яблоко ломтиками и звёздочками). очень часто высыпаю потом нетронутые овощи в мусорное ведро, но бывают и удачные дни, когда все морковки-помидорки-болгарские-перчики сметены подчистую, ради таких дней и продолжаю</p><div class=\"outrop\"><p>на прошлой неделе у меня остались испеченные печеньки савоярди, и утром я быстро соорудила подобие бананового пудинга: смешала маскарпоне с греческим йогуртом и ванилью, положила этот «крем», затем печенье, затем слой банановых слайсов, снова крем, снова банановые слайсы, сверху присыпала воздушным киноа. естественно, домой приехал кристально чистый ланчбокс 🙂</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0784_01_785_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"449\" src=\"thumb/0784_02_786_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0784_03_787_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0784_04_788_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0784_05_789_photo.webp\" alt=\"\"></figure></div>"},"845":{"id":845,"title":"Куриный суп с фрикадельками","sub":"","cat":"Малышковый Мишлен","img":"thumb/0845_00_845_photo.webp","lq":"data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAABQBQCdASoUABkAPu1wsFIppiSiqAgBMB2JZACdMtP3XsSxC7JJoB/8IlWj/MF+FR9UwAAA99u9xGgGS6BNL7qx38O3DUTHwl35qVqng5njm1Zuk1HG/zPBY7AB5U4KbhLaS6vm8P4GQOdxx+lrM8fJUBxhzjC7ATkFBKIa8FPMrQYb2gHXQWDQHSfuuucfk/tZRnk9JAUKf85xliOP/SrEDS4ZR7LPxoLVXCS5Sf56AXihtAU4Vs/O1pn8JHnqfwkJxo2AdbgKAQZlKAMP4c3TOS0uQZL+v+3usmnZ6WjCjVbXeJYAAA==","w":360,"h":450,"q":"куриный суп с фрикадельками  на 6 порций для a 557 куриного бульона 2 л куриные окорочка и крылья по 2 шт морковь 2 шт сельдерей 2 шт помидор крупный 1 шт лук 1 шт тимьян 4 веточки лавровый лист 2 шт петрушка 4 6 стеблей перец горошком 6 8 шт вода 2 5 л для супа фарш из индейки 500 г морковь 2 шт сельдерей 2 шт паста ракушки 200 г паста ракушки мелкие 50 г опционально горошек молодой 60 г оливковое масло зелень петрушка укроп кинза куриный суп с фрикадельками","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0845_00_845_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAABQBQCdASoUABkAPu1wsFIppiSiqAgBMB2JZACdMtP3XsSxC7JJoB/8IlWj/MF+FR9UwAAA99u9xGgGS6BNL7qx38O3DUTHwl35qVqng5njm1Zuk1HG/zPBY7AB5U4KbhLaS6vm8P4GQOdxx+lrM8fJUBxhzjC7ATkFBKIa8FPMrQYb2gHXQWDQHSfuuucfk/tZRnk9JAUKf85xliOP/SrEDS4ZR7LPxoLVXCS5Sf56AXihtAU4Vs/O1pn8JHnqfwkJxo2AdbgKAQZlKAMP4c3TOS0uQZL+v+3usmnZ6WjCjVbXeJYAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 6 порций:</p><div class=\"iblock\"><p class=\"lbl\">для <a class=\"xref\" href=\"#/r/557\">куриного бульона</a> (2 л):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриные окорочка и крылья - по 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь - 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей - 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидор крупный - 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук - 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян - 4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист - 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка - 4-6 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком - 6-8 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 2,5 л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для супа:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">фарш из индейки - 500 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">морковь - 2 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">сельдерей - 2 шт</span></li><li><i class=\"bul\">💥</
