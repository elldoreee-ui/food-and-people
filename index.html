></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Хлеб замочить в сливках до мягкости. Лук очистить, нарезать мелким кубиком и обжарить на оливковом масле  и среднем огне 5-7 минут до абсолютной мягкости. Обязательно дать остыть!</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Подмерзшее 15 минут в морозилке мясо измельчить через мясорубку или в блендере. Ни в коем случае не превращать в пасту, обязательно сохранить лёгкую текстуру.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить желток, хлеб со сливками (даже если кажется, что жидкости слишком много), остывший обжаренный лук, соль, перец и мускатный орех. Хорошо перемешать до однородности.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Сформировать продолговатые котлеты (удобно работать слегка влажными руками).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Обжарить на среднем огне до румяной корочки с обеих сторон. Ориентир — по 2 минуты с каждой стороны.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Затем убавить огонь, добавить сливочное масло, раздавленный чеснок и тимьян. Накрыть крышкой и готовить ещё 5–7 минут, периодически поливая котлеты ароматным маслом.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Дать постоять 2–3 минуты перед подачей.</div></div></div></div>"},"582":{"id":582,"title":"Куриные наггетсы","sub":"с домашним кетчупом","cat":"Курица и птица","img":"thumb/0582_00_582_photo.webp","lq":"data:image/webp;base64,UklGRvwAAABXRUJQVlA4IPAAAAAwBgCdASoUABkAPu1ur1IppiQiqAgBMB2JaACdMoR5mPeqzFQYGXba19lJWZWEoHU4h+nPrp0pMnAAAPjkOPBwQ0Lh4pPjeHygZahH/QRbknPW5SisyZmkOfEipGWs5wMfEo0LYwSWaX4GHiVdAIpGqGhDQbtcYT/YJPBy+e5Nqf04wRyhR5DoY6F3EXNcy2UkfA44zw+J/HJY6NV8eAp9NUXkNt7bEGNRR4TVVrBxsZBQoxpTJSynkAh3jjabbp79N+oCKjrMGZdkVObXl0tHu45nRSZsHRal59zzyebrAEKzr5uUp6b5y/NAWhDjgAA=","w":360,"h":450,"q":"куриные наггетсы с домашним кетчупом на 24 наггетса куриный фарш 400 г батат небольшой 1 шт цуккини небольшой 1 2 шт паприка сладкая 1 2 ч л куркума 1 4 ч л чеснок гранул 1 4 ч л панировочные сухари 100 г масло растительное в спрее кунжут для кетчупа томаты консервированные целые 400 г яблоко сладкое 1 шт морковь небольшая 1 2 шт масло авокадо или гхи 1 ст л кленовый сироп или другой 1 ст л соевый соус 1 ст л лимон 1 4 или 1 2 шт по вкусу опционально базилик или орегано куриные наггетсы с домашним кетчупом","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0582_00_582_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvwAAABXRUJQVlA4IPAAAAAwBgCdASoUABkAPu1ur1IppiQiqAgBMB2JaACdMoR5mPeqzFQYGXba19lJWZWEoHU4h+nPrp0pMnAAAPjkOPBwQ0Lh4pPjeHygZahH/QRbknPW5SisyZmkOfEipGWs5wMfEo0LYwSWaX4GHiVdAIpGqGhDQbtcYT/YJPBy+e5Nqf04wRyhR5DoY6F3EXNcy2UkfA44zw+J/HJY6NV8eAp9NUXkNt7bEGNRR4TVVrBxsZBQoxpTJSynkAh3jjabbp79N+oCKjrMGZdkVObXl0tHu45nRSZsHRal59zzyebrAEKzr5uUp6b5y/NAWhDjgAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 24 наггетса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриный фарш 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">батат небольшой 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цуккини небольшой 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка сладкая 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранул. 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">панировочные сухари ~100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло растительное в спрее</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжут</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для кетчупа:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">томаты консервированные целые 400 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">яблоко сладкое 1 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">морковь небольшая 1/2 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">масло авокадо или гхи 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">кленовый сироп (или другой) 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">лимон 1/4 или 1/2 шт (по вкусу)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">опционально - базилик или орегано</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 200 градусов (конвекция). Противень застелить фольгой и сбрызнуть растительным маслом. Панировочные сухари высыпать в тарелку, подходящую для последующего обваливания.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Батат очистить, цуккини обмыть, оба овоща натереть на мелкой тёрке и отжать лишнюю влагу. В миске смешать куриный фарш, батат, цуккини, паприку, чеснок и куркуму, всё хорошо перемешать и сформировать будущие наггетсы. Я делаю так - сначала руками, смоченными в воде, формирую шарики ~по 25 грамм, затем поочередно придаю каждому форму наггетса, а затем так же поочередно обваливаю каждый в панировочных сухарях и перекладываю на противень. Сверху сбрызнуть растительным маслом.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Запекать в духовке 12-15 минут, в конце можно включить на пару минут гриль, чтобы наггетсы поджарились.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В это время - кетчуп. Яблоко и морковь очистить и натереть на крупной терке. Разогреть в небольшом сотейнике масло авокадо или гхи, добавить яблоко и морковь, обжаривать в течение 5 минут, чтобы морковь стала мягкой. Влить томаты и разбить их деревянной лопаткой, чтобы выпустили сок, хорошо перемешать. Уварить на небольшом огне в течение 10-15 минут, затем очень тщательно пробить погружным блендером до красивой однородной текстуры. Добавить сироп, соевый соус, лимонный сок и травы в зависимости от ваших вкусов, пробить блендером еще раз. Попробовать - хватает ли всех компонентов (соли, сладости, кислоты, должен быть баланс).</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Всё готово! Подавать на большом блюде с мисочкой кетчупа, присыпав кунжутом.</span></li></ul><div class=\"outrop\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: хорошо подходят для заморозки! Замораживать наггетсы следует в сыром виде после формовки, через доску с последующим складированием в зип-пакет. Перекладываем в духовку, не размораживая, запекаем примерно столько же, возможно добавив 2-3 минуты. Кетчуп так же прекрасно морозится в формочках для крупного льда, размораживается в микроволновке или маленьком сотейнике на небольшом огне</div></div></div></div>"},"607":{"id":607,"title":"Воскресная запеченная курица","sub":"poulet du dimanche","cat":"Курица и птица","img":"thumb/0607_00_607_photo.webp","lq":"data:image/webp;base64,UklGRhoBAABXRUJQVlA4IA4BAAAwBgCdASoUABkAPu1qqFAppiOiqA1RMB2JbACdMoR1Q8AazPfwKyyweG7XIpYoxKBAn2ZjbOikeV/YAP6jBiKv0spZT2kUlURn3BnudgBNblxTbsIfu9pgoW1LAeb7lJKMZTclRppTsSkytyZrL1axL6f2iAesZWCD0yTi8bb184umhsQKnADbVbIomzqM2xR6LJf+ifku4ez1zULeitNFLYD6W8cVBGLOCzSomwkP01T0HmRdyrDZLVkQ82lTm/5ODYEIdA62h29WWXuXJ5N/LesWsH/XX66hpfGN69Gu62gYbhEjBgD1oCOuQHdZCmBm+pjCC4IjrjY+Pa/4f4dauQrsvfrMCeVPbvgAAAA=","w":360,"h":450,"q":"воскресная запеченная курица poulet du dimanche на 3 4 порции курица целая 1 3 1 6 кг соль 10 г свежемолотый чёрный перец чеснок гранулированный тимьян свежий 8 10 веточек лук порей 2 шт лук шалот 5 шт оливковое масло 3 ст л вино белое сухое 200 г бульон куриный 600 г крахмал 8 г вода 30 г уксус хересный белый винный 5 г лук резанец для подачи воскресная запеченная курица poulet du dimanche идея воскресного обеда с запечённым мясом настолько архетипична что буквально вросла в наше бессознательное ещё в средневековой европе воскресенье было днём отдыха и разрешённого изобилия после недели труда мясо продукт не повседневный готовили именно в этот день собирались всей семьёй за столом и постепенно этот ритуал закрепился почти во в ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0607_00_607_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhoBAABXRUJQVlA4IA4BAAAwBgCdASoUABkAPu1qqFAppiOiqA1RMB2JbACdMoR1Q8AazPfwKyyweG7XIpYoxKBAn2ZjbOikeV/YAP6jBiKv0spZT2kUlURn3BnudgBNblxTbsIfu9pgoW1LAeb7lJKMZTclRppTsSkytyZrL1axL6f2iAesZWCD0yTi8bb184umhsQKnADbVbIomzqM2xR6LJf+ifku4ez1zULeitNFLYD6W8cVBGLOCzSomwkP01T0HmRdyrDZLVkQ82lTm/5ODYEIdA62h29WWXuXJ5N/LesWsH/XX66hpfGN69Gu62gYbhEjBgD1oCOuQHdZCmBm+pjCC4IjrjY+Pa/4f4dauQrsvfrMCeVPbvgAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица целая 1,3–1,6 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль ~10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый чёрный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян свежий 8-10 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук порей 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук шалот 5 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло ~3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вино белое сухое 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал 8 г (+вода 30 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус (хересный, белый винный) 5 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Идея воскресного обеда с запечённым мясом настолько архетипична, что буквально вросла в наше бессознательное. Ещё в средневековой Европе воскресенье было днём отдыха и разрешённого изобилия после недели труда. Мясо — продукт не повседневный — готовили именно в этот день, собирались всей семьёй за столом, и постепенно этот ритуал закрепился почти во всей Европе: английский Sunday roast, немецкий Sonntagsbraten, французский poulet du dimanche. Форма разная, суть одна: замедлиться, собраться и по-настоящему хорошо поесть.</p>\n<p>Почему, когда я составляла расписание на март, в голову пришла именно французская запечённая курица? Всё дело в моих воспоминаниях. Во время моей последней поездки в Париж моя дорогая подруга, живущая во Франции уже больше пятнадцати лет, познакомила меня с их семейным ритуалом. Я так люблю традиции, связанные с едой! Каждое воскресенье они всей семьёй идут в церковь, а на обратном пути заглядывают к своему мяснику и покупают запечённую курицу. Дальше следовала сцена, от которой у меня до сих пор внутри становится тихо и хорошо: зажаристая курица, соус jus (который в России 🤪 назвали бы не самым гастрономически утонченным словом “подливка”), зелёный салат, свежий багет, бутылка вина.</p>\n<p>Я перелопатила множество материалов, пытаясь понять, как устроена та самая французская rotisserie chicken, и пришла к обескураживающему выводу: повторить её дома один в один — невозможно. В самых знаменитых Rotisserie Парижа курицу сначала недолго томят в бульоне, а потом запекают в специальной жаровне с чугунными нагревательными элементами. То есть сначала курица доходит до определенного уровня готовности, нагревается, а, потом, во время запекания вращается, постоянно поливая себя собственным жиром — отсюда эта идеальная, почти лакированная корочка и настолько вкусное мясо.</p>\n<p>Короче, когда я поняла, что идеал недостижим, появилась свобода. Я разрешила себе не следовать канону, а интерпретировать — и собрать свою версию французской воскресной курицы, опираясь на свои любимые принципы.</p>\n<p>Во-первых, самая хорошая курица, которую удалось найти — фермерская, свободного выгула, чуть старше обычных цыплят из супермаркета (70–90 дней вместо 45-60), с более плотным мясом и выраженным вкусом. Да, это чувствуется в цене — и ещё сильнее в результате.</p>\n<p>Во-вторых, сухое засаливание. Я уже не представляю приготовление птицы без этого гениального приёма: кожа становится сухой и хрустящей, мясо — сочным и насыщенным. Если нет целой ночи, дайте хотя бы пару часов, это уже многое меняет.</p>\n<p>В-третьих, очень французская вкусовая база: чеснок, тимьян, лук-порей и шалот. Лук здесь, кстати, играет не сколько гастрономическую, сколько техническую роль — он абсорбирует жир, не давая ему гореть и дымить. И нет, курица в итоге луком не пахнет, всё уходит в глубину вкуса.</p>\n<p>И наконец — чугунная сковорода. Она позволяет запекать курицу целиком, без метода “бабочки”, сохраняя форму и сочность. Мы будем трижды переворачивать курицу, имитируя жаровню. Прошу вас, не связывайте ей ножки — этот трюк давно пора похоронить вместе с гашением соды уксусом 🙂</p>\n<p>Ох, расписалась я как обычно. Вы, наверное, уже проголодались?</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Субботним вечером очень тщательно обсушить курицу бумажными полотенцами — изнутри и снаружи. Натереть солью со всех сторон, переложить на блюдо или (в идеале) на решетку и убрать в холодильник без накрытия на всю ночь. Чтобы курица красиво выглядела во время запекания, я заправляю фаланги крыльев назад.</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0920_00_920_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtIAAABXRUJQVlA4IMYAAABQBgCdASoUABkAPu1sq1EppaOiqAqpMB2JQBajW7AufU9YsQdWabkqHzwSG9c8AkKIFQLRH6ilY+iMAAD32rDP9ksVKnmuQYq9QtEnm8hwdQuANf65pLy0u0qW+O7xHlP5huw/ajBjIu3hnGfazoLEIUh/NXtnpOf8e+XSp20rTSrXHPXoeq1qokuhnTU/TzTDJxDG7S4957Fb+r/OVX4DqfctsXra1nUkaI8kodLTTI3fDeeO4D1ipVAXAD4Gg0CKDxclAAA=) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">На следующий день обязательно достать курицу за час до приготовления. Поперчить, посыпать гранулированным чесноком, аккуратно отделить кожу от грудки и вложить под неё веточки тимьяна.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Духовку разогреть до 220 градусов (режим: конвекция), внутрь поставить чугунную сковороду, она должна стать очень горячей. Если сковороды у вас нет, то подойдет и металлический противень, но выбирайте максимально тяжелый, такой барьер не даст грудке пересушиться.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук порей вымыть, обсушить, нарезать толстыми шайбами, шалот очистить и разрезать каждый пополам (поперек, не вдоль). Сложить в миску, посолить, добавить листья тимьяна (с пары веточек), влить 1 ст л оливкового масла и очень аккуратно перемешать. Курицу тоже смазать оливковым маслом со всех сторон.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Достать раскалённую сковороду, быстро разложить лук по кругу, в центр уложить курицу грудкой вверх, слегка прижать — должен пойти характерный шипящий звук. Убрать в духовку на 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Достать, аккуратно перевернуть курицу спинкой вверх и запекать ещё 20 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Снова достать, перевернуть обратно грудкой вверх, увеличить температуру до 250 градусов и запекать ещё 5–7 минут до выраженной золотистой корочки. Наблюдайте!</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Вытащить. Курицу переложить на решётку и дать отдохнуть, ничем не накрывая. Лук вынуть из сковороды, переложить в миску. Сковороду поставить на огонь, влить белое вино и выпарить почти полностью, поднимая все поджарки со дна. Затем добавить бульон и уваривать на сильном огне до уменьшения объёма примерно вдвое. Посолить, поперчить. Если любите остренькое, здесь классно добавить или острую пасту, или перышки кайенского перца, или ложку перца урфа (последний дает очень тонкий остренький touch, без эффекта “огня”).</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Крахмал размешать с водой до однородности, влить в соус и проварить до лёгкого загустения.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">К миске с луком добавить чайную ложку уксуса, аккуратно перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Курицу разделать, разложить на блюде вместе с луком, полить соусом, посыпать мелко нарезанным луком-резанцом и сразу подавать.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_01_921_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_02_922_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0920_03_923_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_04_924_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_05_925_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_06_926_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0920_07_927_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0920_08_928_photo.webp\" alt=\"\"></figure></div>"},"619":{"id":619,"title":"Утиные ножки конфи","sub":"ресторанное блюдо на раз-два-три","cat":"Курица и птица","img":"thumb/0619_00_619_photo.webp","lq":"data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAADwBQCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMtCAEQgFPgDCDq9yCgJ4Z8G+9ROMZgKQ+Ln7AADCPvz0ojwAlTJq0NSKnOsZeyWadkEZV3Z2KxS8PTzS7x0GZOCPIltMsD/phz0x4JN9dWtz+1CvV4le55W8YUYzcAeFU1f7OD6mDAZVab2WPzcBHpix6dSdQ5viiDNLKgxYbMmmdoK5kN3v+53eXnGs+owp/+SC92LdpVPS8vaFiwXOATPHNW5EiuI6IHNzMNCYnlTDhXyd8IOnzjMReq1HD0p+HLUKfHjP7olAAA==","w":360,"h":450,"q":"утиные ножки конфи ресторанное блюдо на раз-два-три на 4 порции утиные ножки 4 шт тимьян 10 12 веточек шалфей 6 8 листьев соль 1 ст л свежемолотый черный перец сливочное масло 500 г чеснок 5 6 зубчиков имбирь 25 г для сервировки как на фото a 620 клюквенный соус тут a 711 картофельное пюре тут стручковая фасоль 200 г бланшированная 8 минут в кипящей воде затем переложенная в ледяную обсушенная и заправленная смесью оливкового масла 2 ст л соевого соуса с пониженным содержанием соли 2 ст л лимонного сока 2 ст л и белого перца лук резанец утиные ножки конфи ресторанное блюдо на раз два три каждый декабрь мы оказываемся в одной и той же точке размышлений что поставить на праздничный стол чтобы было и впечатляюще и вкусно и не заняло весь день у плиты хочется чего то нарядного тёплого зимнего но вот без этого декабрьского кулинарного триатлона когда хозяйка влетает к столу в последнюю минуту обессиленная и уже не желающая н","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0619_00_619_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAADwBQCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMtCAEQgFPgDCDq9yCgJ4Z8G+9ROMZgKQ+Ln7AADCPvz0ojwAlTJq0NSKnOsZeyWadkEZV3Z2KxS8PTzS7x0GZOCPIltMsD/phz0x4JN9dWtz+1CvV4le55W8YUYzcAeFU1f7OD6mDAZVab2WPzcBHpix6dSdQ5viiDNLKgxYbMmmdoK5kN3v+53eXnGs+owp/+SC92LdpVPS8vaFiwXOATPHNW5EiuI6IHNzMNCYnlTDhXyd8IOnzjMReq1HD0p+HLUKfHjP7olAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">утиные ножки 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 10-12 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шалфей 6-8 листьев</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 5-6 зубчиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь 25 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для сервировки как на фото:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/620\">клюквенный соус</a> тут</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/711\">картофельное пюре</a> тут</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">стручковая фасоль 200 г, бланшированная 8 минут в кипящей воде, затем переложенная в ледяную, обсушенная и заправленная смесью оливкового масла 2 ст л, соевого соуса с пониженным содержанием соли 2 ст л, лимонного сока 2 ст л и белого перца</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Каждый декабрь мы оказываемся в одной и той же точке размышлений: что поставить на праздничный стол, чтобы было и впечатляюще, и вкусно, и не заняло весь день у плиты? Хочется чего-то нарядного, тёплого, зимнего, но вот без этого декабрьского кулинарного триатлона, когда хозяйка влетает к столу в последнюю минуту, обессиленная и уже не желающая никакого веселья. Я припасла ответ к кульминации клубного месяца, посвященному званым ужинам — утиные ножки конфи.</p>\n<p>Блюдо это выглядит очень празднично, вкус утки — насыщенный и глубокий, корочка хрустящая, мясо нежнейшее, а ваше участие в процессе минимально, потому что томление идёт само, духовка делает всю работу за вас, а вы только принимаете комплименты. Главный бонус, который оценят много работающие (в том числе мамой) участники Клуба: после томления ножки можно залить тем же жиром, в котором они готовились, и спокойно хранить в холодильнике до месяца. Всё верно, это не опечатка: исторически метод конфи был сугубо практичным способом сохранить мясо.</p>\n<p>Это в юго-западной Франции придумали томить утку при низкой температуре в собственном жире: соединительная ткань размягчалась (коллаген медленно распадался на желатин), белки проходили тепловую денатурацию и становились безопасными, а толстый слой жира сверху изолировал мясо от воздуха и микроорганизмов, поэтому оно могло храниться месяцами.</p>\n<p>И прежде чем вы ужаснётесь количеству масла в данном рецепте (во французском каноне форму с ножками заливают до верху утиным жиром), я прибегну к #чистотеоретически и… унесу это всё в комментарии, не забудьте прочитать!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">За ночь до приготовления натереть утиные ножки смесью соли, свежемолотого перца, измельчённых листьев шалфея и половины от всего тимьяна. Уложить ножки плотно в контейнер или форму, закрыть крышкой или пищевой пленкой и убрать на 12-24 часа в холодильник.</div></div>\n<p>NEXT DAY</p>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Духовку разогреть до 160 градусов (режим: верх/низ). Ножки вынуть из контейнера/формы, с помощью бумажных полотенец удалить крупные кусочки трав, но не смывать специи полностью. Уложить ножки в чугунок кожей вниз. Добавить сливочное масло, оставшийся тимьян, имбирь и чеснок. И имбирь, и чеснок, можно сильно не очищать — имбирь разрезать вдоль и сделать частые надрезы ножом, чтобы “достать” больше аромата, зубчики чеснока раздавить плоскостью ножа и снять шелуху.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Закрыть чугунок крышкой и поставить в духовку. Через 2 часа аккуратно перевернуть ножки другой стороной и готовить ещё 1 час. За это время соединительная ткань полностью размягчится, мясо станет удивительно нежным и легко отходящим от косточки.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">После окончания томления вынуть ножки из чугунка и аккуратно переложить их на решётку. Для красоты обрезать верхнюю и нижнюю косточки с помощью флористического секатора или ножниц для птицы.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подготовить духовку к финальному этапу: включить режим конвекции, температуру поднять до 230 градусов, установить противень, наполовину заполненный водой, на нижний уровень духовки. Сверху — решётку с утиными ножками.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Запекать ножки 15-20 минут, пока кожа не станет равномерно золотистой и хрустящей. Важно следить: ножки уже полностью готовы, этот этап исключительно для красоты.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Подавать с картофельным пюре, бланшированной стручковой фасолью и — по желанию — клюквенным соусом, хотя мясо как будто бы самодостаточно и без него 🙂</div></div><div class=\"outrop\"><div class=\"note\"><i class=\"bul\">📍</i>TIP: жир, оставшийся после томления, можно не выбрасывать, а процедить и хранить в холодильнике — он отлично подходит для обжарки картофеля, овощей, грибов или для следующей партии ножек конфи.</div></div></div></div>"},"626":{"id":626,"title":"Запечённая индейка","sub":"с насыщенным мясным соусом","cat":"Курица и птица","img":"thumb/0626_00_626_photo.webp","lq":"data:image/webp;base64,UklGRuwAAABXRUJQVlA4IOAAAAAwBQCdASoUABkAPu1urlIppiQiqAgBMB2JbAC7G1gE2B7ig0D+TMtj9VRRIQG6oZ2IAADcUM4QI8DQPVEGYHa8/aud52Z8Yv1EHhiuf3cZsYWwjMSCLbVOinAP7yw4pyKArRs0G4G3pOHjARiJHiLofpcdFbtgVNDBhzUn6MFDd04q00zSt/GBy0pWxrPemmVuUAqeGtZhkk/z7RsWUXsPPpoYaJNTjDW/CMs0oZIkdumv6fNQRgueaJqfyNUXHvMdNSYBw5kKXpHzLSgfSvRrMQMXGVUCwkkuXxJBwxQAAA==","w":360,"h":450,"q":"запечённая индейка с насыщенным мясным соусом плюсы приготовления индейки методом бабочки все части одинаково вкусны и сочны зажаристая хрустящая красивая кожа легко разделать разложить на красивом блюде и подавать минусы не как в американских фильмах на 6 порций индейка 3 2 кг сливочное масло 100 г тимьян 6 8 веточек шалфей 10 листиков чеснок гранулированный 1 2 ч л лимон 1 шт свежемолотый черный перец соль для соуса спинка шея обрезки от индейки оливковое масло 2 ст л лук красный 1 шт морковь небольшая 2 шт сельдерей 2 стебля бульон куриный 800 г херес 70 г соевый соус 30 г тимьян 4 6 веточек лавровый лист 1 шт шалфей 3 листика перец черный горошком 8 10 шт сливочное масло 1 40 г мука 40 г сливочное масло 2 15 г уксус винный белый 10 г соль свежемолотый черный перец запечённая индейка с насыщенным мясным соусом мне немного неловко начинать этот текст потому что ощущаю что сейчас буду оправдываться спорим прочитав в программе слова","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0626_00_626_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuwAAABXRUJQVlA4IOAAAAAwBQCdASoUABkAPu1urlIppiQiqAgBMB2JbAC7G1gE2B7ig0D+TMtj9VRRIQG6oZ2IAADcUM4QI8DQPVEGYHa8/aud52Z8Yv1EHhiuf3cZsYWwjMSCLbVOinAP7yw4pyKArRs0G4G3pOHjARiJHiLofpcdFbtgVNDBhzUn6MFDd04q00zSt/GBy0pWxrPemmVuUAqeGtZhkk/z7RsWUXsPPpoYaJNTjDW/CMs0oZIkdumv6fNQRgueaJqfyNUXHvMdNSYBw5kKXpHzLSgfSvRrMQMXGVUCwkkuXxJBwxQAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">Плюсы приготовления индейки методом “бабочки”:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">все части одинаково вкусны и сочны</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">зажаристая хрустящая красивая кожа</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">легко разделать, разложить на красивом блюде и подавать</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">Минусы:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">не как в американских фильмах</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">на 6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">индейка ~3,2 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 6-8 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шалфей 10 листиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спинка, шея, обрезки от индейки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук красный 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь небольшая 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 800 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">херес 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 4-6 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шалфей 3 листика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец черный горошком 8-10 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло (1) 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло (2) 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус винный белый 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Мне немного неловко начинать этот текст, потому что ощущаю, что сейчас буду оправдываться. Спорим, прочитав в программе слова “запеченная индейка”, ваше воображение нафантазировало картинку из какого-нибудь американского фильма — с огромной и зажаристой фаршированной птичкой в центре праздничного стола? Увы, разочарую — фаршировать индейку и запекать ее целиком, филигранно связав ножки, мы в Клубе не будем.</p>\n<p>Почему? Потому что я считаю, что в отношении еды на первом месте всегда стоит вкус, а не эстетика. Птица устроена таким образом, что нет практически никакой возможности приготовить её хорошо традиционным способом — об этом я рассказывала в прямом эфире про запекание курицы. Напомню для тех, кто пропустил.</p>\n<p>Дело в том, что грудка и бёдра у птицы — это две разные “белковые” вселенные, объединённые одной кожей. В грудке почти нет соединительной ткани, нежные белки актина и миозина начинают денатурировать уже при 60–65 градусах, и при дальнейшем нагреве мясо начинает стремительно терять влагу. В бёдрах и голенях же совсем другая история: там много жира и коллагена, мясо становится мягким и желатиновым (очень приятным на текстуру и вкус) только после прогрева до 80–85 градусов. В классическом запекании птицы, к которому мы привыкли с детства, это происходит всегда: грудка уже пересохла, а ноги всё ещё не готовы.</p>\n<p>Второй важный момент — безопасность. В традиционной фаршированной индейке внутренняя масса (особенно если она плотная и влажная), защищенная мощным скелетом, прогревается очень медленно. Чтобы довести начинку до безопасных 74 градусов, приходится передерживать всю тушку, и грудка, наше слабое звено, опять же становится сухой, волокнистой и безвкусной. Это одна из причин, почему профессиональные шефы в Америке перестали фаршировать птицу перед запеканием — слишком высок риск и пересушить мясо, и не прогреть начинку равномерно, обезопасив её.</p>\n<p>Вот почему метод “бабочка” кажется мне самым лучшим в вопросе запекания: вы раскладываете птицу в одну плоскость, выравниваете толщину и даёте теплу работать равномерно. Грудка, находящаяся в центре, греется быстрее, бедра по краям — медленее. Как итог, нет ни пережаренной грудки, ни недошедших бёдер — только красивая хрустящая кожа, предсказуемо сочное мясо по всей площади, а еще отделенная спинка, из которой мы делаем сумасшедше прекрасный соус.</p>\n<p>Суммирую!</p></div><p>Надеюсь, я вас убедила. Теперь к рецепту.</p>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: Последовательность действий в рецепте дана с тем расчетом, что и индейку, и соус вы готовите в одно время, но вы также можете разделить приготовление, сделав соус заранее.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Индейку подготовить для запекания методом “бабочка”, подробная инструкция по засаливанию и подготовке к запеканию есть здесь и здесь (в случае с индейкой я сначала подготовила, а затем натерла солью). Внутренности птицы (за исключением печени) и спинку сохранить для соуса. Натереть всю птицу солью под кожей и над кожей из расчета 2 ч л соли на 1 кг птицы. Разместить на решетке, установленной на противне и убрать на ночь в холодильник, ничем не накрывая. Достать птицу из холодильника за один час до запекания.</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0930_00_930_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvoAAABXRUJQVlA4IO4AAABQBQCdASoUABkAPu1sqlEppaOiqAqpMB2JbACxHtDlsgoHK/FAbtD07Rjh+cLAKNC2uqAA4kbvDh3iWmmeKOrQgEWSbfqV66xb/87o361Tc3bCSZ1zS2dkpA0KGVCyjMhhBPjZiVelppVtZHvQYsCQMXxQudP3Hm75XeCq6+fujU6jQy1RuPgpqrd/IvVdvt5L4CrKWu8ID0tYGkQXYI5i5d8LuKuHolY+ku1Gp/cuir7hL8dub0MiZtSHbHxPjPfPs0WAaSmuO5rM1TgsNKIbmH7adxfbQ8UtM1KW90pnqfsNSuRCl0AevsCnDAAA) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В широкой тяжёлой кастрюле (в идеале — чугунке) разогреть 2 ст л оливкового масла. Добавить спинку, шейку, косточки и другие обрезки индейки. Обжаривать на среднем огне 10–12 минут, пока они не зарумянятся.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук, сельдерей, морковь обмыть, обсушить, очистить и крупно нарубить.<br>Добавить в чугунок и обжаривать ещё 6–8 минут. Смешать в стакане херес и соевый соус, влить в чугунок (деглазировать), перемешать, соскребая деревянной лопаткой нагар с дна. Прибавить огонь и выпарить алкоголь около 3 минут. Добавить куриный бульон, тимьян, лавровый лист, шалфей и перец горошком, довести до кипения, затем убавить огонь до минимума и оставить томиться под крышкой на 45-60 минут. По прошествии этого времени процедить соус и удалить из него лишний жир — это удобно сделать с помощью половника, перелив соус в высокий стакан (жир соберется на поверхности). Еще один способ — отправить соус в холодильник до застывания жира, тогда его можно будет удалить одним движением.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Соус без жира снова нагреть до горячего состояния. Сделать ру — основу соуса. Для этого в другой небольшой кастрюле растопить сливочное масло (40 г), всыпать муку (40 г) и готовить на среднем огне 5–7 минут, постоянно помешивая венчиком, пока ру немножко не потемнеет и не начнёт пахнуть тостами.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">С помощью того же венчика начать постепенно добавлять горячий бульон в ру, постоянно перемешивая, чтобы не было комков (держите наготове спатулу, чтобы собрать комкования по углам кастрюли). Соус заметно загустеет и помутнеет — так и должно быть.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Уварить соус на медленном огне в течение 40 минут, периодически помешивая. В финале добавить соль (щепотку), свежемолотый черный перец, сливочное масло (15 г) и белый винный уксус (10 г), перемешать. Попробовать на вкус и скорректировать по желанию — больше соли, перца или кислоты. Хранить соус в теплом месте до подачи.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: если вы готовите соус заранее, не добавляйте сливочное масло и уксус в финале, оставьте этот шаг для разогрева (разогревать в сотейнике на медленном огне, по необходимости добавляя немного бульона) и дня торжества.</div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Духовку разогреть до 230 градусов (режим: конвекция). Противень наполовину наполнить водой и установить на самый нижний уровень духовки. Мягкое сливочное масло смешать с цедрой одного лимона, 1/2 чл гранулированного чеснока и мелко нарубленной зеленью — листиками тимьяна и шалфеем, всё перемешать до однородной пасты и нанести на всю поверхность индейки, снизу и сверху. Закрыть фольгой третьи фаланги крыльев и отправить в духовку: решетку с лежащей бабочкой индейкой и чистый противень уровнем ниже. Итого в духовке конструкция: сверху решетка с индейкой, под ней чистый противень, снизу — еще один противень с водой.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Запекать индейку 40-70 минут, в зависимости от её размера: моя индейка весом 3200 г была готова через 39 минут. Через 15-20 минут после старта стоит убрать противень, на который капало масло и жир от индейки, а решётку с индейкой перевернуть другой стороной и установить вместо этого противня. Мясной сок, собравшийся на противне, процедить и добавить в соус.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Если у вас есть термометр, это самый надежный способ — грудка должна дойти до 70 градусов (после отдыха она дойдет до 74), бедра — до 80 градусов. Индейку накрыть фольгой и оставить отдыхать по меньшей мере не 20 минут, так соки распределятся и не вытекут при разделке.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Разделывать индейку, запеченную методом “бабочка”, невероятно удобно — сначала с помощью ножниц для птицы или флористического секатора отсечь бедра (а от них, соответственно, голени), затем крылья. Затем отрезать по половинке грудки и нарезать каждую кусочками. Разложить красиво на блюде, украсить веточками шалфея и тимьяна и скорее нести радовать своих гостей.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_01_931_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_02_932_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_03_933_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_04_934_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_05_935_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_06_936_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_07_937_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0930_08_938_photo.webp\" alt=\"\"></figure></div>"},"631":{"id":631,"title":"Куриная пиката","sub":"~35 минут","cat":"Курица и птица","img":"thumb/0631_00_631_photo.webp","lq":"data:image/webp;base64,UklGRh4BAABXRUJQVlA4IBIBAADwBQCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMxswln/FsEnDmuFDkExKuw6E1Zi1aL2pdlpmAAD9U+gRbIH5X5pn26Xm7e6RCd9WKBraRrfikup2yFdE7A4NJWvs9R0p6sPsqh6Kk4Ysk71kob87DWv9xBZ7ylNREZSsGwkgprafvCNMG85j3ivHTOTXs5OYNo5xlN3nIeowhYZmRarPVBygErWWoh65izrjMkAFK0B3V3jRv0HRKNhmCsBFC/TKRxBSaj+BKv7kn0a/+fsBT6FawR+nkZPUV7DEncKvX42zN6y40EOK2Z6NnXmssgMInSZiGUzPV9np8iIo6PoG54yoco/04mKytuGRXqdtwgAA","w":360,"h":450,"q":"куриная пиката ~35 минут на 3 4 порции куриная грудка 600 г 3 шт миндальная мука 100 г лимон 1 шт яйцо 2 шт сливочное масло 80 г оливковое масло 4 ст л чеснок 1 зубчик вино белое 60 г бульон куриный 180 г каперсы 30 г петрушка горсть соль свежемолотый черный перец куриная пиката 35 минут не так давно в достаточно современном австрийском ресторане я увидела gluten free версию классического шницеля где вместо пшеничной муки использовали миндальную идея показалась мне крайне удачной и не терпелось скорее её где нибудь применить а тут прекрасно месяц быстрых блюд и на ум сразу пришла пиката пиката piccata в итальянском это не строгий рецепт и да","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0631_00_631_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRh4BAABXRUJQVlA4IBIBAADwBQCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMxswln/FsEnDmuFDkExKuw6E1Zi1aL2pdlpmAAD9U+gRbIH5X5pn26Xm7e6RCd9WKBraRrfikup2yFdE7A4NJWvs9R0p6sPsqh6Kk4Ysk71kob87DWv9xBZ7ylNREZSsGwkgprafvCNMG85j3ivHTOTXs5OYNo5xlN3nIeowhYZmRarPVBygErWWoh65izrjMkAFK0B3V3jRv0HRKNhmCsBFC/TKRxBSaj+BKv7kn0a/+fsBT6FawR+nkZPUV7DEncKvX42zN6y40EOK2Z6NnXmssgMInSZiGUzPV9np8iIo6PoG54yoco/04mKytuGRXqdtwgAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриная грудка 600 г (3 шт)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">миндальная мука 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 4 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вино белое 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Не так давно в достаточно современном австрийском ресторане я увидела gluten free версию классического шницеля, где вместо пшеничной муки использовали миндальную. Идея показалась мне крайне удачной, и не терпелось скорее её где-нибудь применить, а тут — прекрасно! — месяц быстрых блюд, и на ум сразу пришла пиката.</p>\n<p>Пиката (piccata в итальянском) — это не строгий рецепт и даже не конкретное блюдо, а скорее способ приготовления. Берётся тоненько нарезанное мясо, быстро панируется в муке, обжаривается и подаётся в очень приятном, легком, нежном соусе. Соус всегда строится на лимоне, белом вине и каперсах, он балансирует нежность мяса и делает всё блюдо живым и бодрым. В Италии можно встретить piccata di vitello, piccata di pollo, даже piccata di pesce spada — герой в сковороде может быть разным, но принцип всегда один.</p>\n<p>Как и ожидалось, пиката с миндальной панировкой получилась быстрой, сочной, вкусной и очень нарядной. Такую можно приготовить и просто на ужин среди недели, и гостям к празднику подать — в красивой сковороде, с блестящими от сливочного масла лимонными кружочками, золотистой курицей и ароматным соусом, в который так и тянет опустить кусочек чиабатты.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Куриное филе обсушить бумажными полотенцами и, держа хорошо заточенный нож параллельно рабочей поверхности, разрезать на два тоненьких кусочка. Посолить, поперчить с обеих сторон.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лимон помыть горячей водой, обсушить и с помощью микроплана снять цедру, затем нарезать на кружочки. Чеснок очистить и мелко нарезать или натереть. Петрушку обмыть, обсушить, нарубить мелко. Каперсы хорошо промыть.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В широкую неглубокую тарелку высыпать миндальную муку, добавить лимонную цедру и хорошо промешать руками. Разбить два яйца в высокий стакан, немножко посолить и пробить блендером.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Обмакнуть каждый кусочек курицы в яйцо (дать лишней жидкости стечь обратно в миску), затем обвалять в миндальной муке.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В большой тяжёлой сковороде разогреть 2 ст л оливкового масла и 20 г сливочного масла на средне-сильном огне. Выложить курицу и обжарить с двух сторон до румяной корочки, примерно по 3 минуты с каждой стороны. Переложить в чистую сковородку и накрыть крышкой, чтобы сохранить тепло. Получится два захода, после первого стоит протереть сковородку бумажным полотенцем, убрав подгоревшие кусочки панировки, снова добавить оливковое и сливочное масло и обжарить вторую часть.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Затем убавить огонь до среднего, добавить чеснок и готовить, помешивая, около минуты, затем влить вино, бульон, добавить каперсы и ломтики лимона, посолить и поперчить и держать на сильном огне, пока соус не выпарится вполовину. Добавить оставшееся сливочное масло (40 г), деликатно перемешать, затем вернуть курицу в сковороду (либо вылить соус к курице во вторую сковороду) и дать ей прогреться и дойти до готовности, около двух-трёх минут.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Посыпать курицу петрушкой и скорее подавать с рисом, пастой или <a class=\"xref\" href=\"#/r/711\">картофельным пюре</a>.</div></div></div></div>"},"655":{"id":655,"title":"Сливочная курица с прованскими травами","sub":"","cat":"Курица и птица","img":"thumb/0655_00_655_photo.webp","lq":"data:image/webp;base64,UklGRsAAAABXRUJQVlA4ILQAAACQBQCdASoUABQAPu1wsVIppiSiqAgBMB2JZgCdMspljB5BYhqdTqeSSUakqlH5XYSe4I2OAAD+kxNQVcc43V5ZK6sbOAyAQGWoou0tIN6ln0oU1ot6L8ZBlKHn19ooYxRkpHL8rSM4GKCrms8AW4iZxiv0PYHWONMHKJ0LHIFgaYiB5PIbQkdjfCiSGc5JqdBWU5UrhcdGoRLBjXZf/59bBnTma9l/1B2rbEuC+/HIxQPBAAA=","w":360,"h":368,"q":"сливочная курица с прованскими травами  на 4 порции куриное филе 600 гр вяленые томаты 140 гр лук репчатый 1 шт чеснок 2 зубчика оливковое масло 3 ст л сливочное масло 20 гр a 557 куриный бульон 60 гр соевый соус 1 ст л прованские травы 1 ч л кукурузный крахмал 1 ст л без горки сливки 30 250 гр вино белое сухое 60 гр базилик 1 ст л с горкой грюйер или пармезан 30 гр соль перец а также сковорода жасминовый рис сливочная курица с прованскими травами заключила из вчерашнего опроса что многие будут рады идеям для ужина на этом канале поэтому расчехляю один из своих любимых рецептов буднего дня быстро очень вкусно справится даже новичок за базу взят рецепт курицы по тоскански я изменила нарезку птицы приправы и сыр мне так нравится больше ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"655\" src=\"img/0655_00_655_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsAAAABXRUJQVlA4ILQAAACQBQCdASoUABQAPu1wsVIppiSiqAgBMB2JZgCdMspljB5BYhqdTqeSSUakqlH5XYSe4I2OAAD+kxNQVcc43V5ZK6sbOAyAQGWoou0tIN6ln0oU1ot6L8ZBlKHn19ooYxRkpHL8rSM4GKCrms8AW4iZxiv0PYHWONMHKJ0LHIFgaYiB5PIbQkdjfCiSGc5JqdBWU5UrhcdGoRLBjXZf/59bBnTma9l/1B2rbEuC+/HIxQPBAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриное филе 600 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вяленые томаты 140 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/557\">куриный бульон</a> 60 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">прованские травы 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кукурузный крахмал 1 ст л без горки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 250 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вино белое сухое 60 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 1 ст л с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">грюйер или пармезан 30 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль, перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">сковорода</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">жасминовый рис</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Заключила из вчерашнего опроса, что многие будут рады идеям для ужина на этом канале, поэтому расчехляю один из своих любимых рецептов буднего дня - быстро, очень вкусно, справится даже новичок. За базу взят рецепт курицы по-тоскански, я изменила нарезку птицы, приправы и сыр, мне так нравится больше.</p></div><p>❤️the secret ingredient is always love</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Куриное филе нарезать на небольшие кусочки и замариновать в смеси оливкового масла (2 ст л), прованских трав, соли и перца, оставить на 30 минут</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Нарезать вяленые томаты (полосками) и лук (мелким кубиком), чеснок натереть на тёрке или пропустить через пресс</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Поставить сковороду на сильный огонь, дождаться нагрева и очень быстро обжарить куриное филе (приблизительно 3 минуты с одной стороны, 2 - с другой, очень важно филе не пережарить! Если на кусочках останутся небольшие розовые пятна сырого мяса - это не страшно, доготовится чуть позднее), переложить филе в глубокую тарелку</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Убавить огонь до среднего. В ту же сковороду добавить 1 ст л оливкового масла и масло сливочное, добавить лук и чеснок, обжарить в течение 2 минут, затем добавить вяленые томаты и базилик, обжаривать в течение 3 минут, следом добавить соевый соус, куриный бульон и белое вино, перемешать, выпарить в течение 5 минут</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Добавить крахмал, перемешать, затем влить сливки и довести соус до кипения, убавить огонь до минимального. Следом - тертый сыр, перемешать, добавить обжаренное филе вместе с выделившимся в тарелку соком, финально хорошо перемешать и подержать под крышкой три минуты. Попробуйте на соль, если нужно - досолите.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">🍗</i><span class=\"tx\">Готово! Подавайте с ароматным жасминовым рисом и холодным белым.</span></li></ul></div></div>"},"724":{"id":724,"title":"Простая запеченная курица с картофелем","sub":"","cat":"Курица и птица","img":"thumb/0724_00_724_photo.webp","lq":"data:image/webp;base64,UklGRgwBAABXRUJQVlA4IAABAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JagCxHoMrasAwwTQASel5xy4k5j7cvDfQ+oA8FklBvxjHNMAA/dZhczSazR/rwhYK6Ogdm/XRtfKMCKqCOWcfm81WvWDKg2fFy4HQZDoJ6/wJssqa0WCvkO7FolSzftjC4DlDvQVLkzqJfCN/fnmobdT7fcVzQTvTFU9CF3Pe7qpMwd5juci6NHZNZbJ5t2B/LSymZ8hb7Ai5Zz4rtNsbdxt2W+O5xbcTEhFXxnrJdrNuXPevJXZgTd8VwnnOuai0rgCdXQhwqpj0yLOm94rSLvDIusfOXyKg+hk0aqJiaag3hItm5XAA","w":360,"h":450,"q":"простая запеченная курица с картофелем  на 4 порции курица 1 2 1 4 кг подготовленная по методу бабочка картофель молодой крупный 1 кг оливковое масло соль перец петрушка пергаментная бумага фольга противень решетка простая запеченная курица с картофелем","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0724_00_724_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgwBAABXRUJQVlA4IAABAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JagCxHoMrasAwwTQASel5xy4k5j7cvDfQ+oA8FklBvxjHNMAA/dZhczSazR/rwhYK6Ogdm/XRtfKMCKqCOWcfm81WvWDKg2fFy4HQZDoJ6/wJssqa0WCvkO7FolSzftjC4DlDvQVLkzqJfCN/fnmobdT7fcVzQTvTFU9CF3Pe7qpMwd5juci6NHZNZbJ5t2B/LSymZ8hb7Ai5Zz4rtNsbdxt2W+O5xbcTEhFXxnrJdrNuXPevJXZgTd8VwnnOuai0rgCdXQhwqpj0yLOm94rSLvDIusfOXyKg+hk0aqJiaag3hItm5XAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица 1.2-1.4 кг (подготовленная по методу “бабочка”)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель молодой крупный 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пергаментная бумага</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">фольга</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">противень</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">решетка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 230 градусов (режим:конвекция, но если ваша духовка известна тем, что сильно жарит, установите 210 градусов и наблюдайте).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Картофель хорошо обмыть с помощью щетки, обсушить, нарезать кружочками 5-7 мм прямо с кожурой. Переложить в большую миску, добавить оливковое масло и соль, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Противень застелить пергаментной бумагой, выложить картофель по периметру (если положить его в центр, то из-за находящейся сверху курицы он не зарумянится).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Решетку смазать оливковым маслом, выложить курицу, нанести масло с помощью кисточки на всю поверхность кожи, присыпать перцем. Если курица не была засолена заранее, то посолить.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Установить решетку с курицей на второй сверху уровень духовки, картофель накрыть фольгой (не сильно прижимая его к овощам, иначе прилипнет) и установить под решеткой. Отправить к духовку на 30 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Через 30 минут быстро достать противень с картофелем, освободить от фольги и вернуть обратно. Сок и жир от курицы можно утилизировать, а можно добавить к противню с картофелем, я поступаю по второму сценарию.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: Если вы хотите получить на выходе красивую коричнево-золотистую курицу, то на этом этапе нанесите на кожу смесь из 1 ст ложки соевого соуса и 1 ч ложки жидкого мёда. Это немного размягчит кожу, но добавит красивого цвета и аромата.</div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Запекать еще 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Если у вас есть термометр мгновенного считывания, можно проверить температуру бедра - если достигла 77 градусов, курица готова.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">После того, как достали птицу из духовки, оставьте её отдыхать на 15-20 минут. Это поможет мясному соку равномерно распределиться внутри и немного загустеть (и при разделке курица потеряет меньше жидкости), в это время я обычно делаю соус и/или салат. Затем переложите картофель на красивое блюдо, сверху - разделанную курицу, посыпьте петрушкой и подавайте. Прекрасного обеда!</div></div></div></div>"},"725":{"id":725,"title":"Запечённая курица с картофелем,","sub":"травами, лимоном и соусом jus","cat":"Курица и птица","img":"thumb/0725_00_725_photo.webp","lq":"data:image/webp;base64,UklGRswAAABXRUJQVlA4IMAAAAAQBgCdASoUABkAPu1urlIppiQiqAgBMB2JYgCxH3a6SkgAowaJJ/QfH7Ajr/KKpoVkQy+mJACMYAAA/uX2/uRz0UfkkaTJWqq6z9o3v/3ZDA1WnEv4l8u6Hgb+DxD6z8Q55czJAtpsYFJoseMEHgm/n/HTMRYWl8DGZ7m8+q987ncxd2t97mdkOdIOY3NA/k0bL+AbpcglrKV4Vd2zpmUr57/sO8A/wZ7aI4JLRUQoeCoATojmHGAeJLAEmXcAAAA=","w":360,"h":450,"q":"запечённая курица с картофелем, травами, лимоном и соусом jus на 4 порции курица 1 2 1 4 кг лимон 1 шт тимьян 6 8 веточек розмарин 2 ветки петрушка 8 стеблей шалфей 2 ветки 12 листьев сливочное масло 40 г соль черный перец для соуса жю морковь 1 шт сельдерей 1 шт лук репчатый 1 шт a 557 куриный бульон 280 г херес 40 г розмарин 1 ветка тимьян 2 3 ветки лавровый лист 1 шт соевый соус 2 ст л сок лимона 2 ч л мука 1 ст л сливочное масло 45 г петрушка 4 6 стеблей листья черный перец для гарнира картофель крупный 1 кг оливковое масло соль запечённая курица с картофелем травами лимоном и соусом jus","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0725_00_725_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRswAAABXRUJQVlA4IMAAAAAQBgCdASoUABkAPu1urlIppiQiqAgBMB2JYgCxH3a6SkgAowaJJ/QfH7Ajr/KKpoVkQy+mJACMYAAA/uX2/uRz0UfkkaTJWqq6z9o3v/3ZDA1WnEv4l8u6Hgb+DxD6z8Q55czJAtpsYFJoseMEHgm/n/HTMRYWl8DGZ7m8+q987ncxd2t97mdkOdIOY3NA/k0bL+AbpcglrKV4Vd2zpmUr57/sO8A/wZ7aI4JLRUQoeCoATojmHGAeJLAEmXcAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица 1.2-1.4 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 6-8 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 2 ветки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 8 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шалфей 2 ветки (~12 листьев)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса “жю”:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/557\">куриный бульон</a> 280 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">херес 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 ветка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 2-3 ветки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сок лимона 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 45 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 4-6 стеблей (листья)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для гарнира:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель крупный 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Курицу подготовить для запекания по методу “бабочка”. Кухонными ножницами порубить хребет на крупные куски, отрезать фаланги от крыльев. Морковь и сельдерей обмыть, почистить и крупно нарубить. Лук очистить и нарезать мелким кубиком. Духовку разогреть до 230 градусов (режим: конвекция, если духовка лютая - то 210).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Зелень - петрушку, тимьян, розмарин, шалфей - крупно нарубить. С помощью терки микроплан снять цедру с целого лимона. Сливочное масло для курицы (40 г) растопить, добавить зелень, лимонную цедру, черный перец (если курица не была засолена заранее, то +соль) и пробить в маленьком кухонном комбайне или погружным блендером в узкой чаше, должна получиться густая паста.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Картофель хорошо обмыть с помощью щетки, обсушить, нарезать крупными дольками 5-7 мм прямо с кожурой. Переложить в большую миску, добавить оливковое масло и соль, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Противень застелить пергаментной бумагой, выложить картофель по периметру (если положить его в центр, то из-за находящейся сверху курицы он не зарумянится).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Решетку смазать оливковым маслом, выложить курицу, нанести пасту из трав на всю поверхность птицы (под кожей тоже).</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Установить решетку с курицей на второй сверху уровень духовки, картофель накрыть фольгой (не сильно прижимая его к овощам, иначе прилипнет) и установить под решеткой. Отправить к духовку на 30 минут.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">обозначаю так место, где мы возвращаемся к запеченной курице и картофелю</span></li></ul>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">В это время можно заняться соусом. В сотейнике с толстым дном или чугунке на сильном огне разогреть оливковое масло. Выложить куриные кости и обжаривать до уверенных ожогов в течение 3-5 минут (будут приставать к дну, это нормально, счищайте деревянной лопаткой). Добавить лук, морковь и сельдерей, обжаривать еще 7 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Убавить огонь, всыпать муку, обжарить в течение 30 секунд, затем влить херес и бульон. Тщательно все промешать, в том числе соскабливая пригоревшие части со дна. Добавить тимьян, розмарин и лавровый лист, довести до кипения (можно прибавить огонь) прикрыть крышкой и оставить на небольшом огне на 20 минут.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Через 30 минут быстро достать противень с картофелем, освободить от фольги и вернуть обратно.</span></li></ul>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: Если вы хотите получить на выходе красивую коричнево-золотистую курицу, то на этом этапе, нанесите на кожу смесь из 1 ст ложки соевого соуса и 1 ч ложки жидкого мёда. Это немного размягчит кожу, но добавит красивого цвета и аромата.</div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Запекать еще 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Если у вас есть термометр мгновенного считывания, можно проверить температуру бедра - если достигла 77 градусов, курица готова, вытаскивайте из духовки и оставьте отдыхать на 15-20 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Соус процедить, перелить в сотейник и уварить на среднем огне в течение 10 минут. Затем добавить соевый соус, лимонный сок, кубики сливочного масла (45 г), черный перец и нарубленную петрушку, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">12</span><div class=\"st\">Курицу разделать, выложить на красивое блюдо, полить соусом и подавать. Остатки соуса подайте каждому порционно. Всё!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_01_726_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_02_727_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_03_728_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_04_729_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_05_730_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_06_731_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_07_732_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0725_08_733_photo.webp\" alt=\"\"></figure></div>"},"816":{"id":816,"title":"Куриное филе в беконе","sub":"с моцареллой и базиликом","cat":"Курица и птица","img":"thumb/0816_00_816_photo.webp","lq":"data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAAAQBgCdASoUABkAPu1orlCppaQiqAqpMB2JZgCdMw5Gd8Wrh0kkkX64lPhW3Xmr/ugGHd9GUpbJQAAAnrAzuM61xYM7MFZ4ms5FhHrpVaTZEDawQRwlQfqW2i6ikzyQfCn9/pBLLFLrEMuJKnYeRGcpPEkcVE5iCXKq3IEdCNP0ZWg7eO0zPUXUVdIRZtMvehaT/5wOje38uWQr470/JAFn0Bvr6wCCxg7SrRTxlIeQ/KZk5lnBQzv1Dm/08eGmlV/TBaR2WliEV3UwJagAAA==","w":360,"h":450,"q":"куриное филе в беконе с моцареллой и базиликом на 4 порции куриное филе 2 шт бекон 12 кусочков моцарелла твердая для пиццы 40 г базилик несколько веточек оливковое масло соль свежемолотый черный перец куриное филе в беконе с моцареллой и базиликом если взять все способы приготовления мяса и попробовать их классифицировать то мы четко увидим две основные группы группа номер один медленное приготовление это прежде всего томление и тушение задача этой группы нагревать продукт долго и мягко чтобы медленно распадалась соединительная ткань запекание приготовление на пару варка всё это ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0816_00_816_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAAAQBgCdASoUABkAPu1orlCppaQiqAqpMB2JZgCdMw5Gd8Wrh0kkkX64lPhW3Xmr/ugGHd9GUpbJQAAAnrAzuM61xYM7MFZ4ms5FhHrpVaTZEDawQRwlQfqW2i6ikzyQfCn9/pBLLFLrEMuJKnYeRGcpPEkcVE5iCXKq3IEdCNP0ZWg7eO0zPUXUVdIRZtMvehaT/5wOje38uWQr470/JAFn0Bvr6wCCxg7SrRTxlIeQ/KZk5lnBQzv1Dm/08eGmlV/TBaR2WliEV3UwJagAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриное филе 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бекон 12 кусочков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">моцарелла (твердая, для пиццы) 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик несколько веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Если взять все способы приготовления мяса и попробовать их классифицировать, то мы четко увидим две основные группы. Группа номер один: медленное приготовление. Это, прежде всего, томление и тушение. Задача этой группы — нагревать продукт долго и мягко, чтобы медленно распадалась соединительная ткань (запекание, приготовление на пару, варка — всё это тоже можно отнести к медленному приготовлению). Вторая группа — быстрое приготовление, то есть обжарка, будь то гриль, угли или сковорода. Высокая температура, румяная корочка, быстрый запечатанный сок внутри — именно этот способ приготовления будет отличать все мясные рецепты этого месяца. Можно на гриле, можно дома на сковороде и в духовке. Начинаем с курицы!</p>\n<p>Куриному филе, честно говоря, иногда не хватает характера и мясного вкуса, и несколько лет назад друзья моего мужа научили меня, как с этим бороться. Завернуть в бекон! Под воздействием очень высокой температуры бекон напитывает куриное филе ароматами, неизбежно появляющимися вследствие реакции Майяра. Внутри получается сочно, снаружи — хрустко. Добавим сыр для текстуры и базилик для пущего аромата. Готовится быстро, выглядит эффектно, съедается с удовольствием.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">С помощью очень острого ножа разрезать каждое куриное филе на два тонких кусочка. Должно получиться четыре порции, но на всякий случай напишу, что не каждое куриное филе получится разрезать на два ровных полотна (по крайней мере, у меня). Я в таком случае откладываю это филе для курицы с прованскими травами.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Каждый куриный лоскуток нужно переложить в зип-пакет или проложить пищевой плёнкой с двух сторон и отбить. Самое главное правило в отбивании птицы — не бить слишком сильно, чтобы не образовались дырки. Если у вас есть молоточек — прекрасно, если нет, воспользуйтесь моим любимым девайсом в этом плане — сотейником или сковородкой с толстым дном. Отбиваем филе до толщины в полсантиметра.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Моцареллу (или другой сыр на ваш вкус) натереть на мелкой терке, листья базилика обмыть и обсушить. На рабочую поверхность выложить в небольшой нахлест три ломтика бекона, сверху выложить отбитое куриное филе, посолить и поперчить, добавить сыр (около 10-15 грамм на каждое филе), два листика базилика и аккуратно свернуть рулет. Отложить. Провернуть этот фокус ещё три раза.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Если готовите на гриле, читайте здесь</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Духовку разогреть до 200 градусов (режим: конвекция). Стальную или чугунную сковороду (не тефлон, это может быть токсично!) поставить на сильный огонь, добавить немного растительного масла (для таких целей очень удобно иметь масло в спрее) и дождаться разогрева. Быстро обжарить рулеты с двух сторон (примерно по полторы-две минуты с каждой стороны), переложить в форму для запекания или противень и убрать в духовку на 18-20 минут. Обязательно дать 5-7 минут отдохнуть перед тем, как нарезать (это правило любого мяса, обжаренного быстро при высокой температуре).</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Всё готово, подавайте с любимым гарниром! Моя рекомендация для семейного обеда — <a class=\"xref\" href=\"#/r/711\">картофельное пюре</a> с травами и молодой зеленый горошек, быстро обжаренный в сливочном масле с флер де сель.</div></div><div class=\"outrop\"><p>update: как готовлю горошек<br>Бланширую под струей холодной воды, а потом обжариваю буквально 2-3 минуты в очень горячем сливочном масле. Потом хлопья соли и скорее на тарелку.</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0816_01_817_photo.webp\" alt=\"\"></figure></div>"},"822":{"id":822,"title":"Отбивные из индейки","sub":"в сливочном соусе с дижонской горчицей","cat":"Курица и птица","img":"thumb/0822_00_822_photo.webp","lq":"data:image/webp;base64,UklGRrIAAABXRUJQVlA4IKYAAAAQBQCdASoUABkAPu1qqFAppaOiqA1RMB2JYgCdAA0VcdarPFKW0gTad1Vjq3gaYNAAAP1mA92Bd2uKUtWPuJlP4CqAKYDXgQYRiRjdKfQ5I1b/7HFcDxZpaXtWeHL/IZ6iImLww0wNrx6s3OIAwvtbSo3UHxBzMaWQ48msiAIwMyXXR0YFMXlaUhSx9m6ugHqzvAbExn0LbpGTDZaCGg1368BFtwAA","w":360,"h":450,"q":"отбивные из индейки в сливочном соусе с дижонской горчицей на 4 6 порций индейка филе грудки 1000 г соль 2 ч л свежемолотый черный перец горчично сливочный соус сливочное масло 10 г чеснок 1 зубчик бульон куриный 240 г сливки 30 80 г крахмал кукурузный 5 г 1 ч л горчица дижонская 1 ст л горчица зерненая 1 ч л базилик 1 ст л петрушка 1 ст л куркума 1 ч л отбивные из индейки в сливочном соусе с дижонской горчицей как готовить птицу на гриле вообще везде но на гриле особенно важно чтобы она получалась вкусной ответ короткий просто не пережаривайте её нам нужно термически обработать мясо не дав при этом всем белкам денатурировать в резину чтобы помочь мясу приготовиться быстро важно соблюдать следующие правила отбивать филе до одной толщ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0822_00_822_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrIAAABXRUJQVlA4IKYAAAAQBQCdASoUABkAPu1qqFAppaOiqA1RMB2JYgCdAA0VcdarPFKW0gTad1Vjq3gaYNAAAP1mA92Bd2uKUtWPuJlP4CqAKYDXgQYRiRjdKfQ5I1b/7HFcDxZpaXtWeHL/IZ6iImLww0wNrx6s3OIAwvtbSo3UHxBzMaWQ48msiAIwMyXXR0YFMXlaUhSx9m6ugHqzvAbExn0LbpGTDZaCGg1368BFtwAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">индейка филе грудки 1000 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">горчично-сливочный соус:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 240 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 5 г (1 ч л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Как готовить птицу на гриле (вообще везде, но на гриле особенно важно), чтобы она получалась вкусной? Ответ короткий — просто не пережаривайте её. Нам нужно термически обработать мясо, не дав при этом всем белкам денатурировать в резину.</p>\n<p class=\"lbl\">Чтобы помочь мясу приготовиться быстро, важно соблюдать следующие правила:</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">отбивать филе до одной толщины (в таком случае вам понадобится буквально 3-4 минуты на каждый кусочек, и не получится ситуации, что снаружи мясо уже сгорело, а внутри — сырое)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">жарить на очень сильном огне и только обсушенное филе (залог вкуса — коричневая корочка, результат реакции Майяра, которая не образуется, если огонь будет небольшой, а на поверхности мяса будет вода)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">посолить мясо хотя бы за один час до приготовления (процесс, называемый обратным осмосом, при обжаривании сохранит часть соков внутри, сделав мясо нежнее и сочнее)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">после обжаривания дать ему отдохнуть как минимум 5 минут (это распределит соки равномерно и также благоприятно отразится на вкусе).</span></li></ul>\n<p>Запасной парашют, если ещё не набита рука, и мясо всё же пережарено — соус! Здесь — простой, но очень эффектный с горчицей, куркумой, базиликом и петрушкой.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вечером накануне гриля отбить ломтики индейки до толщины около 1-1,5 см, натереть их солью и поперчить. Убрать под плёнку на ночь.</div></div>\n<p>Если вы готовите дома, то последовательность такая: сначала обжариваем филе, затем делаем соус.</p>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Филе индейки достать из холодильника и очень хорошо обсушить бумажными полотенцами. Разогреть две столовые ложки оливкового масла в сковороде на среднем огне, затем прибавить огонь до средне-сильного (у меня 7 из 9) и выложить филе. Обжаривать 2-3 минуты с одной стороны, затем перевернуть филе и обжарить с другой стороны не дольше 1 минуты.</div></div>\n<p>Если вы готовите на гриле, последовательность обратная — сначала делаем соус (дома), затем обжариваем филе.</p>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Филе индейки хорошо обсушить бумажными полотенцами и смазать оливковым маслом. Разогреть угли до среднего жара (проверка рукой: если держите ладонь на высоте 10 см от решётки 5–6 секунд, но не дольше — это то, что нужно). Выложить филе и обжаривать примерно по 2-3 минуты с каждой стороны.</div></div>\n<p>СОУС</p>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Чеснок очистить и мелко нарезать. В сковороде или сотейнике (в случае, если готовите дома, то в той же сковороде, где обжаривалась индейка), растопить сливочное масло, добавить чеснок, базилик и петрушку и готовить около минуты до появления аромата. Добавить <a class=\"xref\" href=\"#/r/557\">куриный бульон</a>, перемешать и довести его до кипения. В отдельной миске смешать сливки, две горчицы, кукурузный крахмал и куркуму, тщательно вымешать венчиком до однородной консистенции. Влить смесь в сковороду, перемешать, довести до кипения (соус загустеет) и поварить без крышки около пяти-десяти минут. Попробуйте на соль, если нужно — досолите и добавьте свежемолотый черный перец.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Перед подачей полить отдохнувшее 5-10 минут филе горячим соусом и присыпать зеленью.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0822_01_823_photo.we
