с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кленовый сироп 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Картофель тщательно вымыть, положить в кастрюлю, наполненную холодной, хорошо подсоленной водой, и отварить в до готовности (около 15-20 минут).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Ромэн вымыть, нарезать или нарвать руками и хорошо обсушить. Авокадо очистить и нарезать крупными ломтиками, редис вымыть и нарезать тонкими кружочками (мандолина в помощь!). Лосось разделить на небольшие кусочки. Укроп мелко порубить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Смешать все ингредиенты для заправки в баночке, взболтать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В салатник поместить салат ромэн и картофель, добавить половину заправки и тщательно перемешать (в идеале руками), чтобы все листья покрылись тонким ароматным слоем.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">На большое блюдо выложить салатные листья с картофелем, авокадо, редис и копченый лосось. Полить оставшейся заправкой, посыпать укропом и сразу подавать.</div></div><div class=\"outrop\"><p>🐶 Можно сделать заранее! Заправку удобно приготовить вечером и убрать в холодильник. Молодой картофель также можно отварить с вечера. Утром останется быстро нарезать остальные ингредиенты и собрать салат за несколько минут.</p></div></div></div>"},"503":{"id":503,"title":"Универсальный зелёный салат","sub":"","cat":"Салаты","img":"thumb/0503_00_503_photo.webp","lq":"data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAAAwBQCdASoUABQAPu1ur1IppiQiqAgBMB2JaACdEfji2OzP5dE6TZ5qrkuH2DtxnXzwAADVmeV4AzSM0BgGlNLO1WXWrNWnM8vQgIwSC5yE7j/kjTBuCOzZK3Ki75GOMBGbILHHAst3rySCkaJcPMhg1Cq+MJsn5Q/tZ7L+vxE7LP7dHbAZDrg/UviMsOJPzhswONXMaeg+5nSIgP6ydh8WYdjqdWRhgQ4muF327BSt3OQHpPUS76+39W8F2sL54ghOL2aljW5oIPPIqb5ewdwWUNMw+f1x/9YZniu5eI9pAf1Pfoup2Wd1qJigAA==","w":360,"h":360,"q":"универсальный зелёный салат  универсальный зелёный салат киш великолепный вариант для легкого обеда или ужина особенно если дополнить его зеленым салатом и ремесленным хлебом со взбитым маслом бёр нуазет слабая сторона большинства салатов которые мы готовим дома заправка то что по идее должно собирать салат из чего бы он не состоял в единое классное блюдо не совру и не преувеличу если скажу что гастрономический мир мой разделился на до и после когда я узнала что заправку надо всегда смешивать отдельно","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0503_00_503_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"359\" src=\"thumb/0503_01_504_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Киш - великолепный вариант для легкого обеда или ужина, особенно если дополнить его зеленым салатом и ремесленным хлебом со взбитым маслом бёр-нуазет. Слабая сторона большинства салатов, которые мы готовим дома - заправка. То, что по идее должно собирать салат (из чего бы он не состоял) в единое классное блюдо. Не совру и не преувеличу, если скажу, что гастрономический мир мой разделился на “до” и “после”, когда я узнала, что:</p>\n<p>💚заправку надо всегда смешивать отдельно</p>\n<p>💚горчицу кладут в заправку не только для вкуса (в связи с тем, что горчицу я не любила, из рецептов ее я исключала, даже не понимая, что разрушаю этим результат).</p>\n<p>❓Почему нельзя просто набросать в салатник зеленых листьев и овощей и налить туда поочередно оливковое масло, бальзамик, соевый соус и далее по списку? Ответ прост: потому что для хорошего салата вам нужен такой соус, который тонким слоем покроет каждый листик зелени, каждую помидорку черри и каждую тыквенную семечку. Как сделать такой соус? Вам нужна эмульсия!</p>\n<p>Берём<br>⭕️жир (оливковое масло 100 гр)<br>⭕️воду (соевый соус 30 гр, бальзамический уксус 20 гр)<br>⭕️эмульгатор (дижонская горчица 1 ч л с горкой)</p>\n<p>Добавляем ароматизаторы<br>⭕️прованские или итальянские травы (1 ч л)<br>⭕️белый перец (1/4 ч л)<br>⭕️гранулированный чеснок, если любите (1/4 чл)</p>\n<p>Интенсивно смешиваем все венчиком, пока молекулы масла и жидкости не объединятся и смесь не помутнеет и не загустеет. Et Voila!</p>\n<p class=\"lbl\">Фоном:</p>\n<p>⭕️Молодой салат романо<br>⭕️Молодой шпинат<br>⭕️Огурцы, нарезанные соломкой<br>⭕️Молодая стручковая фасоль, бланшированная в кипятке в течение 3-5 минут<br>⭕️Молодой горошек или эдамаме, бланшированный в кипятке в течение 1-3 минут<br>⭕️Семечки для салата (тыква, подсолнечник, лён)</p>\n<p>Всё смешать в большой миске, дабавить хорошо взболтанную заправку (на ваш вкус, ~1-2 ст ложки на порцию), перемешать чистыми руками, выложить в салатник или сразу на тарелку. Этот салат может быть дополнен любыми вашими любимыми овощами или переформатирован на любой вкус (иногда, когда мне очень лень, я беру просто готовую салатную смесь) и может выступать как полноценное блюдо, если добавить сверху половинку авокадо, нарезанное ломтиками, вареное яйцо с полужидким желтком и свежий хлеб.</p></div>"},"511":{"id":511,"title":"Салат с запеченными перцами","sub":"с бурратой, прошутто и конфи из томатов","cat":"Салаты","img":"thumb/0511_00_511_photo.webp","lq":"data:image/webp;base64,UklGRkgBAABXRUJQVlA4IDwBAAAwBgCdASoUABkAPu1qrlCppaQiqAqpMB2JbACdMoR/d0plyJ0D2tBNhSVkOowOl/mwzvnjcQfzCP0AAOJww1e5P/rAI4g4LkXya3niqWctIhKXC0pHTbHYINpLDtV2oZhV2+uEztahQAkl0vytb5N4iBmDbja0nbOrR3nOPK5be1QYZqxrhNqcmAK+ricMlU7fH2N7nlRIcrmL3klaQ+kyp8hEd8F16B1+MbdcDrWxV4TcDDWw54UEeRucA7+u0IxrQ7Sxg1zWA5fp8AyLGmJGCuGf+BAz/m67LSf2OgygGUbLAVZYnEoPOW5RHxhZrGo+OK00cSR//RD+eS9LTNGqrX1eAsPPZNGGrOS1bjAk4JDqHR6r/rO9MFyluWjxvqSnVaO7LqG4pKrbO2/KrguX+GSV7m4YUCT6+AAA","w":360,"h":450,"q":"салат с запеченными перцами с бурратой, прошутто и конфи из томатов на 2 4 порции сладкий красный перец 3 шт буррата 200 г прошутто крудо 6 8 ломтиков помидоры черри 400 г каперсы 1 ст л оливковое масло extra virgin бальзамик соль свежемолотый черный перец базилик чиабатта салат с запеченными перцами с бурратой прошутто и конфи из томатов яркое тёплое блюдо на грани закуски и салата которому больше всего подходит определение антипасти от итальянского antipasti антипасти это итальянская закуска подаваемая до основного блюда чтобы разжечь аппетит слово буквально значит перед едой anti перед pasto еда антипасти в целом не про одно конкретное блюдо ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0511_00_511_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRkgBAABXRUJQVlA4IDwBAAAwBgCdASoUABkAPu1qrlCppaQiqAqpMB2JbACdMoR/d0plyJ0D2tBNhSVkOowOl/mwzvnjcQfzCP0AAOJww1e5P/rAI4g4LkXya3niqWctIhKXC0pHTbHYINpLDtV2oZhV2+uEztahQAkl0vytb5N4iBmDbja0nbOrR3nOPK5be1QYZqxrhNqcmAK+ricMlU7fH2N7nlRIcrmL3klaQ+kyp8hEd8F16B1+MbdcDrWxV4TcDDWw54UEeRucA7+u0IxrQ7Sxg1zWA5fp8AyLGmJGCuGf+BAz/m67LSf2OgygGUbLAVZYnEoPOW5RHxhZrGo+OK00cSR//RD+eS9LTNGqrX1eAsPPZNGGrOS1bjAk4JDqHR6r/rO9MFyluWjxvqSnVaO7LqG4pKrbO2/KrguX+GSV7m4YUCT6+AAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сладкий красный перец — 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">буррата 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">прошутто крудо 6-8 ломтиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло extra virgin</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чиабатта</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Яркое тёплое блюдо на грани закуски и салата, которому больше всего подходит определение антипасти (от итальянского antipasti). Антипасти — это итальянская закуска, подаваемая до основного блюда, чтобы разжечь аппетит. Слово буквально значит “перед едой” (anti — перед, pasto — еда). Антипасти в целом не про одно конкретное блюдо, это скорее стиль подачи: несколько ярких, насыщенных по вкусу закусок на общем блюде или доске. Подаются комнатной температуры, красиво разложенные, вызывают ощущение праздника и активное слюноотделение🈁<br>На мой взгляд, идеальное решение для обеда на свежем воздухе, но легко трансформируется и в нетривиальный салат для домашнего ужина.</p>\n<p>Все пропорции условны, даны лишь для ориентира.</p></div><div class=\"note\"><i class=\"bul\">⚡️</i>TIP: на нашем маленьком обеде, который я организовала для друзей, возникла классная идея для пикника — к этой тарелке закусок можно подать свежую разрезанную вдоль чиабатту, и вот уже у вас получился роскошный сендвич в итальянском стиле.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Заранее приготовить конфи из помидорок черри. Для этого черри (берите только целые, не поврежденные помидорки) обмыть, обсушить, выложить в керамическую форму, сбрызнуть оливковым маслом, присыпать солью, перцем и базиликом (свежий или замороженный, с натяжкой подойдёт и сухой), хорошо промешать и поставить в духовку на 150 градусов (режим:верх/низ) на полтора-два часа.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Позднее, когда помидорки будут готовы, обмыть сладкие перцы, обсушить, выложить на металлический противень без всего и отправить в духовку под гриль на 15-20 минут, в процессе перевернув их несколько раз. Вытащить, переложить в пакет или под крышку на 15 минут, затем вытащить плодоножку вместе с семенами, обмыть перцы от остатков семян, снять кожицу и нарезать мякоть на полоски.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">•</i><span class=\"tx\">если будете хранить, то сбрызните оливковым маслом.</span></li><li><i class=\"bul\">•</i><span class=\"tx\">если готовите на открытом гриле, то процесс тот же, просто доводите перцы до готовности на решётке над углями (времени на это уйдет, конечно, поменьше).</span></li></ul>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Собираем закуску:<br>Буррату нарезать на 8 частей, прошутто разорвать руками на небольшие кусочки. На красивую тарелку выложить запеченные перцы, затем буррату, затем прошутто, затем помидоры. Присыпать каперсами, сбрызнуть очень качественным оливковым маслом и бальзамиком (здесь хорошо подойдет хороший крем-бальзамик, ближе к десертному), пройтись мельницей с черным перцем, украсить листьями базилика и скорее подавать. Не забудьте про чиабатту!</div></div></div></div>"},"518":{"id":518,"title":"Кобб салат","sub":"американская классика как пример салата-конструктора","cat":"Салаты","img":"thumb/0518_00_518_photo.webp","lq":"data:image/webp;base64,UklGRiABAABXRUJQVlA4IBQBAAAwBgCdASoUABkAPu1qrVEppaQiqAqpMB2JbACdMoM0cTASqxtIEv8sKl09O4VNKGT1jJzjhW0t5ZsAAPzd9VkYGa1Bzjj4soc1DWak2ic8OhmkC243YUrHDulAx8tbNs2c9gxBzP9LLROg6YaIOeuZRjcHayazzl4LhcYbLHyaxfRCQTnhAlsxiSM2Ka/ZaFePFh+ZdFH1AVn/JevVF42ExyhcKD1XRz3n5twIAcUAV6gPjJXQ4qIzhsBkrGJ7RwrIJUNd9Kkq1X/xa0PRP0UDTgMYDTa44YicjTqYOXXp3mXR3Oo/ZsoGvJTkPnw/abDnV1ER2fXnd6yhOtNGWTv5UURZoQlFnX40IXyaC0x4DKGAAAA=","w":360,"h":450,"q":"кобб салат американская классика как пример салата-конструктора на 4 порции салат романо крупный 1 шт помидоры черри 200 г огурец длинный 1 шт бекон 8 ломтиков куриная грудка 2 шт авокадо крупный 1 шт сыр с голубой плесенью 100 г семена льна петрушка для заправки лук шалот 1 шт чеснок 1 зубчик оливковое масло 8 ст л горчица дижонская 1 ст л горчица зерненая 1 ст л уксус винный красный 2 ст л сок лимона 2 ст л кленовый сироп 1 ст л петрушка 1 ст л соль 1 2 ч л кобб салат американская классика как пример салата конструктора 35 минут говорят что этот салат родился случайно владелец голливудского ресторана brown derby роберт кобб поздно вечером заглянул на кухню уставший и голодный открыл холодильник а там ну обычный американский разброс остатки курицы бекон авокадо яйца сыр салатные листья он всё это быстро нарубил щедро полил заправко","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0518_00_518_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRiABAABXRUJQVlA4IBQBAAAwBgCdASoUABkAPu1qrVEppaQiqAqpMB2JbACdMoM0cTASqxtIEv8sKl09O4VNKGT1jJzjhW0t5ZsAAPzd9VkYGa1Bzjj4soc1DWak2ic8OhmkC243YUrHDulAx8tbNs2c9gxBzP9LLROg6YaIOeuZRjcHayazzl4LhcYbLHyaxfRCQTnhAlsxiSM2Ka/ZaFePFh+ZdFH1AVn/JevVF42ExyhcKD1XRz3n5twIAcUAV6gPjJXQ4qIzhsBkrGJ7RwrIJUNd9Kkq1X/xa0PRP0UDTgMYDTa44YicjTqYOXXp3mXR3Oo/ZsoGvJTkPnw/abDnV1ER2fXnd6yhOtNGWTv5UURZoQlFnX40IXyaC0x4DKGAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">салат романо крупный 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурец длинный 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бекон 8 ломтиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриная грудка 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">авокадо крупный 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыр с голубой плесенью 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена льна</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для заправки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук шалот 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 8 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус винный красный 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сок лимона 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кленовый сироп 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1/2 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>~ 35 минут</p>\n<p>Говорят, что этот салат родился случайно. Владелец голливудского ресторана Brown Derby Роберт Кобб поздно вечером заглянул на кухню, уставший и голодный. Открыл холодильник — а там… ну, обычный американский “разброс”: остатки курицы, бекон, авокадо, яйца, сыр, салатные листья. Он всё это быстро нарубил, щедро полил заправкой и получил блюдо, которое через пару лет стало классикой американской гастрономии.</p>\n<p>Мне в этой истории особенно нравится мораль: иногда прекрасный обед собирается не по плану, а из того, что есть под рукой. Кобб-салат это прекрасно иллюстрирует: есть курица — отлично, нет курицы — возьмите индейку, ростбиф или даже креветки. Бекон можно заменить обжаренными грибами или нутом, а вместо помидоров положить, скажем, запечённую тыкву, батат или сладкий перец. Сыр с голубой плесенью тоже вариативен — подойдут и фета, и козий, и с натяжкой даже твёрдый выдержанный. Главное держать структуру: зелень + белок + овощи + что-то сливочно-солоноватое.</p>\n<p>Особое внимание заостряю на заправке, она универсальна. Горчица и красный винный уксус дают остринку и кислоту, кленовый сироп уравновешивает их мягкой сладостью, а оливковое масло скрепляет всё в шелковистую эмульсию. Этим соусом можно оживить любую тарелку: хоть листовой салат, хоть печёные овощи, хоть даже отварную гречку.</p>\n<p>Но помним: классический Кобб — салат с характером, богатый на калории и жиры (America, baby). Если хочется облегчённый вариант — уменьшите вполовину количество масла в заправке, замените (или сократите) бекон на курицу или овощи, а сыр возьмите полегче. Суть от этого слегка потеряется, зато тарелка станет легче. Если вы проповедуете схожую со мной философию, то просто не объедайтесь тазиком этого салата на ночь, но делайте “по канону”.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: в традиционном салате присутствуют яйца, но я решила их исключить. Если хотите более аутентичную версию, то добавьте к рецепту 2 вареных вкрутую</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сначала заправка, так как ее можно сделать вообще сильно заранее и хранить в холодильнике 2-3 дня. Лук шалот очистить и мелко нарезать, чеснок очистить и натереть на микроплане. Смешать все ингредиенты в баночке, закрыть крышкой и хорошенько взболтать.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Куриные грудки залить двумя литрами холодной воды, добавить 2 ст л соли (не переживайте, курица соленой не будет), поставить на сильный огонь и довести до кипения, затем сразу же убавить огонь до минимума, накрыть крышкой и засечь 10 минут. После этого слить горячую воду и залить грудку водой холодной на 1-2 минуты. Нарезать кубиками.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть сковородку с толстым дном и на средне-сильном огне обжарить ломтики бекона до золотистости и хруста, переложить на бумажное полотенце, чтобы впитался лишний жир, затем нарезать на небольшие кусочки (ножницами удобнее).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Салат романо нарезать, промыть водой и хорошо обсушить, выложить в глубокую широкую тарелку или противень, как я. Огурец обмыть, нарезать продольно на четвертинки, удалить семена и нарубить крупными кусочками. Помидоры черри нарезать на половинки. Авокадо очистить и нарезать кубиками.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Вылить на салатные листья примерно треть заправки и хорошо перемешать руками, чтобы все они покрылись соусом. Затем выложить стройными рядами: курицу, бекон, раскрошенный голубой сыр, авокадо, помидоры и огурцы, оставив одну полосочку “салатной”. Распределить остатки заправки по ингредиентам, посыпать петрушкой и семенами льна и подавать.</div></div></div></div>"},"602":{"id":602,"title":"Салат “цезарь” с курицей","sub":"возможно, самый известный салат в мире","cat":"Салаты","img":"thumb/0602_00_602_photo.webp","lq":"data:image/webp;base64,UklGRtgAAABXRUJQVlA4IMwAAACQBQCdASoUABkAPu1srVCppiQiqAqpMB2JZgDCgYzQb729jLlqcQQoKpjJRuYf+nma69/T2AD+yNovpMmBDWb1zic4rKXXIeuZA6lnCjAnK13UF7Tw3i1tgDlNFiBsTjskEeZ76kTp2F73V08nBCo0yWFk+bzetlE1YBedk9awHq9j9nWMbRbDdQ/uKOPpCw+EWDO5CabCJq0ltksRv8wjdDPOkUx2vyGy2vCupcrtiVaMwxS0uBC7EsTxfGcTWriEMPC6l6IiLYzgAAA=","w":360,"h":451,"q":"салат “цезарь” с курицей возможно, самый известный салат в мире на 4 порции куриная грудка 400 г 2 шт салат романо 150 г чиабатта 120 г оливковое масло соль итальянские травы 1 ч л свежемолотый черный перец для соуса майонез 150 г всегда предпочтительнее домашний анчоусы 30 г чеснок 1 зубчик пармезан 40 г для подачи лимон 1 2 шт сок салат цезарь с курицей возможно самый известный салат в мире подробно говорим об этом легендарном салате и готовим его и даже a 689 домашний майонез вместе завтра в 12 30 по москве ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"639\" height=\"800\" src=\"img/0602_00_602_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtgAAABXRUJQVlA4IMwAAACQBQCdASoUABkAPu1srVCppiQiqAqpMB2JZgDCgYzQb729jLlqcQQoKpjJRuYf+nma69/T2AD+yNovpMmBDWb1zic4rKXXIeuZA6lnCjAnK13UF7Tw3i1tgDlNFiBsTjskEeZ76kTp2F73V08nBCo0yWFk+bzetlE1YBedk9awHq9j9nWMbRbDdQ/uKOPpCw+EWDO5CabCJq0ltksRv8wjdDPOkUx2vyGy2vCupcrtiVaMwxS0uBC7EsTxfGcTWriEMPC6l6IiLYzgAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриная грудка 400 г (2 шт)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">салат романо 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чиабатта 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">итальянские травы 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез 150 г (всегда предпочтительнее домашний)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 40 г (+ для подачи)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Подробно говорим об этом легендарном салате и готовим его (и даже <a class=\"xref\" href=\"#/r/689\">домашний майонез</a>) вместе завтра в 12:30 по Москве!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Куриную грудку разрезать вдоль на более тонкие части. Слегка отбить ладонью или дном сотейника до одинаковой толщины.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Натереть курицу солью, свежемолотым чёрным перцем, итальянскими травами и небольшим количеством оливкового масла. Оставить мариноваться минимум на 30 минут при комнатной температуре.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть духовку до 180 градусов (режим: конвекция). Чиабатту нарезать небольшими кубиками. Сбрызнуть оливковым маслом, слегка посолить и перемешать. Выложить на противень в один слой без пергамента и подсушить в духовке до золотистости и хруста, на это уйдет примерно 10-15 минут, в середине пути можно встряхнуть противень. Снаружи сухарики должны стать румяными, а внутри остаться приятно жевательными.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для соуса соединить майонез, анчоусы, чеснок, мелко натёртый пармезан и лимонный сок. Пробить погружным блендером до гладкой, густой и полностью однородной эмульсии. Если текстура получилась чрезмерно густая, добавьте воды или сливок и ещё раз пробейте блендером.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Романо разобрать на листья, тщательно промыть в очень холодной воде и хорошо обсушить. Это важный момент: влажные листья не удержат соус, и фирменный хруст у салата исчезнет. Крупные листья разрезать или разорвать руками вдоль.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Прямо перед подачей хорошо разогреть чугунную сковороду, добавить оливковое масло. Обжарить курицу на сильном огне до румяной корочки с обеих сторон. Переложить на доску и дать отдохнуть 5 минут, чтобы соки внутри стабилизировались.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">В большой миске аккуратно смешать романо с частью соуса — листья должны быть покрыты тонким слоем заправки, а не утопать в ней.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Разложить салат по тарелкам, добавить сухарики и нарезанную курицу. Сверху распределить слайсы пармезана, добавить немного свежемолотого чёрного перца.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Подавать сразу: хороший “Цезарь” не любит ожидания. Его магия в контрасте холодных хрустящих листьев, тёплой курицы, солёного пармезана и густого, насыщенного соуса.</div></div></div></div>"},"606":{"id":606,"title":"Салат с курицей","sub":"и йогуртовой заправкой","cat":"Салаты","img":"thumb/0606_00_606_photo.webp","lq":"data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAADwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JYgCdMoPKgfKgPDweYvpSRv6saOmF4TyLnSkih+XUAAD98HI0ssB6UgRwRK78QliYc2jbsMOaJ5WeUHneOWzYdp9Z5TVf4pin7y8lFmapj+SzY4dJSydb0f2zLKasjTy9Qsm+HilXj3OdTMOezLTt+aePj0gvBbPXaCl4oOKBJZ3H+vzj9IiuqjExuaCT9WDVg+Un8mbiWa1fwWgPnMT4pOEo8InqjL86urctTd5q87tSOo7t+kRBP0N1eF7SCdJIvwwlHTho2qmitEAAAA==","w":360,"h":450,"q":"салат с курицей и йогуртовой заправкой на 3 4 порции салатная зелень 80 г сельдерей 2 стебля огурец 2 шт помидоры черри 125 г оливки 80 г курица отварная 300 400 г лук красный 1 2 шт соль для заправки йогурт греческий 4 ст л оливковое масло 3 ст л соевый соус 2 ст л уксус бальзамический 1 ст л горчица дижонская или зерненая 1 ч л белый перец 1 4 ч л орегано 1 2 ч л салат с курицей и йогуртовой заправкой это один из моих самых любимых салатов так как дома регулярно появляется вареная курица я стабильно раз в неделю варю a 557 куриный бульон из целой курицы в нем много белка он сытный и вкусный благодаря йогуртово бальзамическо соевой заправке а еще крайне вариативный вместо курицы можно взять консервированный тунец салатная зелень любая овощи ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0606_00_606_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAADwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JYgCdMoPKgfKgPDweYvpSRv6saOmF4TyLnSkih+XUAAD98HI0ssB6UgRwRK78QliYc2jbsMOaJ5WeUHneOWzYdp9Z5TVf4pin7y8lFmapj+SzY4dJSydb0f2zLKasjTy9Qsm+HilXj3OdTMOezLTt+aePj0gvBbPXaCl4oOKBJZ3H+vzj9IiuqjExuaCT9WDVg+Un8mbiWa1fwWgPnMT4pOEo8InqjL86urctTd5q87tSOo7t+kRBP0N1eF7SCdJIvwwlHTho2qmitEAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">салатная зелень 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурец 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 125 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливки 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица отварная 300-400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук красный 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для заправки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">йогурт греческий 4 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус бальзамический 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская или зерненая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">орегано 1/2 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Это один из моих самых любимых салатов, так как дома регулярно появляется вареная курица (я стабильно раз в неделю варю <a class=\"xref\" href=\"#/r/557\">куриный бульон</a> из целой курицы). В нем много белка, он сытный и вкусный благодаря йогуртово-бальзамическо-соевой заправке, а еще крайне вариативный. Вместо курицы можно взять консервированный тунец, салатная зелень — любая, овощи — любые, кисленькая составляющая — любая (оливки, соленые огурчики, каперсы). Если хочется еще диетичнее, можно сократить количество оливкового масла, но будет уже не так насыщенно.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Курицу разобрать руками на крупные, рваные куски. Лучше не резать ножом, а именно разобрать, так она лучше впитает соус.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Все овощи и зелень вымыть и обсушить. Сельдерей и огурцы нарезать тонкими ломтиками, черри разрезать пополам. Красный лук нарезать максимально мелко (если хочется сбавить лучной дух, то промыть в сите под холодной водой и затем обсушить). Оливки нарезать кружочками. Сложить все в большую миску, посолить, перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В большой миске или банке смешать йогурт, оливковое масло, соевый соус, бальзамик и горчицу. Добавить орегано и белый перец, перемешать до гладкой густой эмульсии. Попробовать и подстроить баланс по своему вкусу: добавить чуть больше кислоты или соли, если хочется.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Вылить соус на курицу и аккуратно перемешать, затем добавить ее в миску к овощам и также аккуратно перемешать. Дать постоять 5 минут, чтобы все вкусы подружились, и можно подавать. С горячим бульоном и ломтиком поджаренного ремесленного хлеба — моё любимое!</div></div></div></div>"},"614":{"id":614,"title":"Оливье","sub":"салат как культурный код","cat":"Салаты","img":"thumb/0614_00_614_photo.webp","lq":"data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAAAwBgCdASoUABkAPu1ur1IppiQiqAgBMB2JQBOmXEa4aSodFqmB/EOC7BtxRwFQSRE52qKRuTDleLEAAP5xuLI1KV62Rj1nwRnTDcIofOMuemzjPHMIr3ARaEQbLhNl65Ws5XiLIyRdXcMtD2k0gm0JEhq5Ep6JtfoojpgQy9ni6PQKbQG0HIhflO757pwsyvXmTy7OMe9p2wE94S2M/l7YXw7cDooz51H4jFUFd1vY2+Cvgo0oC1qLRzmhy0DoNdHRmxxZio5i3xd7d7YFhGTvayslPMqiZkJ6xmai56R/oK/TSAA=","w":360,"h":450,"q":"оливье салат как культурный код на 12 порций филе куриное 300 г колбаса докторская 300 г картофель 400 г морковь 200 г яйца с1 6 шт огурцы солёные 200 г огурцы свежие 200 г горошек молодой замороженный 200 г майонез предпочтительно домашний соус устричный качественный в котором вы уверены горчица зерненая каперсы мелкие чеснок 2 зубчика лавровый лист 2 шт тимьян суш 1 ч л оливье салат как культурный код мало какое блюдо в русской гастрономической традиции может похвастаться столь внушительной биографией переделок утрат и переосмыслений как салат оливье жемчужина постсоветского новогоднего стола придуманный во второй половине xix века московским ресторатором люсьеном оливье этот салат начинал свою жизнь как сложная весьма буржуазная композиция дичь телячий ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0614_00_614_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAAAwBgCdASoUABkAPu1ur1IppiQiqAgBMB2JQBOmXEa4aSodFqmB/EOC7BtxRwFQSRE52qKRuTDleLEAAP5xuLI1KV62Rj1nwRnTDcIofOMuemzjPHMIr3ARaEQbLhNl65Ws5XiLIyRdXcMtD2k0gm0JEhq5Ep6JtfoojpgQy9ni6PQKbQG0HIhflO757pwsyvXmTy7OMe9p2wE94S2M/l7YXw7cDooz51H4jFUFd1vY2+Cvgo0oC1qLRzmhy0DoNdHRmxxZio5i3xd7d7YFhGTvayslPMqiZkJ6xmai56R/oK/TSAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 12 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">филе куриное 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">колбаса докторская 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца С1 6 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурцы солёные 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурцы свежие 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горошек молодой замороженный 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез, предпочтительно домашний</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соус устричный (качественный, в котором вы уверены!)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы мелкие</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян суш. 1 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Мало какое блюдо в русской гастрономической традиции может похвастаться столь внушительной биографией переделок, утрат и переосмыслений, как салат Оливье — жемчужина постсоветского новогоднего стола. Придуманный во второй половине XIX века московским ресторатором Люсьеном Оливье, этот салат начинал свою жизнь как сложная, весьма буржуазная композиция: дичь, телячий язык, раковые шейки, каперсы, свежие огурцы и фирменный соус, якобы тщательно скрываемый от посторонних глаз. Уже тогда Оливье был не столько “салатом” в сегодняшнем понимании, сколько тщательно выстроенной системой вкусов — солёного, кислого, жирного, умами — и связанных при этом богатой эмульсией. Со временем рецепт утратил дорогие ингредиенты, пережил революции, дефицит, стандартизацию и силами коллективной памяти стал народной формулой.</p>\n<p>Свою версию я сознательно собирала как ностальгическую и родную — я пробовала и готовила Оливье с курицей, индейкой, телятиной и говядиной, но только кусочки пахнущей мускатным орехом докторской колбасы делают этот салат идеальным для маленькой Саши, живущей внутри меня. Конечно, это не был бы рецепт Клуба, если бы мы не воспользовались приобритенными ранее гастрономическими приёмами. Куриную грудку будем отваривать в ароматизированной воде при такой технологии, чтобы не переденатурировали белки (и грудка не стала резиновой). <a class=\"xref\" href=\"#/r/689\">Домашний майонез</a> даст понятно откуда взявшуюся жирность и контроль над вкусом, зернёная горчица добавит текстуры, а каперсы и устричный соус возвратят блюдо к его дореволюционным корням (в аутентичном рецепте салата Оливье присутствовал “соя кабуль” — дореволюционный соус из ферментированных соевых бобов). Это всё ещё Оливье, узнаваемый и комфортный, но собранный с вниманием к балансу, текстуре и вкусовому профилю.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Куриную грудку залить 2 литрами холодной воды, добавить 2 ст л соли (не переживаем, не перебор, это для сочности мяса), 2 зубчика чеснока (придавить плоскостью ножа и очистить), 1 чайную ложку сушеного тимьяна и 2 лавровых листа. На средне-сильном огне довести воду до кипения, убавить огонь до слабого, накрыть крышкой и засечь от 8 до 12 минут в зависимости от размера грудки. Переложить филе в холодную воду и подержать там 2-3 минуты. Обсушить полотенцами, нарезать небольшими кубиками.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Сварить яйца: вскипятить в кастрюле воду, с помощью столовой ложки переложить яйца комнатной температуры в воду и установить таймер на 9 минут. Подготовить большую миску с ледяной водой и переложить яйца сразу же после истечение таймера. Оставить на 5-10 минут, затем очистить от скорлупы. Разрезать каждое яйцо пополам, вынуть желтки, белки нарезать мелким кубиком, желтки просто раскрошить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Картофель и морковь очистить от кожуры и нарезать мелким кубиком (размером с ваш зеленый горошек). Картофель можно нарезать немного крупнее, чем морковь, но это не принципиально. Сложить кубики в кастрюлю, залить водой, промыть, затем слить воду и залить снова — 2 литра воды и 1 ст л соли. Довести до кипения на средне-сильном огне, проварить 5 минут, затем всыпать замороженный зеленый горошек, выключить огонь, накрыть кастрюлю крышкой и засечь 10 минут. По прошествии этого времени слить воду и разложить овощи на какой-нибудь поверхности (например на противне, застеленном пергаментной бумагой, или в большом широком контейнере).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Свежие огурцы разрезать пополам, выскрести и удалить семена, нарезать мелким кубиком. Соленые огурцы также нарезать мелким кубикам, разложить на сложенное вдвое бумажное полотенце и отжать рассол. Докторскую колбасу и очистить тем же мелким кубиком. Сложить все нарезанные ингредиенты в большой контейнер или кастрюлю. Сделать домашний майонез.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Окончание в комментариях</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Заправить салат:<br>На 500 грамм массы — 50 гр майонеза, 6 г устричного соуса и 1 чайная ложка зерненой горчицы. Посыпать одной столовой ложкой промытых под водой каперсов, подавать сразу же.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Заправленный салат может храниться в холодильнике до 12 часов (оптимально — 6-8 часов). Не заправленный, в холодильнике — до 48 часов.</div></div></div></div>"},"499":{"id":499,"title":"Драники из цуккини","sub":"с риетом из лосося и икрой","cat":"Закуски","img":"thumb/0499_00_499_photo.webp","lq":"data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAAAQBQCdASoUABkAPu1oqVAppiOiqA1RMB2JZgC2yYyURJmhHOzBrexn8MyJdmibtjs2AP6yPPLxurzS6dFehDf58r/c/9V4ouQkDNYmKgn7ERfcY2mWvNcUv6GjAJv+z1yA87Qx3JCRSd7kMEhkLUYt+uVNic4MLQf6Lump+b92q/Ddzu8yUjAXwLnHdbqi+Bqp3iU6DZghC5W0HRJysQiRv0GMfE0x5KF0nDVgPiJ/NmZoep8DHv9DA85ibel8hCNj33iamWcJGMw8weLY6MlVHU8jCgAA","w":360,"h":450,"q":"драники из цуккини с риетом из лосося и икрой на 12 драников цуккини 700 г яйцо 1 шт мука 50 г пармезан 40 г орегано 1 2 ч л чеснок 1 4 ч л растительное масло сметана риет из лосося красная икра укроп драники из цуккини с риетом из лосося и икрой сегодня без лирических отступлений а сразу четко и по делу итак два самых важных правила в приготовлении драников из цуккини очень хорошо отжимаем натертые цуккини чтобы в них осталось по минимуму влаги не торопимся переворачивать драники ждём когда сформируется плотная поджаристая корочка а теперь вперёд к праздничному завтраку ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0499_00_499_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAAAQBQCdASoUABkAPu1oqVAppiOiqA1RMB2JZgC2yYyURJmhHOzBrexn8MyJdmibtjs2AP6yPPLxurzS6dFehDf58r/c/9V4ouQkDNYmKgn7ERfcY2mWvNcUv6GjAJv+z1yA87Qx3JCRSd7kMEhkLUYt+uVNic4MLQf6Lump+b92q/Ddzu8yUjAXwLnHdbqi+Bqp3iU6DZghC5W0HRJysQiRv0GMfE0x5KF0nDVgPiJ/NmZoep8DHv9DA85ibel8hCNj33iamWcJGMw8weLY6MlVHU8jCgAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 12 драников:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">цуккини 700 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">орегано 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">растительное масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">риет из лосося</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">красная икра</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Сегодня без лирических отступлений, а сразу четко и по делу. Итак, два самых важных правила в приготовлении драников из цуккини:</p>\n<ul class=\"ings\"><li><i class=\"bul\">✔️</i><span class=\"tx\">очень хорошо отжимаем натертые цуккини, чтобы в них осталось по минимуму влаги</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✔️</i><span class=\"tx\">не торопимся переворачивать драники, ждём когда сформируется плотная поджаристая корочка</span></li></ul>\n<p>А теперь вперёд, к праздничному завтраку!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Цуккини натереть на крупной тёрке, хорошо посолить, перемешать руками и оставить на 10 минут. Затем тщательно отжать через марлю или мешочек для овощей.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>TIP: Если есть желание сваять с утра драники на раз-два-три, шаг с теркой и откидыванием цуккини на сито можно перенести на вечер накануне, но в таком случае не солить, накрыть цуккини пищевой плёнкой и убрать в холодильник!</div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пармезан натереть на микроплане. В большой миске смешать отжатые цуккини, яйцо, муку, пармезан, орегано и чеснок. Перемешать и сразу же приступать к жарке.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть сковороду с небольшим количеством растительного масла (я беру масло авокадо). Одна столовая ложка — один драник, выкладываем массу и сразу же слегка прижимаем ложку к сковороде и разравниваем, чтобы сформировались круглые тонкие лепёшки. Жарить на среднем огне по 3–4 минуты с каждой стороны до золотистой корочки. Не переворачивайте раньше времени, расползутся. Дождитесь, когда масса станет матовой — это сигнал, что низ схватился.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Готовые драники выкладывать на бумажное полотенце или пергамент.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для подачи: складываем драники стопочкой, промазывая каждый уровень одной чайной ложкой сметаны. Сверху — столовая ложка риета, икра и немного укропа.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0499_01_500_photo.webp\" alt=\"\"></figure></div>"},"509":{"id":509,"title":"Взбитое масло","sub":"с анчоусами и лимоном","cat":"Закуски","img":"thumb/0509_00_509_photo.webp","lq":"data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAABwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JYwDInAgOXCHWBDEgW0xPVICC5Qf8fgMhv0eAANaAEbGNj+kRO+dqt16s+EwIpWrs2lksnbD2DjoDHQMvRztXSPrv/78lICoxUjHdJyGpbTCXk4FgPRf8GZ0xo+Ut5ks8jhPRBfP/53RcO7wzkEgZ9a+6iB+sxspILOsJqRwQMwVJvQaLpxI8ksrfWpgICHAu6JcwH4TdK+WZCbwjpWVYCtlgcgAA","w":360,"h":450,"q":"взбитое масло с анчоусами и лимоном  сливочное масло 180 г мягкое анчоусы в масле 3 4 филе цедра 1 лимона лимонный сок 2 чл взбитое масло с анчоусами и лимоном","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0509_00_509_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAABwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JYwDInAgOXCHWBDEgW0xPVICC5Qf8fgMhv0eAANaAEbGNj+kRO+dqt16s+EwIpWrs2lksnbD2DjoDHQMvRztXSPrv/78lICoxUjHdJyGpbTCXk4FgPRf8GZ0xo+Ut5ks8jhPRBfP/53RcO7wzkEgZ9a+6iB+sxspILOsJqRwQMwVJvQaLpxI8ksrfWpgICHAu6JcwH4TdK+WZCbwjpWVYCtlgcgAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 180 г мягкое</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы в масле 3-4 филе</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цедра 1 лимона</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 2 чл</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Масло заранее достать из холодильника, чтобы оно стало мягким.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Анчоусы выложить на бумажное полотенце, чтобы впиталось лишнее масло, затем мелко нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Соединить сливочное масло, анчоусы, лимонную цедру и лимонный сок. Взбивать миксером в течение 3–5 минут, пока масло не посветлеет и не увеличится в объеме. Начинайте с низкой скорости миксера, через 30-40 секунд увеличивайте — так текстура получится более стабильной.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Остатки хранить в холодильнике. Перед подачей дать маслу постоять при комнатной температуре 30–40 минут: так оно вернет свою нежную, взбитую текстуру и будет легко намазываться.</div></div></div></div>"},"516":{"id":516,"title":"Карпаччо из томатов","sub":"с анчоусной заправкой и пекорино","cat":"Закуски","img":"thumb/0516_00_516_photo.webp","lq":"data:image/webp;base64,UklGRt4AAABXRUJQVlA4INIAAACwBQCdASoUABkAPu1gq1AppSOisBgIATAdiWwAnS/UlYsmAtCe5JBKaAR4ggVf/YpWuN2liAAA/SGzt8z1RKZIs9N8FkQ+cXysWApnt8HVfQ7ScxDA2psWf3uS8zMSsthjQGUFNEWvfY35l3T2fdlHeBupkcYMF9loTW2XXzi6jYC5NRGiEOWI6apuOHglKdU0MYEuU6GMejAZmKAiHPKBzRieGunnjIp89TPg+Zx7eUSbA9+YDUSaaAUUaZmJMxHoP0K6XtIINEw+LSELfxIygAA=","w":360,"h":450,"q":"карпаччо из томатов с анчоусной заправкой и пекорино для заправки анчоусы в масле 3 4 филе оливковое масло 4 ст л лимон 1 2 шт сок чеснок 1 2 небольшого зубчика дижонская горчица 1 чл черный перец свежемолотый по вкусу базилик 2 3 веточки карпаччо из томатов с анчоусной заправкой и пекорино на 4 порции томаты 3 4 крупных спелых пекорино романо или пармезан 50 г","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0516_00_516_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRt4AAABXRUJQVlA4INIAAACwBQCdASoUABkAPu1gq1AppSOisBgIATAdiWwAnS/UlYsmAtCe5JBKaAR4ggVf/YpWuN2liAAA/SGzt8z1RKZIs9N8FkQ+cXysWApnt8HVfQ7ScxDA2psWf3uS8zMSsthjQGUFNEWvfY35l3T2fdlHeBupkcYMF9loTW2XXzi6jYC5NRGiEOWI6apuOHglKdU0MYEuU6GMejAZmKAiHPKBzRieGunnjIp89TPg+Zx7eUSbA9+YDUSaaAUUaZmJMxHoP0K6XtIINEw+LSELfxIygAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">для заправки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы в масле 3-4 филе</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 4 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1/2 небольшого зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дижонская горчица 1 чл</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец свежемолотый по вкусу</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 2-3 веточки</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">на 4 порции:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты 3-4 крупных спелых</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пекорино романо или пармезан 50 г</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Анчоусы, чеснок, дижонскую горчицу, половину базилика и лимонный сок соединить в мраморной ступке или высокой емкости и измельчить пестиком/пробить погружным блендером до однородности. Тонкой струйкой влить 2 ст л оливкового масла, непрерывно перемешивая, чтобы получилась густая эмульсия. Приправить свежемолотым черным перцем.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Томаты нарезать кружочками толщиной около 5 мм. Оставшийся базилик мелко нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Анчоусную заправку распределить по дну овального или круглого блюда. Сверху выложить кружочки томатов внахлест. Сбрызнуть оливковым маслом, посыпать флер де сель и нарезанным базиликом.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">При помощи овощечистки нарезать пекорино тонкими лепестками и распределить по всей поверхности блюда. Сразу же подавать.</div></div></div></div>"},"590":{"id":590,"title":"Риет из лосося","sub":"нежный и насыщенный","cat":"Закуски","img":"thumb/0590_00_590_photo.webp","lq":"data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABwBACdASoUABkAPu1srlIppaQiqAgBMB2JYwDBzAkrB1tcHdnuzVsHiRDbAAD8Wl3k8AA/pJXQ0FNSlp+IidKDXjEzWtyW2p/rHZcTRPFt8dYAnF0iiJ6TSVuQOuaYNiUkoVldaUlEIUa1md77+oQrEHxsx/W37ysWyU8E1INx9MjgrOVdvjeLwft9X++QgAA=","w":360,"h":450,"q":"риет из лосося нежный и насыщенный  слабосолёный лосось 120 г сливочный сыр 80 г масло слив мягкое 20 г каперсы 20 г лимон 1 2 шт цедра и сок укроп горсть белый перец риет из лосося нежный и насыщенный знаете этот финт из французского языка когда слово состоит из десяти букв а читается из них только половина сегодня у нас как раз такой герой риет французское многобуквенное rillettes традиционное французское блюдо родственное паштету но с иной технологией мясо чаще всего свинина утка гусь или кролик долго томится в собственном жире до волокнистой ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0590_00_590_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABwBACdASoUABkAPu1srlIppaQiqAgBMB2JYwDBzAkrB1tcHdnuzVsHiRDbAAD8Wl3k8AA/pJXQ0FNSlp+IidKDXjEzWtyW2p/rHZcTRPFt8dYAnF0iiJ6TSVuQOuaYNiUkoVldaUlEIUa1md77+oQrEHxsx/W37ysWyU8E1INx9MjgrOVdvjeLwft9X++QgAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">слабосолёный лосось 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло слив. мягкое 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра и сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Знаете этот финт из французского языка, когда слово состоит из десяти букв, а читается из них только половина? Сегодня у нас как раз такой герой!</p>\n<p>Риет (французское многобуквенное rillettes) — традиционное французское блюдо, родственное паштету, но с иной технологией. Мясо (чаще всего свинина, утка, гусь или кролик) долго томится в собственном жире до волокнистой мягкости, разбирается и растирается до состояния нежной массы, а затем заливается жиром для консервации. Таким был риет раньше. Во второй половине 20 века в эпоху nouvelle cuisine и общего увлечения морепродуктами во Франции, шеф-повара начали экспериментировать с рыбными риетами, и благодаря их стараниям сегодня в одном маленьком кулинарном Клубе маленький такой рецепт.</p>\n<p>Я очень люблю правильную денатурацию белков (в яйцах, в мясе, но особенно в рыбе), а еще люблю максимизировать вкусы, поэтому лосось возьмем в двух формах, и тот, что свежий, будем готовить интересным способом — варить, но в холодной воде, то есть нагревать вместе, будто картошку для пюре, это позволит ему остаться супер нежным.</p>\n<ul class=\"ings\"><li><i class=\"bul\">❄️</i><span class=\"tx\">Подходит для заморозки!</span></li></ul>\n<p>Размораживать через холодильник, чтобы сохранить текстуру.</p>\n<p class=\"lbl\">на 3 баночки по 200 мл:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">филе лосося 300 г</span></li></ul>\n<p>(+1 лимон и 1 лавровый лист)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Филе лосося нарезать одинаковыми кубиками, залить питьевой водой так, чтобы она покрыла рыбу примерно на 1 сантиметр, добавить сок одного лимона и лавровый листик, установить на средний огонь. Как только вода начнет выдавать пузырьки (примерно 70 градусов), снять с огня и откинуть лосось на дуршлаг. Переложить в миску и разобрать филе пальцами.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Каперсы промыть и мелко нарезать. Снять цедру с половины лимона и выжать сок. Укроп промыть, обсушить, нарубить. Слабосоленый лосось нарезать мелким кубиком и добавить в миску к лососю отваренному.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Туда же — сливочный сыр и мягкое сливочное масло, каперсы, лимонную цедру, сок лимона и укроп. Все аккуратно и недолго перемешать — важно дать сливочному маслу и сыру распределиться по массе, но текстуру волокон лосося сохранить. Попробовать на вкус: возможно захочется капнуть ещё лимонного сока, добавить немного соли и молотого белого перца.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Готовый риет переложить в баночку, закрыть крышкой и убрать в холодильник минимум на час, чтобы вкусы перемешались. Хранить до трёх дней.</div></div></div></div>"},"599":{"id":599,"title":"Перцы тоннато","sub":"","cat":"Закуски","img":"thumb/0599_00_599_photo.webp","lq":"data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAAAQBgCdASoUABkAPu1qrlCppaQiqAqpMB2JagCdMoPJ6AgBCaLNFV1Y3oFfp1QKEgUflnd0dYIVUAAA4gEkylgMjeHV1bWD+F2esOCht/kTNUksORt/Y1j+2l1REgcLnloUnPkU4QCnAsnGO2PsW+yyx9Dn6ghj/FGrwM64eAO5u3i8G4CYUOEdatwnAxGM47p2KgcsV396v1eSqL7+D1/mYPjDQgaxVSRMhBk8bOT9Xbr5xLSZuZhH6L0sq8VoUtM/wgb9MQB5to3aHJFjevqrYmN9BhmGgAA=","w":360,"h":450,"q":"перцы тоннато  на большую тарелку и компанию от 2 до 8 человек перцы сладкие красные 4 шт каперсы мелкие 1 ч л каперсы крупные 2 3 шт опционально лимон 1 2 шт цедра оливковое масло для соуса тунец консервированный в масле 100 г анчоусы 3 филе a 689 майонез 100 г лимон 1 2 шт сок вурстерширский соус 1 ст л сливки 70 г горчица дижонская 1 ч л свежемолотый черный перец перцы тоннато","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0599_00_599_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAAAQBgCdASoUABkAPu1qrlCppaQiqAqpMB2JagCdMoPJ6AgBCaLNFV1Y3oFfp1QKEgUflnd0dYIVUAAA4gEkylgMjeHV1bWD+F2esOCht/kTNUksORt/Y1j+2l1REgcLnloUnPkU4QCnAsnGO2PsW+yyx9Dn6ghj/FGrwM64eAO5u3i8G4CYUOEdatwnAxGM47p2KgcsV396v1eSqL7+D1/mYPjDQgaxVSRMhBk8bOT9Xbr5xLSZuZhH6L0sq8VoUtM/wgb9MQB5to3aHJFjevqrYmN9BhmGgAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на большую тарелку и компанию от 2 до 8 человек:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">перцы сладкие красные 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы мелкие 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы крупные 2-3 шт опционально</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">тунец консервированный в масле 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы 3 филе</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/689\">майонез</a> 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстерширский соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 230 градусов (режим: конвекция или самый сильный гриль).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Перцы вымыть, обсушить, выложить на противень и запекать до появления тёмных подпалин со всех сторон. Кожица должна местами почернеть, а сами перцы стать полностью мягкими. Переложить горячие перцы в закрывающийся пакет или контейнер с крышкой и оставить на 10-15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Очистить перцы от кожицы, удалить плодоножки и семена. Если хочется особенно аккуратной подачи, разделить мякоть на крупные красивые лепестки, сохраняя естественную форму перца и обрезать излишки.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для соуса соединить в чаше блендера тунца, анчоусы, майонез, лимонный сок, вурстерширский соус, сливки и дижонскую горчицу. Измельчить в течение 2-3 минут до полностью однородной кремовой консистенции. Если получилось слишком густо, можно добавить еще немного сливок. Попробовать перед тем, как солить: обычно соли от анчоусов и майонеза оказывается вполне достаточно.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">На большое блюдо выложить соус толстым слоем и слегка разровнять ложкой. Сверху свободно распределить лепестки запечённых перцев. Здесь не нужна геометрическая точность — красивые складки и изгибы делают блюдо только аппетитнее.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Посыпать мелкими каперсами, предварительно хорошо промытыми под водой. Если используете крупные каперсы на веточке, разложить их сверху в нескольких местах. Добавить немного лимонной цедры и щедро сбрызнуть хорошим оливковым маслом. Подавать!</div></div></div></div>"},"600":{"id":600,"title":"Трио дипов","sub":"с сезонными овощами","cat":"Закуски","img":" /p><div class=\"iblock\"><p class=\"lbl\">для свекольного хумуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">нут консервированный или варёный 220 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">запечённая свёкла 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тахини 45 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">жидкость от нута 40–60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (сок и немного цедры)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1/2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжутное масло 1-2 капли</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для дипа ромеско:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">красный сладкий перец 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">миндальная мука 75 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">хересный уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1/2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копчёная паприка 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец урфа 1/2 ч л опционально</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для сливочного дипа с авокадо:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">авокадо 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">густой греческий йогурт 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лайм 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мята 10–15 листьев</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">овощи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурцы короткоплотные 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь молодая 4-5 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">редис 1 пучок (10-15 шт)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 4-8 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молодой горошек 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кольраби 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">любые другие овощи по вашему желанию</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-резанец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Начнем с запекания овощей для дипов. Свёклу вымыть, обсушить, отрезать плодоножку, завернуть в фольгу и убрать в разогретую до 200 градусов (режим: верх/низ) духовку. Запекать от 50 до 80 минут, в зависимости от величины свёклы (ориентир: нож входит внутрь как в сливочное масло), затем остудить и очистить от кожицы. Для ромеско догреть духовку до 230 градусов (режим: конвекция или самый сильный гриль), перцы выложить на противень и запекать до появления тёмных подпалин и полностью мягкой мякоти, примерно по 10 минут с каждой стороны. Переложить в контейнер или пакет, закрыть и оставить на 10-15 минут. После этого снять кожицу и удалить семена.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Для свекольного хумуса соединить в чаше блендера нут, свёклу, тахини, чеснок, кумин, оливковое масло, лимонный сок и немного лимонной цедры. Добавить 40 г жидкости от нута и измельчить до максимально однородной массы. При необходимости добавить ещё немного жидкости, добиваясь консистенции густого крема. Посолить по вкусу и в самом конце добавить буквально пару капель кунжутного масла. Оно очень ароматное и легко перетягивает на себя всё внимание, поэтому здесь его нужно совсем немного.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Запечённые перцы соединить в чаще блендера с миндальной мукой, чесноком, хересным уксусом, оливковым маслом, копчёной паприкой и перцем урфа. Измельчить до однородности. Попробовать, досолить по вкусу.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для сливочного дипа с авокадо соединить сливочный сыр, авокадо, греческий йогурт, сок лайма и листья мяты. Измельчить погружным блендером до гладкого крема. Приправить солью и белым перцем.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Огурцы нарезать длинными брусочками. Морковь очистить и также нарезать брусочками. Редис разрезать пополам или на четвертинки в зависимости от размера. Сельдерей разобрать на отдельные стебли и нарезать кусочками длиной 8–10 см. Молодой горошек оставить целиком. Кольраби очистить и нарезать тонкими ломтиками или дольками.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Для подачи разложить дипы в небольшие миски и установить в центре большого блюда. Вокруг свободно распределить овощи, чередуя цвета, формы и текстуры. Перед подачей можно дополнительно сбрызнуть дипы хорошим оливковым маслом и посыпать: ромеско копченой паприкой, хумус кумином, сливочный дип — мелко нарезанным луком-резанцом.</div></div></div></div>"},"612":{"id":612,"title":"Гречневые мини-блины с лососем","sub":"slavic core appetizer","cat":"Закуски","img":"thumb/0612_00_612_photo.webp","lq":"data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAADQBQCdASoUABkAPu1sqlEppaOiqAqpMB2JbACdMwnlsQas01eWi6Gh65keTR/gArmd+dSshO0AAMlYUqZ/WHRurJ9UNY1B7LnHS4E+WXqb63+xVQBAWzglIJoqzo0B/5QFlqzUHES/vJLOUEeJbXShsO6NVQjLfpi9oFhF9V/Yk4b51A2Z5Jl6Wi1kL5D09b40EbNYYrybsSrqbdyRteIS3Uqa9pSsY7o2xW2ctTaF3Tze/HVbfqOxkfwyEshr9HHF+1YDnxDEfjnqQAAAAA==","w":360,"h":450,"q":"гречневые мини-блины с лососем slavic core appetizer для блинчиков молоко 250 г мука пшеничная 80 г мука гречневая 80 г яйца 2 шт сахар 1 ст л разрыхлитель 1 ч л раст масло 2 ст л соль щепотка для начинки сливочный сыр 240 г сметана 160 г лимон 1 2 шт цедра белый перец щепотка лосось с с 300 г икра рыбная черная имитация 50 г укроп веточки для украшения гречневые мини блины с лососем slavic core appetizer посчитала и обомлела впервые эту закуску я готовила на новогодний стол в декабре 2011го тогда же когда придумала и испекла свой идеальный торт с тонкими коржами творожным кремом и россыпью ягод который позднее стал моим фирменным вуди алленом похоже тот декабрь был особенно щедр на рецепты остающиеся со мной надолго помню что отец","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0612_00_612_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAADQBQCdASoUABkAPu1sqlEppaOiqAqpMB2JbACdMwnlsQas01eWi6Gh65keTR/gArmd+dSshO0AAMlYUqZ/WHRurJ9UNY1B7LnHS4E+WXqb63+xVQBAWzglIJoqzo0B/5QFlqzUHES/vJLOUEeJbXShsO6NVQjLfpi9oFhF9V/Yk4b51A2Z5Jl6Wi1kL5D09b40EbNYYrybsSrqbdyRteIS3Uqa9pSsY7o2xW2ctTaF3Tze/HVbfqOxkfwyEshr9HHF+1YDnxDEfjnqQAAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">для блинчиков:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука пшеничная 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука гречневая 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">разрыхлитель 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">раст.масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для начинки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 240 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана 160 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось с/с 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">икра рыбная черная (имитация) 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп веточки, для украшения</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Посчитала и обомлела — впервые эту закуску я готовила на новогодний стол в декабре 2011го, тогда же, когда придумала и испекла свой “идеальный торт” с тонкими коржами, творожным кремом и россыпью ягод, который позднее стал моим фирменным “Вуди Алленом”. Похоже, тот декабрь был особенно щедр на рецепты, остающиеся со мной надолго.</p>\n<p>Помню, что отец моего тогдашнего молодого человека, журналист и историк, попробовав, сказал, мол, как удивительно хорошо рыба и икра идут гречке, и так его те блинчики поразили, что через несколько дней он даже выдал мне историческую справку. Я такими вещами ещё не интересовалась, а потому слушала вполуха, но вот спустя четырнадцать лет дошла до этого сама.</p>\n<p>Выяснила, что гречневые блины с рыбой — это устойчивая часть русской гастрономической традиции. До широкого распространения доступной белой пшеничной муки в городском быту гречневая (наряду с ржаной и овсяной) активно использовалась как раз для блинов и оладий, особенно в регионах, где гречиха была привычной культурой. Связка же “блины + рыба/икра” была продиктована календарём постов и праздничных дней. Рыба и икра выступали важным источником животного белка там, где мясо было ограничено религиозными нормами или экономикой, и поэтому оказались естественными сопровождениями к блинам. Вкусовая сторона у этой пары тоже рациональна: гречневое тесто с выраженной ореховой нотой и лёгкой горчинкой хорошо принимает жир (масло, рыбу), а солёность и “морская” интенсивность икры получает нейтрально-тёплую опору и становится чище по восприятию.</p>\n<p>Свой первоначальный рецепт я для Клуба пересобрала: убрала ненужное и выровняла пропорции, получилось замечательно. Сервирую блинчики каждый год по-разному, в зависимости от настроения и количества времени. Можно нанести на каждый мини-диск по ложке крема и свернуть из лосося красивые розочки, можно сначала положить лосось, а сверху отсадить крем из кондитерского мешка. Вариантов много, главное не забудьте икру (я беру имитацию черной) и укроп — они сразу же делают блинчики праздничными.</p>\n<p class=\"lbl\">на ~45 блинчиков:</p>\n<p>(не думайте, что это много, с тарелки они улетают моментально)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Соединить пшеничную и гречневую муку с разрыхлителем, просеять. Яйца разделить на белки и желтки. В отдельной миске соединить желтки, сахар и половину молока, перемешать венчиком до однородности. Добавить растительное масло, перемешать, всыпать сухие ингредиенты, перемешать, затем влить оставшееся молоко, перемешать и оставить смесь на 10 минут. В это же время поставить сковородку разогреваться, на среднем огне.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Белки взбить до мягких, устойчивых пиков. Добавить в тесто и перемешать движениями снизу вверх, стараясь сохранить максимальное количество воздуха.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Слегка смазать сковороду растительным маслом и начать жарить блинчики. Выкладывать тесто небольшими порциями (примерно по половине столовой ложки), формируя круглые мини-блинчики. Удобно делать это с помощью соусника, если отрезать на нем кончик. Жарить около 1 минуты до уверенного золотистого цвета, перевернуть и готовить ещё с полминуты. Обязательно следите за нагревом, так как блинчики быстро становятся румяными и могут сгореть!Готовые блинчики переложить на тарелку и остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Сливочный сыр соединить со сметаной, цедрой лимона и щепоткой белого перца, взбить миксером до гладкого однородного крема.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Собираем: на каждый блинчик по чайной ложке крема, кусочек лосося, немного икры и веточку укропа.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Блинчики можно испечь заранее — они спокойно хранятся до 12 часов при комнатной температуре, накрытые чистым полотенцем. Крем также можно приготовить заранее (за пару часов), а вот собирать закуску стоит непосредственно перед подачей.</div></div></div></div>"},"646":{"id":646,"title":"Пастрами из индейки","sub":"для бутербродов, боулов, салатов и окрошки","cat":"Закуски","img":"thumb/0646_00_646_photo.webp","lq":"data:image/webp;base64,UklGRsIAAABXRUJQVlA4ILYAAAAwBgCdASoUABkAPu1grFAppSQisBgIATAdiWIAnTMTBFCAAT7zgSiw/EET9GdBy1QSTEXuHnGHZKBwAM4MJ/7DJ7ujnAt8/HhDhRaMxb0+5hnuFxC/V5h53WoQsmF1YiczKE8YTq+pGBjvJUEYYvrJX4MMevx4rorISi5jIU3A1HL1FoiiaVEyUHz9d2vfsYTuywY87KhFWoAeDMdBadLcH239oxYkV5eCR5VCuLeLRInQmaAAAA==","w":360,"h":450,"q":"пастрами из индейки для бутербродов, боулов, салатов и окрошки маринад вода 1 л соль крупная 60 г сахар 15 г перец горошком 10 шт чеснок 2 зубчика лавровый лист 2 шт розмарин 1 веточка тимьян 3 4 веточки горчица зерненая 1 ч л семена фенхеля 1 2 ч л филе индейки 800 г оливковое масло сливочное масло 20 г розмарин 1 веточка чеснок 1 зубчик пастрами из индейки для бутербродов боулов салатов и окрошки","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0646_00_646_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsIAAABXRUJQVlA4ILYAAAAwBgCdASoUABkAPu1grFAppSQisBgIATAdiWIAnTMTBFCAAT7zgSiw/EET9GdBy1QSTEXuHnGHZKBwAM4MJ/7DJ7ujnAt8/HhDhRaMxb0+5hnuFxC/V5h53WoQsmF1YiczKE8YTq+pGBjvJUEYYvrJX4MMevx4rorISi5jIU3A1HL1FoiiaVEyUHz9d2vfsYTuywY87KhFWoAeDMdBadLcH239oxYkV5eCR5VCuLeLRInQmaAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">маринад:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 1 л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль крупная 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком 10 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 веточка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 3-4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена фенхеля 1/2 ч л</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">филе индейки 800 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 веточка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вечером накануне сложить все ингредиенты для маринада в сотейник, перемешать, нагреть, чтобы соль и сахар растворились, а ароматы — раскрылись, затем выключить огонь и охладить маринад до комнатной температуры. Поместить филе индейки в подходящий контейнер, залить маринадом, накрыть крышкой и убрать в холодильник на ночь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">На следующий день разогреть духовку до 150 градусов (режим: конвекция), достать индейку, обсушить бумажными полотенцами, натереть оливковым маслом, положить на металлический противень и отправить в духовку приблизительно на 30 минут. Термометр, вставленный в центр мяса, должен показывать +-60 градусов.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Растопить в сковороде сливочное масло, чеснок раздавить плоскостью ножа прямо с шелухой, добавить в сковороду вместе с розмарином и хорошо повозить тем и другим по маслу, чтобы напитать его ароматами. Выложить филе и обжарить до румяной корочки со всех сторон (приблизительно по 3 минуты с каждой стороны, контролируйте нагрев, чтобы масло не сгорело). Термометр, вставленный в серединку филе, должен показывать 70 градусов. Плотно обернуть фольгой и убрать в холодильник минимум на 1 час. Съесть в течение 72 часов.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0646_01_647_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0646_02_648_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0646_03_649_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0646_04_650_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0646_05_651_photo.webp\" alt=\"\"></figure></div>"},"653":{"id":653,"title":"Vitello tonnato","sub":"закуска из Пьемонта","cat":"Закуски","img":"thumb/0653_00_653_photo.webp","lq":"data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAACQBQCdASoUABkAPu1qrFEppaQiqAqpMB2JZACsAdz5fmKZypQ0L7xPtpAmdQD0PYSg1VzWAADb/FTqq/vJAC8sQQtF9jZCr16xIN/db+54ixn+9RDNje0neHPO79zGA3sZ4FLlQGa+0maeIX0nTlSsz1E+PE7X1Sf4lygM/EmTTscti3B708PnFfq1ftCirXC6JNVGYkqHntKlU73q5wrBG7FjGn7EA0LGbDrHsbklYktqsSHn5JmCKrVvjpK4pa0S8wUlyDNNTH7GD8vANWrw4px3Ndw9TJUqwecaFPlJmbAAAAA=","w":360,"h":450,"q":"vitello tonnato закуска из пьемонта для маринования телятины вода 1 л соль крупная 60 г сахар 15 г перец горошком 10 шт чеснок 1 2 зубчика лавровый лист 2 шт розмарин 1 веточка тимьян 3 4 веточки горчица зерненая 1 ч л семена фенхеля 1 2 ч л телятина вырезка 600 г оливковое масло сливочное масло розмарин 1 веточка чеснок 1 зубчик для соуса тунец консервированный в масле 80 г анчоусы 4 филе майонез предпочтительно домашний 100 г лимон 1 2 шт сок чёрный перец по вкусу вурстерширский соус 1 ст л сливки 30 100 г горчица дижонская 1 ч л каперсы 1 ч л петрушка оливковое масло vitello tonnato закуска из пьемонта поговорим о шедевре итальянской гастрономической традиции которое кажется переживает свой пик популярности в москве vitello tonnato элегантная сбалансированная холодная закуска заставляющая многих вскидывать брови то есть как это мясо с рыбой vitello tonnato родом из пьемонта и изначально как ни странно блюдо не содержало","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0653_00_653_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAACQBQCdASoUABkAPu1qrFEppaQiqAqpMB2JZACsAdz5fmKZypQ0L7xPtpAmdQD0PYSg1VzWAADb/FTqq/vJAC8sQQtF9jZCr16xIN/db+54ixn+9RDNje0neHPO79zGA3sZ4FLlQGa+0maeIX0nTlSsz1E+PE7X1Sf4lygM/EmTTscti3B708PnFfq1ftCirXC6JNVGYkqHntKlU73q5wrBG7FjGn7EA0LGbDrHsbklYktqsSHn5JmCKrVvjpK4pa0S8wUlyDNNTH7GD8vANWrw4px3Ndw9TJUqwecaFPlJmbAAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">для маринования телятины:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 1 л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль крупная 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком 10 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1-2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 веточка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 3-4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица зерненая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена фенхеля 1/2 ч л</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">телятина (вырезка) 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 веточка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">тунец консервированный в масле 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">анчоусы 4 филе</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез, предпочтительно домашний 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чёрный перец по вкусу</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстерширский соус 1 ст л</span></li><li><i class=\"bul\
