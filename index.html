<style>
*{box-sizing:border-box}
:root{
  --paper:#FBFAF8; --ink:#14100F; --ink-2:#6B635E; --ink-3:#A79E98;
  --line:#E7E2DC; --wash:#F2EFEA; --plum:#6E2B4E; --plum-soft:#F4EAEF;
  --focus:#6E2B4E;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#141211; --ink:#F2EEEA; --ink-2:#A79E97; --ink-3:#756C66;
    --line:#2B2523; --wash:#1C1917; --plum:#D08FB2; --plum-soft:#2B1B24;
    --focus:#D08FB2;
  }
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:400 17px/1.62 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-variation-settings:'opsz' 18;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.u{font:700 11px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}

/* ── лента-контактник: один день, снятый целиком ── */
.filmstrip{display:flex;gap:2px;overflow:hidden;height:52px;background:var(--wash)}
.filmstrip a{flex:1 1 0;min-width:0;height:100%;filter:saturate(.92)}
.filmstrip img{width:100%;height:100%;object-fit:cover}
.filmstrip a:hover{filter:none}
@media (max-width:700px){.filmstrip{height:38px}.filmstrip a:nth-child(n+13){display:none}}

/* ── шапка ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(150%) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{font:250 21px/1 Inter,sans-serif;letter-spacing:-.035em;white-space:nowrap;
  font-variation-settings:'opsz' 24}
.brand b{font-weight:650}
.search{flex:1 1 auto;position:relative;max-width:340px;margin-left:auto}
.search input{width:100%;height:34px;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:0 0 0 22px;font:400 15px Inter,sans-serif;background:transparent;color:var(--ink);outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-bottom-color:var(--plum)}
.search svg{position:absolute;left:0;top:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.back{display:none;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;
  font:600 14px Inter,sans-serif;color:var(--ink-2);font-family:inherit}
.back:hover{color:var(--plum)}
body.view-recipe .back{display:flex}
body.view-recipe .search{display:none}

/* ── титул: оглавление как обложка ── */
.masthead{padding:86px 0 8px}
.masthead h1{font:200 clamp(56px,12.5vw,150px)/.86 Inter,sans-serif;letter-spacing:-.05em;margin:0;
  font-variation-settings:'opsz' 32}
.masthead h1 em{font-style:normal;font-weight:600}
.masthead .say{margin:26px 0 0;max-width:38ch;color:var(--ink-2);font-size:16px}
.masthead .say b{font-weight:600;color:var(--ink)}

.contents{margin:52px 0 20px;border-top:1px solid var(--ink);padding-top:14px;
  columns:2;column-gap:56px}
@media (max-width:760px){.contents{columns:1;margin-top:38px}
  .cline .nm{white-space:normal}
  .search{max-width:190px}}
.cline{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
  break-inside:avoid;cursor:pointer}
.cline .nm{font-weight:500;letter-spacing:-.012em;white-space:nowrap}
.cline .dots{flex:1 1 auto;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.cline .ct{flex:0 0 auto;font:600 13px Inter,sans-serif;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cline:hover .nm{color:var(--plum)}
.cline:hover .ct{color:var(--plum)}

/* ── полоса категории ── */
.band{padding:64px 0 0;scroll-margin-top:70px}
.bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  border-bottom:1px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.bhead h2{font:250 clamp(28px,4.6vw,46px)/1 Inter,sans-serif;letter-spacing:-.035em;margin:0;
  font-variation-settings:'opsz' 30}
.bhead .meta{text-align:right;color:var(--ink-3);flex:0 0 auto}
.bhead .meta .n{font:600 13px Inter,sans-serif;font-variant-numeric:tabular-nums}
.bhead .meta .d{font-size:13px;max-width:26ch;line-height:1.35;margin-top:3px;color:var(--ink-3)}
@media (max-width:620px){.bhead{display:block}.bhead .meta{text-align:left;margin-top:8px}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 22px}
.grid .card:first-child{grid-column:span 2;grid-row:span 2}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}
  .grid .card:first-child{grid-column:span 2;grid-row:auto}}

.card{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.card .ph{position:relative;overflow:hidden;background:var(--wash);aspect-ratio:4/5}
.grid .card:first-child .ph{aspect-ratio:1/1}
@media (max-width:640px){.grid .card:first-child .ph{aspect-ratio:5/4}}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.card:hover .ph img,.card:focus-visible .ph img{transform:scale(1.035)}
.card .nm{font-weight:500;font-size:15.5px;line-height:1.24;letter-spacing:-.014em}
.grid .card:first-child .nm{font-size:22px;font-weight:400;letter-spacing:-.024em}
.card .sb{color:var(--ink-3);font-size:13px;line-height:1.35;margin-top:-5px}
.grid .card:first-child .sb{font-size:14.5px}
.empty{color:var(--ink-2);padding:56px 0 120px;max-width:46ch}

/* ── страница рецепта ── */
.recipe{padding:44px 0 110px;max-width:1000px;margin:0 auto}
.rtop .u a:hover{color:var(--plum)}
.recipe h1{font:250 clamp(32px,6vw,62px)/1.0 Inter,sans-serif;letter-spacing:-.042em;margin:10px 0 0;
  font-variation-settings:'opsz' 32}
.recipe .sub{color:var(--ink-2);font-size:19px;margin:12px 0 0;max-width:46ch;font-weight:300}
.spread{display:grid;grid-template-columns:288px 1fr;gap:52px;align-items:start;margin-top:40px}
@media (max-width:880px){.spread{grid-template-columns:1fr;gap:26px}}
.rail figure{margin:0}
.rail figure.hero img{width:100%;height:auto}
.railwrap{position:sticky;top:76px}
@media (max-width:880px){.railwrap{position:static}}

/* состав — список, который отмечают по ходу */
.ingcol{margin-top:22px}
.iblock{margin-bottom:22px}
.lbl{font:700 11px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 11px;display:block}
.lbl.solo{color:var(--ink-2)}
.idiv{color:var(--ink-3);margin:0 0 16px;font-weight:300;font-size:20px}
.ings{list-style:none;margin:0;padding:0}
.ings li{display:flex;gap:9px;align-items:baseline;padding:5px 0;font-size:15.5px;line-height:1.35;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;
  transition:color .18s ease,opacity .18s ease}
.ings li:last-child{border-bottom:0}
.ings li .bul{flex:0 0 auto;font-size:9px;opacity:.5;filter:grayscale(.35);transform:translateY(-2px)}
.ings li:hover{color:var(--plum)}
.ings li.done{color:var(--ink-3);opacity:.55}
.ings li.done .tx{text-decoration:line-through;text-decoration-thickness:1px}
.iblock.note-ish{font-size:15px;color:var(--ink-2)}
.iblock.note-ish p{margin:0}

/* текст */
.main>*:first-child{margin-top:0}
.main p{margin:0 0 16px}
.introp{font-style:italic;color:var(--ink-2);font-size:18px;line-height:1.6;font-weight:300;
  max-width:62ch}
.introp p:first-of-type::first-letter{font-size:2.9em;line-height:.86;float:left;font-weight:200;
  font-style:normal;margin:.06em .11em 0 0;color:var(--ink)}
.note{border-left:2px solid var(--plum);padding:2px 0 2px 18px;margin:0 0 20px;
  font-size:16px;line-height:1.55;color:var(--ink-2);max-width:62ch}
.note .bul{font-size:11px;opacity:.6;margin-right:2px}
.outrop{color:var(--ink-2);max-width:62ch}

/* шаги — отмечаются по ходу */
.steps-head{display:flex;align-items:baseline;gap:14px;margin:30px 0 14px;
  border-top:1px solid var(--ink);padding-top:12px}
.steps-head .prog{font:600 12px Inter,sans-serif;color:var(--ink-3);font-variant-numeric:tabular-nums}
.steps-head .reset{margin-left:auto;font:600 12px Inter,sans-serif;color:var(--ink-3);
  background:none;border:0;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.steps-head .reset:hover{color:var(--plum)}
.step{display:grid;grid-template-columns:46px 1fr;gap:0 14px;padding:14px 0;
  border-bottom:1px solid var(--line);cursor:pointer;max-width:70ch}
.step:hover .sn{color:var(--plum)}
.step .sn{font:200 30px/1 Inter,sans-serif;color:var(--ink-3);font-variant-numeric:tabular-nums;
  transition:color .18s ease;font-variation-settings:'opsz' 28}
.step .st{font-size:17px;line-height:1.62}
.step.done{color:var(--ink-3)}
.step.done .sn{color:var(--plum);font-weight:400}
.step.done .sn::after{content:'✓';font-size:15px;margin-left:2px}
@media (max-width:520px){.step{grid-template-columns:34px 1fr}.step .sn{font-size:23px}}

/* галерея процесса */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:36px}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.vid{position:absolute;left:7px;top:7px;background:rgba(10,8,7,.62);color:#fff;
  font:700 9px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:3px 5px}

/* ссылки между рецептами */
.xref{color:var(--plum);border-bottom:1px solid color-mix(in srgb,var(--plum) 40%,transparent);
  font-style:normal;font-weight:500}
.xref:hover{border-bottom-color:var(--plum)}

.nav{display:flex;gap:22px;margin-top:64px;border-top:1px solid var(--ink);padding-top:16px}
.nav a{flex:1 1 0;color:var(--ink-2);font-size:15px;line-height:1.3}
.nav a .u{display:block;margin-bottom:5px}
.nav a:hover{color:var(--plum)}
.nav .r{text-align:right}
footer{border-top:1px solid var(--line);margin-top:70px;padding:26px 0 46px;color:var(--ink-3);font-size:13px}
footer a{border-bottom:1px solid var(--line)}
</style>

=\"async\" width=\"640\" height=\"800\" src=\"img/0609_00_609_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuYAAABXRUJQVlA4INoAAACwBQCdASoUABkAPu1wsFIppiSiqAgBMB2JagCsIOZgzAmuGqrsCcSXkj6Mwy5oTaohTJegqHgA/h8JMzDZCdYJ9TF5ld8Uc1zE7jtuhXwZYSX5CTEgV4nUd+qDGoE9jA1hMasJbcqPdmeYttJKiTZtwffkv/wyPqLz1ODF4zg3yX5d/+OI9pj0APWrQSodArfFELfzzOry+fb2UF71tt9oVom6EdF6PmE+Xa91mc/lHn5DzLg7WGSUkdINSmeH8k4+ttNXKrbuK3ylt/pB8J9g2i6KiE10QyAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на один тост:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыр пекорино романо 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">хлеб ремесленный 1 ломтик</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">зеленый салат в качестве дополнения</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Привет, дорогие соклубники, я с удовольствием начинаю парад рецептов весеннего сезона!</p>\n<p>Март — месяц номинально весенний, но фактически (и гастрономически), увы, всё ещё зимний. Земля холодна, солнца немного, грядки пока спят, и первые весенние сезонные продукты появятся только в конце месяца, поэтому начинаем неспешно и обогащаем картотеку клубных рецептов новым завтраком — невероятно простым и быстрым, но гениальным в этой своей простоте. Этот тост — оммаж великолепной итальянской пасте cacio e pepe: тёплый хрустящий хлеб, нежный сливочный скрембл, солоноватый сыр и яркий аромат свежемолотого перца.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: в отличие от упомянутой выше пасты, где использование сыра пекорино романо крайне важно для образования правильного соуса-эмульсии, этот скрембл более лоялен к замене и не обидится, если вместо пекорино вы возьмете пармезан. Это уже не будет вкус cacio e pepe, но всё ещё будет яркий интересный завтрак</div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: Поджарить ломтик хлеба можно двумя способами — либо на сковороде с двух сторон, предварительно немного сбрызнув обе стороны оливковым маслом, либо на решетке в духовке под самым сильным грилем. Я предпочитаю второй вариант, держу по три минуты с каждой стороны.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В небольшой миске смешать два яйца, крошечную щепотку соли и столовую ложку сливок. Если сливок нет, сойдет в принципе любой молочный продукт — молоко, кефир или йогурт, но в плане конечного вкусового профиля блюда сливки предпочтительнее. Хорошо взбить всё вилкой и оставить на 5-7 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Натереть примерно 2/3 от кусочка сыра на микроплане, отставить. Дальше действуем быстро: установить небольшую сковороду на средне-сильный огонь и добавить свежемолотый перец, прогреть его в течение одной-двух минут (сковорода должна быть хорошо прогрета, прежде чем приступать к скремблу). Затем добавить сливочное масло, дождаться, пока оно растопится, распределить по всей раскаленной плоскости и влить яичную смесь. Сразу же распределить сверху натертый пекорино и с помощью спатулы начать делать скрембл.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Здесь важно помнить главный принцип хорошего скрембла: он готовится очень быстро, но ваши движения не должны быть стремительными. Яйца должны схватываться постепенно, образуя крупные нежные складки, а не сухие мелкие крошки.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Сначала нужно дать яйцам буквально 10–15 секунд спокойно схватиться снизу, затем начать мягко “собирать” массу спатулой от краёв к центру. Движения должны быть широкими и неторопливыми. Каждый раз, когда вы проводите спатулой по поверхности, жидкая часть яйца будет стекать на горячую поверхность и снова схватываться.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Если сковорода была разогрета хорошо, уже через 30 секунд масса начнёт густеть. Очень важно не перемешивать яйца постоянно — делать это нужно редко, но метко.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Финально сформировать кусочки будущего скрембла стоит тогда, когда он станет кремовым и слегка влажным (и будет выглядеть недоготовленным — смотрите видео). Здесь можно финально несколько раз провести спатулой по сковороде и снять её с огня. Остаточное тепло ещё немного доведёт яйца до идеальной текстуры. Если передержать их на огне, они быстро станут сухими.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Выложить скрембл на горячий тост, натереть сверху оставшийся пекорино и добавить сверху свежемолотого чёрного перца, щедро. Подавать сразу же — например, вместе с простым зелёным салатом.</div></div></div></div>"},"634":{"id":634,"title":"Шакшука","sub":"~ 15 минут","cat":"Завтраки","img":"thumb/0634_00_634_photo.webp","lq":"data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAABQBgCdASoUABkAPu1or1CppaQiqAqpMB2JagC1G2iBS8AgwHWuIaP268p3Jt97WaEaSDJ3KOAHQIVZAAD+72pIzvN7Ok06Yem5w8PQpvvJcjsXB+2EKL+qHuYtNrCcqyY11ov1OWYCa92m9qlQ7PS+AyvQRxPKCalsiEb/vb3HteGKgjZaYwQI1oyQgLTdtJ1yxQBGNciYSEOqjnKSnI7QWbCIJ90CvJhra3tc0VELqFcKYWm9LorTpO88qP0Bn12AR1PE31nQqlgNRiSiQO8/8/iYAZZxMRa4NJaDPLTWHhqIAAA=","w":360,"h":450,"q":"шакшука ~ 15 минут  a 633 соус матбуха 750 г яйца комнатной температуры 4 6 шт в зависимости от ваших пожеланий пита 3 4 шт свежемолотый черный перец зелень петрушка или кинза горсть шакшука 15 минут на 3 4 порции сковорода диаметром 25 см ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0634_00_634_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvAAAABXRUJQVlA4IOQAAABQBgCdASoUABkAPu1or1CppaQiqAqpMB2JagC1G2iBS8AgwHWuIaP268p3Jt97WaEaSDJ3KOAHQIVZAAD+72pIzvN7Ok06Yem5w8PQpvvJcjsXB+2EKL+qHuYtNrCcqyY11ov1OWYCa92m9qlQ7PS+AyvQRxPKCalsiEb/vb3HteGKgjZaYwQI1oyQgLTdtJ1yxQBGNciYSEOqjnKSnI7QWbCIJ90CvJhra3tc0VELqFcKYWm9LorTpO88qP0Bn12AR1PE31nQqlgNRiSiQO8/8/iYAZZxMRa4NJaDPLTWHhqIAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/633\">соус матбуха</a> 750 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца комнатной температуры 4-6 шт (в зависимости от ваших пожеланий)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пита 3-4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зелень — петрушка или кинза горсть</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">на 3-4 порции:</p>\n<p>(сковорода диаметром 25 см)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 200 градусов (режим: верх/низ). Матбуху выложить в сковороду и поставить на средний огонь. Дождаться, пока смесь начнёт булькать, перемешать и начать вбивать яйца — под каждое яйцо нужно сделать углубление с помощью ложки и вбить туда яйцо. Если хотите, чтобы не только вкусно, но и очень красиво, то разделите яйцо — сначала вбейте белок, а затем уже желток.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Накрыть крышкой и держать на среднем огне от 6 минут (если любите жидкий желток) до 8 (если любите полностью приготовленные яйца). В это время можно подогреть лепешки в духовке. Посыпать шакшуку зеленью, пройтись мельницей с черным перцем и сразу же подавать.</div></div></div></div>"},"709":{"id":709,"title":"Картопляники с сыром","sub":"","cat":"Завтраки","img":"thumb/0709_00_709_photo.webp","lq":"data:image/webp;base64,UklGRuwAAABXRUJQVlA4IOAAAADQBQCdASoUABcAPu1or1CppaQiqAqpMB2JbACxHzAnArQPcsPGnvcd486/UV8eOC69UxwEuMYAAM0AWYyAz/+4bk/aJpEJAmFxXzPMnlLKsJe4Rcb6gJGojeZ8zqDBm1w2KoYX6F5oBlPk84LNFUelgjrTlJ0l4cZtI64p3LH5cmTKhYwnw16N2BLxgOxYQsGv+Xi0YS+HJcHgA57NEYMbABVLu3ps8RZX64aZB7mQY+aWbIBsnU8/ZE8g70rQFGs7zuZyhRg8/SuXzMLBxpW+n6QdcwNbMOMKaAGDjYAAAA==","w":360,"h":420,"q":"картопляники с сыром   картофель средний 8 шт желток 2 шт мука 90 гр эдам или гауда 60 гр пармезан 40 гр лавровый лист 2 3 шт перец горошком 6 шт соль зелень по желанию а также сковорода подсолнечное масло добавки на ваш вкус с с лосось сметана бекон печеные бобы картопляники с сыром сытный завтрак выходного дня который можно провернуть буквально за 15 минут если озаботится варкой картофеля заранее сегодня вечером сварить завтра утром натереть на терке или пропустить через мясорубку на 4 порции","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"746\" src=\"img/0709_00_709_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuwAAABXRUJQVlA4IOAAAADQBQCdASoUABcAPu1or1CppaQiqAqpMB2JbACxHzAnArQPcsPGnvcd486/UV8eOC69UxwEuMYAAM0AWYyAz/+4bk/aJpEJAmFxXzPMnlLKsJe4Rcb6gJGojeZ8zqDBm1w2KoYX6F5oBlPk84LNFUelgjrTlJ0l4cZtI64p3LH5cmTKhYwnw16N2BLxgOxYQsGv+Xi0YS+HJcHgA57NEYMbABVLu3ps8RZX64aZB7mQY+aWbIBsnU8/ZE8g70rQFGs7zuZyhRg8/SuXzMLBxpW+n6QdcwNbMOMKaAGDjYAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель средний 8 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 90 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">эдам или гауда 60 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 40 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2-3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком 6 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зелень (по желанию)</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">сковорода</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">подсолнечное масло</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">добавки на ваш вкус: с/с лосось, сметана, бекон, печеные бобы</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Сытный завтрак выходного дня, который можно провернуть буквально за 15 минут, если озаботится варкой картофеля заранее (сегодня вечером сварить, завтра утром натереть на терке или пропустить через мясорубку).</p>\n<p>на 4 порции</p></div><div class=\"outrop\"><p>❤️the secret ingredient is always love</p>\n<p>💛Картофель помыть, очистить и отварить в течение ~20-25 минут (до полной мягкости, проверять вилкой) вместе с чайной ложкой крупной морской соли с горкой, лавровым листом, тимьяном и перцем горошком.</p>\n<p>💛Размять в пюре, остудить (так, чтобы не обжигало палец), добавить яйцо, сыры и муку, хорошо вымешать, сформировать оладья (добавьте еще ~30 грамм муки, если оладья будут плохо формироваться). Если любите зелень - тоже можно добавить прямо в “тесто”. Я очень люблю тимьян, добавляю его в небольшом количестве.</p>\n<p>💛Руками, смоченными водой или маслом, сформировать тонкие широкие оладья и обжарить на внушительном количестве подсолнечном масле и среднем огне с двух сторон, до золотистой корочки.</p>\n<p>💛Подавать со слабосоленным лососем и сметаной, либо с жареным яйцом и беконом, либо с грибами и печеной фасолью, в общем - как вам больше нравится!</p></div></div></div>"},"735":{"id":735,"title":"Варёное яйцо","sub":"всмятку и вкрутую","cat":"Завтраки","img":"thumb/0735_00_735_photo.webp","lq":"data:image/webp;base64,UklGRrAAAABXRUJQVlA4IKQAAAAQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZwAD5aCV8YOKE3o7x0JnSXTTqmLysVsAAP7c/IsWvSXjp0Gy1WaWbRYEP12xkuMAjervHVN1lUWBbKRFBPoebWJjDu67IbgCaRvX0ttW9+fh5tvV3fhIvmeq5weGCrtR9zpjvAKUPxx09bla9mvw7mbXsN+nkesKQ9mMKpkynQdYO4ePaPMwOgAAAA==","w":360,"h":450,"q":"варёное яйцо всмятку и вкрутую варёное яйцо всмятку и вкрутую","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0735_00_735_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrAAAABXRUJQVlA4IKQAAAAQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZwAD5aCV8YOKE3o7x0JnSXTTqmLysVsAAP7c/IsWvSXjp0Gy1WaWbRYEP12xkuMAjervHVN1lUWBbKRFBPoebWJjDu67IbgCaRvX0ttW9+fh5tvV3fhIvmeq5weGCrtR9zpjvAKUPxx09bla9mvw7mbXsN+nkesKQ9mMKpkynQdYO4ePaPMwOgAAAA==) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: время приготовления может немного меняться в зависимости от температуры на вашей кухне и от вида вашей посуды (способности посуды удерживать тепло). Я очень рекомендую сначала попробовать сварить одно яйцо (обязательно приняв во внимание его размер) и при необходимости скорректировать время для нужного вам результата, исходя из полученных данных. Если вы находитесь на средней высоте над уровнем моря или выше, однозначно стоит увеличить время варки (да, это влияет на кипение воды и соответственно на время приготовления еды).</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вскипятить воду в маленьком сотейнике. Можно держать в голове формулу 1 литр на 2 яйца, но это не строгое правило, привожу его для ориентира, потому что если положить много холодных яиц в слишком маленький сотейник, они сильно охладят воду, и весь тайминг собъётся. С помощью столовой ложки опустить холодное яйцо в кипящую воду, снова быстро довести до кипения и держать на среднем огне (вода должна кипеть, но не активно - иначе яйца побьются) от 5 до 10 минут.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">При варке 5 минут вы получите уплотненный, но не до конца сварившийся белок и полностью жидкий тёплый желток.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">При варке 6 минут вы получите белый крепкий белок и теплый, по краям начинающий уплотняться желток.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">При варке 7 минут вы получите полноценно готовый белок как у яйца вкрутую и золотистый, жидкий в центре, но твердый по краям желток.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">При варке 8 минут вы получите яйцо, идеально сваренное для тех, кто любит баланс между яйцом вкрутую и яйцом всмятку (я варю именно так) - крепкий белок и самую чуточку жидкий в центре желток.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">При варке 10 минут вы получите яйцо вкрутую - с полностью приготовленными белком (он будет приближаться к перекоагуляции) и полностью оформившимся желтком.</span></li></ul>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Слить всю воду и наполнить сотейник до краев ледяной водой. Засечь одну минуту, слить нагретую яйцом воду и снова наполнить ледяной.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Чтобы легко очистить яйцо, сделайте несколько ударов о стол, начиная с тупого конца яйца, чтобы вся поверхность скорлупы покрылась трещинами. Откройте кран и под тонкой струйкой холодной воды очистите яйцо.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0735_01_736_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0735_02_737_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0735_03_738_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0735_04_739_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0735_05_740_photo.webp\" alt=\"\"></figure></div>"},"741":{"id":741,"title":"Яичница-болтунья","sub":"","cat":"Завтраки","img":"thumb/0741_00_741_video.webp","lq":"data:image/webp;base64,UklGRqwAAABXRUJQVlA4IKAAAAAwBQCdASoUABkAPuFgpk2opaOiMAwBEBwJagC1F9SBngeKa/Uo3zCdpWTzmIOs2D020ADvg8B0XBN6Au6GWqayTA5WWnGmjjZ3DZ0CfHW27imGcR25SenOIER/uFbINvaC7xIL6aPESyG2f77lpSXu8ar9Z4R3smOSToBZwLINv1mMzLQ2zdgumN/XCEJmEnQzx3KQGN6dUD8lcbeU18AA","w":256,"h":320,"q":"яичница-болтунья   яйца 2 шт сливочное масло 15 г соль черный молотый перец пармезан петрушка яичница болтунья это рецепт завтрака который я ем стабильно три или четыре раза в неделю я люблю яйца но никогда не любила глазунью вкус жареного белка не моё и классический скрембл мне не нравился тоже текстурой не люблю я эти разодранные остывающие кусочки на своей тарелке решение пришло с течением времени от двух моих любимых людей сначала я заметила что фирменный омлет моей мамы","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"256\" height=\"320\" src=\"img/0741_00_741_video.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRqwAAABXRUJQVlA4IKAAAAAwBQCdASoUABkAPuFgpk2opaOiMAwBEBwJagC1F9SBngeKa/Uo3zCdpWTzmIOs2D020ADvg8B0XBN6Au6GWqayTA5WWnGmjjZ3DZ0CfHW27imGcR25SenOIER/uFbINvaC7xIL6aPESyG2f77lpSXu8ar9Z4R3smOSToBZwLINv1mMzLQ2zdgumN/XCEJmEnQzx3KQGN6dUD8lcbeU18AA) center/cover\" alt=\"\"><span class=\"vid\">видео</span></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный молотый перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Это рецепт завтрака, который я ем стабильно три или четыре раза в неделю. Я люблю яйца, но никогда не любила глазунью (вкус жареного белка - не моё), и классический скрембл мне не нравился тоже (текстурой - не люблю я эти разодранные остывающие кусочки на своей тарелке). Решение пришло с течением времени от двух моих любимых людей. Сначала я заметила, что фирменный омлет моей мамы получается таким вкусным из-за мощного кусочка сливочного масла, который она разогревает на сковороде, затем подсмотрела у Вилли его технику приготовления скрембла - он не рвал схватывающиеся яйца на горячей поверхности, а лишь немного пододвигал их силиконовой спатулой, давая сырой массе вытечь и приготовиться, затем заворачивая в конце края яичницы, собирая подобие конвертика. Я объединила эти два приема, добавила петрушку и пармезан, и радостно завтракаю своей идеальной яичницей-болтуньей вот уже больше года.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разбить два яйца в миску, посолить, взбить вилкой в течение нескольких секунд, чтобы белок и желток очень хорошо перемешались. Оставить на 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Установить антипригарную сковороду на средне-сильный огонь (у меня 7 из 9), растопить сливочное масло и дождаться, пока оно перестанет пениться. Вылить яйца, выждать буквально полминуты и начать аккуратно двигать кусочки яичницы силиконовой спатулой. Когда вытекающей яичной массы больше не останется (центр должен выглядеть непрожаренным, так и должно быть), завернуть края яичницы с помощью спатулы и аккуратно перевернуть ее другой стороной. Сразу же выключить огонь, подождать полминуты - и можно перекладывать на тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Украсить петрушкой, натертым на микроплане пармезаном и свежемолотым перцем. С ломтиками ветчины, сыром комте, слабосоленым лососем + зеленый салат - обожаю!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0741_01_742_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0741_02_743_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0741_03_744_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0741_04_745_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0741_05_746_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"747":{"id":747,"title":"Яйцо пашот","sub":"мой самый любимый способ","cat":"Завтраки","img":"thumb/0747_00_747_photo.webp","lq":"data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAADQBQCdASoUABkAPu1qrVCppaQiqAqpMB2JZQDMHYyAcCvFxW7dwwMWSjmLSmNgPeG1HQvdx+sAAP7DhiUnentxtRP648ZNqMZGKs+5+12GrcELHqFXGkg31yxZfobKY5A68gAcPt/nfEYCpyR27KUCDyqnLWOQxEz1RrIj28JzLNOvwcyZW7WeR4DeW1KwB5nvdNyw1lq2OiNtYXdvyD6HjsXMhsWmGzccut7G5KGRhx1k3459jBMAMMJcAAAA","w":360,"h":450,"q":"яйцо пашот мой самый любимый способ яйцо пашот мой самый любимый способ для того чтобы приготовить яйцо пашот не нужен уксус воронка и мешочки из пленки что действительно нужно свежие яйца максимально свежие которые вы только можете достать чем свежее яйцо тем крепче его белок и меньше махрушек вокруг готового пашот сито лайфхак придуманный великим хестоном блюменталем позволяет отделить желток и крепкую часть белка","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0747_00_747_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAADQBQCdASoUABkAPu1qrVCppaQiqAqpMB2JZQDMHYyAcCvFxW7dwwMWSjmLSmNgPeG1HQvdx+sAAP7DhiUnentxtRP648ZNqMZGKs+5+12GrcELHqFXGkg31yxZfobKY5A68gAcPt/nfEYCpyR27KUCDyqnLWOQxEz1RrIj28JzLNOvwcyZW7WeR4DeW1KwB5nvdNyw1lq2OiNtYXdvyD6HjsXMhsWmGzccut7G5KGRhx1k3459jBMAMMJcAAAA) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"introp\"><p>Для того, чтобы приготовить яйцо пашот, не нужен уксус, воронка и мешочки из пленки. Что действительно нужно?</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Свежие яйца. Максимально свежие, которые вы только можете достать. Чем свежее яйцо, тем крепче его белок и меньше “махрушек” вокруг готового пашот.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Сито. Лайфхак, придуманный великим Хестоном Блюменталем, позволяет отделить желток и крепкую часть белка от той самой жидкости, что в любом случае будет даже в самом свежем яйце, и образует некрасивые “махрушки”. Если опускать яйцо в горячую воду прямо в сите, то нестабильный белок останется на нём, и у вас получится красивое и аккуратное пашот как в лучших ресторанах.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Стабильная среда. Чем больше яйцо дрожит и вибрирует, тем больше вероятность, что оно растечется. Яйца коагулируют при температуре 70 градусов, поэтому нет смысла держать воду кипящей. Можете убавить огонь до минимума или вообще убрать. Однако! Перед каждым новым яйцом воду обязательно нужно доводить до кипения повторно, и только потом убавлять/выключать.</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Трехлитровую кастрюлю наполнить почти до краев, добавить щедрую щепотку крупной морской соли и поставить на сильный огонь, чтобы вода закипела.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Подготовить емкость (контейнер или глубокую тарелку) с холодной питьевой водой для хранения готовых яиц пашот, если вы планируете готовить несколько. Установить сито, диаметр которого меньше диаметра кастрюли, на тарелку или миску. Разбить в сито яйцо и дождаться, пока стечет отделившаяся часть белка.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Когда вода в кастрюле закипит, убавить огонь до минимума, чтобы вода совсем не колыхалась (я убавляю с 9 на 3), дождаться, пока уйдут пузыри, опустить немного повернутое сито (смотрите видео!) с яйцом в горячую воду, выждать несколько секунд, чтобы белок схватился, и после этого аккуратно повернуть сито, дав яйцу соскользнуть в кастрюлю.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Засечь одну минуту, после этого ложкой аккуратно перевернуть яйцо другой стороной. Если этого не сделать (можно не делать), готовое яйцо пашот будет выглядеть как плоский прорезиненный блинчик с возвышающимся куполом желтка - не очень красиво и хуже по вкусу. Варить еще три минуты (итого 4 минуты с момента погружения сита в воду).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Аккуратно переложить яйцо в холодную воду. Перед подачей можно будет поместить его на полминуты в горячую воду, чтобы желток снова стал теплым.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0747_01_748_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0747_02_749_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0747_03_750_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0747_04_751_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0747_05_752_photo.webp\" alt=\"\"></figure></div>"},"759":{"id":759,"title":"Французский омлет","sub":"с бурратой и маринованными томатами","cat":"Завтраки","img":"thumb/0759_00_759_photo.webp","lq":"data:image/webp;base64,UklGRvQAAABXRUJQVlA4IOgAAADwBQCdASoUABkAPu1urlIppiQiqAgBMB2JZACdM48OAbXAe7LNn4v92vAbAAi4+znrxJNwhGdZgADMiv9QPE956VMqybf2Mq9bjrSg2OuL2sgXKgBH76oz+jdqoWteb7xSmQ7n9hg3v1knDNxoXAixE1eM3tiV8COkV/D4rHkau9XqbVNPytWKfC3Ni8Qvc+rIxOZhisxlNL0CfE866uoUVVNmVP5nMIOm9gZqfgMp1veomcC6dC+7LvFsPl/STL98CeJ8NOMvplr11F/L1C/LDCHY9+7gZ6ooz2snlKng6GmVXM6WkIAA","w":360,"h":450,"q":"французский омлет с бурратой и маринованными томатами на 2 порции крупные яйца 4 шт сливки 10 20 1 ст л петрушка свеж или заморож 1 ч л тимьян или тархун свеж 1 2 ч л соль щепотка сливочное масло 15 г буррата 1 шт помидоры черри разноцветные 200 г оливковое масло 3 ст л соевый соус 1 ст л уксус на выбор белый винный красный винный или бальзамический я выбираю белый 1 ст л лук шалот 1 шт базилик свеж или заморож 1 ст л авокадо 1 шт опционально свежий базилик для сервировки оливковое масло для сервировки черный перец для сервировки французский омлет с бурратой и маринованными томатами давайте я сразу признаюсь это кликбейт приготовить классический французский омлет задача ох какая непростая нужна правильная сковорода нужна правильная плита движения должны быть точны и уверенны словом на мой взгляд такой рецепт точно не подошел бы для какого нибудь вашего прекрасного и расслабленного субботнего утра всё же с утра х","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0759_00_759_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvQAAABXRUJQVlA4IOgAAADwBQCdASoUABkAPu1urlIppiQiqAgBMB2JZACdM48OAbXAe7LNn4v92vAbAAi4+znrxJNwhGdZgADMiv9QPE956VMqybf2Mq9bjrSg2OuL2sgXKgBH76oz+jdqoWteb7xSmQ7n9hg3v1knDNxoXAixE1eM3tiV8COkV/D4rHkau9XqbVNPytWKfC3Ni8Qvc+rIxOZhisxlNL0CfE866uoUVVNmVP5nMIOm9gZqfgMp1veomcC6dC+7LvFsPl/STL98CeJ8NOMvplr11F/L1C/LDCHY9+7gZ6ooz2snlKng6GmVXM6WkIAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">крупные яйца - 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 10-20% - 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка свеж. или заморож. - 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян или тархун свеж. - 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль - щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло - 15 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">буррата - 1 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">помидоры черри разноцветные - 200 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">оливковое масло - 3 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">соевый соус - 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">уксус (на выбор: белый винный, красный винный или бальзамический, я выбираю белый) - 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">лук-шалот - 1 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">базилик свеж. или заморож. - 1 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">авокадо - 1 шт (опционально)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">свежий базилик для сервировки</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">оливковое масло для сервировки</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">черный перец для сервировки</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Давайте я сразу признаюсь. Это кликбейт! Приготовить классический французский омлет - задача ох какая непростая. Нужна правильная сковорода, нужна правильная плита, движения должны быть точны и уверенны, словом, на мой взгляд, такой рецепт точно не подошел бы для какого-нибудь вашего прекрасного и расслабленного субботнего утра. Всё же с утра хочется просто вкусно поесть, а не отрабатывать технику, переводя яйцо за яйцом. Плюс французский омлет обычно готовится порционно, и если вы планируете накормить семью из нескольких человек, к моменту когда будет готов последний омлет, первый уже безнадежно остынет. Здесь мы берём от французского омлета всё самое лучшее - свежие яйца, смешанные в единое целое, сливочное масло и ароматные травы, а техникой воспользуемся вот этой, чтобы всё точно получилось с первого раза.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Начнем с томатов черри и маринада. Вообще буррата с маринованными томатами - один из моих любимейших салатов, в комментариях к этому посту поделюсь фотографией, как можно его подавать отдельно от омлета. Тут важно понимать, что чем вкуснее будут помидорки, которые вы купите, тем лучше будет результат. Я к тому же покупаю разноцветные (красные, желтые и кумато) - это очень красиво. Постарайтесь не исключать шалот, это вкусно и совсем не луково. Томаты можно сделать с вечера, за ночь в холодильнике они примут идеальное состояние, пропитавшись различными вкусами и ароматами, но можно и с утра - дел на несколько минут. Если всё делаете с утра, то лучше сначала приготовить яичную смесь, а затем приступить к помидорам.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Черри обмыть и нарезать на половинки, лук-шалот очистить и нарезать мелким кубиком, все сложить в миску. Добавить оливковое масло, соевый соус, уксус, базилик, черный свежемолотый перец и всё очень хорошо перемешать. Отставить в сторону или убрать в холодильник, если вы готовите заранее. Очень желательно время от времени помидорки помешивать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">С тимьяна оборвать листочки, петрушку мелко нарубить. Яйца разбить в миску, добавить сливки, щедро посолить и пробить погружным блендером. Отставить на 15 минут. В конце добавить травы. Авокадо очистить, разрезать на половинки, затем на тонкие ломтики и выложить на тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Установить антипригарную сковороду на средне-сильный огонь (у меня 7 из 9), растопить сливочное масло и дождаться, пока оно перестанет пениться. Вылить яйца, выждать около минуты и начать аккуратно двигать кусочки яичницы силиконовой спатулой. Когда вытекающей яичной массы больше не останется (центр должен выглядеть непрожаренным, так и должно быть), завернуть края омлета с помощью спатулы с одной стороны в двух местах (видно на фотографии), и затем свернуть омлет на две части. Сразу же выключить огонь, подождать полминуты, спатулой разделить на две части и можно перекладывать на тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Сборка:<br>Визуально поделить пространство на тарелке на квадрат с четырьмя частями. Авокадо выложить на нижнюю левую часть, омлет - на верхнюю правую, разрезанную пополам буррату - на верхнюю левую. Оставшуюся нижнюю правую часть заполнить маринованными томатами. Украсить листьями свежего базилика, сбрызнуть всё, но особенно буррату, оливковым маслом (можно набрать на чайную ложку или воспользоваться диспенсером для кетчупа), присыпать свежемолотым чёрным перцем и скорее подавать!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0759_01_760_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0759_02_761_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0759_03_762_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0759_04_763_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0759_05_764_photo.webp\" alt=\"\"></figure></div>"},"765":{"id":765,"title":"Лимонный курд","sub":"как соус к завтракам","cat":"Завтраки","img":"thumb/0765_00_765_photo.webp","lq":"data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JbACdMt8vWTQQH1IsuI1DR6BJrCtzwaOXwdAA/FT/2zHrX/dQft44dmDceA78itLw/c685jHnsYNG1ipDriomEKsc5822ztYGx8YXeH5CiL6HtDcZbI4LdkQtT4zAlyqpUSoSaaqJf+EC0tcArdorNU3yzC2t6lGUDW//8j1xr9UxUKyA9G0ptUdGI0Ed0JEQQaAHA+ussUUjJ3Q7/QxifO8K38VkqVPKMvH21Y6w+95/UEfOztGWbqjboCe+16OTMkNj6Onm6pkgxP8Jzf1TMKBM/7RjQf/G+Mjp3QAAAA==","w":360,"h":450,"q":"лимонный курд как соус к завтракам на одну небольшую баночку лимонный сок 120 г 3 лимона лимонная цедра 1 лимона желтки 72 г 5 некрупных яиц сахар 90 г сливочное масло 75 г лимонный курд как соус к завтракам","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0765_00_765_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JbACdMt8vWTQQH1IsuI1DR6BJrCtzwaOXwdAA/FT/2zHrX/dQft44dmDceA78itLw/c685jHnsYNG1ipDriomEKsc5822ztYGx8YXeH5CiL6HtDcZbI4LdkQtT4zAlyqpUSoSaaqJf+EC0tcArdorNU3yzC2t6lGUDW//8j1xr9UxUKyA9G0ptUdGI0Ed0JEQQaAHA+ussUUjJ3Q7/QxifO8K38VkqVPKMvH21Y6w+95/UEfOztGWbqjboCe+16OTMkNj6Onm6pkgxP8Jzf1TMKBM/7RjQf/G+Mjp3QAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на одну небольшую баночку:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 120 г (~3 лимона)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонная цедра 1 лимона</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желтки 72 г (~5 некрупных яиц)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 75 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сливочное масло нарезать небольшими кубиками. Снять цедру с лимона и пальцами тщательно перемешать её с сахаром. Оставить на пять минут, затем объединить с желтками с помощью венчика.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В небольшом сотейнике смешать сок лимона с лимонным сахаром и желтками и непрерывно помешивая венчиком или силиконовой спатулой довести до кипения. Как только смесь закипит и загустеет, сразу же выключить и снять с огня. Процедить через сито в высокий стакан для блендера.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить кусочки мягкого сливочного масла и пробить погружным блендером.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Перелить в красивую баночку, плотно закрыть крышкой и убрать в холодильник. Готовый курд может храниться там до недели.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0765_01_766_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0765_02_767_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0765_03_768_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0765_04_769_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0765_05_770_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"846":{"id":846,"title":"Панкейки с кокосовой сгущенкой и сметанным кремом","sub":"","cat":"Завтраки","img":"thumb/0846_00_846_photo.webp","lq":"data:image/webp;base64,UklGRroAAABXRUJQVlA4IK4AAABwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZACxHzFvgAF5bCHFXiu3XovLYVc656FCbbdAAP7Tiu1+C/N6QIeVYOFzd4NvvgVNdF27RdGx0RsmiejNT7/qVg/Izp/fpwEvR5+O5wrAsCarkcg+ooic/LaDH79Dnx0qqqCzrdeBhaShDnz321QUrWJ8SkgHj9jOhAzkbh9rvHsBTbC/ivBgtO98H9VX/u27/4LGAAA=","w":360,"h":450,"q":"панкейки с кокосовой сгущенкой и сметанным кремом  на 4 5 порций 15 16 панкейков для панкейков рикотта домашняя 160 180 г с одного литра молока сыворотка 180 г мука пшеничная 200 г мука миндальная 60 г мука кукурузная 25 г лимон 1 шт яйца 3 шт сахар 50 г разрыхлитель 1 ч л сода 1 4 ч л масло слив 50 г соль 1 2 ч л для кокосовой сгущенки банка кокосового молока 400 г кокосовый сахар 120 г флер де сель 1 2 ч л урбеч из кешью 80 г для сметанного крема маскарпоне 100 г сливки 30 100 г сметана 100 г сах пудра 30 г панкейки с кокосовой сгущенкой и сметанным кремом","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0846_00_846_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRroAAABXRUJQVlA4IK4AAABwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JZACxHzFvgAF5bCHFXiu3XovLYVc656FCbbdAAP7Tiu1+C/N6QIeVYOFzd4NvvgVNdF27RdGx0RsmiejNT7/qVg/Izp/fpwEvR5+O5wrAsCarkcg+ooic/LaDH79Dnx0qqqCzrdeBhaShDnz321QUrWJ8SkgHj9jOhAzkbh9rvHsBTbC/ivBgtO98H9VX/u27/4LGAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">На 4-5 порций (~15-16 панкейков):</p><div class=\"iblock\"><p class=\"lbl\">для панкейков:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">рикотта домашняя 160-180 г (с одного литра молока)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыворотка 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука пшеничная 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука миндальная 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука кукурузная 25 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">разрыхлитель 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло слив. 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1/2 ч л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для кокосовой сгущенки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">банка кокосового молока 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кокосовый сахар 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">флер де сель 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">урбеч из кешью 80 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для сметанного крема:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сах.пудра 30 г</span></li></ul></div></div></aside><div class=\"main\"><p>+ бананы для подачи</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Готовим кокосовую сгущенку.<br>В сотейник с толстым дном вылить кокосовое молоко, засыпать сахар, хорошо перемешать и установить на средний огонь. Помешивая и по необходимости убавляя немного огонь, варим в течение 30-45 минут, в зависимости от желаемого результата (чем дольше варить, тем гуще будет соус). В конце добавить хлопья соли, урбеч, тщательно пробить блендером, перелить в красивую баночку и убрать в холодильник. Урбеч здесь опционален, однако он положительно сказывается на вкусе и текстуре сгущенки.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Переходим к панкейкам.<br>Сливочное масло растопить. В миске номер один объединить сухие ингредиенты - все виды муки (вы можете использовать только пшеничную в объеме 290 г, но я рекомендую следовать рецепту для впечатляющего результата), разрыхлитель и соду.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В миску номер два добавить сахар (можно убавлять на ваш вкус), цедру одного лимона и хорошо перетереть пальцами. Туда же добавить рикотту и сыворотку, оставшуюся от приготовления рикотты (вы можете заменить эти два ингредиента кефиром или ряженкой (вместо рикотты) и молоком (вместо сыворотки), но я рекомендую следовать рецепту для впечатляющего результата).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В миске номер три взбить до пышной-пышной пены яйца (приблизительно в течение 3-4 минут, не меньше, масса должна ощутимо посветлеть).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Объединяем: с помощью миксера смешать ингредиенты в миске номер два, добавить яичную пену из миски номер три, вылить растопленное масло, смешать, в конце - сухие ингредиенты из миски номер один, аккуратно перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Антипригарную сковороду установить на средне-сильный огонь, налить немного растительного масла и растереть его по сковороде с помощью салфетки или бумажного полотенца. Жарить панкейки (мой любимый размер ~8 см в сыром виде, они расплываются до ~10 см) около 2-3 минут с одной стороны и около 1 - с другой. Обратите внимание, что сковорода будет накаляться, соответственно нагрев нужно будет уменьшать со временем. Для удобства тесто можно переложить в кондитерский мешок и выкладывать тесто “улиткой” (см.видео).</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Для сметанного крема взбить до загустения маскарпоне с сахарной пудрой и холодными сливками, затем добавить сметану и еще раз взбить.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Подать панкейки со сметанным кремом, сгущенкой и поджаренным на сливочном масле бананом. Или просто с кусочком сливочного масла и кленовым сиропом.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_01_847_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_02_848_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0846_03_849_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_04_850_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_05_851_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_06_852_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0846_07_853_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0846_08_854_photo.webp\" alt=\"\"></figure></div>"},"753":{"id":753,"title":"Слабосолёный лосось","sub":"","cat":"Завтраки","img":"thumb/0753_00_753_photo.webp","lq":"data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAABwBgCdASoUABkAPu1qqlEppaOiqAqpMB2JbACdL5AVCiyrFVWi8XEqys5g3VkCRNBHdb+JWnRVVIl4zqAA/KGpSzAlOmYdlAWQ1eRiXYZeg+QaovGq8YO4JykcVw1QMwAYu+M7yx/844NhbBDaTL8LaTYcVF7s/TvdTchdZiX2EnNCxpePifaI5ycIg+pY8q52zN4be1Vw4A/aaXF6eRuJm8Bh+/2HNhCP9mxQbJdc49Ds7T0UTyLb2H+UCJDPVhOYe0bakE271dttddl7dsKVFj0m1l2ixdkhWhhGjE+0QrHVoFK13RSHXnZH8s0e1MQJdgBuFaJMAAAA","w":360,"h":450,"q":"слабосолёный лосось   лосось 300 г соль хлопьями 18 г сахар 6 г цедра 1 2 грейпфрута белый перец щепотка слабосолёный лосось моя самая любимая вариация лосося к завтраку с грейпфрутовой цедрой когда то увидела у лизы булах и восхитилась красоте идеи не люблю гравлакс со свекольно укропной шубой люблю простоту и отчетливый вкус жирной красной рыбы конечно лучше всего солить крупное филе от 1 кг но редко когда такой кусман удаётся съесть за три дня а дольше хранить такого лосося я всё же не с","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0753_00_753_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAABwBgCdASoUABkAPu1qqlEppaOiqAqpMB2JbACdL5AVCiyrFVWi8XEqys5g3VkCRNBHdb+JWnRVVIl4zqAA/KGpSzAlOmYdlAWQ1eRiXYZeg+QaovGq8YO4JykcVw1QMwAYu+M7yx/844NhbBDaTL8LaTYcVF7s/TvdTchdZiX2EnNCxpePifaI5ycIg+pY8q52zN4be1Vw4A/aaXF6eRuJm8Bh+/2HNhCP9mxQbJdc49Ds7T0UTyLb2H+UCJDPVhOYe0bakE271dttddl7dsKVFj0m1l2ixdkhWhhGjE+0QrHVoFK13RSHXnZH8s0e1MQJdgBuFaJMAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль хлопьями 18 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 6 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цедра 1/2 грейпфрута</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец щепотка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Моя самая любимая вариация лосося к завтраку - с грейпфрутовой цедрой, когда-то увидела у Лизы Булах и восхитилась красоте идеи. Не люблю гравлакс со свекольно-укропной шубой, люблю простоту и отчетливый вкус жирной красной рыбы. Конечно, лучше всего солить крупное филе, от 1 кг, но редко когда такой кусман удаётся съесть за три дня (а дольше хранить такого лосося я всё же не советую), поэтому вот компромисс. Чтобы не пересолить - возьмите соль хлопьями.</p></div><div class=\"outrop\"><p>Лосось освободить от упаковки и не промывая (промыть = обеспечить будущей заготовке отчетливый запах рыбы, не совсем приятный) обсушить бумажным полотенцем. Снять цедру половины небольшого грейпфрута, смешать с солью, сахаром и перцем. На дно небольшого контейнера выложить половину получившейся массы, положить лосося, сверху распределить вторую половину массы и немного вмассировать ее в филе. Плотно накрыть крышкой и отправить в холодильник на 12 часов. По прошествии этого времени вытащить филе, очень хорошо промыть питьевой водой, обсушить бумажным полотенцем и хранить в холодильнике не дольше трёх дней.</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0753_01_754_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0753_02_755_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0753_03_756_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0753_04_757_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0753_05_758_photo.webp\" alt=\"\"></figure></div>"},"523":{"id":523,"title":"Крок мадам","sub":"croque-madame","cat":"Завтраки","img":"thumb/0523_00_523_photo.webp","lq":"data:image/webp;base64,UklGRtgAAABXRUJQVlA4IMwAAACQBQCdASoUABkAPu1srlKppaQiqAgBMB2JZgCdMoPNJfNgVZ0JSqTfiYFbrriSLtvdHKOGAADqjyQV7oQnrtOZr0N+PIaWAgc43yygoVeR9/qMt/H222DjQ5N7wUggXAWpG57qTcEV4dKov74QIYtgPIPmGatD5mX52QLpw+T/FJnbIZkB0mKTzoaFrMUdLay/nlkVbM1321hZUZGZtcdfkNvvGbvecVp5Ky7GnSGlDylJvZCk46A7DxactIxP1IVrCr3035wB7S4AAAA=","w":360,"h":450,"q":"крок мадам croque-madame на 2 сендвича для соуса морне сливочное масло 35 г мука 18 г 1 ст л молоко 220 г грюйер 100 сливки 30 30 г 2 ст л желток 1 шт мускатный орех щепотка для сендвичей тостовый хлеб 4 ломтика ветчина хорошего качества 6 ломтиков грюйер 50 г горчица дижонская 3 чл яйцо 2 шт сливочное масло крок мадам croque madame если вам хоть раз доводилось начинать утро в париже по настоящему неторопливо в кафе с его этим фирменным звоном чашек и запахом поджаренного хлеба вполне возможно вы встречались там с героиней сегодняшнего рецепта слово croquer в переводе с французского означает хрустеть откусывать и в этом глаголе пожалуй уже заключена вся суть блюда хрустящий хлеб горя ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0523_00_523_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtgAAABXRUJQVlA4IMwAAACQBQCdASoUABkAPu1srlKppaQiqAgBMB2JZgCdMoPNJfNgVZ0JSqTfiYFbrriSLtvdHKOGAADqjyQV7oQnrtOZr0N+PIaWAgc43yygoVeR9/qMt/H222DjQ5N7wUggXAWpG57qTcEV4dKov74QIYtgPIPmGatD5mX52QLpw+T/FJnbIZkB0mKTzoaFrMUdLay/nlkVbM1321hZUZGZtcdfkNvvGbvecVp5Ky7GnSGlDylJvZCk46A7DxactIxP1IVrCr3035wB7S4AAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 2 сендвича:</p><div class=\"iblock\"><p class=\"lbl\">для соуса морне:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 35 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 18 г (1 ст л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 220 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">грюйер 100</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 30 г (2 ст л)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для сендвичей:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">тостовый хлеб 4 ломтика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ветчина хорошего качества 6 ломтиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">грюйер 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 3 чл</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Если вам хоть раз доводилось начинать утро в Париже — по-настоящему, неторопливо, в кафе, с его этим фирменным звоном чашек и запахом поджаренного хлеба, — вполне возможно, вы встречались там с героиней сегодняшнего рецепта.</p>\n<p>Слово croquer в переводе с французского означает “хрустеть, откусывать”, и в этом глаголе, пожалуй, уже заключена вся суть блюда. Хрустящий хлеб, горячий соус, тянущийся сыр — крок мадам буквально создан для того, чтобы в него с удовольствием вгрызались. Но сначала — про родственные связи.</p>\n<p>Крок мадам и крок месье — это не два разных блюда, а одна конструкция с небольшим, но принципиальным отличием. Исторически первым появился крок месье — горячий сэндвич из хлеба, ветчины, сыра и белого соуса (бешамеля). Чуть позже к нему добавили яйцо-глазунью, и блюдо получило женскую версию — крок мадам. Разница между ними минимальна по составу, но существенна по характеру: ведь яйцо здесь многое меняет. Оно делает блюдо более сытным, более “завтраковым”, добавляет эстетики и текстуры. Если крок месье — это история про быстрый перекус, то крок мадам уже про полноценное начало дня.</p>\n<p>Оба этих сэндвича (есесссно!) родились не как изысканное ресторанное изобретение, а как очень практичный способ использовать хлеб, который начал черстветь. Это вполне логично для французской кухни, которая блестяще умеет работать с остатками, не маскируя их, а превращая в новые формы гастрономии: вчерашний багет становится гренками, панировкой или основой для лукового супа, холодное жаркое — начинкой для пирогов и терринов, кости — насыщенным бульоном, а подсохший хлеб — фундаментом для запеканок и сэндвичей.</p>\n<p>Часть этой же философии — крок мадам — готовится до смешного просто (после пары раз руки запомнят последовательность действий и вы сможете забыть про написанный рецепт). Подсушить хлеб (или взять вчерашний), приготовить соус, собрать сэндвич, запечь до румяной корочки, в конце добавить глазунью. Здесь нет сложных техник, просто обращайте внимание на детали, температурный режим и текстуру. А теперь — allez! — к завтраку как в парижском бистро.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: соуса морне хватит на 4 сендвича, но меньший объем, увы, не сработает; соус можно хранить под пленкой “в контакт” до 48 часов</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 160 градусов (режим: конвекция). С ломтиков тостового хлеба срезать корочки ( их можно подсушить отдельно, а затем смолоть — получатся отличные домашние панировочные сухари для фрикаделек). Выложить хлеб на решётку или противень и подсушить в духовке около 8-10 минут, он должен стать сухим, не зажариться.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пока хлеб в духовке, подготовить соус морне. Весь грюйер (100+50 г) натереть на крупной тёрке, но разложить по отдельным емкостям. Молоко заранее подогреть — в сотейнике или в микроволновке, оно должно быть горячим.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В сотейнике растопить сливочное масло на среднем огне, всыпать муку и, постоянно помешивая венчиком, приготовить ру: прогреть смесь до появления лёгкого орехового аромата, не допуская изменения цвета. Начать вливать горячее молоко небольшими порциями, каждый раз тщательно размешивая венчиком, чтобы соус успевал схватываться и становиться гладким. В результате должен получиться однородный соус бешамель, без комочков.</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0883_00_883_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAADwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JYgCdIQYJ/i2LDhqdcOLOarMd3UJqi8Y70/r61ZOngADeXv9+y7kFck62QX3puiw62owWpu9QVAfQ6A1VBBnU8fZ1S7CbxPQ3Bdapwch76N5LGywWZ7/lw4sqNKZEaor+QvNgG/kTN8upl/2V9vtRNnVhbVx7oXjRcqtXEK9lwySuvPjdauZlKkt0YpDOt4A4JOT5fV4JE0Eikw0QeWi8ReFhphxFVsooZ9xVPU3Gn8UjG4AAAA==) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Убавить огонь под сотейником с бешамелем до минимума, всыпать тёртый грюйер (100 г) и, помешивая венчиком, дать сыру полностью расплавиться. Добавить щепотку мускатного ореха, снять соус с огня, вмешать сливки и затем желток. Быстро и тщательно перемешать до шелковистой текстуры. При необходимости посолить, но не забывайте, что в сендвиче будет соленая ветчина.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Достать хлеб из духовки, температуру в духовке увеличить до 210 градусов и начать сборку сэндвичей, удобно это делать сразу на противне, застеленном пергаментной бумагой. Подсушенные ломтики хлеба смазать тонким слоем соуса морне. На два нижних ломтика выложить ветчину — по 3 ломтика на каждый сэндвич, промазывая между слоями ветчины небольшим количеством дижонской горчицы. Поверх ветчины выложить ещё немного соуса морне и присыпать частью тёртого грюйера (одной третью от всего объема). Вторые ломтики хлеба с внутренней стороны также немного смазать соусом и накрыть ими сэндвичи, слегка прижав.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Сверху щедро покрыть каждый сэндвич соусом морне (3-4 столовые ложки на сендвич) и посыпать оставшимся грюйером. Отправить в духовку примерно на 15 минут, но важно ориентироваться на румяную, хорошо запечённую сырную корочку. При необходимости в конце можно включить режим гриль.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Пока сэндвичи запекаются, на сливочном масле пожарить яичницу-глазунью. Для вау-эффекта как в ресторане делаем так: делим белок и желток, разогретую сковороду и кондитерское кольцо по диаметру сендвича смазываем сливочным маслом, ставим кольцо на сковородку, выливаем белок, ждём примерно 20-30 секунд, в центр выливаем желток (если он скатывается вбок, аккуратно пальцем возвращает его в центр и немного держим, пока не зафиксируется).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подавать сразу: выложить яйцо на каждый горячий крок мадам, поперчить, добавить немного соли хлопьями и — не тянуть, хлеб должен хрустеть, сыр тянуться, а горячий желток соусом растекаться по сендвичу 🫠</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_01_884_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_02_885_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_03_886_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_04_887_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_05_888_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0883_06_889_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"451\" src=\"thumb/0883_07_890_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0883_08_891_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"496":{"id":496,"title":"Капрезе с черешней","sub":"летняя версия итальянской классики","cat":"Салаты","img":"thumb/0496_00_496_photo.webp","lq":"data:image/webp;base64,UklGRgoBAABXRUJQVlA4IP4AAACwBQCdASoUABkAPu1urlIppiQiqAgBMB2JagCdMoAlqAy0bPuI/l5M40nJIcKxl7sLPr5I2QAA/CHHwUDQzlQiyTEyPn87nZH/r6T0KlQjwUEMs99mWDCNtvZou1y7qqdQXqB+JNEkJQMab3V1G4UWWZni9vp4m1bOPVZEqquCYJfS17xsM+21GmhptNPnWJgiiXBKau3IihLgnW6toJ+Vz848FcxlxlZXGfq9zXndmfgeMubQ6OEY33OMIoxGN/Eu7JzPXlqRCVjqfsMcjjGzDGptcZ2NYQI6MRd84BElV4C3N+OyVi57tZOaY96vkpDeM3WCqDRz+7LsmmsAAA==","w":360,"h":450,"q":"капрезе с черешней летняя версия итальянской классики на 4 порции томаты 700 г буррата 150 200 г черешня 300 г соевый соус 1 ст л бальзамический уксус 1 ст л лимон 1 2 шт сок опционально базилик 8 10 крупных листьев флер де сель оливковое масло extra virgin свежемолотый чёрный перец капрезе с черешней летняя версия итальянской классики","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0496_00_496_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgoBAABXRUJQVlA4IP4AAACwBQCdASoUABkAPu1urlIppiQiqAgBMB2JagCdMoAlqAy0bPuI/l5M40nJIcKxl7sLPr5I2QAA/CHHwUDQzlQiyTEyPn87nZH/r6T0KlQjwUEMs99mWDCNtvZou1y7qqdQXqB+JNEkJQMab3V1G4UWWZni9vp4m1bOPVZEqquCYJfS17xsM+21GmhptNPnWJgiiXBKau3IihLgnW6toJ+Vz848FcxlxlZXGfq9zXndmfgeMubQ6OEY33OMIoxGN/Eu7JzPXlqRCVjqfsMcjjGzDGptcZ2NYQI6MRd84BElV4C3N+OyVi57tZOaY96vkpDeM3WCqDRz+7LsmmsAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты 700 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">буррата 150–200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черешня 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст. л.</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 1 ст. л.</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок, опционально)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 8–10 крупных листьев</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">флер де сель</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло extra virgin</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый чёрный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: для летних минималистичных салатов совершенно необходимо брать самые качественные продукты, которые вам доступны — по-настоящему вкусные томаты, оливковое масло ультра класса и свежий качественный сыр (буррату можно заменить и моцареллой, и страчателлой).</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Черешню освободить от косточек и разрезать пополам. Соединить с соевым соусом, бальзамическим уксусом и несколькими оборотами мельницы чёрного перца. Если черешня очень сладкая, а бальзамический уксус мягкий и скорее десертный, добавить сок половины лимона. Аккуратно перемешать и оставить мариноваться на 10 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Томаты нарезать кружочками толщиной около 5–7 мм. Для этого салата особенно хороши крупные мясистые сорта с выраженной сладостью.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Сок, который образовался при мариновании черешни, перелить на дно большого овального блюда. Добавить немного хорошего оливкового масла и слегка перемешать прямо на тарелке — получится простейшая заправка, которая будет пропитывать томаты снизу.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Разложить ломтики томатов внахлёст. Посыпать флер де сель.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Буррату разорвать руками на крупные кусочки и распределить между томатами. Не стоит стремиться к аккуратности: этому салату идет небрежность.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В центр выложить маринованную черешню вместе с оставшимся соком. Листья базилика вымыть, обсушить, сложить стопкой, свернуть рулетом и нарезать тонкими полосками. Рассыпать поверх салата.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Перед подачей сбрызнуть оливковым маслом и при необходимости добавить ещё немного флер де сель.</div></div></div></div>"},"498":{"id":498,"title":"Салат с копченым лососем","sub":"авокадо и апельсиновой заправкой","cat":"Салаты","img":"thumb/0498_00_498_photo.webp","lq":"data:image/webp;base64,UklGRhQBAABXRUJQVlA4IAgBAACwBgCdASoUABkAPu1wsFKppiSiqAgBMB2JbACdMuIgvX/AK+foG8C3pTMs0oLEI8uWlSuAKaF99ZSCA8v2wAD7vaV60KG5rEYgjzBJehFQdr8zK4mNLO9+OGShxtlU3USrjHTaEkOIJEu8e9VUrUPAF4TKQM3JCdr3461Z2VfkN3v8VN8oSyK9a3OWYTC4OOzuFvrNbZzN2BiHpeD4C6cHz+wzwrwIMH/S3jkPl3KSWZVKjYm1c2Z+ZHyeHM0NSmJT4H6ml25voZaxRHm/ShWX99WPDZmdcdw1k9/HYly1QvsGHOKC1n+yrg8o25M3KerVjl2Da3RIM4bEgOHwBYPS8Kl1YzuSQAA=","w":360,"h":450,"q":"салат с копченым лососем авокадо и апельсиновой заправкой на 2 порции бэйби картофель 400 г копченый лосось 200 г авокадо 1 шт редис 5 6 шт салат ромэн 80 100 г укроп небольшой пучок для заправки оливковое масло 3 ст л апельсиновый сок 2 ст л уксус белый винный 1 ст л зернёная горчица 1 ч л с горкой кленовый сироп 1 ч л соль свежемолотый черный перец салат с копченым лососем авокадо и апельсиновой заправкой","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0498_00_498_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhQBAABXRUJQVlA4IAgBAACwBgCdASoUABkAPu1wsFKppiSiqAgBMB2JbACdMuIgvX/AK+foG8C3pTMs0oLEI8uWlSuAKaF99ZSCA8v2wAD7vaV60KG5rEYgjzBJehFQdr8zK4mNLO9+OGShxtlU3USrjHTaEkOIJEu8e9VUrUPAF4TKQM3JCdr3461Z2VfkN3v8VN8oSyK9a3OWYTC4OOzuFvrNbZzN2BiHpeD4C6cHz+wzwrwIMH/S3jkPl3KSWZVKjYm1c2Z+ZHyeHM0NSmJT4H6ml25voZaxRHm/ShWX99WPDZmdcdw1k9/HYly1QvsGHOKC1n+yrg8o25M3KerVjl2Da3RIM4bEgOHwBYPS8Kl1YzuSQAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">бэйби картофель 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копченый лосось 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">авокадо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">редис 5–6 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">салат ромэн 80–100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп небольшой пучок</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для заправки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">апельсиновый сок 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый винный 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зернёная горчица 1 ч л
