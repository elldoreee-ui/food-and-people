рокколи  на 6 порций лосось 350 г брокколи 100 г яйца 3 шт сливки 30 240 г сыр грюйер 60 г мускатный орех соль белый перец предварительно испеченная a 662 основа для киша либо отпечь в то время пока будет готовиться начинка киш с лососем и брокколи","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0578_00_578_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JagCdMtB3l2ABBKiu3v5SrTzfuWQ9Ps64qA4AAP4ZysGRLvwR+huII+oIlTUChfL/ysYWhe4vu2pc1n0nN/6PCsN2vAoA6FNGLZhh657KA+8BCejWf3OMB9EeAtB6UnpCaaqN1fTCIPu13F7aGf8H5TqqK4OB0C1WSvt+o2pfSXDaPhR7b7aZZI/J48Qk5WHRmmXTzlRoPVcVJfpBvlDzyRdqIEgN8dgNsA0RDIjAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">лосось 350 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">брокколи 100 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">яйца 3 шт</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сливки 30% 240 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сыр грюйер 60 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">мускатный орех</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">белый перец</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">предварительно испеченная <a class=\"xref\" href=\"#/r/662\">основа для киша</a> (либо отпечь в то время, пока будет готовиться начинка)</span></li></ul></div></div></aside><div class=\"main\"><p>а также</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 170 градусов (режим верх/низ). Сыр натереть на крупной терке.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лосось нарезать на кубики ~7мм, брокколи разделить на небольшие соцветия и отварить в кипящей воде в течение 5 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">На сковороде разогреть оливковое масло (1 ст л) и очень быстро обжарить лосося (3-4 минуты) на сильном огне, в конце немного посолить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для заливки яйца пробить блендером со сливками, перцем, солью и мускатным орехом.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">На основу выложить начинку, сначала лосось, затем брокколи, равномерно распределить по дну. Залить яично-сливочной массой, засыпать сверху тёртым сыром и отправить в духовку.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Выпекать 30-35 минут до золотистой корочки.</div></div></div></div>"},"605":{"id":605,"title":"Булочки для сэндвичей/бургеров","sub":"нежные как бриошь, но без сливочного масла","cat":"Пироги, тесто и хлеб","img":"thumb/0605_00_605_photo.webp","lq":"data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAACwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdM2iA/0eBlg6LYGNmaymMHMQ50vx/yDhEeMAAzgilRH9kAM07aimew4HtIXP+IdI6xqn3sTfCJllQlHpZQxThqv///vhSdJKoaS5r2VBPACkEMWHK35ZuLoHizFFrKWaeKvlLz/wlRiZaU9biDCv48XM2ufZDbg15b1DQW8yyWpb7syRYakxNZGoa4p6xq6wgqpCf8tCVCxPJZL1Q1rDG3TfaTdduezFdxlzvMWtgne/gEU4AHU6QFNGH4liOaKF9kC7NY1MJ5cqAAA==","w":360,"h":450,"q":"булочки для сэндвичей/бургеров нежные как бриошь, но без сливочного масла на 12 булочек вода 200 г молоко 150 г яйца 3 шт дрожжи сухие 13 г мука пшеничная сильная 670 г мука пшеничная цельнозерновая 60 г соль мелкая 20 г сахар 16 г оливковое масло 60 г яйцо 1 шт молоко 20 30 г кунжут булочки для сэндвичей бургеров нежные как бриошь но без сливочного масла","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0605_00_605_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvIAAABXRUJQVlA4IOYAAACwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdM2iA/0eBlg6LYGNmaymMHMQ50vx/yDhEeMAAzgilRH9kAM07aimew4HtIXP+IdI6xqn3sTfCJllQlHpZQxThqv///vhSdJKoaS5r2VBPACkEMWHK35ZuLoHizFFrKWaeKvlLz/wlRiZaU9biDCv48XM2ufZDbg15b1DQW8yyWpb7syRYakxNZGoa4p6xq6wgqpCf8tCVCxPJZL1Q1rDG3TfaTdduezFdxlzvMWtgne/gEU4AHU6QFNGH4liOaKF9kC7NY1MJ5cqAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 12 булочек:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дрожжи сухие 13 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука пшеничная сильная 670 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука пшеничная цельнозерновая 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль мелкая 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 16 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 60 г</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 20-30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжут</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Смешать в большой миске воду, молоко, 3 яйца и сухие дрожжи. Разболтать хлебным венчиком или вилкой — без фанатизма, просто до однородности. Добавить муку, соль и сахар и начать собирать тесто рукой. Оно будет очень “лохматым”, как будто что-то пошло не так, пусть вас это не смущает — на самом деле всё идёт правильно.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Продолжать вымешивать прямо в миске, пока вся мука не увлажнится и тесто не соберётся в единый, но довольно грубый и растекающийся шар. Выложить его на стол (или в дежу планетарного миксера с насадкой крюк) и начать месить. Первые минуты будет очень липко, неровно и не очень красиво. Через 7–8 минут произойдет маленькое чудо: клейковина начнет развиваться, тесто станет более гладким. Будет все ещё мягкое и слегка липкое, но уже более послушное.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Вернуть тесто в миску, добавить половину масла и начать вминать его в тесто. Будет  скользить, разваливаться, “расслаиваться”. Не паникуем, продолжаем работать руками, складывать, сжимать, вмешивать, пока масло не впитается (а оно впитается!).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Добавить вторую половину масла и повторить. Затем снова вымешать вручную или в планетарном миксере в течение 7–8 минут. В какой-то момент тесто резко соберется: станет гладким, эластичным и блестящим. Это и есть цель.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Сформировать шар, переложить в миску, накрыть влажным полотенцем и оставить при комнатной температуре на полтора часа. Тесто увеличится примерно вдвое.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Подошедшее тесто аккуратно выложить на слегка подпылённый стол и мягко обмять — без агрессии, просто выпустить лишний воздух. Разделить на 12 кусочков.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Каждый кусочек сначала слегка расплющить, а затем собрать в шар, подтягивая края к центру. Перевернуть швом вниз и прокатать по столу ладонью — движением “в чашечке”, чтобы натянуть поверхность. Именно такая техника даёт красивую форму и аккуратный купол при выпечке.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Выложить булочки на противень с пергаментной бумагой, оставить между ними расстояние (не больше восьми булочек на противне). Накрыть чистым полотенцем и дать подойти ещё 30–40 минут, они станут заметно мягче и воздушнее.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Разогреть духовку до 180 градусов(режим: конвекция). Смешать оставшееся яйцо с небольшим количеством молока и смазать булочки кисточкой щедро, но аккуратно, чтобы жидкость не потекла на противень и потом не горела. Посыпать кунжутом (этот шаг опциональный, но делает булочки совсем хорошенькими).</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Выпекать, в зависимости от нрава вашей духовки и размера булочек, от 12 до 18 минут, до насыщенного золотистого цвета.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Обязательно дать им остыть по меньшей мере 15-20 минут, затем можно разрезать и прослаивать. Неиспользованные булочки прекрасно морозятся!</div></div></div></div>"},"624":{"id":624,"title":"Фокачча","sub":"без закваски, но никто в это не поверит","cat":"Пироги, тесто и хлеб","img":"thumb/0624_00_624_photo.webp","lq":"data:image/webp;base64,UklGRioBAABXRUJQVlA4IB4BAADwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JaACdIKv+qJsD3RDOEtxDm3PzBtCpOvw5PABKZIqAAAD2vo+aZh7WavHHw/KtGtmvOzCEa+xX4/kvQlZ5vicDRpHHt5kUbRfqXFNJrFEYYz7pyJ/rmMZ/o8ce+sPDZErO1q8d0mMtU5AXBW4uBCjh5ZnDXrWzsda0q0f37xO3yq7qj4fgTRlstGLjcoKKkHtogkEg/rA/Etxsfjy6O1UJHS/phaORMYDMw1LAJlnPUkN4h515JHPeripSwVhkFdDlrT2x/cVmHoMRft91QYORoDv0kc/gerE3z38bubQOFwa6cBLW0o7z4d5/A4iVGQCqfBPiwDLq8KIZBhBTv/EcevRZZ4AA","w":360,"h":450,"q":"фокачча без закваски, но никто в это не поверит на одну фокаччу размером 32х22 см опара мука 90 г вода 90 г дрожжи сухие щепотка тесто мука 440 г вода 1 300 г дрожжи сухие 1 2 ч л соль 10 г вода 2 40 г оливковое масло начинка помидоры черри 200 г оливковое масло 2 ст л соевый соус 1 ст л розмарин 2 веточки соль maldon день i фокачча без закваски но никто в это не поверит я потратила на неё три дня и кажется писала текст рецепта невообразимо долго а теперь нужно ещё и вдохновляющее предисловие что ж не беритесь за эту фокаччу если вы не любите длинные и долгие рецепты не беритесь если не выносите ощущения прикосновения теста к рукам не беритесь если кухня для вас это место для решения бытовых задач а не о день iii комментарий 1 11 37 важные детали прежде чем вы начнёте существует огромное количество вариаций фокаччи и соответственно методов её приготовления я взяла наверно самый сложный с точки зрения количества этапов но клянусь своим","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0624_00_624_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRioBAABXRUJQVlA4IB4BAADwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JaACdIKv+qJsD3RDOEtxDm3PzBtCpOvw5PABKZIqAAAD2vo+aZh7WavHHw/KtGtmvOzCEa+xX4/kvQlZ5vicDRpHHt5kUbRfqXFNJrFEYYz7pyJ/rmMZ/o8ce+sPDZErO1q8d0mMtU5AXBW4uBCjh5ZnDXrWzsda0q0f37xO3yq7qj4fgTRlstGLjcoKKkHtogkEg/rA/Etxsfjy6O1UJHS/phaORMYDMw1LAJlnPUkN4h515JHPeripSwVhkFdDlrT2x/cVmHoMRft91QYORoDv0kc/gerE3z38bubQOFwa6cBLW0o7z4d5/A4iVGQCqfBPiwDLq8KIZBhBTv/EcevRZZ4AA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на одну фокаччу размером 32х22 см:</p><div class=\"iblock\"><p class=\"lbl\">опара:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дрожжи сухие щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">тесто:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 440 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода (1) 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дрожжи сухие 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода (2) 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">начинка:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 2 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль Maldon</span></li></ul></div><p class=\"lbl solo\">День I:</p></div></aside><div class=\"main\"><div class=\"introp\"><p>Я потратила на неё три дня и, кажется, писала текст рецепта невообразимо долго, а теперь нужно ещё и вдохновляющее предисловие. Что ж.</p>\n<p>Не беритесь за эту фокаччу, если вы не любите длинные и долгие рецепты. Не беритесь, если не выносите ощущения прикосновения теста к рукам. Не беритесь, если кухня для вас — это место для решения бытовых задач, а не отдыха. Не беритесь, если сама идея испечь что-то невероятное из всего лишь муки и воды не вызывает в вас ни одной эмоции. Не беритесь, если равнодушны к кислому аромату дрожжей, фруктовым нотам хорошего оливкового масла и мягкой сладости помидоров черри. Не беритесь, если не хотите, чтобы в вашем доме запахло настоящим итальянским хлебом.</p>\n<p>Во всех остальных случаях — добро пожаловать в хлебопечение для чайников ;)</p>\n<p>важные детали, прежде чем вы начнёте</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вечером смешать в миске 90 г воды, 90 г муки и щепотку дрожжей, перемешать, накрыть чистым полотенцем и оставить при комнатной температуре на ночь (12-14 часов).</div></div>\n<p class=\"lbl\">День II:</p>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Смешать в миске побольше 440 г муки, 1/2 ч л дрожжей, 300 г воды и опару, перемешать и оставить под чистым полотенцем на полчаса. Тесто будет выглядеть страшненько, не пугаемся. Этот этап называется аутолиз — мы “замачиваем” молекулы муки в воде, увлажняем их для лучшего развития глютена в следующем этапе.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Растворить 10 г соли (не йодированной, йод мешает ферментации) в 40 г едва теплой воды, перемешать до полного растворения соли и добавить в тесто, перемешать руками, чтобы всё объединилось в рыхлую, но уже держащую общую форму массу. Оставить отдохнуть на 30 минут, накрыв полотенцем.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Вылить сверху около столовой ложки оливкового масла на тесто и около одной ложки себе на руки и начать процесс замешивания. Есть много разных способов вымешивания фокаччи, мне понравилось два (оба способа есть на видео в комментариях):</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">🟡</i><span class=\"tx\">делать “щуп” с помощью кисти, оттягивая тесто из центра и, складывая, возвращать в центр</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">с помощью двух рук брать тесто посередине, вытягивать его наверх, и затем складывать книжкой</span></li></ul>\n<p>Сейчас мы развиваем глютен, для этого нужно время и движение. Оставить отдыхать на один час, накрыв полотенцем.</p>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Спустя это время повторить процесс — добавить оливковое масло по бортикам теста и на руки, снова несколько раз вымешать. Оооо, каким приятным становится тесто на этом этапе, просто тактильный кайф! Оставляем отдыхать ещё на час.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Сейчас можно сделать глютеновый тест, взяв кусок теста двумя руками и потянув “лоскут” на себя. Если тесто рвется, значит, вымешано недостаточно, нужно повторить процесс и оставить ещё на 30-60 минут. Здесь такое дело — развитие глютена зависит от многих факторов, таких как тип и сила муки, а также температура и влажность в помещении. Вам может понадобиться больше времени, прежде чем глютеновый тест можно будет считать удовлетворительным, это нормально.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Если кармашек оттягивается и не рвется, вы у цели — нужно смазать большую емкость (например, контейнер с крышкой) оливковым маслом, переложить тесто, закрыть и отправить в холодильник на час. Спустя это время обмять тесто, выпустив лишний воздух (вы наверняка видели эти рилсы с мощным ударом по тесту кулаком — это как раз про это, но кулаком бить не обязательно).</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Снова убрать в холодильник, теперь на 8-12 часов (плотно закрыв крышкой). Этот этап — холодная ферментация, от него во многом зависит финальный вкус фокаччи.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">следующий этап уехал в комментарии</div></div>\n<p>— — — комментарий 1, 11:37 — — —</p>\n<p class=\"lbl\">Важные детали, прежде чем вы начнёте:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🌟</i><span class=\"tx\">Существует огромное количество вариаций фокаччи и соответственно методов её приготовления. Я взяла, наверно, самый сложный с точки зрения количества этапов, но — клянусь своим чугунком! — я делаю это из любви, к себе и вам. Конечно, можно испечь фокаччу за несколько часов, но вполне вероятно, что вот такая торопыжка не впечатлит вас и не заставит получить истинное гастрономическое удовольствие. Мы в этом Клубе всё-таки про вкус, а вкус — это дело времени.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🌟</i><span class=\"tx\">Мука должна быть пшеничная, сильная, с высоким содержанием белка, которая выдерживает длительную ферментацию. Хорошо подходят Manitoba, мука 00, мука для пиццы и хлеба. Если берете манитобу, то смешивайте с мукой для пиццы 1:1, иначе фокачча может получиться слишком резиновой. Оливковое масло — только extra virgin, качественное и ароматное.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🌟</i><span class=\"tx\">С начинками можно и нужно экспериментировать, но именно черри и розмарин кажутся мне самой выигрышной комбинацией. На их месте также могут быть оливки, каперсы, песто, разнообразные травы, сливы, инжир и даже шоколад.</span></li></ul>\n<p>— — — комментарий 2, 11:40 — — —</p>\n<p class=\"lbl\">День III:</p>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">На противень нанести оливковое масло, затем застелить пергаментной бумагой и вновь увлажнить всю поверхность оливковым маслом. Добавить оливковое масло и на руки, переложить охлажденное тесто на бумагу и оставить на час, чтобы расслабить глютен. Не забудьте немножко смочить всю поверхность фокаччи маслом с помощью ладоней, чтобы она не пересохла.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">В это время делаем начинку. Разогреть духовку до 160 градусов (режим: верх/низ). Помидоры черри нарезать половинками, добавить 2 ст л оливкового масла и 1 ст л соевого соуса, перемешать, распределить по противню, застеленному пергаментной бумагой и убрать в духовку на 40 минут. В остатках “маринада” замочить листики розмарина. Вытащить запеченные помидорки, остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">12</span><div class=\"st\">Разогреть духовку до 230 градусов (режим: конвекция). Формируем фокаччу (да, снова руками, смоченными оливковым маслом). Подушечками или костяшками пальцев делайте углубления по всей поверхности фокаччи, давая проявиться пузырям. Оставьте на 20 минут, затем повторите процесс и добавьте начинку — вдавите половинки помидоров (именно вдавите), присыпьте листиками розмарина и крупными хлопьями соли.</div></div>\n<div class=\"step\"><span class=\"sn\">13</span><div class=\"st\">Запекать 10 минут при температуре 230 градусов, затем убавить до 210 и запекать еще 10-15 минут, до золотистой корочки. Готовую фокаччу выложить на решетку и остудить. Нарезать. Попытаться не <s>сожрать</s> умять её целиком сразу же.</div></div></div></div>"},"640":{"id":640,"title":"Тесто для галеты","sub":"любой, вообще любой","cat":"Пироги, тесто и хлеб","img":"thumb/0640_00_640_photo.webp","lq":"data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABwBQCdASoUABkAPu1iqE2ppaOiMBgMATAdiWMAnQAPRHIBtqN/u3W/vpi+c1H2o1pgHIPAAPnoOyYMThyY4JfflTjimB8VcIsEG0pnBr1cyGPtN6CebCsTINbJ3tw/dpHI0rTQhVLZK6hAlP5HW7iTYkD0rYyfwjBdapxsjE6qI1O62WquOOGm0TUqIBZoAAA=","w":360,"h":450,"q":"тесто для галеты любой, вообще любой на 2 большие галеты мука 300 г вода 50 г кефир 70 г масло сливочное 230 г сахар 30 соль 1 ч л тесто для галеты любой вообще любой на мой взгляд лучшее тесто для открытого пирога это смесь песочки и ленивой слойки в такой технологии несколько секретиков расплющиваем сливочное масло быстро вымешиваем тесто и несколько раз его слоим без секретного ингредиента тоже не обошлось легкая молочная кислотность кефира замедляет образование клейковины делает тесто податливым и пластичным ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0640_00_640_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABwBQCdASoUABkAPu1iqE2ppaOiMBgMATAdiWMAnQAPRHIBtqN/u3W/vpi+c1H2o1pgHIPAAPnoOyYMThyY4JfflTjimB8VcIsEG0pnBr1cyGPtN6CebCsTINbJ3tw/dpHI0rTQhVLZK6hAlP5HW7iTYkD0rYyfwjBdapxsjE6qI1O62WquOOGm0TUqIBZoAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 большие галеты:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кефир 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 230 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 30</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>На мой взгляд, лучшее тесто для открытого пирога — это смесь песочки и ленивой слойки. В такой технологии несколько секретиков: расплющиваем сливочное масло, быстро вымешиваем тесто и несколько раз его “слоим”. Без секретного ингредиента тоже не обошлось: легкая молочная кислотность кефира замедляет образование клейковины, делает тесто податливым и пластичным, а молочный белок и капелька жира добавляют нежности и мягкости в слои. В итоге получается чудо как хорошо: румяная хрустящая слоеная кромка и уютная песочная сердцевина — идеальный баланс для галеты. Никому не выдавайте наш секрет, ладно? 😉</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Воду объединить с кефиром, взболтать и убрать в морозилку. Сливочное масло нарезать кубиками и также убрать в морозилку на 10-15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Муку просеять в большую миску, добавить сахар и соль, перемешать. Выложить кубики холодного сливочного масла, обвалять их в муке, затем расплющить пальцами каждый кусочек масла. Добавить смесь воды и кефира, очень быстро вымешать тесто (можно добавлять в два захода, добавили половину — вымешали, вторую половину — вымешали). В нём должны оставаться непромешанные кусочки сливочного масла, это нам на руку!</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Отрезать два куска пергаментной бумаги по размеру вашего самого большого противня для духовки. Припылить рабочую поверхность мукой (и разместить пачку с мукой в доступности, чтобы иметь возможность добавить), выложить тесто и раскатать в пласт. Сложить пласт пополам как книжку, припылить, перевернуть, припылить и снова раскатать в пласт. Не жалейте муки, иначе тесто будет прилипать. Повторить тураж (tourage — это процесс многократного раскатывания и складывания теста с прослойкой жира, так получают слоеное тесто, у нас с вами сильно упрощенный вариант) ещё два раза, затем разрезать тесто на две части, свернуть каждую часть книжкой (см.фото), переложить на пергаментную бумагу и раскатать в круг будущей галеты. Внимательно с толщиной, она должна быть не больше 3 мм, иначе волшебство не случится. Убрать пласты в холодильник от 1 часа до 3 суток (если храните долго, то нужно тщательно упаковать, чтобы тесто не высохло). Морозить можно тоже, храним до месяца.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0640_01_641_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0640_02_642_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0640_03_643_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0640_04_644_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0640_05_645_photo.webp\" alt=\"\"></figure></div>"},"662":{"id":662,"title":"Песочное тесто (киш)","sub":"pâte brisée","cat":"Пироги, тесто и хлеб","img":"thumb/0662_00_662_photo.webp","lq":"data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAADwBACdASoUABkAPu1srVEppaQiqAqpMB2JZAC+SA3OVfbWJLix5C0iPjQe8GJxSwAAy0s8yfw7iHO/QGWFumPo1UzZGlP/Jzpnu39ZS3IDqQ0DsXClsSsmIQNTbD2u9e0Wu9AGdDMknzmLXJVwcVd3OB0vRgQGdE8PEVRdFjTLeiLcXqx///Juc5QhfS9sFW/ATF8rLbgn5XOE1HVOzItdoe9Ol9+mJhk4Iv7zz+oeerVeLCiGMdb/pUAAAA==","w":360,"h":450,"q":"песочное тесто (киш) pâte brisée  мука 896 г соль 19 г сахар 10 г масло 500 г вода 188 г пергаментная бумага скалка форма 26 см я использую для киша обычную разъемную форму для бисквита песочное тесто киш p te bris e начинаем с самого простого песочное тесто для киша по классике в составе лишь четыре ингредиента мука масло соль и вода я к этой четверке добавляю сахар для какой цели расскажу в прямом эфире в воскресенье это тесто не требует серьезных навыков оно не капризное податливое лояльно к небольшим ошибкам технологии идеально для старта чтобы понять проц","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0662_00_662_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAADwBACdASoUABkAPu1srVEppaQiqAqpMB2JZAC+SA3OVfbWJLix5C0iPjQe8GJxSwAAy0s8yfw7iHO/QGWFumPo1UzZGlP/Jzpnu39ZS3IDqQ0DsXClsSsmIQNTbD2u9e0Wu9AGdDMknzmLXJVwcVd3OB0vRgQGdE8PEVRdFjTLeiLcXqx///Juc5QhfS9sFW/ATF8rLbgn5XOE1HVOzItdoe9Ol9+mJhk4Iv7zz+oeerVeLCiGMdb/pUAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">мука 896 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">соль 19 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">сахар 10 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">масло 500 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">вода 188 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">пергаментная бумага</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">скалка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">форма 26 см (я использую для киша обычную разъемную форму для бисквита)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Начинаем с самого простого - песочное тесто для киша. По классике в составе лишь четыре ингредиента - мука, масло, соль и вода. Я к этой четверке добавляю сахар, для какой цели - расскажу в прямом эфире в воскресенье. Это тесто не требует серьезных навыков, оно не капризное, податливое, лояльно к небольшим ошибкам технологии - идеально для старта, чтобы понять процесс и попробовать его полюбить. А ещё обрезки этого теста идеально занимают тоддлеров по меньшей мере на 15 минут, не благодарите! 😄</p>\n<p>на 4 киша (форма диаметром 26 см)</p></div><p>а также</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В большую миску (или дежу миксера) просеять муку, добавить соль и сахар. Очень холодное сливочное масло нарезать кубиками со стороной ~1 см. Отмерить нужное количество холодной воды и убрать в морозилку. Чем холоднее ингредиенты, тем лучше результат.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Выложить кубики сливочного масла в муку и, не отвлекаясь на другие дела, начать интенсивно перетирать его между пальцев, пока все кубики не исчезнут. Работать нужно быстро, чтобы масло оставалось холодным. Если используете планетарный миксер, процесс тот же, только соответственно, работаете не вы, а насадка-весло (закидывайте сливочное масло небольшими партиями, но без серьезных перерывов).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Когда текстура крошки начнёт напоминать песок, быстро влить в центр ледяную воду и вымесить тесто - достаточно быстро оно соберётся в красивый гладкий комок, прекрасно пахнущий сливочным маслом.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Убедиться, что масло и мука хорошо объединились - для этого несколько раз  быстрым уверенным движением “размажьте” части теста по рабочей поверхности, надавливая на него тыльной стороной ладони. Эта техника называется fraisage [фрезаж]. Снова собрать тесто в комок, разделить на четыре части (одна часть ~400 г), завернуть в пергаментную бумагу и убрать в холодильник минимум на 1 час.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Если вы готовите всего один киш, три других куска теста стоит убрать в морозилку, там они могут храниться до трёх месяцев.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">По прошествии часа раскатать тесто в круглый пласт толщиной 4 мм, выложить в форму, часто наколоть вилкой, декорировать бортик и убрать в морозилку минимум на полчаса.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Духовку разогреть до 170 градусов (конвекция). Лист пергамента хорошо смять, затем “постелить” сверху на тесто. Засыпать груз (фасоль, нут), хорошо распределить груз по бокам основы (не надавливать, просто распределить!) и выпекать 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Затем убрать груз, еще раз тщательно пройтись вилкой по местам прокола теста и отправить в духовку еще на 15 минут. Основа должна зарумяниться, но в меру.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0662_01_663_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0662_02_664_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0662_03_665_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0662_04_666_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0662_05_667_photo.webp\" alt=\"\"></figure></div>"},"668":{"id":668,"title":"Песочное тесто (тарт)","sub":"pâte sucrée","cat":"Пироги, тесто и хлеб","img":"thumb/0668_00_668_photo.webp","lq":"data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAABwBQCdASoUABkAPu1mpU2ppaMiMBgMATAdiUATpmyM4FaACuoiI1iSpV0Zc5AL8mDj0HbAAPsvLHWtz0D7nzuj9eix5zm3hHXZ5MmzusABDXfKl6SW7OxSuhl4BqD7NqNKUrG6gLOeWeTIP0JY4wLV1MpZP6rgMdfzaXSRJP1pUot0tik74wGthxiYL9i3OP0MZ/VCVK+x9aCzCvf5wnMlx/l0ZLelATqEdP3KQyDZeCRibQW3UmP0PoTgAA==","w":360,"h":450,"q":"песочное тесто (тарт) pâte sucrée  мука 330 г масло 180 г минд мука 50 г сахарная пудра 133 г соль 4 г яйцо 66 г пергаментная бумага скалка форма для тарта 24 см песочное тесто тарт p te sucr e песочное тесто для тарта это уже посложнее есть два способа его приготовления тёплый и холодный мы возьмем холодный чтобы вам пригодился опыт приготовления теста для киша они похожи это тесто можно назвать капризным работать с ним непросто сливочное масло очень быстро тает при комнатной температуре поэтому есть две вещи которые я хочу вам сказать 1","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0668_00_668_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAABwBQCdASoUABkAPu1mpU2ppaMiMBgMATAdiUATpmyM4FaACuoiI1iSpV0Zc5AL8mDj0HbAAPsvLHWtz0D7nzuj9eix5zm3hHXZ5MmzusABDXfKl6SW7OxSuhl4BqD7NqNKUrG6gLOeWeTIP0JY4wLV1MpZP6rgMdfzaXSRJP1pUot0tik74wGthxiYL9i3OP0MZ/VCVK+x9aCzCvf5wnMlx/l0ZLelATqEdP3KQyDZeCRibQW3UmP0PoTgAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 330 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">минд.мука 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 133 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 4 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 66 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">пергаментная бумага</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">скалка</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">форма для тарта 24 см</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Песочное тесто для тарта - это уже посложнее. Есть два способа его приготовления - тёплый и холодный, мы возьмем холодный, чтобы вам пригодился опыт приготовления теста для киша (они похожи). Это тесто можно назвать капризным - работать с ним непросто, сливочное масло очень быстро тает при комнатной температуре, поэтому есть две вещи, которые я хочу вам сказать:</p>\n<p>1️⃣ снимите с себя ответственность и отпустите перфекциониста погулять. Профессиональные кондитеры учатся работать с этим тестом не один день, и у всех на первых порах ничего не выходит.</p>\n<p>2️⃣ правильно приготовленный тарт - это просто безумно вкусно, так что игра стоит свеч!</p>\n<p>на 2 тарта (форма диаметром 24 см)</p></div><p>а также</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В большую миску (или дежу миксера) просеять два вида муки, сахарную пудру, соль. Очень холодное сливочное масло нарезать кубиками со стороной ~1 см. Яйцо взбить венчиком или пробить блендером до однородности.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Выложить кубики сливочного масла в муку и, не отвлекаясь на другие дела, начать интенсивно перетирать его между пальцев, пока все кубики не исчезнут. Работать нужно быстро, чтобы масло оставалось холодным. Если используете планетарный миксер, процесс тот же, только соответственно, работаете не вы, а насадка-весло (закидывайте сливочное масло небольшими партиями, но без серьезных перерывов).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Когда текстура крошки начнёт напоминать песок, быстро влить в центр яйцо и вымесить тесто - достаточно быстро оно соберётся в комок, прекрасно пахнущий сливочным маслом. В отличие от теста для киша, оно будет более липким, тянущимся.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Если вы готовите один тарт, второй кусок теста стоит убрать в морозилку, там они могут храниться до трёх месяцев. А первый - раскатать, не охлаждая, между двух листов пергаментной бумаги (или гитарных, если вы продвинутый пользователь кухни), до 2-3 мм (обязательно тонко!). Убрать в холодильник минимум на 3 часа.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">По прошествии этого времени вытащить тесто из холодильника и выждать несколько минут. Тесто очень быстро из окаменевшего превратиться в податливое, в этот момент надо работать, не мешкая - переложить тесто в форму для тарта 24 см, тщательно прижимая его ко дну и бортам, выпуская вееееесь воздух между (иначе тарт вздуется в духовке). Часто наколоть вилкой и убрать в морозилку минимум на полчаса, максимум — на час.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Духовку разогреть до 170 градусов (конвекция). Лист пергамента хорошо смять, затем “постелить” сверху на тесто. Засыпать груз (фасоль, нут), хорошо распределить груз по бокам основы (не надавливать, просто распределить!) и выпекать 20 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Затем убрать груз и отправить в духовку еще на 15 минут. Основа должна очень хорошо зарумяниться.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0668_01_669_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0668_02_670_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0668_03_671_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0668_04_672_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0668_05_673_photo.webp\" alt=\"\"></figure></div>"},"699":{"id":699,"title":"Заварное тесто","sub":"pâte à choux","cat":"Пироги, тесто и хлеб","img":"thumb/0699_00_699_photo.webp","lq":"data:image/webp;base64,UklGRpQAAABXRUJQVlA4IIgAAABQBACdASoUABkAPu1qr1CppaQjqAqpMB2JYwC2yAuiYR9TLQ6KG3AovHEAAP7M08Hm7NoElPGyuBaWIgtxm8Nf0/LbAY7n02N7WCvYcmHeBMkmTNaiYoBS+IY6n/krufpVJZ/WBNzWlMjgbVp1T3ZpRAjK1iANWN6eIH/0PRwa/6GnFNWZAAAA","w":360,"h":450,"q":"заварное тесто pâte à choux примерно на 30 эклеров 40 профитролей вода 205 г молоко 125 г fleur de sel 7 г либо обычная соль 5 г сахар 14 г масло слив 130 г мука 185 г яйца 245 265 г заварное тесто p te choux","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0699_00_699_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpQAAABXRUJQVlA4IIgAAABQBACdASoUABkAPu1qr1CppaQjqAqpMB2JYwC2yAuiYR9TLQ6KG3AovHEAAP7M08Hm7NoElPGyuBaWIgtxm8Nf0/LbAY7n02N7WCvYcmHeBMkmTNaiYoBS+IY6n/krufpVJZ/WBNzWlMjgbVp1T3ZpRAjK1iANWN6eIH/0PRwa/6GnFNWZAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">примерно на 30 эклеров/40 профитролей:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 205 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 125 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">fleur de sel 7 г либо</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">обычная соль 5 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 14 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло слив. 130 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 185 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 245-265 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: уменьшать порцию теста я рекомендую только в том случае, если готовите вручную, для планетарного миксера это будет необходимый минимум</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Яйца комнатной температуры пробить блендером до однородной текстуры и отставить в сторону - это меланж. В кастрюлю или сотейник добавить воду, молоко, сахар, соль, а также нарезанное на кубики холодное сливочное масло, поставить на средний огонь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Растопить сливочное масло, периодически помешивая спатулой, растворить сахар и соль, прибавить огонь до средне-сильного и дождаться, когда жидкость начнет закипать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Далее работаем быстро: убираем кастрюлю/сотейник с огня, всыпаем сразу всю муку и начинаем активно перемешивать по однородного состояния (это удобно делать спатулой). Как только всё смешается и никаких кусочков муки не останется, возвращаем на средний огонь и продолжаем мешать, “растирая” тесто по дну сотейника, пока на нём не образуется тонкая пригоревшая корочка. Этот процесс не должен занять больше 5 минут.</div></div>\n<p>Если у вас есть планетарный миксер, то муку высыпаем в дежу, включаем миксер (насадка весло) на низко-среднюю скорость, и когда жидкость закипела - в одно движение вливаем ее в дежу, дожидаясь, пока масса полностью не объединится. Затем - по рецепту, возвращаем тесто в сотейник и подсушиваем на огне. Как только образовалась пленка - возвращаем в дежу, включаем на низкую скорость и охлаждаем.</p>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Переложить тесто в миску и охладить до температуры 55-60 градусов (можно без термометра, ориентир - не обжигает палец), начинаем порциями добавлять яичный меланж. Добавили немного - тщательно перемешали, и так далее несколько раз. Это очень важно, нельзя вливать яйца большими порциями, это испортит тесто!</div></div>\n<p>Если у вас планетарный миксер, то вливаем яйца тончайшей струйкой при непрерывно работающем на низкой скорости миксере.</p>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Добиваемся особой, идеальной консистенции, поэтому добавляем столько яиц, сколько «возьмет тесто». Ориентируйтесь на нижнюю границу нормы, но возможно вам понадобится больше - для этого есть верхняя граница нормы. При ручном замесе тесто не будет идеально гладкое, не пугайтесь. Во многих рецептах заварного теста есть ориентир готовности - тесто должно стекать лентой со спатулы и оставлять треугольник. Что ж, поверьте моему опыту! Если вы делаете тесто впервые, НЕ ОРИЕНТИРУЙТЕСЬ на идеально гладкую ленту и треугольник, вы добавите слишком много яиц, и ваши профитроли/эклеры расплывутся. Пусть тесто остаётся немножечко «рваным», пусть не оставляет идеальный треугольник. Попробуйте сначала так, а когда набьете руку и сделаете не один замес заварного теста, наблюдая за тем, как оно будет вести себя в отсадке и духовке, вот тогда уже сможете доводить его до той самой текстуры., если это понадобится.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Когда тесто готово, накрываем его пищевой пленкой в контакт (это значит, что мы кладем пленку прямо на тесто, не образуя никаких воздушных карманов, не натягиваем пленку на края миски/дежи) и отправляем в холодильник на полчаса для профитролей и на 2-4 часа для эклеров.</div></div></div></div>"},"508":{"id":508,"title":"Персиковый сорбет","sub":"с белым вином","cat":"Десерты","img":"thumb/0508_00_508_photo.webp","lq":"data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABQBACdASoUABkAPu1ip04ppSMiMBgMATAdiUAQSSBwxPHu0qy8rfKRoGsAAP6vbhnF+ApJ6UwYafIRA9kIREPLfeSdosXCA3qyr6gZCQ0BOHBlGnffGmOnVfmbokM48Brrcsie6xcABNdXppPcRTPfP+eXN50keR57QUPiIQF3HhsjLAqXCUgsLcmWvtAKzAA=","w":360,"h":450,"q":"персиковый сорбет с белым вином  белые персики 650 г около 5 средних персиков сахар 100 г сироп глюкозы 100 г белое сухое вино 200 г лимон 2 шт сок 80 г персиковый сорбет с белым вином","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0508_00_508_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAABQBACdASoUABkAPu1ip04ppSMiMBgMATAdiUAQSSBwxPHu0qy8rfKRoGsAAP6vbhnF+ApJ6UwYafIRA9kIREPLfeSdosXCA3qyr6gZCQ0BOHBlGnffGmOnVfmbokM48Brrcsie6xcABNdXppPcRTPfP+eXN50keR57QUPiIQF3HhsjLAqXCUgsLcmWvtAKzAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">белые персики 650 г (около 5 средних персиков)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сироп глюкозы 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белое сухое вино 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 2 шт (сок, ~80 г)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: вместо сиропа глюкозы можно взять обычный сахар (текстура у готового сорбета получится менее деликатной), белое вино заменить безалкогольным или водой (финальный букет будет менее интересным)</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">На каждом персике сделать неглубокий крестообразный надрез. Опустить персики в кипящую воду на 1 минуту, затем переложить в миску с ледяной водой и оставить ещё на 1 минуту.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Снять с персиков кожицу, удалить косточки, мякоть нарезать небольшими кусочками и сложить в сотейник или кастрюлю. Добавить сахар, сироп глюкозы и белое вино.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Поставить на средний огонь и довести до кипения. Убавить огонь, прикрыть крышкой и готовить 10–15 минут, пока кусочки персиков не станут совсем мягкими.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Снять с огня, добавить лимонный сок и дать смеси полностью остыть до комнатной температуры.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Пробить погружным блендером в течение 2–3 минут до максимально гладкой и однородной текстуры. При желании процедить через мелкое сито.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Перелить массу в широкий контейнер, накрыть крышкой и убрать в морозильную камеру на ночь, до полного замерзания.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Перед подачей достать сорбет из морозильной камеры и оставить при комнатной температуре на 5–10 минут. Разломать или нарезать замороженную массу на небольшие кусочки и пробить до гладкой, пластичной консистенции с помощью погружного или стационарного блендера. При необходимости несколько раз остановить блендер и перемешать массу лопаткой.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Подавать сразу же, сформировав шарики ложкой для мороженого, или использовать сорбет для приготовления беллини.</div></div></div></div>"},"519":{"id":519,"title":"Галета лета","sub":"с франжипаном из грецкого ореха, сливами и голубикой","cat":"Десерты","img":"thumb/0519_00_519_photo.webp","lq":"data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAADQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JagCsEfqngB3ct9Ih9qJYvf/ixaCOHiLDvaonmdZoAP7e6FnvS845HDzJmKZ2j43Icpt29GMLZOmqDjvegkS5Fr/dumKqebcqxGdXvuudkkqrOwbRY/Z3+dn2RyR3csK1zcads/ID0TWXMvbMcvYzE7pSRLEH6OJuvJAEPQjebieGBUTkByJetno3Dmu4nzT7pCzO4KetmAChkOZlWu2SMckP7jB1vTDnLl0P8okLclaO6LHQx5wt3bwMrWSV36zSYAj3kd0AXgkfKBc/lWIh83dkX1xaFQczfFg5dFMQOAAA","w":360,"h":450,"q":"галета лета с франжипаном из грецкого ореха, сливами и голубикой крем франжипан грецкие орехи 100 г масло сливочное 60 г мягкое сахар ванильный 10 г сахар коричневый 50 г мука 25 г яйцо с0 1 шт соль щепотка сливы 600 г сахар 50 г можно исключить голубика горсть яйцо для смазывания бортиков сахар коричневый галета лета с франжипаном из грецкого ореха сливами и голубикой ну что дачники дорогие попечём пирог этого месяца галета начнём с самого начала слово galette происходит от древнефранцузского galet галька камешек то есть что то круглое и плоское самыми первыми галетами были тривиальные лепёшки из грубой муки выпеченные прямо на горячем камне позднее в восемнадцатом веке хозяйки ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0519_00_519_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAADQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JagCsEfqngB3ct9Ih9qJYvf/ixaCOHiLDvaonmdZoAP7e6FnvS845HDzJmKZ2j43Icpt29GMLZOmqDjvegkS5Fr/dumKqebcqxGdXvuudkkqrOwbRY/Z3+dn2RyR3csK1zcads/ID0TWXMvbMcvYzE7pSRLEH6OJuvJAEPQjebieGBUTkByJetno3Dmu4nzT7pCzO4KetmAChkOZlWu2SMckP7jB1vTDnLl0P8okLclaO6LHQx5wt3bwMrWSV36zSYAj3kd0AXgkfKBc/lWIh83dkX1xaFQczfFg5dFMQOAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">крем франжипан:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">грецкие орехи 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 60 г (мягкое)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар ванильный 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар коричневый 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 25 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо С0 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливы 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 50 г (можно исключить)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">голубика горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо для смазывания бортиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар коричневый</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Ну что, дачники дорогие, попечём? Пирог этого месяца — галета!</p>\n<p>Начнём с самого начала. Слово galette происходит от древнефранцузского galet — “галька, камешек”, то есть что-то круглое и плоское. Самыми первыми галетами были тривиальные лепёшки из грубой муки, выпеченные прямо на горячем камне. Позднее, в восемнадцатом веке, хозяйки, населяющие деревни Франции, стали класть на такой грубый пласт теста ягоды и фрукты, просто загибая края, чтобы не вытекал сок. Это был способ использовать то, что росло прямо сейчас — во Франции, как мы знаем, хорошо понимают преимущества “сезонной гастрономии”. Таким образом можно подытожить, что галета — это самая простая версия французского тарта, его обаятельная кузина из деревушки в Провансе.</p>\n<p>Преимущество галеты в том, что ее начинкой могут выступать абсолютно любые ягоды, фрукты или овощи. Можно усложнять ее франжипаном (франжипан в свою очередь может быть из любых орехов), можно заварным кремом, можно добавлять сухофрукты, пряности, травы, специи, короче, настоящий рай для любителей делать не по рецепту, а по порыву души.</p>\n<p class=\"lbl\">Вот несколько основных правил:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">На 1 галету стоит брать от 400 до 600 грамм овощей, фруктов или ягод.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Если ягоды/фрукты сладкие, то стоит добавить от 25 до 50 грамм сахара в начинку. Если кислые, то от 50 до 100 грамм. Если ягоды/фрукты очень спелые и сочные, то прежде чем смешивать их с сахаром, вмешайте в него столовую ложку кукурузного крахмала.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Чтобы тесто было вкусным и хрустящим, нужен хороший жар! Обязательно хорошо прогревайте духовку (это вообще про любую выпечку, просто напоминаю). Пеките на металлическом противне, перевернутом вверх дном, циркуляция воздуха поможет галете пропечься и зарумяниться.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Галета хороша и сама по себе, теплая или холодная, но кажется еще ни разу мороженое, взбитые сливки или ложка жирной сметаны не испортили теплый открытый ягодный пирог 🙂</span></li></ul>\n<p class=\"lbl\">на 6 порций:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/640\">тесто для галеты</a> 1/2 от этого рецепта</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Франжипан:<br>Если есть кухонный комбайн, то сперва перемолоть в нём грецкие орехи до пастообразного состояния (в муку не получится в связи с их жирностью), затем добавить все остальные ингредиенты и смешать до однородности.<br>Если есть только погружной блендер, то сперва перемолоть грецкие орехи (можно также сделать это в кофемолке). Затем в высоком стакане пробить мягкое сливочное масло с сахаром и яйцом, затем добавить пасту из орехов и муку, смешать всё до однородности.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть духовку до 200 градусов (режим: конвекция). Голубику обмыть и хорошо обсушить. Сливы обмыть, очистить от косточек и нарезать дольками. Попробуйте одну — если сливы кислые, то добавьте сахар и аккуратно перемешайте (можно не добавлять сахар совсем).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Достать пергамент с пластом теста из холодильника, переложить на перевернутый противень. Распределить франжипан по поверхности теста, оставив около 3 см с каждой стороны. Выложить дольки фруктов на крем (как на фото или на свой вкус), завернуть края галеты, хорошо прижимая складки, чтобы не разошлись в духовке. Разложить ягоды голубики, смазать краешки теста взбитым яйцом и посыпать коричневым сахаром, отправить в духовку (температуру в этот момент понизить с 200 на 180) на 40-50 минут. Ближе к концу выпекания я разворачиваю противень другой стороной — так краешки галеты золотятся равномерно.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Имейте в виду, что галету лучше передержать, чем недодержать. Если верх румянится слишком быстро, прикройте центр фольгой.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0519_01_520_photo.webp\" alt=\"\"></figure></div>"},"595":{"id":595,"title":"Тарт с клубникой и земляникой","sub":"летняя кростата, сделанная французами","cat":"Десерты","img":"thumb/0595_00_595_photo.webp","lq":"data:image/webp;base64,UklGRhQBAABXRUJQVlA4IAgBAABwBgCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMoR/U8Aa3LgENBOvBLuZ3i6FDrOAP90TJ2qXvW2NAAAAxDGxfFKlGc6ByKL8BG7fjthYjSRAPpcCf/swzXhpR8tjWH990e8jzPDw/1fe/IzrM2mFvfkB+cyYAQ3QKQsOjAWB6QMN34BZ8nh3beYG2QnnQO1ArfMfpcr+1Ptpq1I90L0Xp/mC2L+/+GXckrjLkp/HN/e4nt9cKBK31loUe70XYwqujSoGTwiNJ7/6EfH9WooDBYb++e/Qgc/SXu/mVgOWRa2VO+xtdHp6g5XisEpeRN67pqjscszUzaF6U2GEzt3eSRP3yRNEfAA=","w":360,"h":450,"q":"тарт с клубникой и земляникой летняя кростата, сделанная французами на тарт диаметром 25 26 см для крема дипломат молоко 300 г ваниль 1 стручок сахар 30 г 30 г желтки 60 г 3 4 шт крахмал кукурузный 20 г масло сливочное 50 г сливки от 30 210 г ягоды клубника земляника 500 г ванильный сахар 5 6 г лимонная цедра немного предварительно отпеченная a 668 основа для тарта тарт с клубникой и земляникой летняя кростата сделанная французами","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0595_00_595_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhQBAABXRUJQVlA4IAgBAABwBgCdASoUABkAPu1srFEppaQiqAqpMB2JbACdMoR/U8Aa3LgENBOvBLuZ3i6FDrOAP90TJ2qXvW2NAAAAxDGxfFKlGc6ByKL8BG7fjthYjSRAPpcCf/swzXhpR8tjWH990e8jzPDw/1fe/IzrM2mFvfkB+cyYAQ3QKQsOjAWB6QMN34BZ8nh3beYG2QnnQO1ArfMfpcr+1Ptpq1I90L0Xp/mC2L+/+GXckrjLkp/HN/e4nt9cKBK31loUe70XYwqujSoGTwiNJ7/6EfH9WooDBYb++e/Qgc/SXu/mVgOWRa2VO+xtdHp6g5XisEpeRN67pqjscszUzaF6U2GEzt3eSRP3yRNEfAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на тарт диаметром 25-26 см:</p><div class=\"iblock\"><p class=\"lbl\">для крема дипломат:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ваниль 1 стручок</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 30 г + 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желтки 60 г (3-4 шт)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 50 г</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки от 30% 210 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">ягоды (клубника/земляника) 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ванильный сахар 5-6 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонная цедра немного</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">предварительно отпеченная <a class=\"xref\" href=\"#/r/668\">основа для тарта</a></span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: идеальный тайминг приготовления десерта такой: вечером накануне нагреваете молоко с ванилью и оставляете на ночь настаиваться, на следующий день с утра делаете песочное тесто, распределяете между пергаментными листами и убираете в холодильник; тогда же делаете заварной крем и отправляете его стабилизироваться. К обеду или ужину ваш прекрасный тарт будет готов!</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Для заварного крема вылить молоко в небольшую кастрюлю. Стручок ванили разрезать, выскоблить семена и добавить в молоко, туда же положить пустой стручок. Нагреть до состояния, близкого к кипению, накрыть крышкой и дать настояться минимум 1 час (в идеале, как и всегда, ночь).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">По прошествии этого времени вытащить стручки и крупные кусочки из молока, добавить первую часть сахара (30 г) и снова нагреть молоко до состояния, близкого к кипению. Желтки объединить в миске венчиком со второй частью сахара и кукурузным крахмалом. Тонкой струйкой влить к желткам горячее молоко, непрерывно помешивая венчиком. Когда все объединится, вернуть массу в кастрюлю на средний огонь и варить, помешивая венчиком или спатулой до загустения (лучше всего так — сначала венчиком, а после загустения спатулой). Когда крем загустеет, проварить его минимум три минуты, затем снять с огня, переложить в миску, закрыть пищевой пленкой в контакт и убрать в холодильник, чтобы крем немного остыл. Когда температура крема достигнет 50-60 градусов, добавить кусочки сливочного масла и пробить крем погружным блендером до шелковой текстуры. Накрыть пищевой пленкой в контакт и убрать в холодильник до полной стабилизации (минимум на 3-4 часа).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Для крема дипломат взбить холодные сливки до уверенных пиков, этими же венчиками “взбодрить” охлажденный заварной, чтобы он стал однородным. Объединить заварной крем со взбитыми сливками с помощью спатулы, движениями сверху вниз. Готовый крем выложить на отпеченную основу, убрать тарт в холодильник на час, либо до подачи.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Клубнику нарезать на половинки или четвертинки, добавить немного ванильного сахара (половину пакетика) и немного лимонной цедры, перемешать и оставить при комнатной температуре на 15 минут или в холодильник до подачи.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Выложить клубнику горкой в центр охлажденного тарта, украсить свежей земляникой и срочно подавать.</div></div></div></div>"},"601":{"id":601,"title":"Очень шоколадный торт","sub":"с кремом или без — на ваш выбор","cat":"Десерты","img":"thumb/0601_00_601_photo.webp","lq":"data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAADwBACdASoUABkAPu1irFAppSQisBgIATAdiUAWnQHD0EGTyTFeRCGxxmZt+tCP2AAA/tck6rM36doFJXsI7Jd9cRM2syz5dUqbBTEHi3GVUV3I0bT09ZF5bkobi4x391EVmn+q5vbXd2/W8bUO1kocOqRL7/KPNev/NQIcX+IU7FHR1AdHCBnMZHd4sNL6rxwnb8JXv7BfKD22fW8PsgH3zUA6FINsfoRp8/vKgzNwz1gZ22vh4ZjtcDHvwAAA","w":360,"h":450,"q":"очень шоколадный торт с кремом или без — на ваш выбор на 10 12 кусочков для бисквита мука 140 г какао 35 г сметана 140 г масло сливочное 60 г масло растительное 60 г сахар 80 г сахар коричневый 50 г яйцо со 1 шт эспрессо 50 г соль 3 г разрыхлитель 4 г сода 2 г для крема шоколад горький 250 г сливки 33 250 г масло сливочное 210 г мягкое какао 40 г мёд 1 ч л соль щепотка очень шоколадный торт с кремом или без на ваш выбор есть в английском языке слово которое часто используют беременные в контексте своих пищевых пристрастий cravings если вы не знакомы со значением объясню это когда вам очень очень хочется чего то вот прямо до скрежета зубов и дрожи в коленях так вот я не фанат шоколада вы знаете я часто об этом говорю лучший десерт для меня творожн","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0601_00_601_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAADwBACdASoUABkAPu1irFAppSQisBgIATAdiUAWnQHD0EGTyTFeRCGxxmZt+tCP2AAA/tck6rM36doFJXsI7Jd9cRM2syz5dUqbBTEHi3GVUV3I0bT09ZF5bkobi4x391EVmn+q5vbXd2/W8bUO1kocOqRL7/KPNev/NQIcX+IU7FHR1AdHCBnMZHd4sNL6rxwnb8JXv7BfKD22fW8PsgH3zUA6FINsfoRp8/vKgzNwz1gZ22vh4ZjtcDHvwAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 10-12 кусочков:</p><div class=\"iblock\"><p class=\"lbl\">для бисквита:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 140 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">какао 35 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана 140 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло растительное 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар коричневый 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо СО 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">эспрессо 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 3 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">разрыхлитель 4 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода 2 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для крема:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">шоколад горький 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 33% 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 210 г мягкое</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">какао 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Есть в английском языке слово, которое часто используют беременные в контексте своих пищевых пристрастий — cravings. Если вы не знакомы со значением, объясню: это когда вам очень-очень хочется чего-то, вот прямо до скрежета зубов и дрожи в коленях.</p>\n<p>Так вот. Я не фанат шоколада, вы знаете, я часто об этом говорю. Лучший десерт для меня — творожный, нежный, сливочный, ягодный, ванильный и так далее. Однако же иногда, совершенно внезапно и без всякого уважения к собственной гастрономической идентичности, я ловлю себя на мысли, что прямо сейчас хочу ШОКОЛАД. Не просто квадратик шоколадной плитки, съеденный на ходу, а шоколад как событие, как маленькую личную капитуляцию. Мне всегда хотелось иметь рецепт ровно на такой случай, и вуаля — получайте!</p>\n<p>Корж здесь получается настолько влажным, насыщенным и выразительным, что его спокойно можно печь просто в виде шоколадного пирога, без всякого крема и сборки: испекли, остудили, нарезали щедрыми кусками, налили себе чашечку кофе и съели. А вот если настиг серьёзный craving, и нужно нечто большее, зубодробительно шоколадное, предлагаю добавить к этому блестящий шоколадный крем, разрезать корж на слои и превратить всё в очень шоколадный торт.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 190 градусов. Форму диаметром 18 см застелить фольгой/бумагой для выпечки.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В большой миске смешать растопленное сливочное масло и растительное масло. Добавить оба вида сахара, затем яйцо, кофе и соль, тщательно перемешивая венчиком после каждого добавления.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить муку, какао, соду и разрыхлитель. В конце вмешать сметану и перемешать до однородности (следить, чтобы не осталось сухих участков теста).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Выпекать 25-30 минут, проверять готовность зубочисткой — на ней не должно оставаться жидкого теста, при этом несколько влажных крошек допустимы.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Оставить корж в форме на 10 минут, затем извлечь и полностью остудить на решётке.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">После остывания завернуть корж и убрать в холодильник на 6 часов (в идеале — на ночь). Будьте аккуратны, корж очень нежный. Этот шаг только для тех, кто собирает торт с кремом, так как холодный корж гораздо легче разрезать.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Для крема нагреть в сотейнике сливки с чайной ложкой мёда до состояния, близкого к кипению. Шоколад поломать на маленькие кусочки, сложить в высокий стакан для блендера, затем залить горячими сливками и оставить на пару минут. Пробить размягченный шоколад со сливками в однородную шоколадную эмульсию в течение 2-3 минут. Перелить в миску, накрыть пленкой в контакт и убрать в холодильник на один-два часа (крем должен быть холодным).</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Кубики размягченного сливочного масла взбить миксером до воздушного состояния, добавить какао и продолжить взбивать. В два захода добавить охлажденный шоколадный крем-ганаш, взбить до однородности. Добавить щепотку соли, хорошо перемешать и попробовать. Если нужно больше контраста — посолите ещё.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Срезать у коржа купол. Оставшуюся часть разрезать на два или три коржа и собрать торт. После сборки убрать в холодильник на полчаса, и можно нападать. Предупреждаю только — осторожнее с размером кусочка, торт очень насыщенный и очень сытный!</div></div><div class=\"outrop\"><p>PS. При долгом охлаждении крем сильно затвердевает, и баланс текстур немного портится. В связи с этим мой совет — если делаете торт в качестве десерта на праздник, достаньте его из холодильника хотя бы за полчаса.</p></div></div></div>"},"616":{"id":616,"title":"Подарочная гранола","sub":"с ароматом Рождества и пряничными человечками","cat":"Десерты","img":"thumb/0616_00_616_photo.webp","lq":"data:image/webp;base64,UklGRqIAAABXRUJQVlA4IJYAAABwBACdASoUABkAPulcp02pJSOiN/VYASAdCWYAACU1slxvG7MAM6bo6mvHQAD+FnGErqervs5eNsxYNZIMJHU0IXnqDdPxrW91bfgqmUzHBpDxXsj9F1BYlAwD+rRYwHtgEuwd1rP4wkNCD7i/U3dpREcgrcwdcPmgnZWGDbuS/dCtKF838ynEJew8NlNX6IC/lp1oAAA=","w":360,"h":450,"q":"подарочная гранола с ароматом рождества и пряничными человечками на 500 г гранолы овсянка длительного приготовления 250 г миндаль 80 г кешью 80 г пекан 80 г семена конопли 30 г корица 2 палочки бадьян 2 звездочки пудра ванили 1 ч л имбирь 1 2 ч л кардамон 1 4 ч л мёд тёмный 80 г патока меласса темная 60 г кокосовое масло 40 г клюква вяленая 120 г подарочная гранола с ароматом рождества и пряничными человечками","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0616_00_616_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRqIAAABXRUJQVlA4IJYAAABwBACdASoUABkAPulcp02pJSOiN/VYASAdCWYAACU1slxvG7MAM6bo6mvHQAD+FnGErqervs5eNsxYNZIMJHU0IXnqDdPxrW91bfgqmUzHBpDxXsj9F1BYlAwD+rRYwHtgEuwd1rP4wkNCD7i/U3dpREcgrcwdcPmgnZWGDbuS/dCtKF838ynEJew8NlNX6IC/lp1oAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 500 г гранолы:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">овсянка длительного приготовления 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">миндаль 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кешью 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пекан 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена конопли 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">корица 2 палочки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бадьян 2 звездочки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пудра ванили 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кардамон 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд тёмный 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">патока/меласса темная 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кокосовое масло 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">клюква вяленая 120 г</span></li></ul></div></div></aside><div class=\"main\"><p>+ пряничные человечки</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 170 градусов (режим: верх/низ). Овсяные хлопья высыпать в большую миску. Орехи крупно порубить: миндаль и кешью на 2–3 части, пекан оставить более крупным, чтобы он красиво чувствовался в готовой граноле. Добавить орехи к овсянке, всыпать семена конопли и перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В небольшом сотейнике соединить мёд, патоку и кокосовое масло. Нагревать на слабом огне, помешивая, до полного растворения мёда и масла. Снять с огня.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить в горячую смесь палочки корицы, бадьян, ванильную пудру, имбирь и кардамон. Накрыть кастрюлю крышкой и настоять 20-30 минут, затем убрать корицу и бадьян и вылить ароматную смесь в миску с сухими ингредиентами. Тщательно перемешать, чтобы хлопья и орехи были равномерно покрыты.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Противень застелить бумагой для выпечки, выложить гранолу ровным слоем. Запекать 30–35 минут, аккуратно перемешать гранолу в середине, добиваясь равномерного подрумянивания и образования хрустящих кусочков. Не перемешивайте слишком активно, если хотите, чтобы гранола запеклась кусочками.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Готовую гранолу достать из духовки, сразу же вмешать вяленую клюкву и оставить на противне до полного застывания. Разложить по банкам вместе с пряничными человечками.</div></div></div></div>"},"617":{"id":617,"title":"Имбирные человечки","sub":"gingerbread","cat":"Десерты","img":"thumb/0617_00_617_photo.webp","lq":"data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADQBACdASoUABkAPu1urlIppiQiqAgBMB2JYgCdMsdlrQPyTfw1hz1FGyLfWtFkgAD2oA6UNCH++CUROrkIRKIszEPyWAwEEuLXR8HK23nEzyfUQaWnIeFYD00nskHdn2h7ahR5XkXOzHEhxIOKVmy24RCUQcaG6SjYwkQdaVeOr0Q5NN5QNw+1/L+m6cKFexac8f5n0fstBDn8NKwCV0CJVApZgSfMTdklH/9c9hWAaN2pv3dgaMNX3+0i9Mv4hsykeq9v5a8wJ/f1+H4+6C5+iVJAKj0yuqQLGJiaEoOvH1uaP6IxLaA/J6TGzdXGL52WGoo8vgrPR+BOMKWZ8YhKFCIAAA==","w":360,"h":450,"q":"имбирные человечки gingerbread  мука 300 г миндальная мука 40 г сливочное масло 60 г растительное масло 20 г мёд темный 100 г патока меласса темная 90 г сода 1 ч л желток 1 шт апельсин 2 шт цедра лимон 1 шт цедра имбирь свежий 30 г либо 20 г если хотите вкус помягче имбирь сухой 2 ч л либо 1 ч л если хотите вкус помягче корица 1 ч л кардамон 1 2 ч л пудра ванили 1 ч л мускатный орех 1 4 ч л черный перец щепотка соль 1 2 ч л имбирные человечки gingerbread сегодня имбирное печенье прочно ассоциируется с декабрьскими вечерами за кухонным столом детским смехом разномастными формочками и липкими от глазури пальцами во многих семьях выпечка пряников с детьми стала таким же устойчивым рождественским ритуалом как украшение ёлки или развешивание гирлянд процесс важнее результата а неровный человечек с отломанной рукой и ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0617_00_617_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADQBACdASoUABkAPu1urlIppiQiqAgBMB2JYgCdMsdlrQPyTfw1hz1FGyLfWtFkgAD2oA6UNCH++CUROrkIRKIszEPyWAwEEuLXR8HK23nEzyfUQaWnIeFYD00nskHdn2h7ahR5XkXOzHEhxIOKVmy24RCUQcaG6SjYwkQdaVeOr0Q5NN5QNw+1/L+m6cKFexac8f5n0fstBDn8NKwCV0CJVApZgSfMTdklH/9c9hWAaN2pv3dgaMNX3+0i9Mv4hsykeq9v5a8wJ/f1+H4+6C5+iVJAKj0yuqQLGJiaEoOvH1uaP6IxLaA/J6TGzdXGL52WGoo8vgrPR+BOMKWZ8YhKFCIAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">миндальная мука 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">растительное масло 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд темный 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">патока/меласса темная 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">апельсин 2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь свежий 30 г (либо 20 г, если хотите вкус помягче)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь сухой 2 ч л (либо 1 ч л, если хотите вкус помягче)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">корица 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кардамон 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пудра ванили 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1/2 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Сегодня имбирное печенье прочно ассоциируется с декабрьскими вечерами за кухонным столом, детским смехом, разномастными формочками и липкими от глазури пальцами. Во многих семьях выпечка пряников с детьми стала таким же устойчивым рождественским ритуалом, как украшение ёлки или развешивание гирлянд: процесс важнее результата, а неровный человечек с отломанной рукой и смазанной глазурью ценится выше безупречного “инстаграмного”, ведь спустя время такие воспоминания становятся артефактами родительской памяти.</p>\n<p>Исторически, однако, имбирный пряник был существом куда более серьёзным. Его ранние европейские версии — плотные, тёмные, насыщенные специями — относились скорее к “взрослой” кухне: их пекли в монастырях (ибо только у церкви были деньги на пряности), ели понемногу, ценили за согревающий эффект и способность долго храниться. Сладость здесь была побочным следствием мёда и патоки, главную же роль играли пряности — как ощущение достатка и праздника. Детским лакомством имбирный пряник стал значительно позже, когда сахар подешевел, а рождественская культура сместила акцент с пользы на игру и эстетику.</p>\n<p>Этот рецепт — осознанный диалог с обеими традициями. В нём достаточно патоки, тёмного мёда и специй, чтобы сохранить ту самую взрослую глубину, и достаточно мягкости, чтобы тесто было пластичным, благодарным и подходящим для самых разных форм. Из него одинаково хорошо получаются и пряничные домики, и тонкие фигурные печенья, и простые округлые пряники без декора — всё зависит от толщины раскатки, времени выпечки и вашей фантазии.</p>\n<p>Я привожу его здесь как предисловие к рецепту гранолы: мы будем вырезать из этого теста маленьких пряничных человечков — милейших, ароматных, с тёплым имбирным послевкусием, сразу же переносящих вашу гранолу из разряда повседневных — в праздничные.</p>\n<p>~ на 160 маленьких пряничных человечков</p>\n<p class=\"lbl\">или на 40 — больших:</p>\n<p>(для имбирного домика рецепт лучше удвоить)</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: так как в рецепте есть целый желток, уменьшить порцию не получится, но это возможно и не понадобится — тесто прекрасно хранится и в холодильнике (до недели), и в морозилке (до трёх месяцев). Если планируете хранить, то сразу делите тесто на несколько шариков, оборачивайте пищевой пленкой — и вперед. Размораживаем только через ночь в холодильнике!</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В небольшой сотейник выложить сливочное и растительное масла, мёд и патоку. Поставить на средний огонь и нагревать, помешивая, до полного объединения — масса должна стать однородной, текучей и хорошо прогретой, не кипеть. Снять с огня.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Свежий имбирь натереть на самой мелкой тёрке. С апельсинов и лимона снять цедру с помощью микроплана. Добавить свежий имбирь, цедру, сухой имбирь, корицу, кардамон, ваниль, мускатный орех, чёрный перец и соль в горячую медово-масляную смесь. Перемешать и дать постоять 5–7 минут, чтобы специи раскрылись в жире и тепле. Вмешать желток до полной однородности (на момент добавления желтка тесто не должно обжигать палец).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В большой миске соединить пшеничную и миндальную муку, соду, хорошо перемешать. Влить тёплую пряную смесь и замесить мягкое, липковатое, но собранное тесто. Оно должно держать форму и оставаться пластичным. Если тесто кажется слишком мягким, дать ему постоять 10 минут — мука впитает влагу, и консистенция выровняется.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Упаковать тесто в пищевую плёнку и убрать в холодильник минимум на 3 часа (идеально — ночь). Охлаждение углубляет вкус и значительно облегчает формовку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Окончание не поместилось и переехало в комментарии</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Духовку разогреть до 180 градусов (режим: верх/низ). Противень застелить бумагой для выпечки. Раскатать тесто, немного припыляя мукой, до толщины 4 мм и вырезать пряничных человечков. Перенести на противень (можно вплотную, они почти не увеличиваются). Выпекать 10–12 минут. Не передерживать — пряники дойдут при остывании.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Дать пряникам постоять на противне 5 минут, затем переложить на решётку. В тёплом виде они особенно нежные, а полностью раскрываются через несколько часов — и особенно хороши на следующий день.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Хранить в закрытом контейнере при комнатной температуре до недели.</div></div></div></div>"},"621":{"id":621,"title":"М
