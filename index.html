eR2Sx3XkzizZFKXltBdJx8hMLSUsogv4EoF4lYvlVlncyJDyT24y5AmDh0X/ABrsfcH32ITqIS2av1iH4ZCmpNZ1RoM64+v3+c0AXnppiQQr6clRmwvxDmuLI4g994JsEGDesbfWHk/VpuHMDc1sAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш говяжий - 400-500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста - 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук - 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь - 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей - 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян - 3-4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка - 6-8 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист - 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец горошком - 10-15 шт (по вашему вкусу)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода ~3 л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">большая кастрюля (даже две)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">мелкое сито или марля (я процеживаю бульон через хранящуюся на кухне исключительно для этих вещей сумочку для взвешивания овощей)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">контейнеры для заморозки</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>“Только чистый сердцем может сделать хороший суп”<br>Л.В.Бетховен</p>\n<p>Вы, полагаю, уже поняли, что я очень люблю бульоны. Некоторые женщины чувствуют себя некомфортно, когда выходят из дома без парфюма, а я чувствую себя некомфортно, когда в моей морозилке нет бульона. В подавляющем большинстве случаев я храню там пару-тройку килограммовых брусочков куриного. Он универсален, варится быстро (относительно, понятное дело), ну а красивый вид получается без всяких предварительных танцев с бубнами.</p>\n<p>Говяжий бульон - история несколько иная. Один раз в несколько месяцев я вспоминаю этот дивный бронзовый цвет и сдаюсь. Над хорошим, крепким, насыщенным бульоном из говядины нужно немного поколдовать. Прежде всего, найти хорошие кости, чтобы порублены не сильно крупно, и с мясом на них - свой мясник будет очень кстати, но и супермаркетом на худой конец можно обойтись. Далее кости нужно запечь, да не просто так, а с томатной пастой и фаршем - для красоты, отчетливого мясного вкуса и букета из ароматов. Ну а дальше вы всё уже проходили - залить водой, добавить овощи, снять пену, забыть на плите надоооооолго, потом процедить, охладить и избавить от неприятной верхней пленки (говяжий жир - бе). Но результат, ребята! Такой бульон даже свеклой и капустой забивать рука не поднимется, он уже сам по себе хорош, с добрым куском мяса и горстью укропа. Но мы в этом месяце потеряем всякую совесть и превратим его в шурпу. Ароматную, горячую, чуточку пряную, чуточку острую. Такую исцеляющую, согревающую, максимально комфортную тарелку в морозный январский полдень, м?</p>\n<p>К делу!</p>\n<p class=\"lbl\">на 2,5 л бульона:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">говяжьи кости - 2,5 кг</span></li></ul>\n<p>(если вы нашли кости совсем без мяса, возьмите 1,5 кг и добавьте к этому большой кусок суповой говядины на косточке)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 180 градусов (режим: конвекция, и если ваша духовка известна тем, что жарит мощно, установите 170). Кости выложить на противень и распределить по ним томатную пасту. В тот же противень выложить фарш и отправить в духовку на 50 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пока говядина запекается, подготовить овощи - лук очистить и разрезать на две части, морковь и сельдерей очистить и крупно порубить. Тимьян и петрушку можно связать ниткой для удобства, но это понты необязательно.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Достать противень с говядиной из духовки, переложить кости и фарш в большую кастрюлю. Налить в противень немного горячей воды и, тщательно пошкрябав лопаткой все пригоревшие части, добавить этот “мясной сок” в кастрюлю. Следом: все овощи, а также тимьян, петрушка, лавровый лист и перец горошком, залить водой (вся вода может не войти в кастрюлю, это нормально, главное чтобы она покрывала кости и овощи), довести до кипения, снять образовавшуюся пену, убавить огонь и оставить на один час.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Затем снова убрать образовавшуюся пену, ещё убавить огонь и держать на плите ещё … пять часов. Да, шесть часов - это минимум для говяжьего бульона. Помните, что крышкой булькающий бульон не накрываем, будет понемногу выкипать (так и должно быть, в процессе можно немного подливать теплую воду, чтобы кости и овощи были покрыты жидкостью). За час до готовности я добавляю немного соли - в том числе, чтобы вкусно съесть мясо с косточек как можно скорее.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Бульон остудить, затем вытащить кости, мясо и овощи, и тщательно процедить (в идеале дважды - сначала через сито, затем через марлю или сетчатый мешочек). Убрать в холодильник и после полного охлаждения целиком снять образовавшийся верхний слой жира. Разлить по контейнерам для заморозки или использовать для дальнейшего приготовления.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"503\" src=\"thumb/0566_01_567_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"504\" src=\"thumb/0566_02_568_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"229\" height=\"320\" src=\"thumb/0566_03_569_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"229\" height=\"320\" src=\"thumb/0566_04_570_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"504\" src=\"thumb/0566_05_571_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"504\" src=\"thumb/0566_06_572_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"503\" src=\"thumb/0566_07_573_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"229\" height=\"320\" src=\"thumb/0566_08_574_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"620":{"id":620,"title":"Клюквенный соус","sub":"аромат Рождества и идеальная пара к птице","cat":"Соусы и бульоны","img":"thumb/0620_00_620_photo.webp","lq":"data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAABQBQCdASoUABkAPu1uqlEppiOiqAqpMB2JbACdMoR86A9/pqHHPUmQULXwsX6nLSPVIAAA4liwXUG3x3fxhDDx3JhPnR/+k/p/d/kLCFIvUmeA5pFi/dlN0f/UOpfzEvLkT7vEvtTv0fuRgXHQk8t+d0G4H3h4yKIPp3AsLaWvUI5zAgs1dwHYW1l/je/xuklmLGpLGCYdRWwwomuzSeuaN2nKidYvSklzgfUdMAip9XkYGPCiR75MoiSma1JoqBa4I3XV3Baomex6MvTNJm2IFTgAAA==","w":360,"h":450,"q":"клюквенный соус аромат рождества и идеальная пара к птице на баночку 0 5 л клюква 350 г сахар мусковадо 100 г апельсин 1 шт цедра и сок розмарин 2 веточки корица 1 палочка бадьян 1 звездочка кардамон 4 коробочки ликёр grand marnier 40 г соль щепотка розовый перец щепотка клюквенный соус аромат рождества и идеальная пара к птице клюквенный соус подающийся вместе с праздничной птицей простая функциональная и удивительно устойчивая классика хотя идея жирная птица кислая ягода родилась задолго до появления клюквенного соуса как такового в северной европе к гусям и уткам например традиционно подавали брусничные соусы своей кислотой они прекрасно балансиро","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0620_00_620_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAABQBQCdASoUABkAPu1uqlEppiOiqAqpMB2JbACdMoR86A9/pqHHPUmQULXwsX6nLSPVIAAA4liwXUG3x3fxhDDx3JhPnR/+k/p/d/kLCFIvUmeA5pFi/dlN0f/UOpfzEvLkT7vEvtTv0fuRgXHQk8t+d0G4H3h4yKIPp3AsLaWvUI5zAgs1dwHYW1l/je/xuklmLGpLGCYdRWwwomuzSeuaN2nKidYvSklzgfUdMAip9XkYGPCiR75MoiSma1JoqBa4I3XV3Baomex6MvTNJm2IFTgAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на баночку 0,5 л:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">клюква 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар мусковадо 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">апельсин 1 шт (цедра и сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 2 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">корица 1 палочка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бадьян 1 звездочка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кардамон 4 коробочки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ликёр Grand Marnier 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розовый перец щепотка</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Клюквенный соус, подающийся вместе с праздничной птицей — простая, функциональная и удивительно устойчивая классика, хотя идея “жирная птица + кислая ягода” родилась задолго до появления клюквенного соуса как такового. В Северной Европе к гусям и уткам, например, традиционно подавали брусничные соусы — своей кислотой они прекрасно балансировали жир и оттеняли аромат птицы. Англия поддержала эту идею своими ягодными чатни к дичи, а в Северной Америке, где повсюду росла именно клюква, всё сложилось особенно логично: местная кислая ягода аккуратно встала на место европейской брусники.</p>\n<p>Вариаций у клюквенного соуса столько же, сколько рецептов запечённой утки: каждый сочетает сладость, кислоту и специи по-своему. Версию ниже я собрала под себя, но её можно легко адаптировать под ваши собственные вкусы.</p>\n<p>Подавайте к индейке, утке, курице, свинине, паштетам, сырам — бри и камамберу, да и просто к утренним рождественским тостам.</p>\n<p class=\"lbl\">Учитывайте важные моменты из курса гастрономической химии:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Пектин работает за вас.</span></li></ul>\n<p>Клюква — одна из самых пектиновых ягод. Пектин (природный полисахарид) сам загущает соус при нагревании и в кислой среде, поэтому текстура получается плотной и устойчивой даже при уменьшенном сахаре или изменённом количестве жидкости. Помните только, что для идеальной текстуры (=правильной работы пектина) важны температура и время — варить нужно не меньше 10 и не дольше 20 минут.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Специй не стоит бояться.</span></li></ul>\n<p>Соус имеет водную основу, а вода растворяет ароматические молекулы мягко, не так агрессивно, как жиры. В жировой среде специи раскрываются ярче, во всей силе, в воде дают лишь лёгкий фон, поэтому розмарин, корица, кардамон и бадьян в клюкве звучат деликатно и не перебивают вкус. Никакого глинтвейна и аромата елки.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Клюкву — свежую или замороженную — быстро перебрать, убрать потемневшие ягоды. Переложить в сотейник с толстым дном, всыпать сахар, добавить розмарин, корицу, бадьян и кардамон. С апельсина снять цедру (пока не добавлять), выжать сок — ориентироваться на 80–90 г. Влить сок в сотейник и поставить на средний огонь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Довести смесь до слабого кипения, периодически помешивая, чтобы сахар растворился равномерно и не подгорел снизу. Варить 8–10 минут, затем с помощью толкушки размять ягоды — без фанатизма, часть ягод может остаться цельными.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Влить Grand Marnier, перемешать и варить еще 10 минут. Затем снять с огня, удалить крупные специи (корицу, бадьян, розмарин и кардамон), добавить апельсиновую цедру, соль и перец, перемешать, залить в чистую банку и перевернуть вверх дном на несколько минут. Хранить в холодильнике до десяти дней.</div></div></div></div>"},"633":{"id":633,"title":"Соус матбуха","sub":"основа для [[a:634|шакшуки]]","cat":"Соусы и бульоны","img":"thumb/0633_00_633_photo.webp","lq":"data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAABwBQCdASoUABkAPu1srVCppiQiqAqpMB2JbACdMyYBb4Jm6HoxI3ryAR4BJSqBhkZrMyw4APlTCgPFcu3PgTs/RyIU/5ESpSEmxuafxvVp7vzti40RfuKcFfdzcmyDox1h8Ak2iG8EDHOj6bVBCiqvuodFJzeshr8cZUwBZjLde/ui85xyvczl752+CvHs0brltom0/7+5f6YPOBjjZ1QzU5BOnvQD91UNeMyXryEJGiwDxryJX3oU1mvTl6Ktme8fv/M/qyL2qimCn8BhMjWiaYPgwpCw17XPHoTu5dLWy1UiLWAeAW6uCwAAAA==","w":360,"h":449,"q":"соус матбуха основа для [[a:634|шакшуки]]  оливковое масло 5 ст л лук репчатый 2 шт крупный чеснок 6 зубчиков баклажан 3 шт средние сладкий перец красный 6 шт томаты консервированные целые 2 4 кг томатная паста 1 ст л 30 г паприка хлопья 1 ст л копченая паприка 1 ч л кумин молотый 2 ч л перец урфа 1 ст л сахар ванильный 1 ст л соль свежемолотый чёрный перец соус матбуха основа для a 634 шакшуки 3 часа из них 1 час активного времени моя первая в жизни шакшука случилась в вене в кафе neni на нашмаркте куда мы с подругой отправились утром после веселой ночной экскурсии по венским барам это было гастрономическое озарение которое я не в силах забыть пряный деликатно жгучий томатный соус и горячая пита которой можно было ловить растекающийс ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0633_00_633_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAABwBQCdASoUABkAPu1srVCppiQiqAqpMB2JbACdMyYBb4Jm6HoxI3ryAR4BJSqBhkZrMyw4APlTCgPFcu3PgTs/RyIU/5ESpSEmxuafxvVp7vzti40RfuKcFfdzcmyDox1h8Ak2iG8EDHOj6bVBCiqvuodFJzeshr8cZUwBZjLde/ui85xyvczl752+CvHs0brltom0/7+5f6YPOBjjZ1QzU5BOnvQD91UNeMyXryEJGiwDxryJX3oU1mvTl6Ktme8fv/M/qyL2qimCn8BhMjWiaYPgwpCw17XPHoTu5dLWy1UiLWAeAW6uCwAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 5 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 2 шт (крупный)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 6 зубчиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">баклажан 3 шт (средние)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сладкий перец красный 6 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консервированные целые 2,4 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста 1 ст л (30 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка хлопья 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копченая паприка 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин молотый 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец урфа 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар ванильный 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый чёрный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>~ 3 часа (из них 1 час активного времени)</p>\n<p>Моя первая в жизни шакшука случилась в Вене, в кафе Neni на Нашмаркте, куда мы с подругой отправились утром после веселой ночной экскурсии по венским барам. Это было гастрономическое озарение, которое я не в силах забыть — пряный, деликатно жгучий томатный соус и горячая пита, которой можно было ловить растекающийся желток. Так началась моя несчастная любовь.</p>\n<p>Несчастная — потому что я настолько же сильно люблю есть шакшуку, насколько не люблю её готовить. Дело не в каком-то определенном процессе, отнюдь нет. Просто я люблю быстрые завтраки, вот чтобы встать к плите и минут через 20 уже прихлебывать остывающий чай, сытая и счастливая. В основе же шакшуки лежит соус матбуха (מַטְבּוּחָה‎, matbukha), популярная закуска из североафриканской еврейской кухни, блюдо далеко небыстрое. Само слово по-арабски означает “приготовленное”. По сути, это густой салат-паста из томатов, сладкого перца, чеснока и специй, которые долго тушатся на медленном огне, пока овощи не превратятся в ароматную, чуть сладковатую и слегка острую массу, такой пряный томатный джем. Матбуху едят по-разному: чаще всего как холодную закуску (мезе) с питой, лавашем или халой, намазывают на хлеб или используют в сэндвичах (например, с жареным баклажаном и яйцом, как в сабихе). Она прекрасно работает как гарнир к мясу и рыбе на гриле, к котлетам или запечённой курице, а ещё может служить основой для блюд — в ней тушат фрикадельки или яйца, превращая собственно в шакшуку.</p>\n<p>Прелесть в том, что любое блюдо, которое тушится долго, идеально переносит заморозку. Вот он, мой шанс, подумала я, когда затеяла в Клубе месяц планирования. Один раз у плиты — и месяц еженедельной шакшуки утром! Ну а раз уж делаем впрок, то можно и разгуляться: перцы запечем для великолепного дымного аромата, баклажаны обжарим до золотистости, добавим ворох разнообразных приправ, включая перец урфа — на мой взгляд, это самый подходящий матбухе вид остроты. Не обжигающий, а сладкий и деликатный.</p>\n<p>ps. Перед всеми, кто считает, что баклажанов в аутентичной шакшуке быть не должно, я прошу прощения. Та Великая Шакшука из Neni была с баклажанами, и я с тех пор не признаю другие.</p>\n<p class=\"lbl\">на 12 завтраков:</p>\n<p>или 4 порции соуса по ~750 г</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 220–230 (режим верх/низ), либо самый мощный гриль. Перцы уложить на противень и запекать, пока кожица не начнёт пузыриться и чернеть (20–25 минут, пару раз перевернуть в процессе). Переложить горячие перцы в миску и накрыть плёнкой/крышкой на 10 минут — так кожица легче снимется. Очистить от кожицы и семян, мякоть крупно нарубить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Баклажаны нарезать средними кубиками, хорошо посолить, переложить в дуршлаг, установленный над тарелкой, и оставить так на 15–20 минут, затем промокнуть бумажными полотенцами. Разогреть в широкой сковороде оливковое масло (4 ст л) и обжарить баклажаны до золотистости и мягкости, примерно 10 минут. Отложить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук и чеснок очистить и мелко нарезать. В широкой жаропрочной кастрюле, чугунке или глубокой сковороде с толстым дном разогреть 4 столовых ложки оливкового масла и обжарить лук на оливковом масле 10–12 минут до мягкого золотистого состояния. Добавить чеснок, жарить с минуту. Всыпать два вида паприки, кумин и перец урфа — прогреть 30 секунд, затем добавить томатную пасту и обжаривать еще полминуты.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Туда же выложить консервированные томаты (размять их лопаткой или ложкой), ваниль и соль. Убавить огонь и тушить 10 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В соус вмешать запечённые перцы и обжаренные баклажаны, перемешать, попробовать на вкус (соль, сладость, острота) и скорректировать, если нужно.</div></div>\n<p>всё не поместилось, продолжаю в комментариях</p>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Поставить кастрюлю без крышки в духовку и держать там при 170 градусах (режим: верх/низ) полтора часа. Смесь уварится, станет более густым и суперконцентрированным, с мягким сладко-дымным вкусом.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Снять с огня, остудить, разлить по заготовленным формам (зип-пакеты или контейнеры) и убрать в морозилку, не забыв подписать дату изготовления. Хранить до трёх месяцев.</div></div></div></div>"},"656":{"id":656,"title":"Бёр-нуазет","sub":"beurre noisette","cat":"Соусы и бульоны","img":"thumb/0656_00_656_video.webp","lq":"data:image/webp;base64,UklGRrQAAABXRUJQVlA4IKgAAABQBQCdASoUABQAPu1urlKppiQiqAgBMB2JZQDA3Yyod7UN+z5VkSXXGMCDC2EZRKqYYAAA/jDWruLtSzPaNFt1Vbhw7/IdPZzLPiDETwjoT5LlKGE5/prphid2nSFpX7pb2v+vXOIWFSC8iqIpYI+E4f8SLUFypk8hLG6XcgtmctzMkM6WpYnSOUUongFl9UNOb4/GmL2kHC6S57zCRS9eguq2fpm9AAA=","w":320,"h":320,"q":"бёр-нуазет beurre noisette бёр нуазет beurre noisette однажды я проходила обучение у шеф кондитера nicolas bachere и ему ассистировала переводчица которая знала французский но никогда не работала на кондитерских мастер классах когда мы обсуждали мадлен она упорно раз за разом повторяла фундучное масло и аудитория всё не могла понять о каком таком фундучном масле она говорит beurre noisette действительно переводится с французского как фундучное масло однако никаких орехов в нем нет выделите полчаса своего времени чтобы освоить приготовление этого масла и вы получите самый наглядный ответ на вопрос что такое французская кухня ","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"320\" height=\"320\" src=\"thumb/0656_00_656_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0656_01_657_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"320\" height=\"320\" src=\"thumb/0656_02_658_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"359\" src=\"thumb/0656_03_659_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"320\" height=\"320\" src=\"thumb/0656_04_660_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"359\" src=\"thumb/0656_05_661_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Однажды я проходила обучение у шеф-кондитера Nicolas Bachere, и ему ассистировала переводчица, которая знала французский, но никогда не работала на кондитерских мастер-классах. Когда мы обсуждали мадлен, она упорно, раз за разом, повторяла “фундучное масло”, и аудитория всё не могла понять, о каком таком фундучном масле она говорит.</p>\n<p>Beurre noisette действительно переводится с французского как фундучное масло, однако никаких орехов в нем нет. Выделите полчаса своего времени, чтобы освоить приготовление этого масла, и вы получите самый наглядный ответ на вопрос, что такое французская кухня.</p>\n<p>Обычный продукт + немного химии + немного мастерства повара = великолепный продукт.</p>\n<p>1️⃣ Масло в количестве 150 грамм (можно и больше, но начните с малого) нужно нарезать крупными кусочками и сложить в сотейник с толстым дном. Поставить на средний огонь и постараться не отвлекаться в ближайшие несколько минут.</p>\n<p>2️⃣ Сначала под воздействием тепла масло перейдет из твердой формы - в жидкую, то есть полностью растает.</p>\n<p>3️⃣ Затем масло нагреется и начнёт кипеть, из него начнёт выпариваться вода, а на поверхность поднимется белая пенка - это денатурированные белки (да-да, примерно как в курином бульоне).</p>\n<p>4️⃣ В сливочном масле содержится от 13 до 17 % воды, которая должна уйти, прежде чем температура жира поднимется настолько, чтобы “зажарить” сывороточные белки. Как только масло достигнет температуры 100°C, вода начнёт испаряться гораздо быстрее. Масло будет пузыриться и может начать разбрызгиваться, ваша задача - вращать сотейник, приподнимая его, чтобы все пузырьки выходили.</p>\n<p>5️⃣ Если вы уверены в своих силах, то можете увеличить температуру до высокой или средне-высокой, хотя при более высокой температуре масло из идеального превратится в подгоревшее гораздо быстрее. Мой совет - на первых порах держать сотейник на среднем или даже низко-среднем огне, наблюдать и запоминать.</p>\n<p>6️⃣ Через несколько минут масло начнет пениться. Тут опять же надо следить, встряхивать сотейник или помешивать масло лопаткой, чтобы будущие твердые молочные частицы не прилипли к стенкам и дну (если прилипнут, быстро сгорят, если быстро сгорят - испортят).</p>\n<p>7️⃣ И вот где-то в этом моменте и произойдет магия! Когда температура масла приблизится к отметке в 140 градусов, неминуемо и стремительно произойдет реакция Майяра - аминокислоты в сывороточных белках вступят в реакцию с молочными сахарами, затвердеют и выпадут в осадок- вы увидите эти мелкие золотистые крошечки, плавающие в жире. Масло - совершенно внезапно! - начнёт пахнуть орехами, поджаренными тостами и вообще счастьем.</p>\n<p>8️⃣ Скорее выключайте огонь! Не позвольте остаточному теплу превратить золотистые крошечки в черные, иначе масло будет испорчено. С помощью маленького сита процедите масло в подходящий контейнер. Можно убирать в холод и радоваться - теперь у вас есть волшебное масло бёр нуазет, которое может превратить самые ординарные кексы - в жемчужину, а ваш новогодний бутерброд с икрой - в деликатес.</p>\n<p>Об этом - завтра 😉</p></div>"},"689":{"id":689,"title":"Майонез","sub":"mayonnaise","cat":"Соусы и бульоны","img":"thumb/0689_00_689_photo.webp","lq":"data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAAAwBQCdASoUABQAPu1ur1IppiQiqAgBMB2JQBb3MW0OHRbH5xML3/qgrlH/6NS/EzcDIAD+6OZWBEsA+SS+b/dTveGiVoN+IX+b6LfxjdKKKZZ/nEgO6YI613mzKJh9wdLj/uVQrgyUYlqV1/grCO+5Q/VTOOZsC9OONTC8kiZ+MuB0CUo7vg0i5Pg+hb3K8OtXfBVeqG1fQV3ZByNELMHvksG23/Db+C9UuAVW3ZtlPGOlKTtveYgwnTE+jDgLYhuuxMh13DkZWpdg4EjRhi3rJL76hIAA","w":360,"h":360,"q":"майонез mayonnaise  нейтральное растительное масло рапсовое или подсолнечное 220 г оливковое масло 80 г желток 2 шт горчица дижонская 2 ч л лимонный сок или белый винный уксус 2 ст л соль 1 2 чл белый перец 1 4 чл вода погружной блендер венчик красивая баночка для хранения майонез mayonnaise у моего сына есть книга маши рупасовой под названием сказки о царе колбаске я честно сказать её обожаю но касаемо одной главы с автором у меня идеологические разногласия дело в том что главным злодеем в ней является майонез и на мой взгляд это совершенно несправедливо там есть такие строчки вы все дяди и тети в майонез нырнете станете майонезными жирными и непол","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"639\" src=\"img/0689_00_689_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAAAwBQCdASoUABQAPu1ur1IppiQiqAgBMB2JQBb3MW0OHRbH5xML3/qgrlH/6NS/EzcDIAD+6OZWBEsA+SS+b/dTveGiVoN+IX+b6LfxjdKKKZZ/nEgO6YI613mzKJh9wdLj/uVQrgyUYlqV1/grCO+5Q/VTOOZsC9OONTC8kiZ+MuB0CUo7vg0i5Pg+hb3K8OtXfBVeqG1fQV3ZByNELMHvksG23/Db+C9UuAVW3ZtlPGOlKTtveYgwnTE+jDgLYhuuxMh13DkZWpdg4EjRhi3rJL76hIAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">нейтральное растительное масло (рапсовое или подсолнечное) 220 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">оливковое масло 80 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">желток 2 шт</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">горчица дижонская 2 ч л</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">лимонный сок (или белый винный уксус) 2 ст л</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">соль 1/2 чл</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">белый перец 1/4 чл</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">вода</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">погружной блендер</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">венчик</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">красивая баночка для хранения</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>У моего сына есть книга Маши Рупасовой под названием «Сказки о Царе Колбаске». Я, честно сказать, её обожаю, но касаемо одной главы с автором у меня идеологические разногласия. Дело в том, что главным злодеем в ней является Майонез, и, на мой взгляд, это совершенно несправедливо. Там есть такие строчки:</p>\n<p>Вы все, дяди и тети,<br>В майонез нырнете.<br>Станете майонезными,<br>Жирными и неполезными.</p>\n<p>Что ж, Маша Рупасова явно никогда не ела настоящий майонез. На самом деле этот классический французский соус отнюдь не жирный и очень даже полезный. Он богат витаминами A, E, D, антиоксидантами, полиненасыщенными жирными кислотами, фолиевой кислотой и селеном. Главное, как и во всём, знать меру!</p>\n<p class=\"lbl\">Маленькие tips перед тем как вы начнете:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Лучший девайс для приготовления майонеза - погружной блендер. Сделать его вручную можно, но результат может огорчить. Если вы за неимением блендера хотите попробовать сделать его в кухонном комбайне, напишите мне, я расскажу как.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Не заменяйте рапсовое/подсолнечное масло оливковым! Оливковое масло нельзя пробивать блендером, так как расщепляясь на молекулы, оно приобретает очень сильную горечь. Лучше всего делать майонез на нейтральном масле, а затем для вкуса и аромата вмешивать вручную оливковое.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Не жалейте соли. Майонез должен быть соленым (не путать с пересоленным!)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Это должно быть само собой разумеющимся, но я подчеркну - все продукты должны быть свежими, это очень важно. Не используйте домашние яйца и не ешьте майонез вообще, если вы тревожная беременная.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">Когда вы работаете с сырыми яйцами (я сейчас не шучу) - делаете голландез, майонез, беарнез или что-то ещё на -ез, вы должны быть спокойны. Я не знаю, как это работает, но яйца не любят нервных и обеспокоенных. Включите джаз, выключите фоновый шум из мыслей, думайте только о том, что делаете. Пусть это будет ещё одна ваша кулинарная медитация.</span></li></ul>\n<p>Итак,</p></div><p>а также</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В узкую высокую ёмкость добавить горчицу, 1 ст л лимонного сока, 1 ст л воды и желтки. Поставить блендер так, чтобы лопасть накрыла желтки и затем, не двигая и вообще не трогая блендер, тонкой струйкой вылить сверху растительное масло. Начать процесс эмульгирования - включить блендер в том же положении и затем потихоньку поднимать его наверх, следя за тем, чтобы водоворот, образуемый блендером, захватывал все больше и больше масла. Убедиться в том, что вся масса загустела и посветлела.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Установить миску на устойчивую поверхность (самый простой вариант - кастрюля, выстланная полотенцем) и начать понемногу вливать оливковое масло, непрерывно помешивая венчиком. Вы можете контролировать вкус вашего будущего майонеза в зависимости от предпочтений: но помните, если добавить слишком много оливкового масла, он может начать горчить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить столовую ложку лимонного сока и столовую ложку воды, соль, перец, всё хорошо перемешать венчиком и переложить в красивую баночку.</div></div><div class=\"outrop\"><p>Срок хранения майонеза в холодильнике (attention: не на дверце!) - до 2 недель.</p>\n<p>Рецепт самой продаваемой закуски в парижских бистро - яиц с майонезом - soon!</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0689_01_690_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0689_02_691_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0689_03_692_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0689_04_693_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0689_05_694_photo.webp\" alt=\"\"></figure></div>"},"777":{"id":777,"title":"Голландский соус","sub":"hollandaise","cat":"Соусы и бульоны","img":"thumb/0777_00_777_photo.webp","lq":"data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAABwBQCdASoUABkAPu1ur1KppiQiqAgBMB2JZgCdKK0VzQPHlRA/xRSKQ86te8vyU1KcX4LQAPRyqZ5wfQQwJuLho1475fQjEVMZAlwW2rbzG9W3CyX+P2W/k9kIuBwm6cUxEBZVRCgczeCdWWcvcwmjcaA6/A5te8NfGWeKs07/opgJFmW8GSfMWOgBjfDJUC7oxJVO9Qkhr1eWkxuRHEPV0Wvf5FqQQAE78TweVehO/Y9cJGk3vh9nHg2/RUbTymJ6ZHjT/GuRYrDMGgHIAAAA","w":360,"h":450,"q":"голландский соус hollandaise на 6 8 порций желтки 4 шт масло сливочное 300 г 230 250 г горячего топленого масла вода горячая 1 ст л лимонный сок 2 ст л соль белый или кайенский перец голландский соус hollandaise","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0777_00_777_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtwAAABXRUJQVlA4INAAAABwBQCdASoUABkAPu1ur1KppiQiqAgBMB2JZgCdKK0VzQPHlRA/xRSKQ86te8vyU1KcX4LQAPRyqZ5wfQQwJuLho1475fQjEVMZAlwW2rbzG9W3CyX+P2W/k9kIuBwm6cUxEBZVRCgczeCdWWcvcwmjcaA6/A5te8NfGWeKs07/opgJFmW8GSfMWOgBjfDJUC7oxJVO9Qkhr1eWkxuRHEPV0Wvf5FqQQAE78TweVehO/Y9cJGk3vh9nHg2/RUbTymJ6ZHjT/GuRYrDMGgHIAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6-8 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">желтки 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 300 г (~230-250 г горячего топленого масла)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода горячая 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый или кайенский перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сливочное масло, нарезанное на небольшие кусочки, растопить на среднем огне (не доводить до кипения, просто растопить). Процедить в миску или мерный стакан так, чтобы в сите осталась часть белого налёта. Важный момент: после перетапливания и процеживания масла на дне миски или мерного стакана останется белёсый осадок, его не надо добавлять к соусу, он должен остаться в посуде - добавляем только жёлтую, золотистую часть масла. Если вы делаете и храните запасы топленого масла или масла гхи, можно сразу использовать его, но оно обязательно должно быть горячим - нагрейте предварительно!</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В высокий стакан для блендера поместить желтки комнатной температуры, добавить соль, щепотку белого или кайенского перца, горячую воду и лимонный сок и пробить блендером до однородности.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Затем работаем по следующей технологии (см. видео!): не поднимая насадку блендера, включаем его и начинаем вливать горячее масло. По мере добавления масла потихоньку поднимаем насадку так, чтобы лезвия блендера захватывали все больше и больше жидкости, превращая её в блестящий густой соус. Тщательно проходим блендером по всему объему соуса, убеждаясь в том, что текстура однородная.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Переложить соус в керамический или стеклянный сотейник/чашку, накрыть крышкой и держать в тёплом месте до подачи не более 2 часов (я храню в духовке на режиме “Поддержание тепла”, это 60 градусов).</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0777_01_778_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0777_02_779_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0777_03_780_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0777_04_781_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0777_05_782_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"790":{"id":790,"title":"Овощной бульон","sub":"","cat":"Соусы и бульоны","img":"thumb/0790_00_790_photo.webp","lq":"data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABQBgCdASoUABsAPu1sqk8ppiOiMBgIATAdiWwAuy+AbP88AMZeNr9TbxTYo+cWrydErjoDLf5e8X1rAAD+fC2vmQo353DXg+r6IJjz8CvKTHnFeyQTEdIGRy9a3CdB9ENMd+rTVUTW/Oz6mWzrGF/8m1Fm4bm6mYqoIk1HvgbN+LOITuRB0yz4wYNS/Nn6Coj4UO+Wc6eV63jxWZwmJ3RLuNu2sLKztQxpKUsDmS7ZldFiwvyT/53yGRVQLbOfSYffVevJUnVucJ3kscBu3wTIBwFBiaJTix50U7fFleNHk+dugAr9qaRpCzxGBDIB7ahBAo9V9oAAAA==","w":360,"h":480,"q":"овощной бульон  на 1 5 л бульона морковь 3 шт лук 1 шт сельдерей 4 шт белые грибы суш 10 г или шампиньоны 200 г зеленое яблоко 2 шт помидор средний 2 шт лавровый лист 1 шт перец горошком 1 ч л петрушка 5 6 стеблей с листьями тимьян 5 6 веточек розмарин 1 2 веточки лемонграсс 1 стебель соевый соус 2 ст л желатин 10 15 г вода 2 5 л овощной бульон для полной коллекции бульонов в клубе не хватало овощного и наш с вами месяц овощей отличный повод это исправить хочется начать разочаровывающе возлагать на это варево больших гастрономических надежд не стоит после концентрированного говяжьего и золотого куриного овощной бульон может показаться блеклым и по цвету и по вкусу но это конечно не повод его игнорировать овощно","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"600\" height=\"800\" src=\"img/0790_00_790_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABQBgCdASoUABsAPu1sqk8ppiOiMBgIATAdiWwAuy+AbP88AMZeNr9TbxTYo+cWrydErjoDLf5e8X1rAAD+fC2vmQo353DXg+r6IJjz8CvKTHnFeyQTEdIGRy9a3CdB9ENMd+rTVUTW/Oz6mWzrGF/8m1Fm4bm6mYqoIk1HvgbN+LOITuRB0yz4wYNS/Nn6Coj4UO+Wc6eV63jxWZwmJ3RLuNu2sLKztQxpKUsDmS7ZldFiwvyT/53yGRVQLbOfSYffVevJUnVucJ3kscBu3wTIBwFBiaJTix50U7fFleNHk+dugAr9qaRpCzxGBDIB7ahBAo9V9oAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 1,5 л бульона:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белые грибы (суш.) 10 г или шампиньоны 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зеленое яблоко 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидор средний 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 5-6 стеблей (с листьями)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 5-6 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1/2 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лемонграсс 1 стебель</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желатин 10-15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 2,5 л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Для полной коллекции бульонов в Клубе не хватало овощного, и наш с вами месяц овощей — отличный повод это исправить. Хочется начать разочаровывающе — возлагать на это варево больших гастрономических надежд не стоит. После концентрированного говяжьего и золотого куриного овощной бульон может показаться блеклым и по цвету, и по вкусу, но это, конечно, не повод его игнорировать. Овощной бульон может прекрасно соседствовать в морозилке со своими мясными товарищами и ждать, пока вы используете его для цветастого минестроне или писту, сварите с ним киноа, булгур, сделаете тыквенное карри или красивое овощное ризотто. В овощной бульон можно класть совершенно разные овощи, за исключением, пожалуй, всех видов крестоцветных и болгарского перца, так как они перетянут всё внимание на себя. Мой любимый набор — в рецепте ниже. Важные грани вкуса, придающие бульону глубину - это кислота (я беру помидоры и зеленые яблоки) и умами (я беру грибы и соевый соус).</p>\n<p class=\"lbl\">NOTES:</p></div><div class=\"note\"><i class=\"bul\">📍</i>Все овощи на первом этапе можно немного обуглить в кастрюле или чугунке, тогда бульон будет более насыщенного цвета и с немного более выраженным вкусом, однако я этот шаг всегда пропускаю — мне достаточно и классического варианта.</div>\n<div class=\"note\"><i class=\"bul\">📍</i>Обычно для умами-вкуса я беру ножки шампиньонов (200 г), которые не выбрасываю, а храню в зип-пакете в морозилке, но в этот раз их не оказалось, поэтому взяла сушеные белые грибы. Если что, ножки от шампиньонов появятся у вас уже на этой неделе, когда мы будем делать тёплый салат.</div>\n<div class=\"note\"><i class=\"bul\">📍</i>Желатин, добавляемый в конце варки, дает жидкости приятную плотность костного бульона, это будет плюсом при использовании бульона в соусах и супах, но этот шаг опциональный.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Самое первое, что нужно сделать, приступая к овощному бульону - тщательно, даже с фанатизмом отмыть все овощи. Мы не будем очищать морковь и не будем обрезать кончики сельдерея, но очень хорошо все промоем. Луковицу очистить от внешней грязной кожуры, но оставить внутреннюю, она даст красивый цвет. Морковь и сельдерей крупно нарубить, помидоры разрезать пополам, яблоки - на четвертинки.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В большую кастрюлю сложить все ингредиенты за исключением соевого соуса и желатина, залить водой, поставить на сильный огонь и довести до кипения. Как только вода закипит, убавить до минимума и, не закрывая крышкой, варить полтора часа. Убрать кастрюлю с плиты, добавить соевый соус, накрыть крышкой и оставить бульон настаиваться еще полтора часа.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">По прошествии этого времени извлечь из бульона овощи и процедить. Можно хорошенько размять овощи, чтобы извлечь больше жидкости, но тогда бульон будет непрозрачный. Если сильно остыл, подогрейте, пржде чем добавлять желатин.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Добавить предварительно замоченный в ледяной воде желатин (1 к 6, если берете порошковый (10 грамм), и просто в воде, если листовой (15 грамм)). Разлить по контейнерам и формочкам в морозилку или использовать сразу.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0790_01_791_photo.webp\" alt=\"\"></figure></div>"},"492":{"id":492,"title":"Фруктовая горчица","sub":"инжир с бальзамическим уксусом","cat":"Заготовки","img":"thumb/0492_00_492_photo.webp","lq":"data:image/webp;base64,UklGRrwAAABXRUJQVlA4ILAAAABQBQCdASoUABkAPu1or1AppaSiqAqpMB2JYwDFCyGBbsXTx5zNj9lFqtFQovLx05sS3ZgA/udAqraCpr+qA71Wf7w6zMMl0KNu8O8HHx6P3olzWcNtiG7l9RHLQXdI06zD9SFcmpY/3OEyG7OJ0gZqCpTfjgWKjrXJn4e/Bns1Nxjid2/TpSyWaHoKrGQ1a5dwuGXewal4nMWnDqMROuEywOussmiCzYQuQfbJAAvAAA==","w":360,"h":450,"q":"фруктовая горчица инжир с бальзамическим уксусом на 2 небольшие баночки свежий инжир 500 г спелый коричневый сахар 90 г 45 45 бальзамический уксус 35 г лимонный сок 20 г семена жёлтой горчицы 7 г горчичный порошок 2 ч л соль 2 г свежемолотый черный перец фруктовая горчица инжир с бальзамическим уксусом","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0492_00_492_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrwAAABXRUJQVlA4ILAAAABQBQCdASoUABkAPu1or1AppaSiqAqpMB2JYwDFCyGBbsXTx5zNj9lFqtFQovLx05sS3ZgA/udAqraCpr+qA71Wf7w6zMMl0KNu8O8HHx6P3olzWcNtiG7l9RHLQXdI06zD9SFcmpY/3OEyG7OJ0gZqCpTfjgWKjrXJn4e/Bns1Nxjid2/TpSyWaHoKrGQ1a5dwuGXewal4nMWnDqMROuEywOussmiCzYQuQfbJAAvAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 небольшие баночки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежий инжир 500 г спелый</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 90 г (45+45)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 35 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена жёлтой горчицы 7 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчичный порошок 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 2 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Инжир вымыть, обсушить, удалить хвостики и нарезать максимально мелкими кусочками, переложить в миску. Добавить половину коричневого сахара, хорошо перемешать и оставить минимум на один час, чтобы инжир начал отдавать сок (если есть время, лучше оставить на всю ночь)</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Оставшийся коричневый сахар смешать в сотейнике с бальзамическим уксусом, поставить на средний огонь и прогреть до полного растворения сахара. Дать смеси покипеть буквально пару минут, чтобы она стала чуть гуще.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить инжир вместе с выделившимся соком, перемешать и готовить на небольшом огне примерно 10–15 минут, периодически помешивая. Когда будет казаться, что плоды хорошо размягчились, без всякого фанатизма пробить массу блендером, быстро, оставляя небольшие кусочки для интересной текстуры.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Семена горчицы слегка растолочь в ступке, оставляя часть практически целыми. Добавить их к инжиру вместе с лимонным соком, свежемолотым черным перцем и солью, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Снять сотейник с огня и дать массе немного остыть. Горчичный порошок развести небольшим количеством холодной воды до консистенции густой кашицы, оставить на 5–10 минут, а затем тщательно вмешать в уже не горячую инжирную массу. Попробовать на соль, если нужно — досолить.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Переложить инжирную горчицу в чистые сухие банки, полностью остудить и убрать в холодильник. Хранить в плотно закрытой банке до месяца.</div></div></div></div>"},"501":{"id":501,"title":"Ферментированный овощной салат","sub":"дача, лето, бабушка","cat":"Заготовки","img":"thumb/0501_00_501_photo.webp","lq":"data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAACQBQCdASoUABkAPuVepU2pJSOiMAwBIByJbACdMoMzG0f9vDzxqBftfr9F/w8TeQqqRhHQAAD+rr6oL/pS3NWgLAdrJU1SoEgyR2PqhxlKgemIzWPX/a7ATyBE20Y96Xo1rRbRX4EEOtDrd6n5ICs6UdIM9Up/jncTg2V3PmxwaXQQ9elgs9WxZqzogUbonga+CfrFSFwKorG2us9dwOjdUm0Eq4X6NUqmj/29aiTWR2DvC7iefl0vrFWjqJAA","w":360,"h":450,"q":"ферментированный овощной салат дача, лето, бабушка на 2 литровую банку капуста белокочанная 1 шт 2 кг огурец 2 шт морковь 2 шт перец сладкий 2 шт соль 36 г укроп горсть опционально укропные зонтики листья смородины ферментированный овощной салат дача лето бабушка вполне возможно кто то из старшего поколения вашей семьи делал такой салат ведь его идею мне подсказала мама это был самый ходовой летний салат в маминой семье капусту морковь огурцы и красный сладкий перец нарезали тонкими полосками засаливали в огромных тазах мяли потом укладывали по банкам и хранили в погребе похожим образом делали","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0501_00_501_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsoAAABXRUJQVlA4IL4AAACQBQCdASoUABkAPuVepU2pJSOiMAwBIByJbACdMoMzG0f9vDzxqBftfr9F/w8TeQqqRhHQAAD+rr6oL/pS3NWgLAdrJU1SoEgyR2PqhxlKgemIzWPX/a7ATyBE20Y96Xo1rRbRX4EEOtDrd6n5ICs6UdIM9Up/jncTg2V3PmxwaXQQ9elgs9WxZqzogUbonga+CfrFSFwKorG2us9dwOjdUm0Eq4X6NUqmj/29aiTWR2DvC7iefl0vrFWjqJAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 литровую банку:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">капуста белокочанная 1 шт (~2 кг)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурец 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец сладкий 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 36 г*</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп горсть</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">опционально:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">укропные зонтики</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">листья смородины</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Вполне возможно, кто-то из старшего поколения вашей семьи делал такой салат, ведь его идею мне подсказала мама. Это был самый “ходовой” летний салат в маминой семье — капусту, морковь, огурцы и красный сладкий перец нарезали тонкими полосками, засаливали в огромных тазах, мяли, потом укладывали по банкам и хранили в погребе, похожим образом делали и закрутки на зиму.</p>\n<p>На закрутки не замахиваюсь, всего лишь хочу разнообразить ваш ферментационный арсенал этой прекрасной версией коул слоу. Делается быстро, ферментируется тоже, вкус — концентрированно летний, дачный, южный, какой-то очень родной.</p>\n<p>Бонусом ко вкусу в одной такой банке собирается достойный набор микронутриентов: витамин C из капусты и сладкого перца, бета-каротин из моркови, витамин K и фолаты из зелени, плюс калий, клетчатка и органические кислоты, образующиеся в процессе ферментации. Доставайте мандолину.</p></div><p>*обязательно делать пересчет под точный вес ваших овощей!</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Подготовить рабочее место — вымытую и тщательно обсушенную стеклянную или керамическую банку, доску, нож и/или мандолину.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">С капусты снять верхние грязные листья, один из наиболее чистых листиков сохранить. Морковь, огурец и перец вымыть, обсушить. Все овощи мелко нашинковать с помощью ножа и/или мандолины. Красивее всего в этом салате смотрятся тонкие длинные полосочки, но это лишь вопрос эстетики, нарезать овощи можно любым способом. Укроп очень мелко нарубить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Все нашинкованные овощи переложить в большую миску или кастрюлю и взвесить на весах. Добавить мелкую не йодированную соль из расчета 18 гр на 1 кг овощей. Тщательно вмассировать соль в овощи и оставить так на 20-30 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">По прошествии времени добавить укроп, перемешать, плотно утрамбовать овощи в банку вместе с выделившимся соком. Если у вас есть укропные зонтики или молодые листья смородины, можно уложить их на дно банки, это даст лучший результат.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Из сохраненного капустного листа вырезать круг по диаметру вашей банки, положить на овощи, прижать и добавить сверху какой-нибудь груз. Закрыть банку не герметично или использовать специальную крышку для ферментации с клапаном. Поставить на тарелку — в первые дни рассол будет вытекать.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Пробовать можно начинать уже с третьего дня. Когда кислота станет той стадии, что вам нравится, переложить салат в чистые сухие банки и хранить в холодильнике. Подавать — с ароматным растительным маслом или без ничего, и так и так будет вкусно и очень по-летнему.</div></div></div></div>"},"510":{"id":510,"title":"Томатный джем","sub":"с ванилью и кардамоном","cat":"Заготовки","img":"thumb/0510_00_510_photo.webp","lq":"data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAABwBQCdASoUABkAPu1qq1EppaOiqAqpMB2JQBf9sX1N3sczLi0YsDpyI4tYW/N6GvjpQXAAAP7et3u1LvY3T8ouqLGyH31C+YiVZI781lzEdih/lCnzru8miHSBztrqRU8oKSSrYNdnWoBJ1Rt9bwRLkdwN4vaZnaqre8KvmwHpq1/1tASvbjPs4eX5nvLCiP8T5glfOgbv5NLxMO5fz8WPBEU9+sbXNpriwj173sSQ5RQ5h+p9Ue60ZkTM0xTUuXCet5dZ2rFHsoEEa7AAAA==","w":360,"h":450,"q":"томатный джем с ванилью и кардамоном на 3 4 баночки по 250 мл томаты 2 кг 1 5 кг нетто сахар белый 250 г сахар коричневый 130 г уксус яблочный 60 г лимон 1 шт сок соевый соус 1 ст л ваниль 1 стручок кардамон 1 2 ч л корица 1 2 ч л томатный джем с ванилью и кардамоном","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0510_00_510_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtoAAABXRUJQVlA4IM4AAABwBQCdASoUABkAPu1qq1EppaOiqAqpMB2JQBf9sX1N3sczLi0YsDpyI4tYW/N6GvjpQXAAAP7et3u1LvY3T8ouqLGyH31C+YiVZI781lzEdih/lCnzru8miHSBztrqRU8oKSSrYNdnWoBJ1Rt9bwRLkdwN4vaZnaqre8KvmwHpq1/1tASvbjPs4eX5nvLCiP8T5glfOgbv5NLxMO5fz8WPBEU9+sbXNpriwj173sSQ5RQ5h+p9Ue60ZkTM0xTUuXCet5dZ2rFHsoEEa7AAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 баночки по 250 мл:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты 2 кг (~ 1,5 кг нетто)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар белый 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар коричневый 130 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус яблочный 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ваниль 1 стручок</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кардамон 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">корица 1/2 ч л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">На каждом томате сделать неглубокий крестообразный надрез. Залить кипятком на 1–2 минуты, затем сразу переложить в ледяную воду. Снять кожицу и крупно нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Переложить томаты в широкую кастрюлю с толстым дном, добавить белый и коричневый сахар, яблочный уксус, соевый соус, семена ванили вместе со стручком, кардамон и корицу. Перемешать и оставить на 20–30 минут (в идеале оставить на ночь).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Поставить кастрюлю на средний огонь, довести до кипения, периодически помешивая до полного растворения сахара.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Уменьшить нагрев до небольшого и варить без крышки около 90-120 минут, периодически помешивая. В последние 20 минут нужно делать это чаще, так как джем начнет активно густеть. Готовый джем должен заметно уменьшиться в объеме, стать густым и блестящим. Если провести лопаткой по дну кастрюли, след от нее будет недолго держаться.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Удалить стручок ванили, добавить сок лимона, тщательно перемешать и проварить еще 3 минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Разложить кипящий джем по заранее простерилизованным банкам, сразу плотно закрыть крышками, перевернуть вверх дном и оставить до полного остывания. Если долго хранить джем вы не планируете, то просто разложить по баночкам и убрать в холодильник.</div></div></div></div>"},"594":{"id":594,"title":"Малосольные огурцы","sub":"","cat":"Заготовки","img":"thumb/0594_00_594_photo.webp","lq":"data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAAAQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JZgCdISBDgbUwiVzXPO75FNnYU2m1ZpoKTLpQKME5yxAA/sWuXrcremxeKKUEZSqSzvDvUJ1QIEkjjS5ldSHR2CP00sWykoYoSIdFPzPAuvVxPoqx1PtHEGrM413W2chrhBazb2sdI2pcJqKpagXany404xQnoXDceOVicvig6YLyciYWkoKJGt61wa+pvvBTA4rk8777HG8DigpenTGgwShs/OabZePLrEwS5KfHTWsgDgHMcklNtw+vUXDmlawB9Ve1gW+uYPgZEMg1fVuregAAAA==","w":360,"h":450,"q":"малосольные огурцы  на банку 3 л огурцы короткоплодные 1 1 5 кг вода холодная 1 л соль 40 г укроп большой пучок лучше с зонтиками листья смородины 5 8 шт опционально чеснок 6 8 зубчиков семена фенхеля 1 2 ч л опционально малосольные огурцы прежде чем мы приступим небольшой ликбез очень важно понимать что тот самый хруст малосольных огурчиков создают не пузырьки и не какие то особые добавки а высокое внутреннее давление в клетках огурца его называют тургором именно поэтому самыми хрустящими получаются свежесобранные огурцы пока овощ свежий его клетки наполнены водой поэтому он остаётся плотным и ломким м","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0594_00_594_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAAAQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JZgCdISBDgbUwiVzXPO75FNnYU2m1ZpoKTLpQKME5yxAA/sWuXrcremxeKKUEZSqSzvDvUJ1QIEkjjS5ldSHR2CP00sWykoYoSIdFPzPAuvVxPoqx1PtHEGrM413W2chrhBazb2sdI2pcJqKpagXany404xQnoXDceOVicvig6YLyciYWkoKJGt61wa+pvvBTA4rk8777HG8DigpenTGgwShs/OabZePLrEwS5KfHTWsgDgHMcklNtw+vUXDmlawB9Ve1gW+uYPgZEMg1fVuregAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на банку 3 л:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурцы короткоплодные ~1-1,5 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода холодная 1 л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп большой пучок (лучше с зонтиками)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">листья смородины 5-8 шт опционально</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 6-8 зубчиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена фенхеля 1/2 ч л опционально</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Прежде чем мы приступим, небольшой ликбез. Очень важно понимать, что тот-самый-хруст малосольных огурчиков создают не пузырьки и не какие-то особые добавки, а высокое внутреннее давление в клетках огурца (его называют тургором), именно поэтому самыми хрустящими получаются свежесобранные огурцы. Пока овощ свежий, его клетки наполнены водой, поэтому он остаётся плотным и ломким. Мы, городские жители, немножко обманем природу и замочим огурцы в очень холодной воде: так они успеют восполнить небольшую часть потерянной влаги и станут чуть более упругими (и хрустящими).</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: если хочется немного ускорить процесс засолки, можно использовать сильно газированную минеральную воду вместо обычной. Благодаря растворённому углекислому газу рассол становится немного более кислым, поэтому соль быстрее проникает внутрь огурцов. Однако на их хрустящесть пузырьки никак не влияют — за неё отвечают исключительно свежесть огурцов и правильная подготовка.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Огурцы тщательно вымыть и залить очень холодной водой минимум на 2 часа. Если огурцы были собраны не сегодня или успели немного подвянуть, можно оставить их в воде на 4–6 часов.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Перед засолкой срезать кончики с двух сторон — так рассол быстрее проникнет внутрь, и огурчики просолятся равномернее.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Чеснок разобрать на зубчики и очистить. Укроп и листья смородины промыть, обсушить и хорошенько промять в руках, выуживая аромат.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">На дно чистой банки выложить половину укропа, половину листьев смородины и несколько зубчиков чеснока. Плотно уложить огурцы, стараясь заполнять всё пространство. Сверху добавить оставшуюся зелень, листья, чеснок и семена фенхеля.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В холодной воде полностью растворить соль и залить огурцы так, чтобы они были полностью покрыты рассолом.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Закрыть банку крышкой и оставить при комнатной температуре на 24 часа.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">После этого убрать в холодильник до полного охлаждения. Уже через день огурчики будут слегка малосольными, а через двое суток приобретут уже более насыщенный вкус.</div></div></div></div>"},"615":{"id":615,"title":"Апельсиновый мармелад","sub":"","cat":"Заготовки","img":"thumb/0615_00_615_photo.webp","lq":"data:image/webp;base64,UklGRrwAAABXRUJQVlA4ILAAAACQBQCdASoUABkAPuVio02pJaMiMAwBIByJbACdM2iBZaaAX9+kb30atpccNpuNh4fMnpW0AAD+w8Ati0AJ1cBxsNDQDUlPRpCtjr4MhQpHOMWOcM2GkJhKnPbutAAoYdY/c+hTn16a8NLQ9+9wyKdYSv60IsvdKui24UlyM8eHX2WVIh1nbzzkbE/nOfSzOrmAoE8/aqo8VDRm6S5woXpOg08FxwPBOUm2HM/ttkAAAA==","w":360,"h":450,"q":"апельсиновый мармелад  на 5 баночек по 250 мл апельсины 1500 г лимоны 2 шт вода 600 г сахар белый 765 г сахар мусковадо светлый 135 г сода щепотка важное примечание для любителей уменьшить сахар здесь не надо апельсиновый мармелад уже пару месяцев я представляю как начну этот текст так мармеладный дееееееееееень ух полегчало теперь можно спокойно и обстоятельно про рецепт итак классика британского чаепития апельсиновый мармелад в массовом воображении прочно закрепил за собой образ чего то очень уютного и почти детского во многом это произошло благодаря одному там медведю в синем пальто к","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0615_00_615_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrwAAABXRUJQVlA4ILAAAACQBQCdASoUABkAPuVio02pJaMiMAwBIByJbACdM2iBZaaAX9+kb30atpccNpuNh4fMnpW0AAD+w8Ati0AJ1cBxsNDQDUlPRpCtjr4MhQpHOMWOcM2GkJhKnPbutAAoYdY/c+hTn16a8NLQ9+9wyKdYSv60IsvdKui24UlyM8eHX2WVIh1nbzzkbE/nOfSzOrmAoE8/aqo8VDRm6S5woXpOg08FxwPBOUm2HM/ttkAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 5 баночек по 250 мл:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">апельсины 1500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимоны 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар белый 765 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар мусковадо светлый 135 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода щепотка</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🌟</i><span class=\"tx\">Важное примечание для любителей уменьшить сахар: здесь — не надо.</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">Уже пару месяцев я представляю, как начну этот текст так:</p>\n<p>МАРМЕЛАДНЫЙ ДЕЕЕЕЕЕЕЕЕЕЕНЬ!<br>Ух, полегчало, теперь можно спокойно и обстоятельно — про рецепт.</p>\n<p>Итак, классика британского чаепития — апельсиновый мармелад — в массовом воображении прочно закрепил за собой образ чего-то очень уютного и почти детского. Во многом это произошло благодаря одному там медведю в синем пальто, который носит с собой бутерброды с мармеладом как универсальное средство утешения. Паддингтон, по сути, сделал для апельсинового мармелада то же, что Рождество — для имбирных пряников: превратил продукт с довольно жёстким характером в символ заботы и дома.</p>\n<p>Исторически апельсиновый мармелад был куда менее сентиментален. Он был придуман под конкретный фрукт — севильский горький апельсин: плотный, ароматный, с толстой кожурой и высоким содержанием пектина. Именно поэтому классический мармелад строится не на соке, а на всём плоде целиком — с цедрой, белыми плёнками и перегородками, которые в обычной жизни принято безжалостно удалять. Позже, когда рецепт стал популярным и вышел за пределы Британии, мармелад начали варить из самых разных апельсинов — сладких, тонкокожих, южных, — подстраивая технологию под сырьё, но  логика осталась прежней: цитрус, сахар и время.</p>\n<p>С точки зрения физики и химии, мармелад — это прежде всего история про уже знакомый вам пектин. Природный полисахарид, который содержится в кожуре и белых частях цитрусовых и при определённых условиях (кислота + высокая концентрация сахара + температура) образует устойчивую гелевую структуру. Именно поэтому здесь нельзя “чуть уменьшить сахар” или сократить время варки без последствий: апельсины либо соберутся и станут мармеладом, либо нет.</p>\n<p>Этот рецепт — попытка сохранить классический английский профиль: выраженную апельсиновую горчинку, плотную, но не резиновую текстуру и абсолютно чистый вкус без каких-либо улучшений. Я допустила только одну вольность в попытке сделать мармелад не таким зубодробительно сладким (классический рецепт — это 1 кг фруктов и 1.1 кг сахара) — заменила часть белого сахара тростниковым. Обратите внимание, что здесь стоит брать или светлый мусковадо (идеально), или вообще демерару. Темный влажный мусковадо спугнет апельсиновый дух и неминуемо повлияет на цвет. А нам-то нужно упакованное в баночки солнышко посреди суровой зимы ☀️</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">С апельсинов и лимонов овощечисткой снять цедру, стараясь не захватывать белую часть, и нарезать тонкими полосками длиной примерно 3 см. Сложить в широкую кастрюлю с толстым дном, залить холодной водой, довести до кипения и варить 10 минут. Затем слить воду, снова залить цедру новой водой, добавить крошечную щепотку соды и варить 15 минут до полной мягкости. Затем еще раз слить воду, промыть холодной водой и вернуть в кастрюлю.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пока убираем излишнюю горечь с цедры, очистить апельсины от кожуры и нарезать маленькими кусочками. Обязательно сохраняйте весь выделяющийся сок!</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В кастрюле соединить апельсиновую мякоть, весь собранный сок, подготовленную апельсиновую и лимонную цедру и воду (600 г). Довести до кипения и варить 30-40 минут на среднем огне, пока все белые пленочки не развярятся и не пожелтеют.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Добавить белый сахар и мусковадо, тщательно размешать до полного растворения. Варить при активном, но спокойном кипении (на моей индукции 7 из 9) около часа, периодически помешивая, особенно в финале, когда большая часть воды испарится и мармелад легко сможет пригореть. Температура готового мармелада должна быть 104-105 градусов, пузыри будут крупными и блестящими. В самом конце влить лимонный сок, перемешать и прокипятить ещё 2–3 минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Кипящий мармелад разлить по стерилизованным банкам, закрыть крышками, перевернуть на 5-7 минут, затем вернуть в исходное положение и остудить. Оставить созревать минимум на 7 дней — за это время горчинка смягчится, а вкус станет более “четким” и глубоким.</div></div></div></div>"},"618":{"id":618,"title":"Квашеная капуста","sub":"комфорт фуд для вашего микробиома","cat":"Заготовки","img":"thumb/0618_00_618_photo.webp","lq":"data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAACwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JQBdiP/7IrIjcMuTDWP54nCcTxmreefnYJPIFr0AA/j/X+rGqt4KwMhEICagZRtRkannkCKS/WzVSYnhvtEpRoi4HnUekP5bPgCzcsAXh19eW6Q7WOlgyzSR4PjjcQb2InYzgCQCqLx8ur6pnvN2qjI7OdKTXdwldDudKnn24u7k/jcnS/khXUPf3Fma+5nxo1qXWDWnEeZ+52CkGtHeShWZAP/bOcY7+xkTPuL4efdhA6N9RuR+FFG+wHgO3EsKAAAAA","w":360,"h":450,"q":"квашеная капуста комфорт фуд для вашего микробиома на 4 баночки по 500 мл капуста белокочанная 2 кг соль не йодированная 38 г морковь 100 г яблоки зеленые 2 шт квашеная капуста комфорт фуд для вашего микробиома если спросить у моего мужа что он любит больше всего после своей семьи он наверняка моментально выпалит капусту с этой его гастрономической привязанностью я была ознакомлена почти сразу после знакомства и преувеличением это не оказалось вилли из тех кто прямо обожает капусту причём во всех её проявлениях я искренне не могу вспомнить сит","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0618_00_618_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAACwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JQBdiP/7IrIjcMuTDWP54nCcTxmreefnYJPIFr0AA/j/X+rGqt4KwMhEICagZRtRkannkCKS/WzVSYnhvtEpRoi4HnUekP5bPgCzcsAXh19eW6Q7WOlgyzSR4PjjcQb2InYzgCQCqLx8ur6pnvN2qjI7OdKTXdwldDudKnn24u7k/jcnS/khXUPf3Fma+5nxo1qXWDWnEeZ+52CkGtHeShWZAP/bOcY7+xkTPuL4efdhA6N9RuR+FFG+wHgO3EsKAAAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 баночки по 500 мл:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">капуста белокочанная* 2 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль (не йодированная) 38 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь* 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яблоки зеленые 2 шт</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Если спросить у моего мужа, что он любит больше всего после своей семьи, он наверняка моментально выпалит — капусту. С этой его гастрономической привязанностью я была ознакомлена почти сразу после знакомства, и преувеличением это не оказалось — Вилли из тех, кто прямо обожает капусту, причём во всех её проявлениях. Я искренне не могу вспомнить ситуацию, когда в нашем холодильнике не было банки квашеной капусты: это скрепа не только всей российской ферментации, но и нашей семьи.</p>\n<p>Ферментация — волшебная область гастрономии, в которой простые продукты превращаются в сложные, причём условия всегда одни и очень (очень!) доступные. Бытовая магия: сахара, спрятанные в стенках листьев, становятся кислотой, структура меняется, аромат раскрывается, а хруст… ах, этот хруст. При этом квашеная капуста не только вкусна, но и полезна. Она богата витаминами С и К, клетчаткой, антиоксидантами и — главное! — живыми пробиотиками. Эти мирные микроскопические жители поддерживают микробиоту, улучшают пищеварение, укрепляют иммунитет и даже снижают воспалительные процессы.</p>\n<p>Однако ферментация — как танец: партнёры могут сбиться с ритма, если делают шаги не туда. Чтобы вы понимали, почему что-то может пойти не так, я решила собрать в комментариях все главные ошибки в приготовлении квашеной капусты.</p></div><p>*ингредиенты указаны нетто, то есть после подготовки и шинковки, это важно для правильного расчета соли и последующей ферментации</p>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: и морковь, и яблоки здесь опциональны, можно заквасить капусту соло, без ничего</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">С капусты снять верхние листы (один сохранить) и тонко нашинковать — чем тоньше, тем равномернее будет ферментация (раньше мы всегда пользовались мандолиной, но потом я увидела у западных блогеров вариант с широким ножом-экономкой, и это изменило нашу жизнь капусту). Переложить в большую миску, добавить соль и начать мягко мять капусту руками, пока она не пустит сок и не станет заметно более эластичной.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Натереть морковь тонкой стружкой на мандолине, либо просто на крупной тёрке.<br>Добавить к капусте, тщательно перемешать. Дать смеси постоять 10–15 минут, чтобы соль глубже вытянула влагу. Яблоки очистить от сердцевины и нарезать максимально тонкими пластинами.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Плотно утрамбовать массу в стерильные банки, продвигаясь слоями (я использую большую керамическую банку). Между слоями капусты выложить ломтики зеленых яблок. Следить, чтобы внутри не оставалось воздушных карманов, а также чтобы капусты была полностью покрыта собственным соком — это очень важно. Если вдруг собственного сока не хватило, сделайте дополнительный рассол из расчета 18 г соли на 1 л воды и налейте сверху.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Из отложенного листика капусты вырезать круг по диаметру вашей банки, положить на капусту, прижать и добавить сверху какой-нибудь груз. Закрыть банки не герметично или использовать специальную крышку для ферментации с клапаном. Поставить на тарелку — в первые дни рассол может слегка вытекать.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Убрать в температуру 18-22 градуса. Раз в сутки слегка приоткрывать крышку, чтобы выпустить газ. Пробовать капусту можно начинать уже с 3-го дня: когда вкус достигнет любимой точки — перенести в холодильник. Вилли любит шестидневную капусту, я — двухнедельную, поэтому половину я распределяю по банкам на седьмой день, а остаток стоит все четырнадцать. В холоде ферментация замедляется, а аромат становится более глубоким и чистым.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Подавать капусту можно по-разному: кто-то считает мой метод варварством (я сталкивалась с таким мнением, поэтому решила сразу написать)), но я обожаю добавить к капусте моего любимого горчичного волгоградского масла, присыпать сверху клюквой или брусникой и совсем немного — луком-резанцом. Без масла, ягод и лука капуста тоже прекрасна.</div></div></div></div>"},"637":{"id":637,"title":"Закусочные помидоры черри","sub":"пробуем ферментацию","cat":"Заготовки","img":"thumb/0637_00_637_photo.webp","lq":"data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAACwBQCdASoUABkAPu1oqU+ppaOiKA1RMB2JbACdL9V2MwCMnf9O3M+PbIl9X99ZUGLDkPOMgAAA9wQdO5+qXkut5Tv1twOqOY8lFblal+Q8Z2mgDKkB1N1JeUYh1ROYawrnVkB44b1c16STAnPL10jdcXGTPUAyuR0cdIUtxgGOkLG8e0rLhBAOAO+Z7yvl3Vxij62Tf4zQ8j93ljI+Lx/mZk/4kvq8HuwkGNI/EQRSGNHjLtLFATWPpUps7N/hCRwBetjKLU9AAA==","w":360,"h":450,"q":"закусочные помидоры черри пробуем ферментацию на 1 баночку помидоры черри 500 г вода 500 г соль не йодированная 20 г чеснок 2 зубчика эстрагон свежий 5 6 веток только листья перец черный горошком 6 8 шт лавровый лист 1 шт семена фенхеля 1 2 ч л уксус белый 1 ст л закусочные помидоры черри пробуем ферментацию ферментация fermentatio происходит от лат fermentum закваска дрожжи то что вызывает брожение один из древнейших способов сохранить продукты в её основе работает простая но изящная биохимия молочнокислые бактерии питаются сахарами овощей и фруктов превращая их в органические кислоты среда подкисляется нежелательные микробы в связи с этим","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0637_00_637_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAACwBQCdASoUABkAPu1oqU+ppaOiKA1RMB2JbACdL9V2MwCMnf9O3M+PbIl9X99ZUGLDkPOMgAAA9wQdO5+qXkut5Tv1twOqOY8lFblal+Q8Z2mgDKkB1N1JeUYh1ROYawrnVkB44b1c16STAnPL10jdcXGTPUAyuR0cdIUtxgGOkLG8e0rLhBAOAO+Z7yvl3Vxij62Tf4zQ8j93ljI+Lx/mZk/4kvq8HuwkGNI/EQRSGNHjLtLFATWPpUps7N/hCRwBetjKLU9AAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 1 баночку:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль (не йодированная) 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">эстрагон свежий 5-6 веток (только листья)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец черный горошком 6-8 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена фенхеля 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый 1 ст л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Ферментация (fermentatio происходит от лат. fermentum — “закваска, дрожжи, то, что вызывает брожение”) один из древнейших способов сохранить продукты. В её основе работает простая, но изящная биохимия: молочнокислые бактерии питаются сахарами овощей и фруктов, превращая их в органические кислоты. Среда подкисляется, нежелательные микробы в связи с этим не выживают, а вкус продуктов становится глубже и интереснее. По сути, ферментация — это консервирование, которое природа делает за нас.</p>\n<p>Мы, конечно, знакомы с ней с детства, просто не называли по имени. <a class=\"xref\" href=\"#/r/618\">Квашеная капуста</a>, солёные огурцы, хлеб на закваске, кефир — всё это примеры одного и того же процесса. Но долгое время мы воспринимали их как “традицию”, не подозревая, что за ней стоит целая наука и целый мир вкусовых превращений.</p>\n<p>И тут невозможно обойтись без имени Рене Редзепи — шефа ресторана Noma в Копенгагене — ведь во многом благодаря его работе ферментация вернулась в гастрономию, сначала в рестораны, а потом и разбрелась по обычным кухням. В начале 2000-х его команда решила готовить только из “северных” продуктов, обходясь без привычных нам всем лимонов, томатов и оливкового масла. Решением стала ферментация. Так родилась Noma Fermentation Lab, десятки экспериментов — от овощных гарумов до ягод, от мисо до соусов. В 2018 году они оформили этот опыт в книгу The Noma Guide to Fermentation, которая вдохновила поваров и домашних энтузиастов по всему миру. В США движение ферментации подхватил Дэвид Чанг (Momofuku), в Восточной Европе современные шефы начали заново открывать “бабушкины” квашения, а что до Азии — традиции кимчи, мисо и сакэ там никогда и не исчезали.</p>\n<p>Самое важное: чтобы попробовать насладиться ферментацией, не нужно привычно закатывать банки на зиму. Достаточно взять сезонные овощи, приготовить рассол, дать бактериям пару дней — и вот уже вкус обычных продуктов превращается в новый. Хранить ваши ферментированные овощи можно просто в холодильнике, а вкус (то есть время ферментации) регулировать самостоятельно. Это способ одновременно разнообразить рацион, использовать сезонные продукты и
