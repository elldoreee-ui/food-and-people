i><span class=\"tx\">паста ракушки - 200 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">паста ракушки мелкие - 50 г (опционально)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">горошек молодой ❄️ - 60 г</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">зелень - петрушка, укроп, кинза</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Курицу нарезать крупными кусками (чем мельче нарежете - тем больше успеет выделиться вкуса), щепетильно срезать лишний жир и сложить в большую кастрюлю. Я использую курицу целиком, только не кладу грудку - ее вместе с костью мариную в соли и специях и потом запекаю отдельно.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Морковь очистить, её и сельдерей крупно нарубить и сложить к курице. Очищенный и разрезанный пополам лук, разрезанный пополам помидор, тимьян, лавровый лист, петрушку и перец горошком - туда же. Залить двумя с половиной литрами воды, поставить на сильный огонь, довести до кипения, аккуратно снять образовавшуюся пену, убавить огонь до минимального и варить без крышки полтора-два часа. По прошествии этого времени размять помидор, вынуть курицу (она не понадобится), вытащить и выбросить овощи, бульон процедить через мелкое сито или марлю.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Включить в духовке режим гриль или разогреть ее (конвекция) до 230 градусов. Застелить противень фольгой.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Фарш переложить в большую миску, немного помять руками и сформировать два вида фрикаделек.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для детского прикорма я делаю мини-фрикадельки - зачерпываю чайной ложкой порции фарша и выкладываю их на плоскую поверхность, затем смачиваю руки оливковым маслом и катаю фрикадельки. Для детей постарше и взрослых к фаршу стоит добавить небольшое количество соли и черного молотого перца по вкусу. Для ориентира по размеру я беру столовую ложку фарша, катаю так же - руками, смоченными оливковым маслом.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Переложить сформированные фрикадельки (и для детей, и для взрослых) на противень и отправить в духовку на 5-6 минут. Если используется гриль, то ставить противень нужно на самый верхний из возможных уровней.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">В небольшой кастрюле в немного подсоленной воде отварить пасту крупными ракушками (варить на две минуты меньше, чем указано на упаковке).</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Морковь очистить и нарезать крупными кубиками, сельдерей обмыть и нарезать идентично. В чугунке или кастрюле разогреть 2 ст л оливкового масла и обжарить морковь и сельдерей в течение 5-7 минут. Влить бульон, перемешать и довести до кипения. Убавить огонь, добавить фрикадельки для взрослых, зелёный горошек и мелкую пасту, прикрыть крышкой и потомить 5-7 минут. В конце добавить отваренную крупную пасту, нарубленную зелень, хорошо перемешать - и можно подавать к столу!</div></div></div></div>"},"535":{"id":535,"title":"#инструментарий","sub":"","cat":"Базовый инвентарь","img":"thumb/0535_00_535_photo.webp","lq":"data:image/webp;base64,UklGRmAAAABXRUJQVlA4IFQAAACwAwCdASoUABkAPu1or1AppaSiqAqpMB2JaQAALsiollOwJUq8AAD+83O9+zlVqr6xyb2zIQV3hKAy2ZnWVshtDMvbKqly6yt5khDiwRm0dmzAAAA=","w":360,"h":450,"q":"#инструментарий  нужная на вашей кухне вещь если вы хотите регулярно видеть на своем столе киши и яблочные пироги из рубленого теста если очень нравится печь и есть эклеры если по нраву бифштексы котлетки и фрикадельки если в планах есть выпечка домашнего хлеба инструментарий по многочисленным просьбам участников клуба я не так давно написала свой список инвентаря который помогает мне готовить с легкостью и удовольствием пришло время изучить вопрос детальнее сегодня рассказываю про необходимый минимум бытовой техники который позволяет справиться практически с любым рецептом на фотографиях мои помощники погружной блендер на мой взгляд вещь номе","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0535_00_535_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRmAAAABXRUJQVlA4IFQAAACwAwCdASoUABkAPu1or1AppaSiqAqpMB2JaQAALsiollOwJUq8AAD+83O9+zlVqr6xyb2zIQV3hKAy2ZnWVshtDMvbKqly6yt5khDiwRm0dmzAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">Нужная на вашей кухне вещь:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">если вы хотите регулярно видеть на своем столе киши и яблочные пироги из рубленого теста</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">если очень нравится печь (и есть) эклеры</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">если по нраву бифштексы, котлетки и фрикадельки</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">если в планах есть выпечка домашнего хлеба</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>По многочисленным просьбам участников Клуба, я не так давно написала свой список инвентаря, который помогает мне готовить с легкостью и удовольствием. Пришло время изучить вопрос детальнее, сегодня рассказываю про необходимый минимум бытовой техники, который позволяет справиться практически с любым рецептом.</p>\n<p>на фотографиях - мои помощники</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Погружной блендер</span></li></ul>\n<p>На мой взгляд, вещь номер один для любого гастроэнтузиаста. Почему? Ответ из одного слова - эмульсия. Объединение молекул жира и воды, благодаря которому еда становится вкусной, красивой, блестящей, и которое практически невозможно провернуть вручную. Я просто не представляю, как люди справляются без погружного блендера. Соусы для пасты и запеканок, майонез, всевозможные супы-пюре, смузи и молочные коктейли, сделать меланж из яиц для заварного теста или чизкейка - и это далеко не все области его применения. В этом месяце благодаря погружному миксеру мы без особых забот приготовим короля соусов для бранчей - голландез.</p>\n<p>Моя рекомендация: лучшие из лучших на профессиональных кухнях - дорогие, мощные, вечные, настоящие рабочие лошадки Robot Coupe. MicroMix - их самая продаваемая модель, настоящая рабочая лошадка. Чуть хуже, но все еще эмульсионные - Bamix. Для домашнего использования вам подойдет практически любой блендер, который подходит вашему вкусу и кошельку. Домашняя классика - Braun MultiQuick (его, кстати, тоже видела в профессиональных цехах), но мне визуально нравится другой - Bosch ErgoMixx, пользуюсь им дома уже не один год, все потребности закрывает. Обратите, пожалуйста, внимание, что один-миллиард-насадок, которые продают к блендеру - это по большей части маркетинг. На самом деле вам нужен только блендер (ну и, возможно, мини кухонный комбайн, чтобы делать соусы типа песто).</p>\n<p>Организация кухни: для погружного блендера подготовьте видное место или самый ближайший шкаф, использовать его будем часто.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Ручной миксер</span></li></ul>\n<p>Точно необходим, если вы часто оказываетесь на кухне, чтобы сделать какой-нибудь новый торт или десерт. Ручной миксер в разы удобнее и быстрее взбивает небольшие порции кремов и сливок, хорошо справляется с творогом для запеканок и сырников и без него, конечно, никуда, если вы собрались готовить меренги или шифоновый бисквит.</p>\n<p>В 2013 году, когда я уходила из офиса в предпринимательскую жизнь, мои коллеги подарили мне черный глянцевый ручной миксер KitchenAid. Вы не поверите, наверное, но этим миксером потом работали кондитеры в цехе московской Lamm’s. Практически член семьи символично сломался ровнехонько перед закрытием эклерной, в сентябре 2022 года, и в Германии я почти сразу же снова купила себе черный KitchenAid. Правда, с одним отличием, который поделил мою жизнь на до и после. Он беспроводной. Не такой красивый, но невероятно удобный. Советую, не то слово! Однако если использовать миксер собираетесь один раз в полгода, выбирайте на свой вкус и кошелек, все домашние модели плюс минус одинаковые. Дома я использую обычный Bosch.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Планетарный миксер + насадка -мясорубка</span></li></ul></div><div class=\"outrop\"><p>В профессиональном гастромире есть два непримиримых фланга - любители красоты и стиля KitchenAid против поклонников функциональности и скорости Kenwood. Я принадлежу к первым, для дома и своих цехов я всегда выбирала KitchenAid, но на мастер-классах и у коллег работала с Kenwood, и тоже не могу сказать плохого слова. Выбирайте сердцем (и кошельком)</p>\n<p>(продолжение далее)</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0535_01_536_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0535_02_537_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0535_03_538_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0535_04_539_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0535_05_540_photo.webp\" alt=\"\"></figure></div>"},"534":{"id":534,"title":"#инструментарий","sub":"","cat":"Базовый инвентарь","img":"","lq":"","w":0,"h":0,"q":"#инструментарий   погружной блендер ручной миксер планетарный миксер насадка мясорубка сковородка 28 30 см в идеале трёхслойная сталь алюминий сталь чугунная сковородка 25 см качественная дорогая антипригарная сковородка 25 см тяжелая но недорогая ее желательно менять раз в полтора два года чугунок утятница 5 7 л сотейник 2 2 8 л можно даже два если у вас дети кастрюля повседневная 3 5 л в зависимости от состава семьи кастрюля 10 15 л дешевая для бульонов и пасты ножи большой шефский нож 20 25 см w sthof global g 2 victorinox маленький нож 7 5 9 см нож для хлеба зазубренный нож экономка овощечистка kuhn rikon нож сомелье штопор ножницы для птицы kuhn rikon с пружиной деревянная лопатка металлическая лопатка с прорезями силиконовая спатула 2 3 шт разделочная доска дерево или пластик термометр мгновенного измерения кухонные весы цифровые цифровой таймер секундомер скребок солонка в виде контейнера с открыв","html":"<div class=\"spread\"><aside class=\"rail\"><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">погружной блендер</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">ручной миксер</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">планетарный миксер + насадка -мясорубка</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">сковородка 28-30 см (в идеале - трёхслойная, сталь-алюминий-сталь)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чугунная сковородка 25 см (качественная, дорогая)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">антипригарная сковородка 25 см (тяжелая, но недорогая, ее желательно менять раз в полтора-два года)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чугунок, утятница 5-7 л</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">сотейник 2-2,8 л (можно даже два, если у вас дети)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кастрюля повседневная 3-5 л в зависимости от состава семьи</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кастрюля 10-15 л (дешевая, для бульонов и пасты)</span></li></ul></div><div class=\"idiv\">НОЖИ</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">большой шефский нож 20-25 см (Wüsthof, Global G-2, Victorinox)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">маленький нож 7,5-9 см</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">нож для хлеба зазубренный</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">нож-экономка (овощечистка) (Kuhn Rikon)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">нож сомелье - штопор</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">ножницы для птицы (Kuhn Rikon с пружиной)</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">деревянная лопатка</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">металлическая лопатка с прорезями</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">силиконовая спатула 2-3 шт</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">разделочная доска (дерево или пластик)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">термометр мгновенного измерения</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кухонные весы (цифровые)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">цифровой таймер, секундомер</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">скребок</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">солонка в виде контейнера с открывающейся крышкой</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">перечница-мельница (лучшие из лучших - от Peugeot)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">миски - крупные для взбивания, средние для смешивания, мелкие для хранения подготовленных ингредиентов</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">щипцы</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">тёрка микроплан (только Microplane Zester Grater, безкомпромиссно)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">сушилка для салата</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">мандолина (шефы выбирают Benriner)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">шумовка-паутинка</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">картофельный пресс</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">сито с тонкой сеткой</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">ручная соковыжималка-пресс</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">бутылки-диспенсеры</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">контейнеры для хранения с крышками</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">формы для льда - крупные по 100 мл и маленькие по 15 мл</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">разъемная форма или кольца (лучшие размеры - 18 и 20 см)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">форма для тарта/киша металлическая со съемным дном 24 см (бортики от 3,5 см)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">форма для кексов/капкейков на 12 ячеек</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">форма для кекса резная металлическая</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">поворотный столик для декора тортов и тартов</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">скалка с регулирующими высоту кольцами</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кондитерские мешки одноразовые 45 см</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">насадки для кондитерского мешка, самые ходовые - круг, открытая звезда, французская звезда (диаметр меньшего отверстия ~1.5 см)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">перфорированный силиконовый коврик 40х30</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Друзья, дорогие, гип-гип ура! Подошёл к концу второй месяц нашего комфортного кулинарного клуба.</p>\n<p>В честь этого выкатываю запрашиваемый у меня стабильно раз в несколько дней список оборудования и инвентаря, который желательно иметь на кухне.</p>\n<p>Я уже пояснила в Чатике, что всё никак не могу довести этот список со всеми моими примечаниями до ума, а время идёт и идёт. Поэтому придумался выход: ниже в этом посте вы найдете краткое перечисление всего, что на мой взгляд необходимо иметь на кухне. А подробнее про разные штуковины я буду рассказывать в регулярной рубрике, название-которой-пока-не-придумалось. Первый пост (про бытовую технику) - уже завтра!</p>\n<p>Итак,</p>\n<p>я хочу много и вкусно готовить, что мне нужно иметь на кухне?</p>\n<p>БЫТОВАЯ ТЕХНИКА</p></div><p>КАСТРЮЛИ И СКОВОРОДКИ</p>\n<p>ИНВЕНТАРЬ</p>\n<p>ВЫПЕЧКА И ДЕСЕРТЫ</p></div></div>"},"541":{"id":541,"title":"Подборка ножей","sub":"#инструментарий","cat":"Ножи и разделочные доски","img":"","lq":"","w":0,"h":0,"q":"подборка ножей #инструментарий подборка ножей инструментарий премиум инвестиция на годы а то и на жизнь а также идеальный подарок shun kai group ","html":"<div class=\"prose\"><p>Премиум (инвестиция на годы, а то и на жизнь, а также идеальный подарок)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Shun (Kai Group)</span></li></ul>\n<p>Ручная ковка, дамасская сталь, эстетика в чистом виде. Shun Classic или Premier. Великолепно сбалансированы, требуют любви и заботы.<br>от 200 до 400 €<br>Официальный сайт Kai Europe</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Miyabi (Zwilling Japan)</span></li></ul>\n<p>Немецко-японский гибрид: традиционная японская техника плюс немецкая точность.<br>Сверхострые и долговечные.<br>от 180 до 450 €<br>Официальный сайт Miyabi</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Wüsthof Ikon / Classic Ikon</span></li></ul>\n<p>Германия, очень прочные, идеально подойдут тем, кто любит тяжёлый, уверенный в руке нож. Меньше эстетики, больше надёжности.<br>от 140 до 300 €<br>Официальный сайт Wüsthof</p>\n<p>Мидл-сегмент (отличное качество без космос-цены)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Victorinox</span></li></ul>\n<p>Швейцарская надёжность, простота, качество, идеален для начинающих.<br>30–70 €<br>Официальный сайт Victorinox</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Tojiro (DP Series)</span></li></ul>\n<p>Японская VG-10 сталь, трёхслойное лезвие, цена/качество — топ.<br>70–120 €<br>Tojiro DP Series на Knivesandtools</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Misono (UX10 серия)</span></li></ul>\n<p>Пограничный сегмент — между мидлом и премиумом. Острые, легкие, “пишут” по продукту.<br>120–160 €<br>Официальный сайт Misono</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Global</span></li></ul>\n<p>Лёгкие, цельнометаллические, необычный футуристичный дизайн. Для тех, кто устал от “классики” и любит “не как у всех”.<br>80–150 €<br>Официальный сайт Global Knives</p>\n<p>Бюджет (доступный старт и честное качество)</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Samura (серии Mo-V или Harakiri)</span></li></ul>\n<p>Достойный выбор за свои деньги. Острое лезвие, хороший дизайн, легко найти.<br>30–60 €<br>Samura на Messerworld</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Tramontina</span></li></ul>\n<p>Бразильский бренд, много лет на рынке. Не вау, но надёжно: если нужен «нож на каждый день».<br>15–40 €<br>Официальный сайт Tramontina</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">IKEA 365+ или VÖRDA</span></li></ul>\n<p>Не шутка. Некоторые ножи из этой линейки справляются с базовыми задачами на ура.<br>10–25 €<br>IKEA 365+ Ножи</p>\n<p class=\"lbl\">Если бы я выбирала нож в каждой из категории:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Премиум: KAI Shun Classik Santoku 18 см</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Мидл: Tojiro Santoku 17 см или</span></li></ul>\n<p>Samura SUPER 5 Santoku 18 см</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Бюджет: Samura-MoV Aus-8-Stahl 18 см</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">Сейчас у меня в работе дома Fissler PROFI Santoku 165 мм</span></li></ul></div>"},"542":{"id":542,"title":"Разделочные доски","sub":"продолжение поста","cat":"Ножи и разделочные доски","img":"thumb/0542_00_542_photo.webp","lq":"data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAADwBQCdASoUABkAPu1krE+ppSQiMBgIATAdiUAXZCQFSxb2CLcBeBO6a33uzDZlT6QfzLShagtJgADdU4Y5GGjqByz0ozdxxyzTpv4z1vUpA3tkntTW8b/mleCp7oAYgkGN+MM6iCAsGscng7rfvmwtJSOIxvyOce01iJ3vZ7j3F3HWQp59GC6stm8u6iFYsmarSdHDJFOy9sYwjGDpzLoMJd1FLdb8ai5kVvXN9iI8zeJlIYomo7uLabUEFRlK+84q2NE2Z7AYcAAA","w":360,"h":450,"q":"разделочные доски продолжение поста продольные edge grain например они собраны из планок уложенных волокнами вдоль это привычные бюджетные деревянные доски красивые удобные со временем изнашиваются и покрываются следами от ножа торцевые end grain собраны из кирпичиков поставленных торцом волокон вверх вы конечно же видели эти доски в рилсах модных фуд блогеров на поверхности виден характерный шахматный рисунок нож входит в такую доску мягко как в волокна щётки не разрезает их а раздвигает торцевые деревянные доски идеальный выбор для гастроэнтузиаста эти доски дольше служат щадят ножи на них практически не видны следы от порезов ","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0542_00_542_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Продольные (edge grain), например. Они собраны из планок, уложенных волокнами вдоль. Это привычные бюджетные деревянные доски: красивые, удобные, со временем изнашиваются и покрываются следами от ножа.</p>\n<p>Торцевые (end grain) — собраны из “кирпичиков”, поставленных торцом волокон вверх. Вы конечно же видели эти доски в рилсах модных фуд-блогеров: на поверхности виден характерный шахматный рисунок. Нож входит в такую доску мягко, как в волокна щётки: не разрезает их, а раздвигает.</p>\n<p>Торцевые деревянные доски — идеальный выбор для гастроэнтузиаста: эти доски дольше служат, щадят ножи, на них практически не видны следы от порезов.</p>\n<p>На каких производителей стоит обратить внимание?</p>\n<p class=\"lbl\">ЕВРОПА И АМЕРИКА:</p>\n<div class=\"note\"><i class=\"bul\">⚡️</i>Continenta (Германия) — делают торцевые доски из акации и ореха, красивые и практичные<br>⚡️Boos Blocks Maple (США, продаются в Европе) — профессиональный стандарт, классический клён<br>⚡️Schneidebrett.de (Германия) — локальное производство, FSC-сертификаты, за каждую покупку высаживают деревья<br>⚡️Larch Wood (Канада, доступны в Европе через дилеров) — культовые доски из лиственницы, невероятно красивый рисунок. Та самая доска Нары Смит<br>⚡️The Boardsmith (США) — орех, клён, вишня, ручная работа, безупречная геометрия<br>⚡️John Boos End-Grain Walnut Block — тяжёлые, статусные доски, любимцы профессиональных кухонь</div>\n<p class=\"lbl\">РОССИЯ:</p>\n<p>(большущий бонус для жителей РФ — достойную доску здесь можно купить за существенно меньшую сумму)</p>\n<div class=\"note\"><i class=\"bul\">⚡️</i>Aura Wood — дубовые торцевые доски в среднем сегменте, простые и надёжные<br>⚡️Wood-Mood — дуб и ясень, разнообразные размеры и формы, от компактных до внушительных<br>⚡️VKuhnu (например, CUT-324) — крепкая дубовая торцевая доска с масляной пропиткой<br>⚡️Only-Wood / ITKT.ru — удобные рабочие модели из дуба, компактные</div>\n<p>Подвожу итог: для дома можно обойтись двумя-тремя бюджетными досками (например: пластиковая для мяса и рыбы + деревянная продольная для овощей). А если хочется удовольствия от процесса и красивого ритуала, то торцевая доска — это та инвестиция, которая точно будет радовать вас десятилетиями.</p>\n<p>#инструментарий</p></div>"},"543":{"id":543,"title":"Какой чугунок вам нужен","sub":"размеры и формы как траектория любви","cat":"Чугун","img":"","lq":"","w":0,"h":0,"q":"какой чугунок вам нужен размеры и формы как траектория любви какой чугунок вам нужен размеры и формы как траектория любви если продолжать разговаривать про чугунок сердцем иначе и не могу то размеры и формы это вовсе не сухая математика и точно не история про вот этот лучше всех это вопрос ваших кулинарных ритуалов привычек характера кухни и даже темпа жизни но начнём как обычно с теории размер ","html":"<div class=\"prose\"><p>Если продолжать разговаривать про чугунок сердцем (иначе и не могу), то размеры и формы — это вовсе не сухая математика и точно не история про “вот этот — лучше всех!”. Это вопрос ваших кулинарных ритуалов, привычек, характера кухни и даже темпа жизни. Но начнём, как обычно, с теории.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">РАЗМЕР🔘</span></li></ul>\n<p>У производителей принято мерить чугунки в литрах и в сантиметрах по диаметру крышки. За каждой цифрой однако же скрывается сценарий, что вы будете в нём готовить.</p>\n<p>1–2 литра (14–18 см)<br>Маленькие “личные” чугунки. Прекрасны для быстрых рагу “на двоих”, для карамелизации лука, для соусов, а также для тех дней, когда хочется медленного красивого глинтвейна. Мини-убежища для спокойной еды. Полагаю, они могут дополнять имеющийся чугунок побольше.</p>\n<p>3–4 литра (20–22 см)<br>Золотой стандарт для семьи из трех-четырех человек. В них идеально томятся бёдра курицы, несколько кусочков говядины, свиная шея или лопатка, а еще луковый суп. Если вы выбираете свой первый чугунок и не часто принимаете гостей — это лучший вариант, особенно если брать в расчет стоимость чугуна.</p>\n<p>5–6 литров (24–26 см)<br>Большим семьям и компаниям, для хлеба, для бараньей лопатки, для всего того, что “поставил в духовку — и ушел заниматься жизнью”. Большой чугунок — это уже не просто кастрюля, а инфраструктура. Это мой личный выбор, потому что я люблю принимать гостей, а еще потому что томленые блюда прекрасно переносят заморозку (то есть можно готовить сразу с запасом).</p>\n<p>7 литров и больше (28–30+ см)<br>Ну это уже если дом с печью, костёр с казаном у реки и огромная семья, которая любит собираться и есть со вкусом. Прекрасно для плова, гуляша, утки, огромного карри, всех видов заливных и томленых бульонов.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ФОРМА🔘</span></li></ul>\n<p>У чугунков, как у людей, тоже есть характеры.</p>\n<p>Круг<br>Классика жанра. Универсальная форма для большинства задач: тушение, супы, паста, ризотто, рагу. Круглая форма хорошо распределяет конвекцию пара — то есть всё внутри прогревается равномерно, без “уголков” и сухих зон. Круг — это гармония, стабильность, предсказуемость.</p>\n<p>Овал<br>Удобен для продолговатых кусков: курица, утка, баранья нога. Если вы любите запекать крупное мясо или целые овощи,  овальная форма даст большее поле маневра. Минус один — на круглой конфорке овальный чугунок греется чуть менее равномерно, но можно приспособиться, плюс в духовке он раскрывается идеально.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ВЫСОТА СТЕНОК🔘</span></li></ul>\n<p>Классические стенки (8–12 см) — универсальность, баланс.</p>\n<p>Глубокие модели (12–15+ см) — супы, бульоны, томление.</p>\n<p>Низкие широкие (так называемые “brasier”, 6–8 см) — идеальны для жарки, соусов, овощей и везде, где важна большая площадь испарения.</p>\n<p class=\"lbl\">Если коротко (я стараюсь, честно):</p>\n<p>форма, размер и масса чугунка — это не про технические характеристики, а про то, какой ритм вы хотите привнести на кухню. Любите собираться всей семьёй? Берите большой. Чаще готовите маленькими порциями? Средний. Часто жарите и хотите румяную корочку? Низкий brasier. Много тушите и делаете бульоны? Глубокий овальный.</p>\n<p>Чугунок — это продолжение вашей кулинарной личности. Не торопитесь. Выбирайте тот, с которым будете говорить на одном гастрономическом языке.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ПОДБОРКА ПРОИЗВОДИТЕЛЕЙ🔘</span></li></ul>\n<p>-премиум-</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">Le Creuset — французская классика, эталон светлой эмали, пожизненная история на плите.</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">Staub — тоже Франция, чёрная внутренняя эмаль, идеален для томления и корочки.</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">Made In — для тех, кто хочет выбрать премиум, но “не как все”: современный американский бренд с французским производством, хорошо собранный эмалированный чугунок, который в тестах показывает результаты на уровне старших коллег — но при этом выглядит и ощущается чуть более индивидуально.</span></li></ul>\n<p>-миддл-</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">Lodge — тот самый чугунок, который в слепых тестах регулярно называют лучшим “value for money”: он держит тепло, печёт хлеб, тушит рагу и по качеству сильно ближе к премиуму, чем подсказывает цена. Независимые обзоры ставят его как лучший вариант “если Le Creuset пока рано”</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">COMBEKK — современный нидерландский бренд с европейским производством: эмалированный чугунок с хорошей теплопроводностью, более “честной” ценой и устойчивой эмалью. Достойная альтернатива премиуму в стиле “разумный миддл” — надёжный, тяжёлый, с ровным нагревом и красивым дизайном.</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">Keltum — ещё один нидерландский бренд, представленный на европейском рынке: эмалированный чугунок в категории миддл, хороший выбор для тех, кто хочет качество чугуна и эмали без премиум-ценника и без компромиссов с основами.</span></li></ul>\n<p>-бюджет-</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">IKEA VARDAGEN — честный рабочий чугунок: простая эмаль, понятный дизайн, подойдёт для старта и не потребует продавать почку.</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">Ballarini (Bellamonte) — итальянский бренд под крылом Zwilling: чугун с эмалью, который часто берут как “входной билет” в мир томления, когда хочется красоты и качества, но без ценника премиума.</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">VEVOR — тяжёлый и прямолинейный. Без изысков, но честно выполняет свою работу и идеально подходит, если хочется попробовать “жить с чугунком” с минимальным бюджетом.</span></li></ul></div>"},"545":{"id":545,"title":"Как ухаживать за чугуном","sub":"","cat":"Чугун","img":"","lq":"","w":0,"h":0,"q":"как ухаживать за чугуном  как ухаживать за чугуном голый чугун пористая классика сковороды lodge старые казаны антикварные формы современные bare cast iron","html":"<div class=\"prose\"><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ГОЛЫЙ ЧУГУН🔘</span></li></ul>\n<p>“пористая” классика: сковороды Lodge, старые казаны, антикварные формы, современные bare cast iron</p>\n<p>Сразу самое важное, что нужно запомнить в работе с голым чугуном: если дать ему намокнуть и не высушить, он заржавеет. НО! Ржавчина — не трагедия, а всего лишь железо с избытком воды. Если сковорода не проржавела целиком, это лечится.</p>\n<p>Seasoning — это запекание тонкого слоя масла на поверхности металла, создание защитной патины.</p>\n<p>Масло, попадая в микротрещины и поры чугуна, при нагреве проходит через фазу термического разложения и последующей полимеризации: молекулы ненасыщенных жирных кислот окисляются кислородом воздуха и связываются друг с другом в плотную, твёрдую, тонкую плёнку. Эта плёнка запечатывает поры, защищает металл от влаги и создаёт естественное антипригарное покрытие.</p>\n<p>Иначе говоря, seasoning — это не просто смазывание маслом, а мини-лакировка, созданная очень высокой температурой.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">КАК СДЕЛАТЬ SEASONING</span></li></ul>\n<p>Хорошо вымыть. С тёплой водой и мягким средством. Металл выдержит и абразив, но лучше не начинать с жёсткого — seasoning любит просто чистую обезжиренную поверхность.</p>\n<p>Полностью высушить. Поставить на плиту и прогреть 2–3 минуты до испарения всей влаги.</p>\n<p>Нанести тончайший слой масла с бомощью бумажного полотенце или латексной перчатки. Не каждое масло подойдёт! Нужны только те, в которых много ненасыщенных жирных кислот. Лучше всего подойдет масло виноградной косточки или рапсовое. Главное — максимально тонкий слой, как будто вы протираете поверхность, а не поливаете. Лишнее масло даст липкость.</p>\n<p>Запечь. Поместить чугун в духовку при 230 градусов (верх/низ) на один час, без крышки. Можно перевернуть вверх дном, так масло точно не оставит пленки на дне. Затем оставить в духовке до полного охлаждения, чтобы процесс завершился плавно.</p>\n<p>Повторить 2–3 раза, так как патина нарастает слоями, как кольца на дереве.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">КАК УХАЖИВАТЬ ЗА ГОЛЫМ ЧУГУНОМ</span></li></ul>\n<p>после того, как он “засезонен”, а также за эмалью black satin</p>\n<p>Мытьё без средств (горячая вода + щётка). Время от времени можно и с мягким средством, так seasoning не смоется. После мытья обязательно высушить на огне.</p>\n<p>Когда чугунок уже сухой и тёплый — протереть салфеткой с каплей масла.<br>Это усиливает слой патинирования.</p>\n<p>Если что-то пригорело, то налить воды, довести до кипения и дать побулькать 3-5 минут, затем выключить и дать немножко остыть. Использовать силиконовую или пластиковую лопатку, чтобы аккуратно “сдвинуть” пригар.</p>\n<p>Если всё же появилась ржавчина, то сперва нужно зачистить мягкой абразивной губкой, промыть, высушить и сделать один слой быстрого seasoning. Всё. Ржавчина — это как простуда, неприятно, но нестрашно.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ГЛЯНЦЕВЫЙ ЭМАЛИРОВАННЫЙ ЧУГУН🔘</span></li></ul>\n<p>Глянцевая бежевая эмаль является защитной оболочкой для голого чугуна: она скрывает его пористую структуру, делает поверхность инертной, удобной и предсказуемой. Но, как и всё красивое, требует правильного обращения.</p>\n<p class=\"lbl\">После приготовления еды:</p>\n<p>Дать чуть остыть (не надо поливать ледяной водой — термошок эмаль не любит). Залить тёплой водой и оставить на 10–15 минут — это облегчит жизнь губке. Мыть обычным средством, не использовать металлические губки или абразивы. Вытирать насухо.</p>\n<p>Если что-то пригорело, то налить воды с каплей моющего средства, затем прогреть до лёгкого кипения, выключить и дать настояться. Использовать силиконовую или пластиковую лопатку, чтобы аккуратно “сдвинуть” пригар. Пятна от томатов, специй или карамели на светлой эмали — это нормально. Это не грязь, а история. Они со временем светлеют.</p>\n<p>Правильно ухоженный чугунок со временем темнеет до мощного антрацита, становится гладким и чуть блестит, как речная галька, и становится антипригарным, позволяя использовать при приготовлении всё меньше и меньше масла. И в этом его волшебство: с каждым годом он становится только лучше. Чугун взрослеет красиво. И точно стоит того.</p></div>"},"546":{"id":546,"title":"Чугунки: подборка классики","sub":"дополнение к постам про чугун","cat":"Чугун","img":"thumb/0546_00_546_photo.webp","lq":"data:image/webp;base64,UklGRogAAABXRUJQVlA4IHwAAAAwBACdASoUABQAPu1grE2ppaSiMBgMATAdiWYAzcAQ79dExXmEaS9ezaAA/vHEqimtUJtgo4TKF8JKTUFUoKTvcgbohCsWbz+5zsF/jPNPUZqqR8Q9UC/ejIz5ZmbhuXvQdilgZqmChSN4F7p+SDe5hqVvs83oH9rhJ8AA","w":360,"h":360,"q":"чугунки: подборка классики дополнение к постам про чугун ну и конечно подборочка классики ","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_00_546_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_01_547_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_02_548_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_03_549_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_04_550_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_05_551_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_06_552_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_07_553_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0546_08_554_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Ну и, конечно, подборочка классики.</p></div>"},"610":{"id":610,"title":"Дорожная карта: рагу в чугунке","sub":"идеальная комфортная еда, которая готовит себя сама","cat":"Чугун","img":"","lq":"","w":0,"h":0,"q":"дорожная карта: рагу в чугунке идеальная комфортная еда, которая готовит себя сама дорожная карта рагу в чугунке идеальная комфортная еда которая готовит себя сама если вы состоите в клубе фиолетового брецеля то вам не нужно объяснять как сильно я люблю тему медленного томления и свой чугунок в первые два месяца после рождения лукаса наши обеды и ужины готовил вилли и чаще всего это было так называемое рагу он обжаривал в чугунке мясо добавлял овощи и томил это все в течение полутора двух часов рагу было разным разные виды мяса разный соус разные овощи но каждый раз очень вкусным потому что такой вид еды в общем то не требует рецепта если есть вкус и минимальная база знаний я подготовила для вас инструкцию как готовить такие рагу в чугунке в зависимости от вашего настроения и наполнения холодильника и кладовки и назвала ее дорожная карта мне показалось что именно этот заголовок лучше всего передаст мою идею что каждый ваш поворот или остановка по пути приготовления раг","html":"<div class=\"prose\"><p>Если вы состоите в Клубе Фиолетового Брецеля, то вам не нужно объяснять, как сильно я люблю тему медленного томления и свой чугунок. В первые два месяца после рождения Лукаса наши обеды и ужины готовил Вилли, и чаще всего это было так называемое “рагу” — он обжаривал в чугунке мясо, добавлял овощи и томил это все в течение полутора-двух часов. Рагу было разным — разные виды мяса, разный соус, разные овощи, но каждый раз очень вкусным, потому что такой вид еды, в общем-то, не требует рецепта, если есть вкус и минимальная база знаний.</p>\n<p>Я подготовила для вас инструкцию, как готовить такие рагу в чугунке в зависимости от вашего настроения и наполнения холодильника и кладовки, и назвала ее “дорожная карта”. Мне показалось, что именно этот заголовок лучше всего передаст мою идею — что каждый ваш поворот или остановка по пути приготовления рагу неминуемо отразится на результате, и хорошо было бы знать, каким именно образом, и понимать, почему.</p>\n<p>Любое путешествие сначала нужно спланировать, то есть построить маршрут, по которому вы будете двигаться. В нашем случае необходимо решить — кто будет главным героем рагу, и в какие декорации он будет помещён. Стартуем!</p>\n<p>*️⃣ОСНОВА — БЕЛОК</p>\n<p>Белок задаёт и текстуру будущего рагу, и глубину вкуса. Исторически рагу придумали, конечно, не из любви к уюту и чугункам, а из практической необходимости. Это был способ приготовить самые сложные куски мяса — жёсткие и жилистые. Медленное приготовление в жидкости, при невысокой температуре, позволяло сделать их не только съедобными, но ещё и по-настоящему вкусными, и в этом смысле рагу — одна из самых честных и демократичных форм домашней кухни.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Говядина</span></li></ul>\n<p>Классический и, пожалуй, самый благодарный вариант. Лопатка, шея, голяшка, щёки, хвост — то, что при быстром приготовлении остаётся жёстким, а при долгом томлении превращается в мягкое, насыщенное мясо с глубиной вкуса и плотной текстурой соуса. Говядина любит продолжительное время в чугунке и спокойно выдерживает и два (маленькие кусочки), и три, а иногда и четыре часа томления.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Баранина</span></li></ul>\n<p>Особенно хороша для пряных, насыщенных рагу. Выбирайте куски с выраженной структурой и характером — плечо или лопатку, шею, рёбра. При правильном подходе баранина становится поразительно нежной, с глубоким мясным вкусом и без пахучей “резкости”, которой многие опасаются (часто совершенно напрасно).</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Свинина</span></li></ul>\n<p>Свинина быстрее становится мягкой, поэтому требует меньшего времени томления (полтора-два часа) и хорошо работает в менее “мясных”, скажем, сливочных или томатных версиях рагу. Идеально подходят лопатка, шея и грудинка.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Птица</span></li></ul>\n<p>Филе бедра для быстрых рагу (будут готовы в течение часа), бёдра и голени с кожей, костями и соединительной тканью — для насыщенных рагу с густыми обволакивающими соусами. Птице как и свинине очень идут томатные и сливочные соусы.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Дичь</span></li></ul>\n<p>Косуля, олень, кабан — продукты сложные, но в плане длительного томления всегда благодарные, дают рагу с мощным нетривиальным вкусом и густым соусом, в котором чувствуется сама идея медленного приготовления.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟢</i><span class=\"tx\">Растительные основы</span></li></ul>\n<p>Грибы (белые, портобелло, вёшенки), нут, крупная фасоль — отличная основа для вегетарианских рагу без мяса. Принцип остаётся тем же: продукт должен выдерживать длительное приготовление и становиться лучше от времени, а не терять форму и вкус.</p>\n<p>*️⃣ЖИДКОСТЬ — ОСНОВА СОУСА</p>\n<p>Жидкость в медленном томлении не обязательна, но желательна, если вы хотите получить разбирающееся на волокна нежное мясо и соус, который объединит блюдо с любым гарниром. Варианты могут быть разными — бульон (куриный, говяжий, овощной), вино (красное — глубина, белое — свежесть), темное пиво, яблочный сидр или томаты в разных формах (пассата, кусочками, целые). Естественно, вы можете брать не один тип жидкости, а смешивать их, чтобы получить именно тот результат, которого добиваетесь.</p></div>"},"555":{"id":555,"title":"Формы для выпечки","sub":"стекло, керамика, металл и силикон","cat":"Формы для выпечки","img":"","lq":"","w":0,"h":0,"q":"формы для выпечки стекло, керамика, металл и силикон формы для выпечки стекло керамика металл и силикон инструментарий форма для выпечки один из самых недооценённых предметов на кухне её редко выбирают осознанно и вдумчиво гораздо чаще решение принимается по принципу красивая подходит по размеру или увидели в рилс в этом нет ничего предосудительного по крайней мере до тех пор пока результат не начинает отличаться от ожидаемого причём достаточно регулярно и без видимых причин ","html":"<div class=\"prose\"><p>#инструментарий</p>\n<p>Форма для выпечки — один из самых недооценённых предметов на кухне. Её редко выбирают осознанно и вдумчиво, гораздо чаще решение принимается по принципу “красивая”, “подходит по размеру” или “увидели в рилс”. В этом нет ничего предосудительного, по крайней мере до тех пор, пока результат не начинает отличаться от ожидаемого, причём достаточно регулярно и без видимых причин.</p>\n<p>Ключевая мысль, с которой имеет смысл начать: форма для выпечки — не пассивный контейнер, а активный участник процесса. Она напрямую влияет на скорость и характер нагрева, распределение температуры, степень подрумянивания и, как следствие, на текстуру и вкус готового блюда. Разница между стеклом, керамикой, металлом и силиконом — не эстетическая, а физическая, и как только эта физика становится понятной, ваша духовка перестаёт быть источником сюрпризов и начинает вести себя предсказуемо. Разбираемся.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">СТЕКЛЯННЫЕ ФОРМЫ</span></li></ul>\n<p>медленно, ровно, предсказуемо</p>\n<p>Стекло относится к материалам с высокой тепловой инертностью — оно нагревается долго и неохотно, зато, набрав температуру, столь же неохотно её отдаёт. С точки зрения физики это означает мягкий, постепенный прогрев без резких температурных скачков.</p>\n<p class=\"lbl\">На практике стеклянные формы создают условия, при которых:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">овощные, творожные и яичные запеканки пропекаются равномерно по всей толщине,</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соусы и сливочные заливки нагреваются спокойно, без бурного кипения,</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">яичные массы (например, во фриттатах) сворачиваются плавно, без расслоения,</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">края не пересыхают раньше, чем прогреется центр.</span></li></ul>\n<p>Именно поэтому стекло прекрасно подходит для гратенов, лазаний, творожных запеканок, овощей в сливках и, скажем, томатов конфи. Дополнительный, но весьма ощутимый бонус — визуальный контроль: прозрачные стенки и дно позволяют наблюдать за процессом и вовремя реагировать, что заметно снижает уровень тревожности.</p>\n<p>Что по минусам — стекло практически не участвует в образовании корочки. Оно не отдаёт тепло настолько интенсивно, чтобы запустить активную реакцию Майяра, поэтому рассчитывать на выраженное подрумянивание не стоит. Кроме того, стекло плохо переносит экстремальные температуры и резкие перепады: путь “из холодильника — сразу в раскалённую духовку” для него недопустим.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">КЕРАМИЧЕСКИЕ ФОРМЫ</span></li></ul>\n<p>ещё мягче и ещё медленнее</p>\n<p>Керамика во многом похожа на стекло, но ведёт себя ещё более спокойно и инертно. Это один из самых медлительных материалов на кухне: он долго прогревается, стабильно удерживает тепло и так же медленно остывает. Такая тепловая инерция делает керамические формы инструментом для процессов без спешки.</p>\n<p>В керамике особенно хорошо удаются блюда, где ценится нежная, кремовая текстура и отсутствие резких температурных воздействий: клафути, пудинги, суфле, десерты на основе запечённых или томлёных фруктов (груши, яблоки, айва), а также овощи в сливочных соусах (тот же гратен). Эти формы буквально диктуют ритм приготовления — неспешный, вдумчивый, терпеливый.</p>\n<p>Та же инертность становится и ограничением. Керамика как и стекло не участвует в формировании корочки: она не “поджаривает” дно и не даёт резкого теплового удара, поэтому киши и тарты с песочной основой, галеты, заливные и открытые пироги, да в целом вообще любая выпечка, где важна активная реакция Майяра и чёткая структура теста, — не её территория.</p>\n<p>Отдельного внимания заслуживает качество керамики. Хорошие формы плотные, тяжёлые и равномерно обожжённые, дешёвая керамика может быстро обрасти микротрещинами, нагреваться неравномерно и со временем трескаться, что делает её поведение в духовке менее предсказуемым, поэтому выбирать керамику нужно так же как и чугунок — лучше одну качественную, чем пять разных цветов. У керамики, как и у ножей или воков, есть бренды, которые последовательно делают достойные по качеству изделия, и эти имена вам уже встречались:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⚫️</i><span class=\"tx\">Emile Henry</span></li></ul>\n<p>Французская керамика, обожжённая при высокой температуре методом, близким к технологическому обжигу кирпича — плотная, устойчиво переносит горячую духовку и перепады температуры, прекрасно подходит для гратенов, запеканок, рататуев и фруктовых десертов.</p>\n<ul class=\"ings\"><li><i class=\"bul\">⚫️</i><span class=\"tx\">Le Creuset</span></li></ul>\n<p>Хотя Le Creuset известен прежде всего чугуном, их керамическая посуда также высокого класса: устойчивые к сколам глазурь и плотность обжига делают их формы надёжными долгожителями на вашей кухне.</p>\n<ul class=\"ings\"><li><i class=\"bul\">⚫️</i><span class=\"tx\">Staub</span></li></ul>\n<p>Та же философия качества, что и у Le Creuset — плотное, толстостенное изделие, одинаково хорошо ведёт себя при медленном прогреве и долгом томлении.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">МЕТАЛЛИЧЕСКИЕ ФОРМЫ</span></li></ul>\n<p>быстро, активно, точно</p>\n<p>Металл — прямой антипод стекла и керамики, он нагревается мгновенно и столь же активно передаёт тепло продукту, а потому металлические формы остаются главным инструментом на профессиональных кухнях — стабильным и предсказуемым.</p>\n<p>Алюминий, сталь и анодированный алюминий обеспечивают быстрое схватывание теста, активное подрумянивание дна и стенок и чёткую, воспроизводимую структуру. Пироги, бисквиты, тарты, песочные основы, печенье, хлеб — всё, где важны форма, корочка и контроль, лучше всего получается именно в металле.</p>\n<p>За эту эффективность, правда, приходится расплачиваться вниманием. Металл легко перегревается, особенно если форма тёмная или тонкая. Он не прощает ошибок во времени и температуре: то, что в стекле может “сойти с рук”, в металле быстро превращается в подгоревший край или пересушенное дно. Металлические формы требуют понимания рецепта и особенностей своей духовки, зато при наличии этого понимания они дают самый стабильный, повторяемый и богатый на вкус и ароматику результат.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">СИЛИКОНОВЫЕ ФОРМЫ</span></li></ul>\n<p>удобство вместо теплопередачи</p>\n<p>Силикон стоит здесь особняком, потому что по своей сути это вообще не материал для управления теплом, а материал для упрощения процесса. Он почти не проводит тепло, не формирует корочку и минимально влияет на текстуру — его задача сводится лишь к удержанию формы и лёгкому извлечению готового изделия, и именно поэтому в силиконовой форме нельзя испечь по-настоящему вкусный бисквит или кекс.</p>\n<p>Силикон удобен для муссов, холодных десертов, заморозки, желейных тортов и простых кексов совсем без гастрономических амбиций, ожидать от него выпечки с выраженной корочкой, хорошей текстурой и активным подрумяниванием — ошибка. Силикон не запекает, он просто придает тесту форму.</p>\n<p>ВМЕСТО ВЫВОДА</p>\n<p>В конечном счёте, выбор формы для выпечки — это не экзамен на кулинарную грамотность и не поиск единственно верного решения, а скорее разговор о ваших приоритетах, ритме жизни и том настроении, которое чаще всего царит на кухне. Иногда хочется точности, хруста и контроля — и тогда рука сама тянется к металлу. Иногда важнее визуал, мягкость и неспешность — тогда стекло или керамика оказываются идеальными спутниками. Чем лучше вы понимаете свойства материалов, тем свободнее становитесь в выборе и тем лучше кухня подстраивается под вас и ваши цели.</p></div>"},"636":{"id":636,"title":"Съедобная скорая помощь","sub":"часть вторая, практическая","cat":"Запас продуктов","img":"","lq":"","w":0,"h":0,"q":"съедобная скорая помощь часть вторая, практическая углеводная база паста спагетти капеллини короткие фузилли разноцветные пенне гречневая лапша булгур кускус рис жасминовый рис арборио картофель белковая основа фарш говядина свинина куриные окорочка грудка индейки лосось замороженный переложенный в холодильник креветки замороженные очищенные тунец в оливковом масле консервы сардины в оливковом масле консервы нут консервы красная фасоль консервы белая фасоль консервы яйца основы соусов и усилители вкуса целые томаты в собственном соку томатная паста кокосовое молоко оливки каперсы артишоки соевый соус пониженное содержание соли орехи и семечки маленькие упаковки морозилка стручковая фасоль зелёный горошек брокколи грибы овощи для вока смесь a 557 куриный бульон a 566 говяжий бульон слоёное тесто на сливочном масле пельмени кусочки ремесленного хлеба зелень петрушка укроп базилик холодильник пармезан и или пекорино греческие йогурты горчиц","html":"<div class=\"spread\"><aside class=\"rail\"><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">углеводная база:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">паста: спагетти, капеллини, короткие фузилли, разноцветные пенне</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">гречневая лапша</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">булгур</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кускус</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">рис жасминовый</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">рис арборио</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">картофель</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">белковая основа:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">фарш (говядина + свинина)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">куриные окорочка</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">грудка индейки</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">лосось (замороженный, переложенный в холодильник)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">креветки (замороженные, очищенные)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">тунец в оливковом масле (консервы)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">сардины в оливковом масле (консервы)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">нут (консервы)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">красная фасоль (консервы)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">белая фасоль (консервы)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">яйца</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">основы соусов и усилители вкуса:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">целые томаты в собственном соку</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">томатная паста</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кокосовое молоко</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">оливки</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">каперсы</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">артишоки</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">соевый соус (пониженное содержание соли)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">орехи и семечки (маленькие упаковки)</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">морозилка:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">стручковая фасоль</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">зелёный горошек</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">брокколи</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">грибы</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">овощи для вока (смесь)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/557\">куриный бульон</a></span></li><li><i class=\"bul\">🟣</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/566\">говяжий бульон</a></span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">слоёное тесто (на сливочном масле)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">пельмени</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кусочки ремесленного хлеба</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">зелень: петрушка, укроп, базилик</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">холодильник:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">пармезан и/или пекорино</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">греческие йогурты</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">горчица: дижонская и зернистая</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">свежие овощи и фрукты (база):</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">лук репчатый</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">морковь</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">лимон</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">масла:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">оливковое масло extra virgin</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">масло с высокой точкой дымления (например, авокадо)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">растительное рафинированное (подсолнечное или рапсовое)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кунжутное масло</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">сливочное масло (холодильник)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">масло нуазетт (морозилка)</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">специи:</p><ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">соль Maldon</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чёрный перец горошком (в мельнице)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">чеснок гранулированный</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">орегано</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">куркума порошок</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">зира семена</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">кориандр семена</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">фенхель семена</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">острый перец (чили, урфа)</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">ванильная пудра</span></li></ul></div></div></aside></div>"},"635":{"id":635,"title":"Съедобная скорая помощь","sub":"часть третья, прикладная","cat":"Запас продуктов","img":"","lq":"","w":0,"h":0,"q":"съедобная скорая помощь часть третья, прикладная съедобная скорая помощь часть третья прикладная 10 разных быстрых обедов на основе списка каждый с небольшой инструкцией тост с сардинами","html":"<div class=\"prose\"><p class=\"lbl\">10 разных быстрых обедов на основе списка, каждый с небольшой инструкцией:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ТОСТ С САРДИНАМИ</span></li></ul>\n<p>~10 мин<br>Поджарить ломтики ремесленного хлеба на сковороде или в тостере, сверху выложить сардины в оливковом масле, немного артишоков и каперсов, сбрызнуть лимонным соком и оливковым маслом extra virgin, посыпать свежемолотым перцем. Если к этому есть свежий помидор — идеально.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ЭКСПРЕСС <a class=\"xref\" href=\"#/r/634\">ШАКШУКА</a></span></li></ul>\n<p>~15 мин<br>На оливковом масле обжарить лук с чесноком и специями, добавить банку томатов и томатную пасту, тушить 5 минут, сделать углубления, вбить яйца и готовить под крышкой до желаемой степени, подавать с тостами из хлеба и зеленью.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">СПАГЕТТИ БОЛОНЬЕЗЕ (БЫСТРЫЕ)</span></li></ul>\n<p>~25 мин<br>Обжарить фарш с луком и морковью, добавить томатную пасту, орегано и бульон, тушить 10–12 минут, сварить спагетти и соединить с соусом; подавать с пармезаном.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">КАРРИ С НУТОМ И КОКОСОВЫМ МОЛОКОМ</span></li></ul>\n<p>~25 мин<br>Сварить рис, обжарить овощи для вока со специями на масле нуазетт, добавить нут, томатную пасту и кокосовое молоко, тушить 10 минут, подавать с рисом.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ПИРОГ С БРОККОЛИ И ЛОСОСЕМ</span></li></ul>\n<p>~30 мин<br>В форму смазанную маслом уложить слоёное тесто, сверху брокколи и кусочки лосося, залить смесью яиц, йогурта и специй, посыпать тертым сыром, выпекать при 200 градусов (режим: конвекция) около 25 минут.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ГРЕЧНЕВАЯ ЛАПША С ИНДЕЙКОЙ И ОВОЩАМИ</span></li></ul>\n<p>~15 мин<br>Сварить лапшу, на масле нуазетт обжарить овощи для вока, грибы и индейку, добавить лапшу, соевый соус, кунжутное масло и острый перец, быстро прогреть и подать горячим.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ПЕЛЬМЕНИ В <a class=\"xref\" href=\"#/r/557\">КУРИНОМ БУЛЬОНЕ</a></span></li></ul>\n<p>~20 мин<br>Подогреть бульон с морковью и луком, проварить 7-10 минут до мягкости моркови, отдельно отварить пельмени до готовности, подать всё вместе с зеленью, маслом нуазетт, греческим йогуртом и тостами.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">ПАЭЛЬЯ ИЗ БУЛГУРА С КРЕВЕТКАМИ</span></li></ul>\n<p>~25 мин<br>На оливковом масле обжарить лук и морковь, всыпать булгур и специи, влить горячий бульон и готовить 15 минут. За 5 минут до готовности выложить бланшированные креветки, подать с лимоном.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">САЛАТ-НИСУАЗ (БЫСТРЫЙ)</span></li></ul>\n<p>~15 мин<br>Отварить картофель небольшим кубиком (10 минут) и стручковую фасоль (5 минут), яйца (8 минут). Выложить на тарелку с тунцом и оливками, заправить лимонным соком, дижонской горчицей и оливковым маслом.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">КАПЕЛЛИНИ АЛЬ ЛИМОНЕ</span></li></ul>\n<p>~15 мин<br>Сварить капеллини, сохранив полстакана воды. На сковороде растопить сливочное масло с лимонным соком и цедрой, добавить немного воды из-под пасты, вмешать пасту, посыпать сыром и свежемолотым перцем.</p></div>"},"674":{"id":674,"title":"Доска с закусками к вину","sub":"planche apéro","cat":"Сервировка и подача","img":"thumb/0674_00_674_photo.webp","lq":"data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAACQBQCdASoUABsAPu1kq0+ppSOiMBgIATAdiWIAuwHc+X9Rb7hnqZLbeuuZife63pRxhmMUgADagBf9Ze4T2JuT+bALFDS4098KAYp2++WWoRf2605tyiLBCHz8U+CQgGHiBBogrSRNwDT5cY18uS1loYB88D9YF3S7np8Ei+XAl5iVRBw5a1/hqwnzhuVThvtgTo03gvy1AXeXnLSKeTglpogeWmTgmbABXYKJVovCIosyhF0ki9lBRK/P8wHeTFMW7n0ltCmZoinT+HkD92FKwW3R9MOlhews+CAunLDnqdQ3dQXEcWVJjrgx+qVS8OgGANAwAAA=","w":360,"h":480,"q":"доска с закусками к вину planche apéro  бри выложить прямо в бумаге нарезка типа круглого пирога пармезан колотый горгондзола разломать руками на небольшие кусочки чеддер или гауда нарезать кубиками мясо прошутто котто или любая вареная ветчина нарвать руками сформировать хаотичные бутончики прошутто крудо или хамон тот же принцип чориззо салями сальсиччо выложить веером или в одну линию багет сладкий хлеб с сухофруктами и семечками хлебные палочки типа гриссини крекеры с сыром или зеленью чипсы с интересными вкусами с пармезаном чили и лаймом либо просто классика с морской солью солёный миндаль кешью оливки классно выглядит когда сочетаются несколько видов оливок гигантские маленькие маслины я всегда добавляю каперсы с хвостиками этот прием подсмотрела в барселоне на рынке бокерия вяленые томаты мини перчики с начинкой из творожного сыра конфитюр мой фаворит инжир еще хорошо подойдут любые цитрусовые виноград ножницами порез","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"600\" height=\"800\" src=\"img/0674_00_674_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAACQBQCdASoUABsAPu1kq0+ppSOiMBgIATAdiWIAuwHc+X9Rb7hnqZLbeuuZife63pRxhmMUgADagBf9Ze4T2JuT+bALFDS4098KAYp2++WWoRf2605tyiLBCHz8U+CQgGHiBBogrSRNwDT5cY18uS1loYB88D9YF3S7np8Ei+XAl5iVRBw5a1/hqwnzhuVThvtgTo03gvy1AXeXnLSKeTglpogeWmTgmbABXYKJVovCIosyhF0ki9lBRK/P8wHeTFMW7n0ltCmZoinT+HkD92FKwW3R9MOlhews+CAunLDnqdQ3dQXEcWVJjrgx+qVS8OgGANAwAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">бри (выложить прямо в бумаге, нарезка типа круглого пирога)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">пармезан (колотый)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">горгондзола (разломать руками на небольшие кусочки)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">чеддер или гауда (нарезать кубиками)</span></li></ul></div><div class=\"idiv\">МЯСО</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">прошутто котто или любая вареная ветчина (нарвать руками, сформировать хаотичные «бутончики)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">прошутто крудо или хамон (тот же принцип)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">чориззо/салями/сальсиччо (выложить веером или в одну линию)</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">багет</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сладкий хлеб с сухофруктами и семечками</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">хлебные палочки типа гриссини</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">крекеры с сыром или зеленью</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">чипсы с интересными вкусами (с пармезаном, чили и лаймом, либо просто классика с морской солью)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">солёный миндаль</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">кешью</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">оливки (классно выглядит, когда сочетаются несколько видов оливок - гигантские, маленькие, маслины + я всегда добавляю каперсы с хвостиками - этот прием подсмотрела в Барселоне, на рынке Бокерия)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">вяленые томаты</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">мини-перчики с начинкой из творожного сыра</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">конфитюр (мой фаворит - инжир, еще хорошо подойдут любые цитрусовые)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">виноград (ножницами порезать кисти на небольшие кисточки по несколько ягод, чтобы удобно было взять веточку, а не отдирать каждую виноградину)</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">мёд</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">конфитюр с имбирём или красным перцем</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/492\">фруктовая горчица</a></span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Ловите моё первое правило тайм-менеджмента в области званых ужинов - к приходу самых первых гостей у вас могут быть не дорезаны салаты, не доделано основное блюдо или десерт, могут не стоять свечи или даже могут быть не разложены салфетки и приборы, но вы обязательно должны позаботиться о сверкающих чистотой бокалах под напитки и лёгкой закуске, которую можно брать руками. Это гарантирует вам приятную атмосферу с порога - ворвавшихся в ваш дом гостей первым делом надо успокоить и расслабить. Налейте вина, спросите, как они добрались и накажите попробовать классные оливки, которые вы купили на днях. И продолжайте резать салат.</p>\n<p>Мой фирменный приём, который мои гости знают и любят - большая доска с закусками, которая стоит в самом центре стола ещё до того, как все собрались и расселись, и до того, как поданы другие блюда. Я привезла этот приём сувениром из своей самой первой поездки в Париж. Тогда, в 2015м, мои друзья практически с самолета затащили меня в крошечное местечко в 10м округе, усадили за обшарпанный стол, крикнули официанту незнакомые слова, и вот уже буквально через несколько мгновений на нём появилась корзинка с багетом, запотевшая бутылка белого, пара бокалов и черная дощечка с разномастными колбасами, сырами, крошечной баночкой конфитюра и маленькой мисочкой с пухлыми оливками. Настоящее гастрономическо-гедонистическое счастье.</p>\n<p>Итак, сначала вам нужно решить - собираетесь ли вы делать одну большую доску с разномастными закусками или отдельные - для сыра и мяса. Есть смысл делать две разномастные доски поменьше - если у вас длинный стол и много гостей (иначе будет неудобно тянуться). Доски можно выстелить предварительно хорошенько смятой пергаментной бумагой, но это опционально.</p>\n<p>Чем наполнять?</p>\n<p>Основной принцип: разные виды мяса, разные виды сыра, что-то хлебное, что-то хрустящее, что-то соленое, что-то сладкое, а для избранных любителей - что-то острое. Хочется немного снять с себя ответственность: во-первых, я пишу самую базу, и если вы большой любитель и поклонник мяса или сыра, то просто включаете собственный вкус и фантазию. Во-вторых, я намеренно опускаю разного рода тонкости вроде правил подачи сырной тарелки (цельными кусками, определенные виды, с несколькими ножами специально под каждый вид сыра), чтобы не перебарщивать с французским снобизмом. Итак!</p>\n<p>СЫР</p></div><p>ХЛЕБНОЕ</p>\n<p>ХРУСТЯЩЕЕ</p>\n<p>СОЛЕНОЕ</p>\n<p>СЛАДКОЕ</p>\n<p>ОСТРОЕ</p><div class=\"outrop\"><p>Как наполнять?</p>\n<p>Я бы хотела написать тут свод каких-то правил, но их действительно нет. Мне нравится раскладывать все хаотично, добавляя прямо на доску маленькие тарелочки и мисочки. Мой основной совет - тренируйте насмотренность и вволю экспериментируйте. Используйте Pinterest и просто Google, вбивайте нужные поисковые слова на разных языках, подмечайте интересные подачи в фильмах, ресторанах и гостях. Тренируйтесь, в общем! Тут, как и во всем в нашей жизни, важен опыт.</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"540\" src=\"thumb/0674_01_675_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"536\" src=\"thumb/0674_02_676_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"539\" src=\"thumb/0674_03_677_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0674_04_678_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"540\" src=\"thumb/0674_05_679_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"434\" src=\"thumb/0674_06_680_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0674_07_681_photo.webp\" alt=\"\"></figure></div>"},"682":{"id":682,"title":"Планши для вдохновения","sub":"и шпаргалка по нарезке сыра","cat":"Сервировка и подача","img":"thumb/0682_00_682_photo.webp","lq":"data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAABwBQCdASoUABsAPu1qrFEppaQiqAqpMB2JZACw7YwccLbOjSpoWTZdyHfKOa1YH2+3eOTAAP7TF+wNQB09Knm6leBQL77UVfjEMsE51wi5DP0JAMP6XX6SDGhJ9JPngYYdQXABd08ljd+UzAPWZUTs3m7pjyYZMHGGbmhTzlJ4wrp02mvoLp57XCP68ohUzXNpsl0V79bRPetKsabS6IP0azH+/NnQgRxTfRFAt8SsXHNm0c0M8si1tZkwluHmTcd+/1IVSrijwAAA","w":360,"h":480,"q":"планши для вдохновения и шпаргалка по нарезке сыра немного моих планшей для вдохновения а также шпаргалка по нарезке сыра","html":"<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_00_682_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_01_683_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_02_684_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_03_685_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_04_686_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"480\" src=\"thumb/0682_05_687_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0682_06_688_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>Немного моих планшей для вдохновения, а также шпаргалка по наре " decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0793_08_801_photo.webp\" alt=\"\"></figure></div><div class=\"prose\"><p>#aesthetictime</p>\n<p>Порция вдохновения на овощные пироги по мотивам тарта со спаржей с просторов интернета</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Рикотту можно заменить на фету, сливочный или козий сыр</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Бортики тарта можно украсить белым или черным кунжутом, семенами льна, итальянскими травами</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">В качастве начинки — разноцветные томаты, помидоры черри, кабачки или цуккини, лук-порей, зеленый горошек, молодая морковь</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Дополнительно сверху — ветчина, орехи, вяленые томаты, оливки, каперсы, зеленый или красный песто, сальса, свежий базилик или розмарин</span></li></ul></div>"}}};</script>
<script>
const $ = s => document.querySelector(s);
const cat = $('#catalog'), rec = $('#recipe');
let query = '';

const KEY = id => 'fp:' + id;
const load = id => { try { return JSON.parse(localStorage.getItem(KEY(id))) || {i:[],s:[]}; }
                     catch(e){ return {i:[],s:[]}; } };
const save = (id,v) => { try { localStorage.setItem(KEY(id), JSON.stringify(v)); } catch(e){} };

function plural(n,a,b,c){const m=n%100,k=n%10;
  if(m>=11&&m<=14)return c; if(k===1)return a; if(k>=2&&k<=4)return b; return c;}

function cards(ids){
  return ids.map(id=>{
    const it = DATA.items[id]; if(!it) return '';
    const ph = it.img
      ? `<img loading="lazy" decoding="async" width="${it.w}" height="${it.h}" src="${it.img}" alt=""
             style="background:var(--wash) url(${it.lq}) center/cover">`
      : '';
    return `<a class="card" href="#/r/${id}">
      <span class="ph">${ph}</span>
      <span class="nm">${it.title}</span>
      ${it.sub?`<span class="sb">${it.sub}</span>`:''}</a>`;
  }).join('');
}

function renderCatalog(){
  document.body.className='view-catalog';
  rec.hidden=true; cat.hidden=false;
  const q=query.trim().toLowerCase();
  if(q){
    const hits=Object.keys(DATA.items).filter(id=>DATA.items[id].q.includes(q));
    cat.innerHTML=`<div class="wrap"><section class="band" style="padding-top:44px">
      <div class="bhead"><h2>${hits.length?'Нашлось':'Ничего не нашлось'}</h2>
      <div class="meta"><div class="n">${hits.length} ${plural(hits.length,'рецепт','рецепта','рецептов')}</div></div></div>
      ${hits.length?`<div class="grid">${cards(hits)}</div>`
        :`<p class="empty">Поиск смотрит на названия и на списки продуктов. Попробуйте продукт — «буррата», «нут», «анчоусы».</p>`}
      </section></div>`;
    return;
  }
  const contents = DATA.groups.map(g=>
    `<a class="cline" href="#g-${encodeURIComponent(g.name)}">
       <span class="nm">${g.name}</span><span class="dots"></span><span class="ct">${g.ids.length}</span></a>`).join('');
  const bands = DATA.groups.map(g=>`
    <section class="band" id="g-${encodeURIComponent(g.name)}">
      <div class="bhead"><h2>${g.name}</h2>
        <div class="meta"><div class="n">${g.ids.length} ${plural(g.ids.length,'рецепт','рецепта','рецептов')}</div>
        ${g.sub?`<div class="d">${g.sub}</div>`:''}</div></div>
      <div class="grid">${cards(g.ids)}</div>
    </section>`).join('');
  cat.innerHTML=`
    <div class="wrap">
      <header class="masthead">
        <h1>food<br><em>&amp;</em> people</h1>
        <p class="say">Один день кухонного клуба, разобранный по полкам: <b>${DATA.total} ${plural(DATA.total,'рецепт','рецепта','рецептов')}</b>, записанных дословно. Отметьте продукты и шаги прямо в рецепте — страница запомнит, где вы остановились.</p>
      </header>
      <nav class="contents">${contents}</nav>
      ${bands}
    </div>`;
}

function renderRecipe(id){
  const it=DATA.items[id];
  if(!it){ location.hash='#/'; return; }
  document.body.className='view-recipe';
  cat.hidden=true; rec.hidden=false;
  const g=DATA.groups.find(g=>g.ids.includes(id))||{ids:[]};
  const k=g.ids.indexOf(id);
  const prev=k>0?DATA.items[g.ids[k-1]]:null;
  const next=k>=0&&k<g.ids.length-1?DATA.items[g.ids[k+1]]:null;
  rec.innerHTML=`
    <div class="wrap"><article class="recipe">
      <div class="rtop"><div class="u"><a href="#g-${encodeURIComponent(it.cat)}">${it.cat}</a></div>
      <h1>${it.title}</h1>${it.sub?`<p class="sub">${it.sub}</p>`:''}</div>
      ${it.html}
      <nav class="nav">
        ${prev?`<a href="#/r/${prev.id}"><span class="u">Предыдущий</span>${prev.title}</a>`:'<span style="flex:1"></span>'}
        ${next?`<a class="r" href="#/r/${next.id}"><span class="u">Следующий</span>${next.title}</a>`:''}
      </nav>
    </article></div>`;
  document.title=it.title+' — food & people';
  wireChecks(id);
  window.scrollTo({top:0});
}

/* состав и шаги отмечаются по ходу готовки и запоминаются */
function wireChecks(id){
  const ings=[...rec.querySelectorAll('.ings li')];
  const steps=[...rec.querySelectorAll('.step')];
  if(!steps.length && !ings.length) return;
  const st=load(id);
  ings.forEach((li,n)=>{
    li.setAttribute('role','button'); li.tabIndex=0;
    if(st.i.includes(n)) li.classList.add('done');
    const t=()=>{li.classList.toggle('done');
      const s=load(id); const on=li.classList.contains('done');
      s.i=on?[...new Set([...s.i,n])]:s.i.filter(x=>x!==n); save(id,s); paint();};
    li.onclick=t; li.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t();}};
  });
  if(steps.length){
    const head=document.createElement('div');
    head.className='steps-head';
    head.innerHTML=`<span class="u">Приготовление</span><span class="prog"></span>
                    <button class="reset" type="button">сбросить</button>`;
    steps[0].parentNode.insertBefore(head,steps[0]);
    head.querySelector('.reset').onclick=()=>{
      save(id,{i:[],s:[]});
      ings.forEach(l=>l.classList.remove('done'));
      steps.forEach(s=>s.classList.remove('done')); paint();};
  }
  steps.forEach((el,n)=>{
    el.setAttribute('role','button'); el.tabIndex=0;
    if(st.s.includes(n)) el.classList.add('done');
    const t=()=>{el.classList.toggle('done');
      const s=load(id); const on=el.classList.contains('done');
      s.s=on?[...new Set([...s.s,n])]:s.s.filter(x=>x!==n); save(id,s); paint();};
    el.onclick=t; el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t();}};
  });
  function paint(){
    const p=rec.querySelector('.prog'); if(!p) return;
    const d=rec.querySelectorAll('.step.done').length;
    p.textContent=d?`${d} из ${steps.length}`:`${steps.length} ${plural(steps.length,'шаг','шага','шагов')}`;
    const r=rec.querySelector('.reset');
    if(r) r.style.visibility=(d||rec.querySelector('.ings li.done'))?'visible':'hidden';
  }
  paint();
}

function route(){
  const m=location.hash.match(/^#\/r\/(\d+)/);
  if(m){ renderRecipe(m[1]); return; }
  const wasRecipe=document.body.classList.contains('view-recipe');
  if(!cat.innerHTML || wasRecipe) renderCatalog();
  const g=location.hash.match(/^#g-(.+)/);
  if(g){ const el=document.getElementById('g-'+g[1]); if(el) el.scrollIntoView(); }
  else if(!wasRecipe) window.scrollTo({top:0});
}

$('#q').addEventListener('input',e=>{query=e.target.value;renderCatalog();});
$('#back').onclick=()=>{ if(history.length>1) history.back(); else location.hash='#/'; };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&location.hash.startsWith('#/r/')) $('#back').click();
  if(e.key==='/'&&!/input/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
});
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
