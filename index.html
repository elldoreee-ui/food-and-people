bp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0822_02_824_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0822_03_825_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0822_04_826_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0822_05_827_photo.webp\" alt=\"\"></figure></div>"},"828":{"id":828,"title":"Красочная шаверма","sub":"с пряной курицей, морковью и красной капустой","cat":"Курица и птица","img":"thumb/0828_00_828_photo.webp","lq":"data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAACwBQCdASoUABkAPu1ip04ppaMiMBgMATAdiWgAnTKEfidi8Y21mLX1IB3nAGrB+WFz8u6dWwAAnArAHH5q9W3QwuenDYQ36ZAs1OJasocNAIzkjvvfv506FFLbQ55TKuJ3tMA/Xhqbi3EtNeaX6HDjUnukOWVnOA3Sxm/vDSCI5wsRoE0YgiwjZDlPJwUemAHNtkE6CYxE1Hh3oeXwJjyq/i9O44eVLcy9CF25yX5FT6ZSuKmNbhkKXioIRoae9cL1sYHQq+GceQLqkUFXM1fUPeqV/y96HDmwcJiSflTJltvIT/bnTe9TJxvoHSROKUhGOMQAAAA=","w":360,"h":450,"q":"красочная шаверма с пряной курицей, морковью и красной капустой на 3 шавермы для маринования курицы курица филе бедра 500 г греческий йогурт 100 г бальзамический уксус 1 ст л оливковое масло 2 ст л кумин 1 2 ч л гарам масала 1 ч л паприка копченая 1 ч л чеснок гранулированный 1 2 ч л свежемолотый черный перец для соуса майонез предпочтительно домашний 3 ст л греческий йогурт 1 ст л горчица дижонская 1 ч л вурстерширский соус 1 ч л паприка копченая 1 2 ч л а также морковь по корейски малосольная красная капуста тортилья пшеничная спелый помидор красочная шаверма с пряной курицей морковью и красной капустой уличная еда которую знают все шаверма да она же шаварма она же шаурма она же дёнер гирос тагам кабаб турки и так далее стотыщ вариаций а суть одна мясо медленно поджаривающееся на вертикальном вертеле нарезающееся тонкими слайсами и подающееся в лепёшке с разными соусами и разными овощами началась история шавермы в тур","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0828_00_828_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgIBAABXRUJQVlA4IPYAAACwBQCdASoUABkAPu1ip04ppaMiMBgMATAdiWgAnTKEfidi8Y21mLX1IB3nAGrB+WFz8u6dWwAAnArAHH5q9W3QwuenDYQ36ZAs1OJasocNAIzkjvvfv506FFLbQ55TKuJ3tMA/Xhqbi3EtNeaX6HDjUnukOWVnOA3Sxm/vDSCI5wsRoE0YgiwjZDlPJwUemAHNtkE6CYxE1Hh3oeXwJjyq/i9O44eVLcy9CF25yX5FT6ZSuKmNbhkKXioIRoae9cL1sYHQq+GceQLqkUFXM1fUPeqV/y96HDmwcJiSflTJltvIT/bnTe9TJxvoHSROKUhGOMQAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 3 шавермы:</p><div class=\"iblock\"><p class=\"lbl\">для маринования курицы:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">курица (филе бедра) 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">греческий йогурт 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарам масала 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез, предпочтительно домашний 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">греческий йогурт 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вурстерширский соус 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1/2 ч л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь по-корейски</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">малосольная красная капуста</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тортилья пшеничная</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">спелый помидор</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Уличная еда, которую знают все — шаверма! Да, она же шаварма, она же шаурма, она же дёнер, гирос, тагам, кабаб турки и так далее. Стотыщ вариаций, а суть одна: мясо, медленно поджаривающееся на вертикальном вертеле, нарезающееся тонкими слайсами и подающееся в лепёшке с разными соусами и разными овощами.</p>\n<p>Началась история шавермы в Турции, точнее, в Османской Империи времен 19 века. Мясо для кебабов там долгое время жарили на горизонтальных вертелах или в форме шашлыка, но однажды какой-то умник догадался поставить вертел вертикально — так стекающий вниз жир встретился с реакцией Майяра и получилось диво как вкусно, плюс бонусом можно было бесконечно срезать мясо по мере готовности. Это был переворот! Позже этот принцип перекочевал в арабские страны и стал зваться shawarma, от турецкого çevirme — “вращение”. Сегодня у шавермы сотни лиц: в Ливане — с тахини и маринованными огурцами, в Сирии — с картошкой фри, в Германии — с йогуртовым соусом и красной капустой, в России — с майонезом и капустой белой. Моя версия немного отошла от канонов и как часто со мной бывает, родилась от сильного желания угодить мужу. Сочная, хрусткая, чуть острая, с курицей в пряном йогуртовом маринаде, красной малосольной капустой, корейской морковью и дымным соусом. Так выглядела бы шаверма мечты Вилли, и такой она и получилась 🙂</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вечером накануне замариновать курицу. В большую миску отправить греческий йогурт, уксус, оливковое масло, кумин, гарам масала, копченую паприку и чеснок, все хорошо перемешать. Филе бедра обсушить и слегка натереть солью и перцем, затем переложить в миску, хорошо выкупать в маринаде и убрать в холодильник на ночь. Напомню, что лучшая “ёмкость” для маринада мяса — это зип-пакеты (в один слой), так как в таком случае точек соприкосновения маринада с мясом получается больше. Если имеются — лучше переложить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">На следующий день смешиваем все ингредиенты для соуса, нарезаем помидор тонкими слайсами и подготавливаем себе место для сбора шавермы. Куриное филе обсушить бумажными полотенцами и приготовить удобным вам способом:</div></div>\n<p>Если гриль, то около 8-12 минут над покрытыми серым пеплом разогретыми углями, в середине перевернуть. Термометр, воткнутый в центр самого толстого куска, должен показывать 73-75 градусов (после обжаривания мы отправим филе отдыхать под крышкой, и температура дойдёт до нужных нам 77). Если ваше филе с кожей, будет меньше шансов пересушить, поэтому можно менее тщательно следить за внутренней температурой. Если без кожи, то готово будет быстрее, следите. Я всегда покупаю с кожей и убираю её уже после обжаривания.</p>\n<p>Если духовка, то в металлическом противне на 200 градусов (режим: верх/низ) на 18-20 минут.</p>\n<p>Если на сковороде, то разогреваем 1 ст ложку оливкового масла и обжариваем филе на сильном огне по 2 минуты с каждой стороны, затем убавляем огонь и обжариваем снова приблизительно по 5 минут с каждой стороны. Помним про разницу в обжаривании филе с кожей и без кожи.</p>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Дать готовому филе отдохнуть в течение 5 минут, затем можно нарезать крупными ломтиками.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Можно собирать. На лепешку наносим соус, затем выкладываем мясо, затем два кружочка помидора, затем морковь, затем капуста. Загнуть нижний край лепешки вокруг начинки, затем сделать загиб справа и слева и затем завернуть “конверт”. Обжарить шаверму на сковороде на среднем огне на небольшом количестве растительного масла в течение пары минут, чтобы с обеих сторон зарумянилась. Либо на решетке от гриля в зоне рядом с углями (не над ними). Срочно подавать.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0828_01_829_photo.webp\" alt=\"\"></figure></div>"},"866":{"id":866,"title":"Куриные котлетки","sub":"","cat":"Курица и птица","img":"thumb/0866_00_866_photo.webp","lq":"data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAACwBQCdASoUABkAPu1qrFEppaQiqAqpMB2JYgCdMzL6A0fUrQBY345hn3CU3o+P1OSIEciO5yAA/FQsGTYVftFsvCA2E6LMPHM1cUG7za8AOnqJ4iZeP1qLSbxTNPv/PS4nqmD8uZEBYfWTOoppJebUWaHsUqArs77S55ay00SSfjzkBY8L8vqPeDp+KD1PC7eAXPhvCBPZgnymrqKiR5iol/cxABLqyLhhhDw2hod5MSo6Cxf4W8B9pjse7uMFi2vS8OaGoX8jMRBkzrXtiEgYPfEAAA==","w":360,"h":450,"q":"куриные котлетки  на 4 порции 12 котлеток куриная грудка 600 г лук порей 80 г греческий йогурт 120 г яйцо 1 шт мука 20 г петрушка 6 стеблей листья куркума 1 2 чл копченая паприка 1 2 чл соль белый перец соевый соус 3 ст л сливочное масло 10 г оливковое масло кунжут куриные котлетки не смогла удержаться и добавила уменьшительно ласкательный суффикс к названию этого блюда прошу понять и простить о бо жаю куриные котлетки они же куриные оладья из рубленой куриной грудки во первых это очень быстро на весь рецепт редко уходит больше получаса во вторых очень уютно горячие ароматные куриные облачка похожи на объятия бабушки они вкусные и в отличие от к","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0866_00_866_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAACwBQCdASoUABkAPu1qrFEppaQiqAqpMB2JYgCdMzL6A0fUrQBY345hn3CU3o+P1OSIEciO5yAA/FQsGTYVftFsvCA2E6LMPHM1cUG7za8AOnqJ4iZeP1qLSbxTNPv/PS4nqmD8uZEBYfWTOoppJebUWaHsUqArs77S55ay00SSfjzkBY8L8vqPeDp+KD1PC7eAXPhvCBPZgnymrqKiR5iol/cxABLqyLhhhDw2hod5MSo6Cxf4W8B9pjse7uMFi2vS8OaGoX8jMRBkzrXtiEgYPfEAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции (~12 котлеток):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриная грудка 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-порей 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">греческий йогурт 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 6 стеблей (листья)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1/2 чл</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копченая паприка 1/2 чл</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжут</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Не смогла удержаться и добавила уменьшительно-ласкательный суффикс к названию этого блюда, прошу понять и простить. О-бо-жаю куриные котлетки, они же куриные оладья из рубленой куриной грудки! Во-первых, это очень быстро - на весь рецепт редко уходит больше получаса. Во-вторых, очень уютно - горячие ароматные куриные облачка похожи на объятия бабушки, они вкусные и (в отличие от классической постсоветской comfort food) подойдут приверженцам здорового питания. В-третьих, это именно тот тип рецепта, который можно и нужно менять под себя, он очень вариабельный. Не любите лук-порей (или не нашли) - уберите или замените репчатым или шалотом. Не нашли греческий йогурт? Возьмите сметану. Хотите остроты? Добавьте хлопья перца чили. Ну, в общем, вы поняли. Творчество, фантазия, несколько проб - и у вас точно появится СВОЙ идеальный рецепт этого быстрого комфортного обеда.</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">TIP: За 15 минут до начала приготовления переложите куриное филе в морозилку - так будет проще его измельчить.</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Белую часть лука-порея мелко нарезать. Разогреть в сковороде 1 ст ложку оливкового масла с 10 г сливочного масла, добавить порей и обжарить в течение 3-5 минут (следите, чтобы не потемнел!). Немного остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Куриное филе обмыть, обсушить бумажными полотенцами, нарезать на очень маленькие кусочки. Если у вас есть стационарный блендер, измельчите филе в небольшие (различимые) кусочки в импульсном режиме. Если есть мясорубка, можно пропустить мясо через насадку с самыми крупными дырочками. На мой взгляд, вкуснее всего эти котлеты получаются именно из мелко нарезанного вручную филе.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В большой миске смешать нарезанное куриное филе, греческий йогурт, обжаренный лук, яйцо, копченую паприку, куркуму, соль, перец и мелко нарубленную петрушку и быстро вымешать “фарш”. Всыпать муку и еще раз перемешать. Не добавляйте слишком много соли, так как в конце еще будет соевый соус!</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В сковороде разогреть небольшое количество оливкового масла. Руками, смоченными в воде, сформировать плоские котлеты в форме круглых оладьев, обжаривать на средне-сильном огне (например, 6-7 из 9) по 2 минуты с каждой стороны. Будьте аккуратны при переворачивании, они очень нежные! Если совсем разваливаются, добавьте ещё 1 ст л муки. Помните, что в связи с постепенным прогреванием посуды, последняя партия зажарится куда быстрее, чем первая!</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Смешать соевый соус с 5 ст л воды. Когда всё будет пережарено, вернуть котлеты в сковородку, влить соевый соус с водой (поливая каждую котлетку), накрыть крышкой и подержать на слабом огне три минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Очень красиво подать эти котлеты можно на “подушке” из зеленой части лука-порея. Для этого листья нужно нарезать вдоль тонкими полосками, затем обильно промыть под горячей водой, сформировать что-то вроде гнездышка и уложить в глубокую тарелку. Сверху выложить котлеты, декорировать обжаренным кунжутом. Срочно подавать!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0866_01_867_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0866_02_868_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0866_03_869_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0866_04_870_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0866_05_871_photo.webp\" alt=\"\"></figure></div>"},"506":{"id":506,"title":"Фланк-стейк","sub":"с соусом чимичурри","cat":"Мясо","img":"thumb/0506_00_506_photo.webp","lq":"data:image/webp;base64,UklGRuYAAABXRUJQVlA4INoAAABQBQCdASoUABgAPu1sqlEppaOiqAqpMB2JZACdMyMv/qWMCM+Ah2EFmLMa7fxVOy4RMsgA4aZmCfMv3ohmfN/RRr/dKKc7roPMPzVlSM3r2qEW73UNb0EFY5mvZFEvcjZ8+qxPeCHQCmLrDx2KMUEVHaRYrv74RidbG+jr6/gIe8Uy7IuyN4Of8A8XT2FXJzUxBlREeSdrnTKSXeLEPHLVtscg+9EYbzkiRx9/Bz0zEuzbM9gXm2D5hedMAQFR4zfAfDHTj8SFfkuyhrYRlSDMO29Rn2pvFzQAAA==","w":360,"h":439,"q":"фланк-стейк с соусом чимичурри на 4 6 порций фланк стейк 1400 г растительное масло 80 г соевый соус 80 г рыбный соус 20 г коричневый сахар 30 г дижонская горчица 1 ст л сухой орегано 1 ч л имбирь 15 г чеснок 2 зубчика тайская паста чили 1 ч л с горкой соль хлопьями и свежемолотый черный перец для подачи для соуса чимичурри петрушка 1 пучок свежий орегано 3 стебля чеснок 1 зубчик лук шалот 1 2 шт или красный лук 1 4 шт перец урфа 1 ч л оливковое масло 60 г уксус красный винный 2 ст л лайм 1 2 шт соль фланк стейк с соусом чимичурри обожаю фланк это недорогой довольно постный очень мясной и выразительный за это и люблю отруб с длинными хорошо заметными волокнами обращаться с ним нужно немного иначе чем с классическими стейками ему на пользу идёт маринад быстрая обжарка и самое главное правильная нарезка готовый стейк обязательно нарезать тонкими ломтиками поперёк волокон в идеале ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"780\" src=\"img/0506_00_506_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuYAAABXRUJQVlA4INoAAABQBQCdASoUABgAPu1sqlEppaOiqAqpMB2JZACdMyMv/qWMCM+Ah2EFmLMa7fxVOy4RMsgA4aZmCfMv3ohmfN/RRr/dKKc7roPMPzVlSM3r2qEW73UNb0EFY5mvZFEvcjZ8+qxPeCHQCmLrDx2KMUEVHaRYrv74RidbG+jr6/gIe8Uy7IuyN4Of8A8XT2FXJzUxBlREeSdrnTKSXeLEPHLVtscg+9EYbzkiRx9/Bz0zEuzbM9gXm2D5hedMAQFR4zfAfDHTj8SFfkuyhrYRlSDMO29Rn2pvFzQAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">фланк-стейк 1400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">растительное масло 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рыбный соус 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">дижонская горчица 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сухой орегано 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тайская паста чили 1 ч л с горкой</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль хлопьями и свежемолотый черный перец для подачи</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса чимичурри:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 пучок</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежий орегано 3 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук шалот 1/2 шт или ⭐️красный лук 1/4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец урфа 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус красный винный 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лайм 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Обожаю фланк! Это недорогой, довольно постный, очень мясной и выразительный (за это и люблю) отруб с длинными хорошо заметными волокнами. Обращаться с ним нужно немного иначе, чем с “классическими стейками”: ему на пользу идёт маринад, быстрая обжарка и, самое главное, правильная нарезка. Готовый стейк обязательно нарезать тонкими ломтиками поперёк волокон, в идеале еще и диагонально, то есть держа нож под небольшим углом к разделочной доске — так ломтики получаются шире и нежнее.</p>\n<p>Я мариную мясо в насыщенном маринаде с соевым и рыбным соусами, коричневым сахаром, горчицей, имбирём и чесноком. Он добавляет мясу умами, сладость и помогает получить очень красивую насыщенную корочку при обжарке. Из-за маринада поверхность мяса быстро темнеет, поэтому перед сковородой стейки нужно очень тщательно обсушить, а также не перебарщивать с огнем.</p>\n<p>Классический аргентинский соус чимичурри из зелени, чеснока, уксуса и масла здесь работает как комплиментарная противоположность мясу: свежий, кислый, травянистый и немного острый. Его лучше приготовить заранее, чтобы вкусы успели соединиться, а непосредственно перед подачей дополнительно освежить уже настоявшийся соус петрушкой и лаймом.</p></div><p>или томатная паста 2 ч л</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Для маринада имбирь и чеснок мелко натереть. Соединить растительное масло, соевый и рыбный соусы, коричневый сахар, дижонскую горчицу, сухой орегано, имбирь, чеснок и пасту чили (если тайской чили-пасты нет, заменить её томатной).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Залить мясо маринадом, хорошо распределить его по всей поверхности и убрать в холодильник. Идеально для этой цели подходят зип-пакеты подходящей величины.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Для чимичурри петрушку и листья орегано вымыть, тщательно обсушить и мелко порубить ножом. Чеснок натереть на микроплане или нарезать максимально мелко. Лук шалот или красный лук нарезать максимально мелким кубиком, переложить в сито и промывать под прохладной водой около минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Соединить петрушку, орегано, чеснок, красный лук и урфу. Добавить оливковое масло и красный винный уксус, посолить по вкусу и хорошо перемешать. Оставить соус настояться (я готовила его примерно за 4 часа до ужина). В классическом варианте обычно используют хлопья красного чили, но мне нравится заменять их урфой: она мягче и не делает соус слишком острым.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Перед подачей добавить к соусу еще немного нарезанной мелко петрушки и цедру половины лайма. Затем понемногу добавлять сок этой же половины, каждый раз перемешивая и пробуя. Остановиться, когда уровень кислоты будет на ваш взгляд подходящим.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Стейки достать из холодильника примерно за 30-40 минут до приготовления. Вынуть из маринада и очень тщательно обсушить бумажными полотенцами. Слегка смазать мясо со всех сторон оливковым маслом.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Хорошо разогреть стальную или чугуную сковороду на средне-сильном огне. Мне понравилось жарить стейки в чугунке, так как высокие бортики заметно уменьшают количество летящего вокруг жира.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Обжаривать мясо с двух сторон до желаемой степени готовности. Для моих стейков ориентиром были примерно 1–2 минуты с каждой стороны для medium rare и 2–3 минуты для более высокой прожарки, но здесь всё очень сильно зависит от толщины конкретного куска. Самый надёжный способ — использовать термометр. Для medium rare снимать мясо примерно при 52–54 градусах, для medium — при 57–60, для medium well — при 63.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Продолжение в комментариях</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Если термометра нет, одним стейком, скорее всего, придётся пожертвовать: обжарить, дать немного отдохнуть, разрезать и по результату скорректировать время приготовления остальных (здесь гораздо полезнее будет один раз посмотреть на мясо внутри, чем пытаться ориентироваться на универсальное количество минут).</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Если снаружи стейк уже получил хорошую корочку, а внутри ещё не дошёл до желаемой прожарки, переложить его в разогретую до 180 градусов духовку ещё от 2 до 5 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">12</span><div class=\"st\">Готовому мясу дать отдохнуть 5–10 минут. Определить направление волокон и нарезать стейки тонкими ломтиками строго поперёк них. Выложить на большое блюдо, добавить сверху чимичурри, оставшийся соус подать отдельно.</div></div></div></div>"},"579":{"id":579,"title":"Гамбургские стейки","sub":"fancy kotletki","cat":"Мясо","img":"thumb/0579_00_579_photo.webp","lq":"data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAAAQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JagCdMxx4SIAbJ8iK8DjdXbfkYitikuHUWU1e1pfP6wAA/ryfQ2kPOsp2uhzqMRhpWdsques33Sg7g/YfSD+ETOx3kLt4MqQFwXUiBszZsSzjur7RRUUBlc4iwawU20dJ6ORrajypl+BQTEmdldSPKjiIZMRCOlKL9xZm+xGTexhZt2CAqgIPgbiwbt+xwYY7Bcm7VJkeiln0wQjgWPYCevhleDbR8jubfweK7YVom57f3s+LQ4RDD+ge5HXpU2Cq6W7x9EvPdwn4CCkNIfQTuQcFqAVBQ2zI0nOGMjQAAA==","w":360,"h":450,"q":"гамбургские стейки fancy kotletki на 3 4 порции 9 шт говядина фарш 400 г свинина фарш 200 г лук шалот 2 шт желток 1 шт сухари панко 40 г молоко 60 г майонез 30 г соль чёрный перец мускатный орех щепотка лук резанец для подачи гамбургские стейки fancy kotletki я уже давно хотела сделать для канала фиолетового брецеля подборочку рецептов из нескольких видов котлет которой я могла бы пользоваться сама ведь полноценно до проработки такого тривиального блюда как котлета я никогда не добиралась делала всегда плюс минус на глаз каждый раз меняя составляющие вот к чему я пришла в котлетах с насыщенным мясным вкусом ст","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0579_00_579_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAAAQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JagCdMxx4SIAbJ8iK8DjdXbfkYitikuHUWU1e1pfP6wAA/ryfQ2kPOsp2uhzqMRhpWdsques33Sg7g/YfSD+ETOx3kLt4MqQFwXUiBszZsSzjur7RRUUBlc4iwawU20dJ6ORrajypl+BQTEmdldSPKjiIZMRCOlKL9xZm+xGTexhZt2CAqgIPgbiwbt+xwYY7Bcm7VJkeiln0wQjgWPYCevhleDbR8jubfweK7YVom57f3s+LQ4RDD+ge5HXpU2Cq6W7x9EvPdwn4CCkNIfQTuQcFqAVBQ2zI0nOGMjQAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3–4 порции (9 шт):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">говядина (фарш) 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свинина (фарш) 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук шалот 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сухари панко 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чёрный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук резанец для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Я уже давно хотела сделать для канала Фиолетового Брецеля подборочку рецептов из нескольких видов котлет, которой я могла бы пользоваться сама, ведь полноценно до проработки такого тривиального блюда как котлета я никогда не добиралась — делала всегда плюс-минус на глаз, каждый раз меняя составляющие. Вот, к чему я пришла.</p>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">В котлетах с насыщенным мясным вкусом стоит обращать самое пристальное внимание на качество мяса. Сколько бы вкусовых добавок вы не добавили к фаршу, долго лежавшее, не подходящее по отрубу мясо (и особенно — простите меня, но мы тут воспитываем вкус — готовый фарш из говядины и свинины, купленный по акции) выдадут себя с первого же укуса. Если у вас нет мясорубки, выбирайте в мясной лавке определенные куски мяса (я предпочитаю говяжью лопатку и свиную шею) и просите прокрутить фарш при вас. Величину кусочков выбирайте, исходя из собственных предпочтений. Мне нравится брать самые крупные дырочки для гамбургских стейков и средние — для котлет из курицы.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Если вы хотите нежную текстуру и чтобы ничего не отвлекало от вкуса мяса — всегда берите только желток, а не цельное яйцо.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Температура фарша при вымешивании играет ключевую роль в финальной текстуре вашей котлеты (хоть из говядины, хоть из курицы). Он должен быть ОЧЕНЬ холодным. Охлажденные металлические миски, легкое подмораживание кусочков мяса перед прокручиванием в мясорубке, добавление небольших кусков льда при перемешивании — всё это приемы, которые уберегут ваши котлеты от ощущения “резиновости”.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Добавление майонеза, причем по возможности промышленного, покупного — лайфхак для сохранения сочности, и это не “бабушкин трюк”, а довольно элегантная пищевая инженерия. Майонез — устойчивая эмульсия, где жир уже правильно распределён и связан с водой. Внутри котлеты он работает как система микроскопических резервуаров: замедляет испарение влаги, не даёт белкам слишком плотно сжаться и буквально смазывает структуру изнутри. Поэтому котлета получается сочной не за счёт жирности, а за счёт того, как этот жир встроен в систему. Причем именно промышленный майонез ведёт себя здесь стабильнее, так как у него более стабильная эмульсия и предсказуемое поведение при нагреве. Это также играет в плюс, если котлеты вы планируете заморозить.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Ароматизация куриных котлеток в финале обжаривания — трюк, за который я хотела бы вручить додумавшемуся до этого гению кулинарный Оскар. Попробуйте, правда.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Для обжаривания котлет из говядины я бы рекомендовала использовать чугунную сковороду  для особенно прекрасной реакции Майяра. Не забудьте, что нужно достаточное количество масла! Куриные котлеты и фишкейки легко можно готовить даже нв антипригарной сковороде.</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Панко смешать с молоком и дать постоять пару минут, затем интенсивно промять руками.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук-шалот очистить и очень мелко нарезать. Смешать говядину и свинину, добавить желток, панко с молоком, лук, майонез, соль, перец и щепотку мускатного ореха.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Массу перемешать не больше пятнадцати раз движениями снизу вверх, поделить на девять шариков. Сформировать плоские стейки толщиной около 2 см, сделать вмятину посередине.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Хорошо прогреть чугунную сковороду. Духовку разогреть до 160-170 градусов (режим: конвекция). Обжарить стейки на среднем огне до румяной корочки с обеих сторон, ориентир: две минуты с каждой стороны. Переложить в металлическую форму и поставить в духовку на 7 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Дать постоять 3–5 минут перед подачей и посыпать луком резанцом.</div></div></div></div>"},"589":{"id":589,"title":"Пельмени сибирские","sub":"ваша морозилка, полная счастья","cat":"Мясо","img":"thumb/0589_00_589_photo.webp","lq":"data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAADwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JYgCdO//R0peR/YX5C7MeE2bcn11KYTpyesz1J+aygADiAQWVKj2HZjopzs1Y4P3qzse3A7eAW3sY78ERJ19Pm1zayBxRam6EbdEdsTu+xs2gwcf0YQs3OErBmgZb28Tpg07RCS40m3vP3WVRfaauM4nbZNznTsGFuYhv8EfAQdPrLj7SChNxH6gdoubRMlb7eQ0d4jo6mqr4Pp81J7qmJKAfjdulGzylCr1Bwpdokwy8BIOvDascXOdBOFGPQJyMoAAA","w":360,"h":450,"q":"пельмени сибирские ваша морозилка, полная счастья  на 80 пельменей для теста мука содержание белка 11 12 г 500 г вода холодная 150 г молоко 50 г яйцо 1 шт растительное масло 1 ст л соль 1 ч л для начинки говядина шея 450 г свинина шея 350 г бульон говяжий 200 г даси 3 4 ч л соль свежемолотый черный перец для варки и подачи лавровый лист перец горошком сметана зелень пельмени сибирские ваша морозилка полная счастья момент скажу я вам ответственный презентовать в клубе рецепт пельменей этот гастрономический грааль вокруг которого у многих есть и личные семейные воспоминания и убеждения как правильно и хоть я сильно сомневаюсь что кто то сегодня будет вчитываться в текст с наступающим не развернуть предисловие с объяснениями я конечно не могу ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0589_00_589_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAADwBQCdASoUABkAPu1ur1IppiQiqAgBMB2JYgCdO//R0peR/YX5C7MeE2bcn11KYTpyesz1J+aygADiAQWVKj2HZjopzs1Y4P3qzse3A7eAW3sY78ERJ19Pm1zayBxRam6EbdEdsTu+xs2gwcf0YQs3OErBmgZb28Tpg07RCS40m3vP3WVRfaauM4nbZNznTsGFuYhv8EfAQdPrLj7SChNxH6gdoubRMlb7eQ0d4jo6mqr4Pp81J7qmJKAfjdulGzylCr1Bwpdokwy8BIOvDascXOdBOFGPQJyMoAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">~ на 80 пельменей:</p><div class=\"iblock\"><p class=\"lbl\">для теста:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука (содержание белка 11-12 г) 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода холодная 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">растительное масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1 ч л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для начинки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">говядина, шея 450 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свинина, шея 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон говяжий 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">даси 3/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для варки и подачи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец горошком</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зелень</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Момент, скажу я вам, ответственный — презентовать в клубе рецепт пельменей, этот гастрономический Грааль, вокруг которого у многих есть и личные семейные воспоминания, и убеждения “как правильно”. И хоть я сильно сомневаюсь, что кто-то сегодня будет вчитываться в текст (с Наступающим!), не развернуть предисловие с объяснениями я, конечно, не могу.</p>\n<p>Из всего многообразия пельменных вариаций — с замудренным тестом, необычными начинками, сливочным маслом внутри и прочими авторскими отступлениями — я сознательно останавливаюсь на абсолютной классике. Сибирские пельмени — это не просто один из вариантов, а отдельная логика, отдельная технология и возможно даже отдельная философия.</p>\n<p>Исторически пельмени пришли в Сибирь не как “домашнее уютное блюдо”, а как способ заготовки еды на зиму. Их лепили всей семьей большими партиями и сразу же выносили на мороз. Сибирский климат становился частью технологии: пельмени быстро промерзали, прекрасно хранились месяцами и в нужный момент превращались в сытную, надёжную еду — для жизни в условиях, где гастрономия полностью подчинена практичности.</p>\n<p>Начинка — только мясо, лучшее из возможных: говядина, свинина, иногда дичь, минимум добавок, никаких ароматических отвлечений. Вкус устойчивый, чистый, узнаваемый даже после заморозки. Лепка — плотная, герметичная, без декоративных излишеств. И, конечно, тесто. Современная кухня очень любит заварное тесто на кипятке — оно мягкое, податливое и приятное в работе, но у него есть один нюанс, который принципиален именно для сибирских пельменей. При заваривании часть клейковины денатурирует — с течением времени тесто становится менее эластичным, хуже переносит длительную заморозку и при варке чаще даёт разрывы, особенно если внутри сочная начинка. Такое тесто готовится быстрее, а значит к моменту готовности начинки уже теряет то приятное состояние al dente, по которому лично я отличаю восхитительные пельмени от просто хороших.</p>\n<p>Тесто на холодной жидкости (вода, молоко, яйцо) работает иначе. Клейковина формируется полноценно, структура получается упругой и устойчивой. Такое тесто можно раскатать очень тонко, оно спокойно переживает мороз, не раскисает при варке и надёжно удерживает мясной сок внутри.</p>\n<p>В общем, сибирские пельмени — отражение стиля, который я в гастрономии очень ценю, это минимализм, доведённый до совершенства: когда убрано всё лишнее и оставлено только то, что действительно работает. А потому, подчеркну ещё раз, все ингредиенты должны быть лучшие из возможных.</p>\n<p>Вот с этим пониманием можно спокойно переходить к рецепту.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Муку просеять в большую миску. В отдельной ёмкости смешать холодную воду, такое же холодное молоко, яйцо, соль и растительное масло до однородности (в идеале пробить блендером). Сделать в муке углубление и влить сначала треть жидкой смеси, постепенно объединяя всё в тесто с помощью вилки или хлебного венчика, затем — поочередно — следующие две трети. Проследить, чтобы вся мука была увлажнена. Выложить тесто в планетарный миксер с насадкой крюк или на рабочую поверхность и месить до гладкости, примерно 8–10 минут. Сформировать шар, плотно завернуть в плёнку и оставить отдыхать при комнатной температуре на 40 минут.</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0893_00_893_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpAAAABXRUJQVlA4IIQAAADwBACdASoUABkAPu1eq02ppKQiMBgMATAdiWQAnQANgaUIKB+pCjB0eQ3KboIIQYAA+NWdQqlIiO8gIOck+cpCRQdr0Z0yNo2GYAL90wA4XkA8hv/KcqV+EuIKNBlI70x2RnpEnWdQLRKsF3rGk/9TWFgyXcC7Ucq7/Vy6Kq2fByagAAA=) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">В холодный бульон добавить порошок даси и тщательно размешать. Если ваш бульон уже застыл как холодец, то просто промешайте всё вместе пальцами. В большой миске соединить максимально свежий фарш из говядины и свинины, соль и свежемолотый черный перец. Добавить холодный бульон и начать вымешивать до получения однородной, липкой и блестящей массы, продолжать три-четыре минуты. Готовый фарш должен быть мягким и слегка текучим. Попробуйте на соль и перец, это очень важно — для этого можно слепить маленький кусочек фарша и нагреть его в микроволновке. Если нужно, досолите и доперчите. Убрать в холодильник.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Подготовить рабочую поверхность и припылить доску/блюдо, на которые будете выкладывать пельмешки. Тесто разделить на 4 части, одну часть тонко раскатать (остальные накрыть пленкой, чтобы не подсыхали). Можно припылять немного мукой или крахмалом, но не перебарщивать, а то потом не защипнете шов! Перед тем как вырезать кружки (рекомендую диаметр 6,5-7 см), нужно финально перевернуть хорошо раскатанное тесто другой стороной и дождаться, пока оно “скукожится” — тогда кружочки не будут уменьшаться в размерах.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Начинку удобнее всего переложить в кондитерский мешок, отрезать кончик (достаточно большое отверствие) и выкладывать на кружочки из теста, отрывая шарик фарша пальцами. Тщательно защипнуть пельмени, уделяя особое внимание герметичности шва. Готовые пельмени выложить в один слой так, чтобы они не касались друг друга и заморозить, затем переложить в контейнеры или пакеты.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Варить пельмени, не размораживая, в большом количестве щедро подсоленной воды, с лавровым листом и перцем горошком до всплытия + ещё 3-4 минуты после. Подавать сразу, со сметаной и зеленью.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0893_01_894_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0893_02_895_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0893_03_896_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0893_04_897_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0893_05_898_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0893_06_899_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0893_07_900_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0893_08_901_photo.webp\" alt=\"\"></figure></div>"},"591":{"id":591,"title":"Фаршированные перцы","sub":"с булгуром и томатно-сметанным соусом","cat":"Мясо","img":"thumb/0591_00_591_photo.webp","lq":"data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAAAQBgCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMoPNPodAKws8lqZVsngjMebANmfMKtJm8DZQ8gAA/rQuIZueaNTPU2yU7uo3V8OSEvZ0ILXEeCUW8cauitHmNxmQhFyn4oy7Gzg7xbZ9GS9DxNAGAFGT4Jn+Iiif0N//bxpx0XB/mGfhmPx7mBTf0CE8eefAtuXVbWQrDwNWJUPZMhT7KJa95pQDVoXRvN++vbl2xWm6KyzEpP+0GpC+vefiqFSQx/GES7p2zWC+W4VoZfyMeAIGceMuKOLMQAAA","w":360,"h":450,"q":"фаршированные перцы с булгуром и томатно-сметанным соусом на 6 8 порций перцы болгарские 6 8 шт фарш говядина 550 г фарш свинина 350 г лук репчатый 1 шт булгур 100 г цуккини 1 2 шт петрушка 1 ст л соль 1 5 ч л паприка копченая 1 ч л свежемолотый черный перец для соуса томатная пассата 250 г бульон куриный 250 г сметана 120 г соевый соус 1 ст л для подачи микрозелень гарнир по желанию фаршированные перцы с булгуром и томатно сметанным соусом клубу уже полтора года и за это время я признаться почти перестала бояться прикасаться к таким монументам домашней гастрономии как борщ пельмени голубцы или скажем фаршированные перцы блюдам вокруг которых у каждого человека из восточной европы неизбежно существует собственная семейная мифология кто то готовит их исключительно с ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0591_00_591_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRugAAABXRUJQVlA4INwAAAAQBgCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMoPNPodAKws8lqZVsngjMebANmfMKtJm8DZQ8gAA/rQuIZueaNTPU2yU7uo3V8OSEvZ0ILXEeCUW8cauitHmNxmQhFyn4oy7Gzg7xbZ9GS9DxNAGAFGT4Jn+Iiif0N//bxpx0XB/mGfhmPx7mBTf0CE8eefAtuXVbWQrDwNWJUPZMhT7KJa95pQDVoXRvN++vbl2xWm6KyzEpP+0GpC+vefiqFSQx/GES7p2zWC+W4VoZfyMeAIGceMuKOLMQAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6-8 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">перцы болгарские 6-8 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш говядина 550 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш свинина 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">булгур 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цуккини 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1,5 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная пассата 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для подачи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">микрозелень</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарнир по желанию</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Клубу уже полтора года, и за это время я, признаться, почти перестала бояться прикасаться к таким монументам домашней гастрономии, как борщ, пельмени, голубцы или, скажем, фаршированные перцы — блюдам, вокруг которых у каждого человека из Восточной Европы неизбежно существует собственная семейная мифология. Кто-то готовит их исключительно с рисом, кто-то — с пшеном, у кого-то их непременно заливали только томатом, у кого-то еще и сметаной, а где-то внутрь вообще не клали ничего, кроме мяса, лука и чёрного перца, считая все остальные добавки кощунством.</p>\n<p>География у этого блюда действительно головокружительная. Если начать распутывать кулинарную биографию фаршированных овощей, быстро выяснится, что родственники наших домашних перцев существуют буквально по всему Средиземноморью, Балканам, Ближнему Востоку и Кавказу: турецкие dolma и biber dolması, греческие gemista, румынские ardei umpluți, ну и бесконечные вариации фаршированных овощей в сербской, болгарской и молдавской кухнях. Логика при этом одна и та же — взять сезонный овощ, наполнить его чем-то сытным, ароматным и способным накормить большую семью, а затем долго и спокойно томить, пока мясной сок, овощи и соус не превратятся во что-то единое, густое и уютное.</p>\n<p>В моей семье перцы, как и голубцы, готовили без крупы — только мясо, лук и специи, поэтому в детстве я воспринимала их скорее как разновидность котлеты, которую по какой-то случайности завернули не в панировку, а в сладкий, пахнущий летом перец. Для Клуба мне захотелось сохранить именно эту насыщенно-мясную логику, но при этом добавить и крупы — не ради экономии, а ради текстуры. В отличие от риса, который довольно быстро растворяется в общей массе, булгур остаётся чуть более самостоятельным, добавляя начинке приятную зернистость и лёгкий ореховый оттенок.</p>\n<p>Соус здесь абсолютно классический, томатно-сметанный, тот самый, который потом хочется собирать хлебом со дна тарелки неприлично тщательно. Я только слегка усилила его куриным бульоном и ложкой соевого соуса, чтобы добавить ему глубины и того самого трудноописуемого ощущения “ещё ложечку и всё”.</p></div><div class=\"note\"><i class=\"bul\">📍</i>NOTE: если у вас нет чугунка, готовить перцы можно в металлической форме, накрыв фольгой. Если форма керамическая или стеклянная, то заливать перцы нужно уже горячим, предварительно нагретым соусом, а температуру запекания увеличить до 190 градусов. Обязательно проверяйте в процессе, не допуская бурления соуса.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Булгур залить кипятком так, чтобы вода покрывала крупу примерно на 1 см, накрыть и оставить на 15–20 минут, пока он не впитает влагу и слегка не размягчится.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук очистить, нарезать мелким кубиком и обжарить на небольшом количестве масла до мягкости и лёгкой золотистости. Остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Цуккини натереть на мелкой тёрке и слегка отжать руками, убирая лишнюю влагу. Петрушку мелко нарубить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Смешать оба вида фарша, булгур, обжаренный лук, цуккини и петрушку. Добавить соль, копчёную паприку и свежемолотый чёрный перец. Вымесить массу руками до однородности, но без фанатизма. Обязательно тест на соль, чтобы не получить потом пресные перчики — скатайте маленький шарик фарша и отправьте в микроволновку на 15 секунд. Если соли мало, досолите.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Перцы тщательно вымыть, аккуратно срезать верхушки, стараясь сохранить плодоножки для красивой подачи, удалить семена и перегородки. Примерить перцы к чугунку, чтобы все поместились. Наполнить перцы начинкой, образовав небольшую горку.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Духовку разогреть до 170 градусов (режим: верх/низ). Для соуса смешать пассату, куриный бульон и сметану, добавить соевый соус, пробить погружным блендером до однородности. Попробовать, при желании досолить.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Продолжение в комментариях</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Залить перцы соусом, накрыть чугунок крышкой и убрать в духовку примерно на полтора часа. Через полчаса проверьте — соус должен едва подрагивать, а не активно кипеть, так сметана останется нежной и не свернётся.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Готовность удобно проверять термометром: внутренняя температура начинки должна быть около 70 градусов.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">В конце снять крышку, включить гриль и подрумянить верхушки перцев 5 минут, пока кожица местами не начнёт темнеть и слегка обугливаться.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Подавать сразу, с соусом из чугунка, микрозеленью и гарниром по настроению. Особенно хорошо сюда подходит нежное картофельное пюре.</div></div></div></div>"},"592":{"id":592,"title":"Фрикадельки в томатном соусе","sub":"","cat":"Мясо","img":"thumb/0592_00_592_photo.webp","lq":"data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAACwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JagCdMy/lyQeLhR7R6ih3O1x04KZtbXq08hBeXkAA/hSGuhs9Wly9G+riaYUWn/Wj5RRaQGUA/zOOezAiSMgQq4kfahJBFl5vKIaAAd9rXiaPiDCEuBPPynDa6UuRAS5JS90oNytkxEhGUy0kRNqelHlW80lxr008BzK1VJ5ovxd0sk4LysnkmHkC0505NNxEB0wavv3tfYeRxggvhRBaf0+2WST9lwNhjVR7ggQchGE+LQfo6Xg35oROkUAAAAA=","w":360,"h":450,"q":"фрикадельки в томатном соусе  на 8 порций 25 фрикаделек фарш из говядины и свинины 500 г фарш из индейки 400 г лук репчатый 1 шт морковь мелкая 2 шт сельдерей 1 стебель панировочные сухари 50 гр пармезан 50 гр базилик не сухой 1 ст л петрушка 1 ст л яйцо мелкое 1 шт паприка копченая 1 чл чеснок гранулированный 1 4 чл или 1 2 если очень любите соль 1 чл черный перец 1 2 чл сливочное масло 20 г оливковое масло для соуса томаты консервированные кусочками 400 г лук репчатый 1 шт чеснок 2 зубчика бульон куриный 200 г вино красное 60 г соевый соус 1 ст л итальянские травы 1 ч л базилик не сухой 1 ст л а также глубокая сковородка или чугунок духовка спагетти a 711 картофельное пюре булгур гречка пармезан петрушка или базилик фрикадельки в томатном соусе не могу не улыбаться начиная писать этот рецепт ведь отныне думаю что на много лет если не навсегда эти роскошные мясные шарики в насыщенном томатном соусе будут ассоциирова","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0592_00_592_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAACwBQCdASoUABkAPu1qrVCppaQiqAqpMB2JagCdMy/lyQeLhR7R6ih3O1x04KZtbXq08hBeXkAA/hSGuhs9Wly9G+riaYUWn/Wj5RRaQGUA/zOOezAiSMgQq4kfahJBFl5vKIaAAd9rXiaPiDCEuBPPynDa6UuRAS5JS90oNytkxEhGUy0kRNqelHlW80lxr008BzK1VJ5ovxd0sk4LysnkmHkC0505NNxEB0wavv3tfYeRxggvhRBaf0+2WST9lwNhjVR7ggQchGE+LQfo6Xg35oROkUAAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 8 порций (~25 фрикаделек):</p><ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">фарш из говядины и свинины 500 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">фарш из индейки 400 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">морковь мелкая 2 шт</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">сельдерей 1 стебель</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">панировочные сухари 50 гр</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">пармезан 50 гр</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">базилик (не сухой!) 1 ст л</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">яйцо мелкое 1 шт</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">паприка копченая 1 чл</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">чеснок гранулированный 1/4 чл (или 1/2, если очень любите)</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">соль 1 чл</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">черный перец 1/2 чл</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">сливочное масло 20 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">оливковое масло</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса:</p><ul class=\"ings\"><li><i class=\"bul\">🔴</i><span class=\"tx\">томаты консервированные кусочками 400 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">бульон куриный 200 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">вино красное 60 г</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">итальянские травы 1 ч л</span></li><li><i class=\"bul\">🔴</i><span class=\"tx\">базилик (не сухой!) 1 ст л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">🟡</i><span class=\"tx\">глубокая сковородка или чугунок</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">духовка</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">спагетти, <a class=\"xref\" href=\"#/r/711\">картофельное пюре</a>, булгур, гречка</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">петрушка или базилик</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Не могу не улыбаться, начиная писать этот рецепт, ведь отныне (думаю, что на много лет, если не навсегда) эти роскошные мясные шарики в насыщенном томатном соусе будут ассоциироваться у меня с появлением дочери. Так уж сложилось, что это традиционное блюдо, которое я готовлю на свой день рождения, и в прошлом году, после того, как я радостно их смолотила, запивая безалкогольным игристым, я уехала в роддом на долгожданную встречу.</p>\n<p>Фрикадельки - очень удачное блюдо для семейного ужина. В них приятным образом соединяются удовольствие и польза. Много белка разного вида, овощи и зелень, полезные жиры. Добавить к этому углеводы - спагетти, булгур, гречку - и получается сбалансированный обед, который съедается с удовольствием, без всяких ухищрений (мой сын не фанат мяса, но одна-две фрикадельки стабильно залетают в него еще на этапе запекания в духовке).</p>\n<p>И фрикадельки, и соус великолепно выдерживают заморозку, так что если посвятить один выходной день совместному приготовлению, можно получить с любовью сделанный полуфабрикат. Но держим в голове - это лишь компромисс, нет ничего вкуснее только что приготовленной еды, наполнившей дом ароматами уюта.</p></div><p>черный перец</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 230 градусов (режим: верх/низ, если нет, то конвекция на 210 градусов). Лук и морковь очистить, нарезать мелким кубиком вместе с сельдереем.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть в сковороде 1 ст л оливкового масла и 20 г сливочного, добавить лук, обжарить на среднем огне в течение 3 минут, затем добавить морковь и сельдерей и обжаривать еще 7 минут, периодически помешивая лопаткой. Проверьте морковь - она должна быть приготовлена al dente, то есть держать форму, но быть уже мягкой. Немного остудить, переложить в сито и дать стечь лишнему маслу.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В большой миске смешать два вида фарша, обжаренные овощи, панировочные сухари, пармезан, базилик, петрушку, паприку, чеснок, соль, перец и яйцо. Всё очень тщательно перемешать руками и оставить на 10 минут.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">TIP: чтобы проверить на соль, сформируйте микрошарик и отправьте в микроволновку или разогретую сковородку на полминуты, попробуйте. Если мало, досолите.</span></li></ul>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Противень застелить пергаментной бумагой и с помощью рук, периодически смачиваемых водой, сформировать фрикадельки весом около 50 грамм. Выложить на противень и отправить в духовку на 12 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В это время приступаем к соусу. Лук и чеснок очистить и нарезать мелким кубиком. В глубокой сковороде (я использую чугунок) разогреть 1 ст ложку оливкового масла и обжарить лук с чесноком и итальянскими травами на среднем огне в течение 3 минут. Добавить консервированные томаты, перемешать, прогреть в течение пары минут, затем влить соевый соус, <a class=\"xref\" href=\"#/r/557\">куриный бульон</a> и вино, довести до кипения, убавить огонь до слабого и оставить булькать на 10 минут. В конце добавить базилик и черный перец. Попробуйте на соль!</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В соус переложить готовые фрикадельки, очень аккуратно перемешать, чтобы они покрылись соусом и оставить на слабом огне под крышкой на 3 минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Подавать с гарниром на ваш выбор, посыпав тёртым пармезаном, черным молотым перцем и свежей петрушкой и/или украсив листочком базилика.</div></div><div class=\"outrop\"><p>(надеюсь никто не уедет в роддом!))))</p></div></div></div>"},"603":{"id":603,"title":"Глазированные свиные ребрышки","sub":"в азиатском стиле","cat":"Мясо","img":"thumb/0603_00_603_photo.webp","lq":"data:image/webp;base64,UklGRvQAAABXRUJQVlA4IOgAAADQBQCdASoUABkAPu1orVCppaQiqAqpMB2JagCdMoSCm8AVxYTcbZCoi4Kr3wHJbM2j0apQoOAAAP1mlAb5uA82u7AtJrtS4u6cKwp3sPlon75h82OSc3W6mRsA/Uk3JDjCyYcKKSUhueCiDIg+SjboyRR3DUAj4P46WctziAW8BExB1s+CDelPoNoFg2MvcPhGoKaknqB4gzBc8SqcPkzalgSR2g/XSlCHe3z3YH4/yU0cevYkonlrgY0ZS+RDC6P5KMfsqzornIbWJxd+zzSP+WpkYK20czCVqeq0+GEcfZAzJBoAYFgA","w":360,"h":450,"q":"глазированные свиные ребрышки в азиатском стиле на 4 6 порций свиные рёбра 2 3 кг соль свежемолотый черный перец оливковое масло имбирь 40 г чеснок 6 зубчиков бадьян 3 звезды херес 40 г опционально для глазировки устричный соус 70 г соевый соус 2 ст л рыбный соус 1 ст л мёд 80 г коричневый сахар 20 г рисовый уксус 3 ст л чеснок 2 зубчика тайская паста чили 2 ч л копчёная паприка 1 ч л лимон 1 2 шт сок и цедра или больше зелёный лук 2 3 стебля глазированные свиные ребрышки в азиатском стиле не далее чем в подборке рецептов этой недели я снова упомянула свинину и её сомнительную репутацию что ж если в случае со стейками из корейки ещё можно прикрыться разговорами о том что корейка мясо постное и почти диетическое то сегодняшнему рецепту никаких оправданий не придумать будем готовить не просто свинину а свиные рёбра блюдо кот ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0603_00_603_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvQAAABXRUJQVlA4IOgAAADQBQCdASoUABkAPu1orVCppaQiqAqpMB2JagCdMoSCm8AVxYTcbZCoi4Kr3wHJbM2j0apQoOAAAP1mlAb5uA82u7AtJrtS4u6cKwp3sPlon75h82OSc3W6mRsA/Uk3JDjCyYcKKSUhueCiDIg+SjboyRR3DUAj4P46WctziAW8BExB1s+CDelPoNoFg2MvcPhGoKaknqB4gzBc8SqcPkzalgSR2g/XSlCHe3z3YH4/yU0cevYkonlrgY0ZS+RDC6P5KMfsqzornIbWJxd+zzSP+WpkYK20czCVqeq0+GEcfZAzJBoAYFgA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">свиные рёбра 2,3 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 6 зубчиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бадьян 3 звезды</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">херес 40 г опционально</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для глазировки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">устричный соус 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рыбный соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рисовый уксус 3 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тайская паста чили 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копчёная паприка 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок и цедра) или больше</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">зелёный лук 2-3 стебля</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Не далее чем в подборке рецептов этой недели я снова упомянула свинину и её сомнительную репутацию. Что ж, если в случае со стейками из корейки ещё можно прикрыться разговорами о том, что корейка — мясо постное и “почти диетическое”, то сегодняшнему рецепту никаких оправданий не придумать. Будем готовить не просто свинину, а свиные рёбра — блюдо, которое много десятилетий считалось откровенно второсортным.</p>\n<p>Еще сто лет назад рёбра воспринимались как мясо трактиров и рабочих столовых — готовить неудобно, куски большие и тяжелые, возни много, результат — жесткое мясо и куча костей. Позднее человечество (во многом совершенно эмпирически, задолго до того, как наука пришла на кухни) пришло к пониманию главного рёберного секрета. При длительном приготовлении при относительно низкой температуре жёсткий коллаген постепенно превращается в желатин, мясо начинает легко отходить от кости, становится сочным, мягким и почти шелковистым по текстуре.</p>\n<p>Самая известная рёберная традиция, конечно, американская. Вокруг рёбер там выросла целая религия: техасский барбекю с дымом и чёрным перцем, липкие сладковатые рёбра Канзас-Сити, сухая засолка в Мемфисе и так далее, и тому подобное. Все американские подходы объединяет одно — low and slow cooking. Очень внимательное отношение к мясу: низкая температура и много часов приготовления. Именно этот подход кажется мне самым логичным с точки зрения гастрономической науки, потому что он действительно работает на результат: коллаген успевает распасться, жир — вытопиться, мясо при этом не пересыхает и прекрасно жуется.</p>\n<p>Ещё есть китайская традиция, она совершенно другая. Там рёбра редко становятся главным героем огромной доски в центре стола, чаще это небольшие кусочки в густых ферментированных соусах, с соей, уксусом, рисовым вином, oyster sauce, чесноком, специями и сложной сладко-солёной глазурью. Азиатские соусы для рёбер кажутся мне куда интереснее классических американских BBQ. Более объёмными, менее “химозными”, короче, более взрослыми по вкусу.</p>\n<p>Именно поэтому сегодня будет абсолютно неканоничная, но всё ещё прекрасная гибридная история: американский подход к приготовлению (долгое томление, постепенная глазировка, работа с коллагеном и текстурой) и азиатский профиль вкуса (с устричным соусом, мёдом, чесноком, уксусом, чили и лёгкой цитрусовой свежестью). Получается что-то между липкими барбекю ребрами и китайской глазированной свининой. Немножко липко, немножко messy и очень хорошо!</p></div><div class=\"outrop\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: на внутренней стороне рёбер часто находится тонкая серебристая мембрана, закрывающая косточки. Так как она мешает проникновению соли, плюс при долгом приготовлении становится жесткой и “корёжит”, лучше её удалить. Удобнее всего поддеть мембрану небольшим ножом с края, захватить бумажным полотенцем и потянуть на себя — обычно она снимается почти целиком. Если убрать её полностью не получается, ничего страшного: достаточно удалить самые крупные участки.</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0903_00_903_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRsgAAABXRUJQVlA4ILwAAAAwBQCdASoUABkAPu1osFAppaUiqAqpMB2JYgCdMsdBq5j72Mq7BX9vmc2Uy4AnHlx6gAD+VzTr/9edYKtWjKyupcgrTFT3K2zcuf2UnBEQnKDlt39tfZfoFEV/R2js234zGRGY3K15vaxwi7iK9OKz2TwMxuCUT2EU7fjdZqQndOcK4Fk51kR+8hK0s21zjblbTTZH55iPHrmP1Bw11qABSzOOskQyoDI8ZUUcBrk6wciwVlN8V01PqAAAAA==) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Свиные рёбра тщательно обсушить бумажными полотенцами, щедро посолить и поперчить со всех сторон, затем оставить при комнатной температуре примерно на 40 минут (если есть возможность, лучше убрать их в холодильник на 3-4 часа или даже на ночь; в таком случае всё равно нужно будет достать их за 40 минут ло запекания, чтобы они нагрелись).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть духовку до 230 градусов (режим: конвекция).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Рёбра снова обсушить бумажными полотенцами, затем смазать оливковым маслом и уложить на решётку. Вниз поставить противень, застеленный пергаментом: туда будет стекать жир и мясной сок. Запекать рёбра около 25-30 минут, пока поверхность хорошо не подрумянится. Если жир начал дымить — налейте немного воды.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: если совсем не хочется возиться, этот этап можно пропустить, но для действительно глубокого мясного вкуса предварительное запекание играет большую роль.</div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Пока мясо запекается, имбирь очистить и нарезать тонкими ломтиками. Чеснок очистить, слегка раздавить плоской стороной ножа и разрезать пополам.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Глубокий большой противень или форму застелить фольгой. Переложить туда рёбра, добавить имбирь, чеснок и бадьян.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В противне, который стоял под рёбрами, к этому моменту уже соберётся немного вытопившегося жира, мясного сока и поджаренных карамелизованных кусочков — всего того, что французы называют fond. Влить туда 100 г воды, аккуратно собрать всё силиконовой или деревянной лопаткой и перелить получившийся бульон к рёбрам. Добавить 40 г хереса.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Плотно закрыть форму фольгой, снизить температуру духовки до 150 градусов (режим: верх/низ) и отправить рёбра томиться на 2 часа.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Приготовить глазировку. Смешать устричный, рыбный и соевый соусы, мёд, коричневый сахар, рисовый уксус, тайскую пасту чили, копчёную паприку и мелко натёртый чеснок. Прогреть всё на слабом огне 5–7 минут, чтобы сахар и мед полностью растворились. Влить лимонный сок и добавить лимонную цедру. Попробуйте — не нужно ли чего-то добавить?</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Достать противень с ребрами из духовки, увеличить её температуру до 200 градусов (режим: конвекция). Аккуратно переложить рёбра на решетку, установленную на противне и начать глазировать мясо тонкими слоями соуса. Смазать один раз — вернуть в духовку на 5–7 минут. Затем повторить ещё 3 раза.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Постепенная глазировка работает гораздо лучше, чем один толстый слой: соус успевает карамелизоваться, поверхность становится блестящей, а вкус — более глубоким и сложным. В финале можно включить гриль на 2-3 минуты.</div></div>\n<div class=\"step\"><span class=\"sn\">11</span><div class=\"st\">Готовым ребрам дать несколько минут отдохнуть, затем нарезать и выложить на доску или тарелку. Перед подачей посыпать тонко нарезанным зелёным луком. Налетай!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0903_01_904_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0903_02_905_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0903_03_906_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0903_04_907_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0903_05_908_photo.webp\" alt=\"\"></figure></div>"},"718":{"id":718,"title":"Рубленые бифштексы из говядины","sub":"steak haché","cat":"Мясо","img":"thumb/0718_00_718_photo.webp","lq":"data:image/webp;base64,UklGRp4AAABXRUJQVlA4IJIAAADwBACdASoUABkAPu1sqlEppaOiqAqpMB2JaACw7Ah0kdl4T7FDsueP1E9t5UmQeAAA/fw7QwJCBsOYMyKbaeyTDqr6OOv2Exm9J3a1IYhwH6TbMr+Z9LoGYzs2NGsVPy6kRKdwGGXtnvkFHn+HGVhJGc6bUuvN9O6AHiuTwO5Bpy+hxAKweSbovap1cWOhsc8AAA==","w":360,"h":450,"q":"рубленые бифштексы из говядины steak haché на 4 порции говядина шейный отруб 900 г сделать фарш или самостоятельно или попросить мясника сушеные белые грибы 15 г бульон куриный или говяжий 360 г лук шалот 1 шт сливочное масло 60 г мука 1 ч л с горкой соевый соус 1 ст л херес 60 г лимонный сок 1 ч л тимьян свежий 1 ч л соль черный перец рубленые бифштексы из говядины steak hach если сделать все правильно то ох вы запомните эти бифштексы и будете ждать повторения концентрированный мясной вкус ощутимая текстура мяса струящийся по вилке и ножу сок почти что настойщий стейк просто праздник что колоссально важно хорошее мясо шейный отруб идеальное сочетание мяса и жира плюс это не самая дорогая часть говядины получается","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0718_00_718_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRp4AAABXRUJQVlA4IJIAAADwBACdASoUABkAPu1sqlEppaOiqAqpMB2JaACw7Ah0kdl4T7FDsueP1E9t5UmQeAAA/fw7QwJCBsOYMyKbaeyTDqr6OOv2Exm9J3a1IYhwH6TbMr+Z9LoGYzs2NGsVPy6kRKdwGGXtnvkFHn+HGVhJGc6bUuvN9O6AHiuTwO5Bpy+hxAKweSbovap1cWOhsc8AAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">говядина, шейный отруб 900 г (сделать фарш или самостоятельно, или попросить мясника)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сушеные белые грибы 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон куриный или говяжий 360 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-шалот 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 1 ч л с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">херес 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян свежий 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Если сделать все правильно, то ох вы запомните эти бифштексы и будете ждать повторения. Концентрированный мясной вкус, ощутимая текстура мяса, струящийся по вилке и ножу сок - почти что настойщий стейк, просто праздник!</p>\n<p>Что колоссально важно?</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">хорошее мясо</span></li></ul>\n<p>шейный отруб - идеальное сочетание мяса и жира, плюс это не самая дорогая часть говядины, получается практически стейк по очень приемлемой цене</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">никакой соли в фарше</span></li></ul>\n<p>соль начинает сразу же помогать белкам связываться, а нам это (правильно!) не нужно. Солим и перчим уже сформированные бифштексы.</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">время запекания очень зависит от вашей духовки</span></li></ul>\n<p>по классике эти бифштексы жарятся на чугунной сковороде с большим количеством сливочного масла, но я предлагаю попробовать вариант с грилем. Главное, следуйте рекомендациям, не отвлекайтесь, следите за бифштексами, будьте готовы вытащить раньше или дать постоять подольше.</p></div><div class=\"note\"><i class=\"bul\">⚡️</i>минимум движений<br>вспоминаем эфир про фарш - чем меньше вы его трогаете, тем меньше в нем образовывается протеиновых связей, а чем их меньше - тем более “тающее во рту” будет ваше мясо. Идеальный расклад такой: покупаете кусок говяжьей шеи, приступаете к приготовлению бифштексов, подкладываете под мясорубку большой кусок пергаментной бумаги, измельчаете мясо (насадка с самыми крупными дырочками), делите всю массу на четыре части и аккуратно прямо на бумаге формируете котлеты. Меньше вымешивания - больше вкуса и лучше результат.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Бульон разогреть в сотейнике или микроволновке. Засыпать белые грибы в горячий бульон, перемешать и оставить на один час.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Сформировать бифштексы. Мясо выложить на пергаментную бумагу, разделить скребком или ножом на 4 равных части (каждый должен получиться ~по 225 грамм). Разрезать пергамент на 4 части (под каждую котлету) и аккуратно, стараясь как можно меньше тревожить мясо, сформировать бифштексы толщиной примерно в два сантиметра, диаметром около двенадцати. С помощью трех-четырех пальцев сделать углубления в центре. Посолить (мощно) и поперчить (на ваш вкус) с каждой стороны, убрать в холодильник до готовности грибов.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть гриль в духовке. Если у вас градусы, то до 220-230, если уровни, то самый большой. Лук-шалот нарезать мелким кубиком. Грибы вытащить из бульона, отжать и нарезать небольшими кусочками.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В сотейнике распустить 15 гр сливочного масла и обжарить лук-шалот в течение трех минут. Добавить муку, обжарить около минуты. Аккуратно влить соевый соус, херес, перемешать, затем бульон и грибы. Уварить на среднем огне в течение 8-10 минут (посматривайте, может нужно будет выключить пораньше).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Плоский металлический противень для духовки застелить фольгой (важно сделать это тщательно, чтобы мясной сок не попадал на раскаленный металл и не дымил в духовке), выложить бифштексы и разместить на самом верхнем уровне духовки. Расстояние до гриля должно быть ~6-8 см. Обжарить мясо в течение 4 минут с одной стороны, затем перевернуть бифштексы (переворачивать лучше всего силиконовой лопаткой, чтобы не повредить фольгу) и жарить ещё 4 минуты. Если у вас есть термометр для мяса, можно проверить температуру внутри, идеальная прожарка (едва розовая внутри) получится при температуре 60-62 градуса. Допущу, что вы любите полную прожарку (немного кощунственно для данного блюда, но не мне вам указывать), но в любом случае постарайтесь не доводить температуру выше 70. Готовые бифштексы переложить в сковороду под крышку (или в форму для запекания, накрыв фольгой) и дать отдохнуть в течение 10 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В уваренный соус добавить оставшееся сливочное масло (45 грамм), лимонный сок и листья тимьяна.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Подавать бифштексы, полив соусом, с зеленым салатом и любимым гарниром.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0718_01_719_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0718_02_720_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0718_03_721_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0718_04_722_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0718_05_723_photo.webp\" alt=\"\"></figure></div>"},"818":{"id":818,"title":"Smash-чизбургер","sub":"американская классика","cat":"Мясо","img":"thumb/0818_00_818_photo.webp","lq":"data:image/webp;base64,UklGRhgBAABXRUJQVlA4IAwBAADQBQCdASoUABkAPu1urlIppiQiqAgBMB2JbACsOUE88RIGz1DptDeectfbPv+ZLdDcWdGBCKnAAPfQpH5YihWq/fcEz9/Jg3pxkKzF0sArmww+MynijWjPLINeLCLGaal5PtkO0gVR84iQgnFfOTxWfMPGX5WNghsBp09PE4gEnKrrgwBJphtieDy0P6IJUn8vOrK6T7sye9iwuhI70AJDGSC3rdXzaD6MyLm6QEFA4RwHFK2p34x2hlbndMayYheoUkuYsBMrU07+n/QBIbCVSfbTPA/XMX1PFXSLUV0A/zIQn/DKvMbzZeTJ5ZcEOU2/yN/UEPdTbWr8iozfYMvGvZD1Qh2NtuCEYAAA","w":360,"h":450,"q":"smash-чизбургер американская классика на 2 бургера фарш говяжий 300 г в идеале самодельный или свежесделанный у мясника подойдет шея лопатка и грудинка лучший выбор шея или смесь лопатки и грудинки сыр 2 4 ломтика булочки для бургеров 2 шт соленый огурец 1 шт красный лук 1 шт спелый помидор 1 шт а также сотейник с толстым дном и пергаментная бумага классический соус для гамбургеров a 689 майонез 100 г кетчуп 30 г огуречный рассол 1 ст л горчица 1 ст л табаско опционально smash чизбургер американская классика бургеры еще один яркий пример еды быстрого приготовления
