">⭐️</i><span class=\"tx\">сливки 30% 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица дижонская 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Поговорим о шедевре итальянской гастрономической традиции, которое, кажется, переживает свой пик популярности в Москве? Vitello tonnato — элегантная, сбалансированная холодная закуска, заставляющая многих вскидывать брови: то есть как это мясо… с рыбой?</p>\n<p>Vitello tonnato родом из Пьемонта, и изначально, как ни странно, блюдо не содержало tonne — тунца. В старинных итальянских поваренных книгах (например, “La Cucina Borghese” конца 18го века) можно найти рецепты отварной телятины с соусом на основе бульона, желтков, уксуса, каперсов и анчоусов. Тунец, сливки и тем более майонез пришли позднее — в двадцатом веке, вместе с новыми представлениями о вкусе и текстуре (когда повара уже кое-что знали об идеальной эмульсии). Клубная версия vitello tonnato — с уважением к традиции, но без страха перед техникой. Будем готовить без сувида, без слайсера, а результат — как в лучших ресторанах Москвы Пьемонта.</p>\n<p>| здесь спрятано немножко кулинарной химии |</p>\n<p>Дальше на всякий случай скажу крамольное. Если вам очень хочется попробовать этот напичканный умами соус, но жаль тратить деньги на телятину, купите кусок нежирной свинины (идентично — вырезку). Для одного из своих званых ужинов я делала именно такую версию, и эта тарелка опустела быстрее всех. От классики безусловно отличается, но иногда так приятно нарушать правила ;)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Вечером накануне подачи сложить все ингредиенты для маринада в сотейник, перемешать, нагреть, чтобы соль и сахар растворились, а ароматы — раскрылись, затем выключить огонь и охладить маринад до комнатной температуры. Поместить мясо в подходящий контейнер, залить маринадом, накрыть крышкой и убрать в холодильник на ночь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">На следующий день разогреть духовку до 120 градусов (режим: конвекция), достать телятину, обсушить бумажными полотенцами, натереть оливковым маслом, положить на металлический противень и отправить в духовку приблизительно на 30-40 минут. Если термометр, вставленный в центр мяса, показывает от 55 до 60 градусов, значит пора доставать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Растопить в сковороде 15 г сливочного масла, добавить в сковороду розмарин и раздавленный зубчик чеснока и хорошо ими повозить по сковороде. Обжарить кусок телятины до румяной корочки со всех сторон, затем — плотно обернуть фольгой в два слоя (можно вместе с веточкой розмарина) и убрать в холодильник минимум на 1 час (максимум на 8).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Все самое сложное позади, приступаем к соусу. С тунца и анчоусов слить масло, каперсы промыть. В высоком стакане для блендера соединить бульон, выделившийся после запекания мяса, сливки, майонез, тунец, анчоусы, лимонный сок, горчицу, вурстерширский соус и свежемолотый черный перец, тщательно измельчить всё с помощью блендера.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Отдохнувшую телятину нарезаем тонкими слайсами с помощью тщательно заточенного накануне острого ножа, поливаем сверху соусом, раскладываем каперсы, немного петрушки и оливкового масла. Вуаля!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0653_01_654_photo.webp\" alt=\"\"></figure></div>"},"792":{"id":792,"title":"Хумус с запеченными баклажанами","sub":"в томатном соусе с черными бобами","cat":"Закуски","img":"thumb/0792_00_792_photo.webp","lq":"data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAADwBQCdASoUABkAPu1wsFIppiSiqAgBMB2JZgCsM2c/20dw74LRUpuIp1MxNZln+DSrgbpScbgh4AD4Y4LHjo0d2CWhkNGqTMLdlbmrC+7tAqwe4fzFJ0ZLDHFryvUTgeEWBl8K0FZJHavAt0sHRGUmtkz/Gsr7eNOjHm7+WMPzdvAkj8L+TKkN3b2KPwy4+xR7Psp7V0YplaDdiXRoiHOzrqMhG4n/XFSJrHFl6K7jxHTFObU7rZny8Ab00saJQY+0ujhkWnjydhwbkxuLdtPRQQMp8/IO3qD6yG+Wfw49SAAA","w":360,"h":450,"q":"хумус с запеченными баклажанами в томатном соусе с черными бобами на нашу семью из 2 взрослых и 2 детей для хумуса нут консервированный или вареный 280 г жидкость от нута 60 100 г тахини 35 г чеснок 1 зубчик или меньше кумин 1 4 ч л лимон 1 2 шт сок оливковое масло 1 ст л соль щепотка для томатного соуса с баклажанами баклажан 1 шт помидоры черри 300 г черные бобы 200 г лук 1 шт чеснок 2 зубчика кумин 1 ч л гарам масала 1 ч л паприка копченая 1 2 ч л перец чили если любите томатная паста 1 ч л томаты консерв целые 400 г бульон овощной вода 120 г соевый соус 2 ст л черный перец каперсы лимон кинза питы тахини заатар хумус с запеченными баклажанами в томатном соусе с черными бобами есть не так много вегетарианских блюд которые могут заменить мне полноценный обед оставить ощущение что я очень вкусно разнообразно сытно поела и сохранить это ощущение на несколько часов этот хумус как раз такое блюдо так получилось что его составляющие практически всегда ест","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0792_00_792_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAADwBQCdASoUABkAPu1wsFIppiSiqAgBMB2JZgCsM2c/20dw74LRUpuIp1MxNZln+DSrgbpScbgh4AD4Y4LHjo0d2CWhkNGqTMLdlbmrC+7tAqwe4fzFJ0ZLDHFryvUTgeEWBl8K0FZJHavAt0sHRGUmtkz/Gsr7eNOjHm7+WMPzdvAkj8L+TKkN3b2KPwy4+xR7Psp7V0YplaDdiXRoiHOzrqMhG4n/XFSJrHFl6K7jxHTFObU7rZny8Ab00saJQY+0ujhkWnjydhwbkxuLdtPRQQMp8/IO3qD6yG+Wfw49SAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на нашу семью из 2 взрослых и 2 детей:</p><div class=\"iblock\"><p class=\"lbl\">для хумуса:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">нут консервированный или вареный 280 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">жидкость от нута ~60-100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тахини 35 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик или меньше</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для томатного соуса с баклажанами:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">баклажан 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черные бобы 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">гарам масала 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копченая 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец чили (если любите)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консерв. целые 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон овощной/вода 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кинза</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">питы</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тахини</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">заатар</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Есть не так много вегетарианских блюд, которые могут заменить мне полноценный обед — оставить ощущение, что я очень вкусно, разнообразно, сытно поела и сохранить это ощущение на несколько часов. Этот хумус — как раз такое блюдо. Так получилось, что его составляющие практически всегда есть у меня на кухне, и если в магазине я замечаю особенно красивый глянцевый бочок баклажана, молниеносно решаю, что сегодня буду готовить. Бобы можно взять любые, мне, как я уже говорила, очень нравятся черные. Приправа заатар опциональна, но она чудесно дополняет многие овощные блюда и особенно блюда из баклажана — советую присмотреться.</p>\n<p class=\"lbl\">Вот причины, по которым хумус с томатными баклажанами может легко войти в рацион вашей семьи:</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">готовится быстро — когда знаешь, что делать, можно справиться за час</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">соус хорошо переносит три-четыре дня в холодильнике, становясь еще вкуснее, то есть можно приготовить сразу двойную порцию</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">для любителей заготовок — готовый соус можно морозить (но текстура овощей будет похуже, безусловно)</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">если убрать из соуса бобы, получится просто классное дополнение для риса, булгура, гречки или пасты (но мне всё равно больше всего нравится с хумусом и питой)</span></li></ul>\n<p>Готовим?</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Я очень люблю хумус, но только когда он максимально свежий, поэтому никогда не делаю его много, только под конкретное блюдо. Если вы противоположного мнения, легко умножайте ингредиенты на два. В стакане для погружного блендера или чаше кухонного комбайна смешать все ингредиенты и пробить до кремового однородного состояния. Указала в рецепте разное количество жидкости — варьируйте его, чтобы получить желаемую консистенцию хумуса, и имейте в виду, что с течением времени он ещё немного загустеет. С чесноком та же история, кладите в зависимости от ваших предпочтений, мне хватает половинки зубчика на данный объем нута.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Духовку разогреть до 200 градусов (режим: конвекция). Помидоры черри и баклажан обмыть, у баклажана отрезать плодоножку и нарезать сначала толстыми кружочками (толщиной около 1,5-2см), затем на четвертинки. Уложить всё в противень, сбрызнуть оливковым маслом, посолить, поперчить, хорошо перемешать руками и поставить в духовку на 15 минут. Затем перевернуть баклажаны другой стороной и запекать еще 10-15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук и чеснок очистить, нарезать мелким кубиком. В сковороде разогреть 2 ст л оливкового масла, добавить лук и обжарить его в течение 5-7 минут на среднем огне, пока он не станет мягким и золотистым. Затем добавить чеснок, томатную пасту, кумин, паприку, гарам масала и обжарить в течение 2-3 минут. Если любите остринку, здесь можно добавить хлопья или половинку свежего перца чили (я не кладу). Следом добавить консервированные томаты вместе с соком (как обычно разбивая деревянной лопаткой плоды), влить бульон или воду, соевый соус, всё хорошо перемешать и оставить томиться на небольшом огне 15 минут. Попробуйте на соль, если нужно - досолите. Мы едим это блюдо всей семьёй вместе с детьми, поэтому я дополнительно не солю.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Выключите огонь, добавьте бобы, запеченные баклажаны и помидоры черри, аккуратно перемешайте, накройте крышкой и дайте настояться 5 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подаем так: на дно тарелки — хумус, с помощью столовой ложки делаем широкое углубление, туда соус с баклажанами, сверху немного тахини, каперсы, рубленная кинза, заатар и долька лимона. Не забудьте про поджаренную питу или ремесленный хлеб на крайний случай, это самое важное 🙂</div></div></div></div>"},"842":{"id":842,"title":"Bruschetta","sub":"брускетта с томатами, страккино и рукколой","cat":"Закуски","img":"thumb/0842_00_842_photo.webp","lq":"data:image/webp;base64,UklGRjgBAABXRUJQVlA4ICwBAABwBwCdASoUABkAPu1orVCppaQiqAqpMB2JbACsMvXKS2beivAbaDnnTwA7gXAIbrZDTeGruDq73IRAoSceYZDLuWtSAAD+6/RgyeuBYFUmqocphDe4GEkT1nQfR67YQL8m8GHmwo+4ODle9/W/ugp6sv7ksDLXs2mruf43dg4AUUqaKLB8g36GgfRdWlH66q8CFcYdjceRn7AelJ0FJqPVpWJV/UeIB4aaZvafQrq5rPwBi09DQwn6FSGmxfq/NYfoSvB8jwGTB+torp8YZyosDuD2h47Sp08b1oTY/TErZ6OLrMHegdEKQuit4k6Uth/NgscknnYz9FEa2XyJEwv15bZ8uEneaVM6Lxv0LSV5xrbAdgpsMti2vvsOx4IKultpJvm8Sv1iBLmaAAA=","w":360,"h":450,"q":"bruschetta брускетта с томатами, страккино и рукколой на 2 3 порции хлеб ремесленный пшеничный 6 ломтиков помидоры крупные 2 шт страккино 220 г руккола горсть оливковое масло чеснок 1 зубчик бальзамический уксус 1 ст л базилик горсть лимон 1 2 цедра соль свежемолотый черный перец bruschetta брускетта с томатами страккино и рукколой пыталась сегодня хотя бы приблизительно сосчитать сколько брускетт я съела в своей жизни естественно потерпела провал но скажу так их было очень очень много и вот что удивительно в одних местах это была вершина гастрономического искусства нечто простое и великое одновременно и хотелось ещё ещё и ещё а в других блюдо казалось почти","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0842_00_842_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRjgBAABXRUJQVlA4ICwBAABwBwCdASoUABkAPu1orVCppaQiqAqpMB2JbACsMvXKS2beivAbaDnnTwA7gXAIbrZDTeGruDq73IRAoSceYZDLuWtSAAD+6/RgyeuBYFUmqocphDe4GEkT1nQfR67YQL8m8GHmwo+4ODle9/W/ugp6sv7ksDLXs2mruf43dg4AUUqaKLB8g36GgfRdWlH66q8CFcYdjceRn7AelJ0FJqPVpWJV/UeIB4aaZvafQrq5rPwBi09DQwn6FSGmxfq/NYfoSvB8jwGTB+torp8YZyosDuD2h47Sp08b1oTY/TErZ6OLrMHegdEKQuit4k6Uth/NgscknnYz9FEa2XyJEwv15bZ8uEneaVM6Lxv0LSV5xrbAdgpsMti2vvsOx4IKultpJvm8Sv1iBLmaAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2-3 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">хлеб ремесленный пшеничный 6 ломтиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры крупные 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">страккино 220 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">руккола горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Пыталась сегодня хотя бы приблизительно сосчитать, сколько брускетт я съела в своей жизни. Естественно, потерпела провал, но скажу так: их было очень, очень много. И вот что удивительно — в одних местах это была вершина гастрономического искусства, нечто простое и великое одновременно (и хотелось ещё, ещё и ещё), а в других блюдо казалось почти что издевательством над едой в принципе: невнятный хлеб, безвкусные помидоры, грусть и тоска.</p>\n<p>Вообще слово bruschetta происходит от глагола bruscare — “жарить на углях”, и это уже много говорит о происхождении: всё начиналось с хлеба, поджаренного на решетке над открытым огнем. С приходом помидоров в кухню Средиземноморья родился самый известный нынче вариант — брускетта с томатами. Нарезанные на кубики, с солью, базиликом, иногда луком или каплей уксуса — они выделяют сок, который в свою очередь пропитывает хлеб, и получается прелестная игра текстур — хруста и мягкости. В разных уголках Италии свои любимые брускетты: в Тоскане — с белой фасолью и щедрой порцией чеснока, в Апулии — со свежим сыром и анчоусами, в Кампании — с томатами, оливками и орегано. Свою самую вкусную брускетту я съела как раз в Кампании, на острове Капри. Мы поселились в отеле с роскошным двориком с видом на Везувий, и хозяйка в первый же вечер принесла нам к бокалу моего любимого Greco di Tufo большую тарелку очаровательных брускетт. Я тогда была очарована кондитерским делом и, к сожалению, не пыталась ни запомнить, ни выяснить состав понравившихся мне блюд, поэтому в прошлом месяце пришлось всерьез погрузиться в воспоминания, чтобы эту прекрасную брускетту воссоздать для нашего Клуба. Я так сильно хотела повторить этот вкус, что пришлось самой делать страккино, который не купить в немецком супермаркете. Старания оправдались — она была очень близка к оригиналу. Настолько, что пришлось выяснять, где в Пассау достать Greco di Tufo 🙂</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Хлеб нарезать на толстые ломтики (1,5–2 см) и обжарить на сковороде или гриле до золотистой корочки, с небольшим количеством оливкового масла. Пока хлеб ещё горячий, натереть каждый ломтик разрезанным зубчиком чеснока — совсем чуть-чуть, нужна нотка.<br>Альтернативно можно подсушить ломтики в духовке при 180 градусах с конвекцией в течение нескольких минут, но вариант со сковородой или грилем кажется мне наиболее удачным.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Помидоры обмыть и нарезать небольшими кубиками. Посолить, поперчить, добавить ложку оливкового масла и бальзамический уксус. Перемешать и дать постоять 5–10 минут — чтобы выделился сок и всё пропиталось.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Рукколу промыть, очень хорошо обсушить, мелко нарезать и соединить со страккино. Добавить туда же цедру половинки лимона, немного соли, перца и каплю оливкового масла. Если страккино вы не нашли и не сделали, то лучше всего здесь сработает страчателла или молодая свежая моцарелла, но её будет чуть сложнее объединить с рукколой.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Собираем. На каждый кусочек хлеба выложить ложку страккино с рукколой, сверху — томаты с соком, листики базилика и — по желанию — ещё капля масла. Всё. Есть, конечно, сразу. Вот с этим аперолем — идеально! Прекрасной вам пятницы, amici!</div></div></div></div>"},"512":{"id":512,"title":"Тосканский овощной суп","sub":"ribolitta","cat":"Супы","img":"thumb/0512_00_512_photo.webp","lq":"data:image/webp;base64,UklGRv4AAABXRUJQVlA4IPIAAADQBQCdASoUABkAPu1qrFEppaQiqAqpMB2JaACdM0LlwAwHx+eqBpR0/SfUJWK9barHFPOOFEAAAP6ar8t19fqigg6ur2AOTy6t4LiCfdcGh+4P0BoYvLocxPVcuaFvvYocrB6EAu0B3OpjD0oZYMAWWQPLnObiApSxDOAACjJXczC5KPbIitz2rJF7W5PLCHZCGN/FNoUU+6/dJAHOCx4zWFLH7s4D4P+Z5rMPqJxhZaoygKETrtL6eLkkaSIsjTtaE1ZAX6t8Jlh+unO7WCz9AJCPoC+9qdQRSX+K796v9Ux3kSfhXyiT/4SfZjy4ksIAAA==","w":360,"h":450,"q":"тосканский овощной суп ribolitta на 6 порций фасоль каннеллини 220 г савойская капуста 1 2 шт кейл черный или обычный 250 г сельдерей 2 стебля лук порей 1 шт картофель 3 шт морковь 2 шт лук репчатый 1 шт чеснок 2 зубчика розмарин 2 веточки тимьян 4 6 веточек шалфей 2 листа лавровый лист 1 шт томаты консерв 200 г паста мисо 30 г оливковое масло ремесленный хлеб пармезан свежемолотый черный перец тосканский овощной суп ribolitta я крайне удивлена что это блюдо появляется в клубе только сейчас потому что риболитта абсолютно мой жанр это классический пример cucina povera то есть бедной кухни которая рождалась не в ресторанах а на обычных тосканских кухнях когда нужно было накормить большую семью имея в распоряжении лишь фасоль капусту лук оливковое масло и вчерашний хлеб когд ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0512_00_512_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRv4AAABXRUJQVlA4IPIAAADQBQCdASoUABkAPu1qrFEppaQiqAqpMB2JaACdM0LlwAwHx+eqBpR0/SfUJWK9barHFPOOFEAAAP6ar8t19fqigg6ur2AOTy6t4LiCfdcGh+4P0BoYvLocxPVcuaFvvYocrB6EAu0B3OpjD0oZYMAWWQPLnObiApSxDOAACjJXczC5KPbIitz2rJF7W5PLCHZCGN/FNoUU+6/dJAHOCx4zWFLH7s4D4P+Z5rMPqJxhZaoygKETrtL6eLkkaSIsjTtaE1ZAX6t8Jlh+unO7WCz9AJCPoC+9qdQRSX+K796v9Ux3kSfhXyiT/4SfZjy4ksIAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">фасоль каннеллини 220 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">савойская капуста 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кейл черный (или обычный) 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук порей 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 2 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 4-6 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шалфей 2 листа</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консерв. 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паста мисо 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ремесленный хлеб</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Я крайне удивлена, что это блюдо появляется в Клубе только сейчас, потому что риболитта — абсолютно мой жанр. Это классический пример cucina povera, то есть “бедной кухни”, которая рождалась не в ресторанах, а на обычных тосканских кухнях, когда нужно было накормить большую семью, имея в распоряжении лишь фасоль, капусту, лук, оливковое масло и вчерашний хлеб.</p>\n<p>Когда я оказалась во Флоренции, пошла искать ribollita буквально в первый же день, и на этом всё не закончилось: я заказывала её ещё два раза, каждый раз удивляясь, как по-разному она может звучать — где-то более томатно, где-то более капустно, где-то абсолютно кремово от разваренной фасоли и размокшего хлеба. Как я уже сказала, мне невероятно импонирует этот жанр — дымящаяся тарелка очень просто еды, такой честной и такой настоящей.</p>\n<p>За ней, кстати, стоит красивая легенда о том, что в Средние века феодалы подавали мясо на ломтях пресного хлеба (это тосканская особенность — хлеб там не солят), и пропитанный соками хлеб после трапезы отдавали слугам, которые, добавляя к нему фасоль и овощи, “переваривали” всё вместе, создавая новое, сильно более скромное блюдо. Насколько эта история документально точна — вопрос открытый, но сама идея повторного прогревания заложена в названии: ribollire значит вскипятить снова. Это суп второго или даже третьего дня, суп, который не боится времени, а, наоборот, нуждается в нём.</p>\n<p>Отсмотрев тонну материала, я отказалась от попытки реконструировать “единственную подлинную версию”, потому что это, кажется, невозможно, и решила собрать свою — ту, которую я бы готовила дома и с удовольствием ела несколько дней подряд.</p>\n<p>Во-первых, я использовала не каннеллини, а борлотти — просто потому, что найти каннеллини оказалось непросто. Если у вас есть возможность, берите, конечно, каннеллини, они более нежные и сливочные. Во-вторых, вместо классического чёрного тосканского кейла я использовала обычный кейл, потому что за пределами Италии cavolo nero добыть бывает непросто, а я всё-таки за то, чтобы рецепты были реализуемыми. И, наконец, я добавила пасту мисо — мой любимый инструмент для усиления умами в овощных блюдах. Это на тысячу процентов не канон, но мне кажется почти грехом не воспользоваться возможностью сделать овощной суп глубже и объёмнее, если у нас под рукой есть продукт, который так замечательно это умеет.</p>\n<p>Есть ещё одно сознательное отступление: я не прогреваю суп вместе с хлебом. Классическая ribollita часто готовится слоями, с хлебом внутри, который разбухает и становится частью текстуры. Мне же ближе подача с поджаренным ломтем ремесленного хлеба на дне тарелки — когда вы выкладываете на него густой, почти рагуобразный суп, позволяя хлебу постепенно размокать, впитывая бульон, оливковое масло и соки овощей, посыпаете всё это пармезаном и запиваете хорошим красным вином. Во-первых, это красиво!</p></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0873_00_873_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAACwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JbACsAYlkFzQkAaYNvlRv3VpHWRHXlK6T9tXU2QAA/uwk5abZGAnY/mzKtbkZuGoX6NVyidMsReKK74fT19kbi0MtLN7GHadgciRAHeTILQRUns00KC1qKoXW6hT2AWJXnICJ2KN26AL4Rfhl5Z5MZTp+rCim+JR1yhnGT2TmVeFtoCCdjz53CPUF36mVoleWQ2mQUoWdRhGgwmAj8ISuZcrM/o+vu2gOw9bZ85IAAA==) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Фасоль замочить на ночь в холодной воде. На следующий день воду слить, залить новой (примерно на 3–4 см выше фасоли), добавить 3 столовые ложки оливкового масла, веточку розмарина, лавровый лист, 2–3 веточки тимьяна и лист шалфея. Если у вас есть чугунок, то советую томить фасоль в духовке, так она получается вкуснее и лучше сохраняет форму. Если чугунка нет, то на плите на маленьком огне.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть духовку до 160 градусов (режим: верх/низ). Накрыть чугунок крышкой и отправить в духовку приблизительно на два часа. Через полтора часа после старта лучше начать проверять: фасоль должна стать мягкой, но держать форму. Когда фасоль станет мягкой, вытащить чугунок, добавить в воду одну столовую ложку соли, перемешать, накрыть крышкой и оставить на 10 минут. Затем слить воду, сохранив немного для финального этапа.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Пока фасоль готовится, можно заняться овощами. Очистить лук, морковь, картофель, снять верхние листы савойской капусты, перебрать кейл, отрезать толстые жесткие стебли у капусты и кейла. Все обрезки сложить в кастрюлю, добавить два литра питьевой воды и поставить на огонь — пока вы занимаетесь нарезкой, пусть варится бульон. Перед добавлением в суп бульон процедить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Морковь и сельдерей нарезать аккуратным мелким кубиком, картофель кубиком побольше, лук и чеснок — мелко, порей — тонкими полукольцами. Кейл и капусту нарезать небольшими квадратиками или полосками.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В большой тяжёлой кастрюле разогреть щедрую порцию оливкового масла. Добавить репчатый лук, немного листочков тимьяна, веточку розмарина и шалфей. Обжаривать около пяти минут, пока лук не станет прозрачным, затем добавить лук порей, морковь, сельдерей и чеснок и обжаривать около десяти минут. Это база вкуса, здесь нельзя торопиться. Щедро посолить, держа в голове, что мисо добавит еще немного соли позднее.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Добавить консервированные пюрированные томаты, дать им прогреться. Затем добавить картофель, кейл и савойскую капусту, влить овощной бульон и немного фасолевого отвара. Жидкость должна покрывать овощи на 3/4, риболитта — это очень густой суп. Прикрыть крышкой и готовить 45-60 минут на медленном огне, суп должен тихонько булькать, ни в коем случае не кипеть.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">В конце отлить небольшое количество бульона и развести в нем пасту мисо, вернуть в суп. Пробуйте, возможно захочется добавить больше пасты.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Добавить фасоль (традиционно часть фасоли разминают или пробивают блендером, чтобы придать супу кремовую текстуру, я сознательно пропускаю этот шаг, так как люблю классическую текстуру бульона, просто имейте это в виду).</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Попробовать на соль и перец. Дать супу настояться минимум 20–30 минут, в идеале, конечно, до завтра.</div></div>\n<div class=\"step\"><span class=\"sn\">10</span><div class=\"st\">Подача! На дно тарелки уложить ломтик поджаренного ремесленного хлеба. Прямо на хлеб выложить густой суп, сбрызнуть хорошим оливковым маслом и натереть сверху немного пармезана. Подавать с красным вином, очень по-тоскански.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_01_874_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_02_875_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_03_876_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_04_877_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_05_878_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_06_879_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_07_880_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0873_08_881_photo.webp\" alt=\"\"></figure></div>"},"515":{"id":515,"title":"Гаспачо","sub":"испанский холодный суп","cat":"Супы","img":"thumb/0515_00_515_photo.webp","lq":"data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAABwBgCdASoUABkAPu1sqlEppaOiqAqpMB2JbACdMoR/eGRGOgMsEn+8qdErprOz/nfORWq1BnTkUjlAAAAA/phPHj6RSCP+0WxpSpF64JMOTVQDfuOfzIA0l9dVqxVHVq8D6x5TXPLHWakjmSiUqyeSZRB+bGdYU+CawUJbHgj2FiOrlrrasB6QiA/qRIW+H5PWTC6mMnLKzpwKmC88db5YGk6+tk4fSWcvkp8eWX7PE1TtRKho2acgq5fCNBKFUNV9IB8LJQh9RQAA","w":360,"h":450,"q":"гаспачо испанский холодный суп на 4 6 порций томаты 1 2 кг san marzano или другие сливовидные белая булочка 1 шт огурцы 2 шт болгарский перец 2 шт красный лук 1 4 шт базилик 1 ст л с горкой мята 5 6 листиков соевый соус 1 ст л оливковое масло 5 ст л хересный уксус 1 ст л соль по вкусу не жалеть черный перец свежемолотый по вкусу для подачи помидор 1 шт огурец 1 шт оливковое масло маленькие листья базилика гаспачо испанский холодный суп","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0515_00_515_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAABwBgCdASoUABkAPu1sqlEppaOiqAqpMB2JbACdMoR/eGRGOgMsEn+8qdErprOz/nfORWq1BnTkUjlAAAAA/phPHj6RSCP+0WxpSpF64JMOTVQDfuOfzIA0l9dVqxVHVq8D6x5TXPLHWakjmSiUqyeSZRB+bGdYU+CawUJbHgj2FiOrlrrasB6QiA/qRIW+H5PWTC6mMnLKzpwKmC88db5YGk6+tk4fSWcvkp8eWX7PE1TtRKho2acgq5fCNBKFUNV9IB8LJQh9RQAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4-6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты 1,2 кг (San Marzano или другие сливовидные)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белая булочка 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурцы 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">болгарский перец 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">красный лук 1/4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 1 ст л с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мята 5–6 листиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 5 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">хересный уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль по вкусу (не жалеть)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец свежемолотый по вкусу</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для подачи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидор 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурец 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">маленькие листья базилика</span></li></ul></div></div></aside><div class=\"main\"><div class=\"note\"><i class=\"bul\">📍</i>NOTE: если нет хересного уксуса, возьмите красный винный или, в крайнем случае, бальзамический</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">На каждом томате сделать неглубокий крестообразный надрез. Залить кипятком на 1–2 минуты, затем сразу переложить в ледяную воду. Снять кожицу, удалить плодоножки и крупно нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Огурцы наполовину очистить от кожуры. Болгарский перец очистить от семян и плодоножек. Красный лук очистить и крупно нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Соединить томаты, огурцы, болгарский перец, красный лук, базилик, мяту, хересный уксус, соевый соус, соль, черный перец и 2 ст л оливового масла. Аккуратно перемешать, накрыть крышкой или пищевой пленкой и убрать в холодильник на ночь.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Непосредственно перед подачей с булочки срезать корочку, мякиш крупно порвать руками. Добавить к овощам мякиш булочки и оливковое масло, затем тщательно пробить погружным или стационарным блендером до абсолютно гладкой, шелковистой консистенции. Попробовать и при необходимости дополнительно посолить, поперчить или добавить еще немного хересного уксуса. Отправить в холодильник нще на полчаса.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Разлить гаспачо по тарелкам, сверху выложить немного кубиков нарезанных помидора и огурца, полить небольшим количеством хорошего оливкового масла и украсить маленькими листьями базилика. Подавать!</div></div></div></div>"},"604":{"id":604,"title":"Уха домашняя","sub":"но с уважением к традициям","cat":"Супы","img":"thumb/0604_00_604_photo.webp","lq":"data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAAAwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMtDBgZ+OLm3MigXPhfTh7JpYWA/IAAD+521CWY/pqTWx3YW2wgOIgi8MjyAaAkTB5xi7YQSRsHL9Db9uwUlapKOyk+b0dtJPcHw5NGatXUdo9t0aDjqT1ld+MP/4VczWcWJ+NXHdd71Ttezq44pvKHwCaKDYydFXXoIH/C27apck5oVZddA2flkP5JSY86XGXExp54rptJ1bHmcgkmHS63DW5IfHZ8YVhtvyQAAA","w":360,"h":449,"q":"уха домашняя но с уважением к традициям на 4 6 порций для бульона голова хвост обрезки красной рыбы 1 кг лук репчатый 1 шт морковь 1 шт сельдерей 2 стебля лемонграс 1 2 стебля тимьян 2 3 веточки петрушка 2 3 стебля черный перец горошком 10 12 шт лавровый лист 1 шт вода 2 л для ухи картофель 300 г помидоры черри 150 г морковь 1 шт красный перец сладкий 1 2 шт треска 700 г рыбный соус 1 ст л водка 20 г лимон 1 2 шт сок зелень укроп петрушка свежемолотый черный перец соль уха домашняя но с уважением к традициям я выросла на волге уха для меня вещь с одной стороны привычная и тривиальная а с другой ностальгическая и священная за своё детство я съела такое количество ухи что ни одному борщу не снилось причём из таких видов и сочетаний рыбы что взрослая саша сейчас маленькой саше гастрономически очень завидует например когда мне было лет шесть мама корм ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0604_00_604_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtYAAABXRUJQVlA4IMoAAAAwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMtDBgZ+OLm3MigXPhfTh7JpYWA/IAAD+521CWY/pqTWx3YW2wgOIgi8MjyAaAkTB5xi7YQSRsHL9Db9uwUlapKOyk+b0dtJPcHw5NGatXUdo9t0aDjqT1ld+MP/4VczWcWJ+NXHdd71Ttezq44pvKHwCaKDYydFXXoIH/C27apck5oVZddA2flkP5JSY86XGXExp54rptJ1bHmcgkmHS63DW5IfHZ8YVhtvyQAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 4-6 порций:</p><div class=\"iblock\"><p class=\"lbl\">для бульона:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">голова, хвост, обрезки красной рыбы 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лемонграс 1/2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 2-3 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 2-3 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец горошком 10-12 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 2 л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для ухи:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">красный перец сладкий 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">треска 700 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рыбный соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">водка 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (сок)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">зелень: укроп, петрушка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Я выросла на Волге, уха для меня — вещь, с одной стороны, привычная и тривиальная, а с другой — ностальгическая и священная. За своё детство я съела такое количество ухи, что ни одному борщу не снилось, причём из таких видов и сочетаний рыбы, что взрослая Саша сейчас маленькой Саше гастрономически очень завидует.</p>\n<p>Например, когда мне было лет шесть, мама кормила меня ухой из головы огромного осетра. То было славное время, когда браконьеры ещё не успели окончательно истребить осетровых, и поездки на реку с палатками иногда заканчивались не только такой роскошной ухой, но и литровыми банками свежезасоленной чёрной икры. Да, сейчас это звучит как плохо проверяемое хвастовство, но нет, таким было обычное волжское детство середины девяностых.</p>\n<p>Там же, на Волге, но спустя двадцать два года случилась ещё одна запоминающаяся уха — на этот раз от маминого старого друга, настолько давно присутствовавшего в нашей жизни, что я принимала его за родственника. Готовил он её так. Сначала сварил “первый” бульон из разной мелкой рыбы, уложенной в марлю. Затем мешок удалил и заложил в бульон разделанную стерлядь вместе с лавровым листом и душистым перцем. Туда же отправились овощи, нарезанные максимально крупно: сначала картофель и морковь, позднее — сладкий перец и помидоры. А в финале случилось рыбацкое мини-шоу: он достал из костра самое красивое обугленное полено, потушил его прямо в ухе, а затем влил в котелок рюмку водки. Естественно, вкуснее ухи я с тех пор не ела.</p>\n<p>Сейчас, обладая некоторыми знаниями в гастрономической науке, я уже могу объяснить логику этих вау-эффектов, которые тогда показались чистым шаманством. Двойной или тройной рыбный бульон даёт гораздо более насыщенный и “объёмный” вкус за счёт постепенного извлечения коллагена, желатина и водорастворимых ароматических соединений из разных видов рыбы. Хорошо обугленное полено добавляет в суп те ноты, которые возникают при контакте древесины с огнём: фенольные соединения, отвечающие за ощущение костра, копчения и “уличной” еды. Водка же нужна не только для антуража: алкоголь помогает летучим ароматическим молекулам лучше раскрываться в горячем бульоне, делая вкус рыбы в ухе ярче и выразительнее.</p>\n<p>При всей моей любви к рыбацко-котелковой романтике для Клуба я собрала версию домашнюю, чтобы вы не терзали гугл вопросами, где взять стерлядь (их вылов сейчас строго урегулирован) и не подожгли случайно дом 😁</p></div><p>+ копченая соль для эффекта ухи на костре (совсем немного)</p>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: при объединении молекул спирта с молекулами воды выпаривания алкоголя почти не случается, поэтому если уху будут есть дети, не добавляйте водку в общую кастрюлю, лучше пару капель взрослым в тарелку</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Рыбные головы и обрезки очень тщательно промыть, чтобы не было ни намека на кровь. Особенно важно удалить жабры, если они есть: они могут сделать бульон мутным и придать неприятную горечь.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Сложить рыбу в кастрюлю, залить двумя литрами холодной воды и поставить на средний огонь. Очень важно не торопиться: хороший рыбный бульон любит спокойствие. Как только начнёт появляться пена, аккуратно снимать её шумовкой.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук разрезать на четыре части прямо с шелухой — она даст красивый золотистый оттенок. Морковь очистить и нарезать небольшими шайбочками. Стебли сельдерея вымыть и нарезать крупными секциями. Лемонграсс слегка отбить тыльной стороной ножа, чтобы он лучше отдавал аромат (можно использовать замороженный).</div></div></div></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0910_00_910_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRswAAABXRUJQVlA4IMAAAADQBQCdASoUABkAPu1qrFEppaQiqAqpMB2JYgCdL68A3tCniDNRVOXIXiqRPeriWxUm3DvsOEcAAP6JDCwZcgt7N6kHfLzQ6WxI6HOWzIDLMGG/rAtuqzs4jZHb/qJ5EYPSyxF+5vMbVMDbWmHXjoDtv9NVC4wM4REbC2Rgc7NICVfLJCDpZ3P7K/9uaNHYU0yr4dkP/9JyOwa1c9tqAZnRg8Qos6YFZae71loVAXn+YV84z+dr0wkw9Cvf2gOAAAA=) center/cover\" alt=\"\"></figure></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Когда бульон перестанет активно пениться, добавить овощи, тимьян, петрушку, лавровый лист и чёрный перец. Довести до очень слабого кипения — поверхность должна едва подрагивать. Ни в коем случае не допускать бурления: оно может быстро превратить прозрачную уху в молочный рыбный суп. Варить один час.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Готовый бульон аккуратно процедить через мелкое сито или марлю. Если хочется особенно прозрачного результата, можно дать бульону пару минут постоять и затем осторожно перелить, оставляя осадок на дне кастрюли.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Картофель очистить и нарезать половинками. Морковь очистить и нарезать кружочками по диагонали (для красоты). Перец вымыть, очистить и крупно нарезать. Черри разрезать пополам. Укроп и петрушку вымыть, тщательно обсушить и нарубить — укроп мелко, петрушку достаточно крупно. Треску нарезать крупными кусками, обсушить бумажными полотенцами и посолить со всех сторон, отставить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Вернуть бульон на огонь, добавить картофель и морковь, варить 15 минут. Затем добавить сладкий перец и готовить ещё 7 минут. Наконец, опустить в тихо кипящий бульон треску и помидоры. Готовить ещё примерно 5 минут, не допуская активного кипения — рыба должна остаться сочной.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В самом конце добавить укроп, влить водку, рыбный соус и лимонный сок, попробовать, отрегулировать кислоту и соль и сразу после выключить огонь. Дать ухе постоять под крышкой 5–7 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Подавать очень горячей, с чёрным хлебом, большим количеством петрушки, копченой солью и, если хочется абсолютной русской гастрономической классики, — с тонкими ломтиками холодного сливочного масла на хлебе.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"449\" src=\"thumb/0910_01_911_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_02_912_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_03_913_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_04_914_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_05_915_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_06_916_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_07_917_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0910_08_918_photo.webp\" alt=\"\"></figure></div>"},"639":{"id":639,"title":"Куриный суп","sub":"с домашней лапшой","cat":"Супы","img":"thumb/0639_00_639_photo.webp","lq":"data:image/webp;base64,UklGRg4BAABXRUJQVlA4IAIBAAAwBgCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMxx8OIBiglAQgGtMEL0t3c9pRIeJxHRDByaJ7uygAOJDnjoDuSBrTm+Hnr7UkUTHpIoSRLf20luJAg4p074afsKXWHRjzPd+s60XvBIwnvW+Zrx5dghoBrNflAEr5/VwV7hVevvEZk+nP9RvgL3pH3jdSt3/j5cxRx7JNOs5F7EYfftxVS2+tUl6WE491J/phSs2Bvz5PP4Py/xV4gyusUB6dJviId9n4H80nzZqF3Ebb1G2p6PxIr2/tX1k2sqeUZbNVFwaU61avjv/2+zneIOfsccd8QXsbTDgO4eomc+5fryNAAA=","w":360,"h":450,"q":"куриный суп с домашней лапшой на 4 порции для бульона куриные окорочка 4 шт вода 2 л сельдерей 2 стебля морковь небольшая 2 шт лавровый лист 2 шт тимьян 6 8 веточек черный перец горошком 10 шт стебли петрушки 6 8 шт для лапши мука 60 г желток 1 шт вода 1 2 ст л соль щепотка морковь 2 шт картофель 2 шт яйцо всмятку 2 шт петрушка горсть укроп горсть соль свежемолотый черный перец куриный суп с домашней лапшой чувствую внутренний восторг от того что рецепт блюда которое кажется мне вот прямо олицетворением дома я пишу в тот день когда должна получить долгожданные ключи куриный суп это столп мамино лекарство еврейский пенициллин квинтэссенция уюта и домашнего тепла это точно самое повторяющееся блюдо в моей семье и точно еда которую я могу есть всегда вне зависи","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0639_00_639_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRg4BAABXRUJQVlA4IAIBAAAwBgCdASoUABkAPu1sq1EppaOiqAqpMB2JbACdMxx8OIBiglAQgGtMEL0t3c9pRIeJxHRDByaJ7uygAOJDnjoDuSBrTm+Hnr7UkUTHpIoSRLf20luJAg4p074afsKXWHRjzPd+s60XvBIwnvW+Zrx5dghoBrNflAEr5/VwV7hVevvEZk+nP9RvgL3pH3jdSt3/j5cxRx7JNOs5F7EYfftxVS2+tUl6WE491J/phSs2Bvz5PP4Py/xV4gyusUB6dJviId9n4H80nzZqF3Ebb1G2p6PxIr2/tX1k2sqeUZbNVFwaU61avjv/2+zneIOfsccd8QXsbTDgO4eomc+5fryNAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 4 порции:</p><div class=\"iblock\"><p class=\"lbl\">для бульона:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">куриные окорочка 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 2 л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь небольшая 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 6-8 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец горошком 10 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">стебли петрушки 6-8 шт</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для лапши:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 1-2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо всмятку 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Чувствую внутренний восторг от того, что рецепт блюда, которое кажется мне вот прямо олицетворением дома, я пишу в тот день, когда должна получить долгожданные ключи!</p>\n<p>Куриный суп — это столп. Мамино лекарство, еврейский пенициллин, квинтэссенция уюта и домашнего тепла. Это точно самое повторяющееся блюдо в моей семье и точно еда, которую я могу есть всегда, вне зависимости от состояния души и тела, и в особенности, когда нужно поправить состояние души и тела.</p>\n<p>Варить его очень просто, но соберу однако же в комментариях свод важных правил.</p></div><p>(если хотите, чтобы лапши в супе было много, удвойте рецепт)</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сначала бульон. Окорочка разделить на бёдра и голени с помощью острого ножа, сложить всё в большую кастрюлю, залить холодной водой и довести до кипения на среднем огне. Снять пену, убавить огонь до минимума. Добавить крупно нарезанный сельдерей и морковь, лавровый лист, тимьян, перец горошком и стебли петрушки. Варить при лёгком булькании около двух часов.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Пока бульон варится, приготовить лапшу. В большой миске или прямо на рабочей поверхности смешать муку с солью и сделать в горке углубление на манер жерла вулкана. Добавить в центр желток и немного воды, с помощью вилки, а затем рук замесить плотное, но эластичное тесто. Сначала будет казаться, что все пропало — тесто будет комковатое, неоднородное и прилипающее к рукам. Терпение! Месить комочек нужно по меньшей мере 5-7 минут, и когда разовьется глютен, он станет однородным, гладким и очень красивым. Завернуть в плёнку и оставить на 20–30 минут. Затем раскатать очень тонко, посыпать мукой (муку не жалеем, но и стараемся не перебарщивать), свернуть гармошкой и нарезать полосками с помощью острого наша. Разложить на столе и немного подсушить, чтобы не слиплись.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Когда бульон готов, вынуть курицу и овощи. Бульон процедить через сито. Мясо бедрышек отделить от костей, немного посолить и перемешать — его можно подать отдельно. С голеней аккуратно снять кожу и нижние хрящики и отложить.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Поставить варить яйца. Петрушку и укроп обмыть, тщательно обсушить и нарубить мелко. Картофель и морковь очистить и нарезать кубиками — картофель покрупнее, морковь помельче. Когда у меня есть время и настроение, я нарезаю морковь тонкими кружочками, а потом формочками вырезаю из них звездочки или цветочки — моим детям очень нравится :)</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В процеженный бульон положить морковь и картофель, варить на небольшом огне до мягкости, около 15-20 минут. Затем добавить петрушку и укроп, затем лапшу и готовить ещё 3–4 минуты, пока она не станет мягкой. Попробовать на соль, поперчить.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Подавать суп горячим, с половинкой яйца-восьмиминутки и куриной голенью в каждой тарелке, дополнительно посыпав свежей петрушкой. Этот суп лечит. Обещаю!</div></div></div></div>"},"517":{"id":517,"title":"Очень быстрая паста","sub":"спагетти с помидорами черри","cat":"Паста и пицца","img":"thumb/0517_00_517_photo.webp","lq":"data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAADQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JaACdMoR+AdFIgXGVYVgdyQhHCKJ7Rl3JMZJrPjbAAP5m2BU4GCsD7Epokq8Evub3Hs8Z6s5X69dqn1VNxQCeJ8EGyoIjVb39MrXWSTGM4u3RKoWXWHFDmM8GnRKfKG/D21MaWlAUUbHAcvxy8ZvsfO7pIaZFxTz13CFEmyMpvUms+e8AruuafXZfVLaXbtn7jgW0dAUyeE9+7jnntXC28dHP+xPeNT37jC7M8nF396yG/WWE9xvIcnwrRsMAAAA=","w":360,"h":449,"q":"очень быстрая паста спагетти с помидорами черри на 2 порции спагетти 220 г оливковое масло 2 ст л чеснок 2 зубчика лук шалот 1 шт томаты черри 250 г томатная паста 20 г соевый соус с низким содержанием соли 2 ст л базилик 1 ст л еще немного пармезан пекорино чёрный перец свежемолотый соль очень быстрая паста спагетти с помидорами черри когда я увидела в анкетах обратной связи большое количество запросов простых и быстрых обедов сразу вспомнила про мою пасту для детей однажды это блюдо собралось экстренно под крики мама ам и из тех продуктов что всегда есть у нас в холодильнике и кладовке спагетти помидоры черри соевый соус томатная паста и замороженный базилик и я счи","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0517_00_517_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAADQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JaACdMoR+AdFIgXGVYVgdyQhHCKJ7Rl3JMZJrPjbAAP5m2BU4GCsD7Epokq8Evub3Hs8Z6s5X69dqn1VNxQCeJ8EGyoIjVb39MrXWSTGM4u3RKoWXWHFDmM8GnRKfKG/D21MaWlAUUbHAcvxy8ZvsfO7pIaZFxTz13CFEmyMpvUms+e8AruuafXZfVLaXbtn7jgW0dAUyeE9+7jnntXC28dHP+xPeNT37jC7M8nF396yG/WWE9xvIcnwrRsMAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">спагетти 220 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-шалот 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты черри 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томатная паста 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус с низким содержанием соли 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">базилик 1 ст л + еще немного</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан/пекорино</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чёрный перец свежемолотый</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Когда я увидела в анкетах обратной связи большое количество запросов простых и быстрых обедов, сразу вспомнила про мою “пасту для детей”. Однажды это блюдо собралось экстренно под крики “мама ам!” и из тех продуктов, что всегда есть у нас в холодильнике и кладовке — спагетти, помидоры черри, соевый соус, томатная паста и замороженный базилик, и я считаю спагетти с помидорами черри буквально самым быстрым блюдом в своем арсенале (наравне с отвариванием пельмешек). Как и во всех простых блюдах, для впечатляющего результата важно обращать внимание на качество ингредиентов и технику приготовления. Главный секрет вкусной пасты — эмульсия, которую вы создаете прямо в сковороде из жировой основы (оливкового масла с ароматизаторами вроде лука, чеснока и базилика) и воды из-под пасты (с небольшим количеством крахмала, который загущает соус и делает его “прилипчивым”). Поэтому не пренебрегайте вот этим вымешиванием спагетти в сковороде, ведь это ключ к успеху. Сладкие, а не безвкусные помидоры черри, итальянские спагетти с приготовлением минимум 11-12 минут, хорошее оливковое масло extra virgin и качественный сыр (я как и всегда предпочитаю здесь пекорино) — по умолчанию.</p>\n<p>Засекайте время!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Чеснок очистить и нарезать пластинками, лук-шалот очистить и нарезать мелким кубиком. Помидоры черри обмыть, обсушить и разрезать на половинки. Если вы используете свежий базилик, то обмыть его, обсушить (я использую замороженный) и нарвать на небольшие кусочки.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В большой кастрюле довести до кипения хорошо подсоленную воду и отварить спагетти на 2 минуты меньше, чем указано на упаковке. Не забудьте сохранить примерно 120-130 г воды из-под пасты, она понадобится для соуса.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В широкой сковороде разогреть 2 ст л оливкового масла, добавить лук и чеснок и готовить на среднем огнк, слегка помешивая, около двух-трех минут. Добавить замороженный базилик и прогреть его в масле вместе с луком и чесноком около 20–30 секунд. Положить томатную пасту и перемешать, давая ей слегка обжариться в масле — так вкус станет более глубоким и насыщенным. Влить соевый соус, перемешать и засечь минутку, чтобы все ароматы объединились.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Добавить в сковороду помидоры черри и готовить на среднем огне пару минут, как раз до готовности спагетти.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Переложить в сковороду готовые спагетти и добавить сохраненную воду из-под пасты. Интенсивно перемешать, чтобы добиться эмульсии. Сделать это можно двумя способами — встряхивая сковороду или перемешивая спагетти прямо в ней (удобно делать это кухонным пинцетом). Не пропускайте этот шаг! Когда увидите, что спагеттинки обволоклись соусом, всё готово.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Снять с огня, вмешать еще немного базилика, перемешать, разложить по тарелкам, посыпать тертым сыром и щедро приправить свежемолотым чёрным перцем. Подавать как можно скорее!</div></div></div></div>"},"575":{"id":575,"title":"Лазанья","sub":"bad mood comfort food","cat":"Паста и пицца","img":"thumb/0575_00_575_photo.webp","lq":"data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAAAwBgCdASoUABkAPu1srVEppaQiqAqpMB2JYgCsM0920+ga2ocvU4aa1o1Pp+f5YAXORiSgz2BjcdAAAPli34z2/ty7NQVr8S4mtOS3OULDG  говядины 450 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш из свинины 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">копчёный бекон 4 кусочка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт (крупный)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей 1 стебель</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 2 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">томаты консервированные целые 800 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">красное сухое вино 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 1000 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 4-6 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">итальянские травы 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 130 г (80+50)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">моцарелла 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мускатный орех</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль и перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Мой безоговорочный фаворит в двух случаях: когда стоит задача накормить вкусно большую толпу или когда нужно экстренно поднять себе настроение. Впервые я сделала лазанью, когда очень хотела отпраздновать нашу с Вилли годовщину свадьбы, а финансовая ситуация не то что бы позволяла устраивать званый ужин. Десятого августа две тысячи девятнадцатого в Москве было холодно и дождливо, мы с толпой друзей вместе были на митинге на Проспекте Сахарова, потом загрузились в такси-минивен, приехали в нашу небольшую квартиру на Белорусской и тут же открыли красное вино. Та минута, когда я с огромным противнем горячей лазаньи зашла в гостиную под одобряющие улюлюкания и аплодисменты захмелевших от вина друзей, останется в моей памяти как один из самых душевных моментов жизни. Это практически была ода любви и молодости, сказ о том, что нужно объединять людей за столом, если есть хороший повод, и главное не то, что конкретно ты приготовишь, а то, с какими мыслями ты будешь это готовить и нести на стол. Очень качественное мясо, немножко ароматических трюков с тимьяном и мускатным орехом, много-много сыра и, безусловно, любви. Как ни крути, в таком деле она действительно секретный ингредиент.</p>\n<p class=\"lbl\">Прежде чем приступать к рецепту:</p>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Слабое звено любой покупной лазаньи — фарш. Это важнейшая составляющая, на которой как раз не стоит экономить. Я всё ещё не встречала в своей жизни хороший готовый фарш, поэтому выбираю в магазине кусок говядины (идеально — шея, но сойдет и лопатка) и кусок свинины (тоже шея или корейка), и прошу сделать из них фарш. Соотношение всегда выбираем, исходя из своих предпочтений: у говяжьего фарша больше мясного вкуса, свиной дает сочность. 80/20 — общепринятый эталон, но для лазаньи мне нравится брать соотношение 60/40. Обладатели мясорубок как всегда выигрывают.</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Самая вкусная лазанья получается со свежей пастой, но если нет возможности найти такую, то берите те листы, что не требуют отваривания. Я обычно беру классические от Barilla. Вы можете снизить углеводность своей лазаньи, если замените листы на слайсы цуккини или баклажана (предварительно запеките их в духовке до золотистого состояния).</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">Консервированные томаты — ещё одна важнейшая часть! В итальянском месяце Клуба я рассказывала, что всегда предпочитаю брать цельные помидоры Mutti — в них больше вкуса, меньше воды и сбалансированное соотношение сладости и кислоты. Рекомендую, в общем.</span></li></ul>\n<p class=\"lbl\">Перечисляю опциональные ингредиенты, без которых можно обойтись, но с сушественным ухудшением результата:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟡</i><span class=\"tx\">бекон (любимый лайфхак всех британских шефов, придаёт фаршу приятный дымно-копченый аромат)</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">морковь, сельдерей, лавровый лист, тимьян, розмарин, мускатный орех — все это про ароматику и оттенки вкуса, которыми вы можете обогатить или обеднить свою лазанью</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">вино можно заменить на бульон, бульон — на воду, но сами понимаете…</span></li></ul></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0575_01_576_photo.webp\" alt=\"\"></figure></div>\n<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0444_00_444_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvgAAABXRUJQVlA4IOwAAACQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JbACdMoAluQoGMbcy97/773jFKSII8Wn2zGGpgAD+qUiydF513ctEs7aVnLXgyzeBNZAayies0mr3oQvkNLIUa/MjHOMIktXikhHvUaIs8vqTTZAbjHoGuMv0eGLPe6gmem7mJxqJ1hzZoAP6/2dLR1G/Tcqauy4Czorb9dXShnLSGXVO4H4tikzEqygpyxQOQPSOe/n9Xq0nURuYy1nuHcv/X9Ur+6iTa9fl0y+A8h9Nz147LN+3qnYxIA8UetMmqUqUXPr4zgJPvPUQ7THSEAAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">Как готовить:</p></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Начнём с бешамеля. В кастрюлю или большой сотейник с толстым дном налить молоко, уложить туда лавровый лист и тимьян, посолить, поперчить и поставить на огонь. Когда молоко приблизится к закипанию, выключить огонь, накрыть крышкой и дать напитаться ароматами.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук, морковь и чеснок очистить и нарезать мелким кубиком, сельдерей обмыть и нарезать идентично, бекон нарезать на маленькие кусочки. В кастрюле или сковороде с высокими стенками разогреть 2 столовые ложки оливкового масла, добавить туда поочередно бекон (поджарить пару минут до запаха), веточки розмарина и чеснок (полминуты), лук (минуту), затем морковь и сельдерей, довести все до мягкости на небольшом огне в течение 7-10 минут. Если увидите, что овощи суховаты, добавьте ещё ложку оливкового масла. Переложить зажарку в тарелку.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>TIP: если вы, как и я, не часто используете сельдерей, то удвойте или тройте ингредиенты для предыдущего шага, а затем просто охладите и заморозьте остаток. Так вы будете на шаг впереди к вашей следующей лазанье ;)</div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Смешать руками два вида фарша, добавить в сковороду две столовые ложки оливкового масла, и прожарить фарш на средне-сильном огне примерно 5-7 минут, непрерывно разбивая кусочки лопаточкой. Затем добавить обжаренные овощи с беконом, соевый соус и бульон, промешать, все консервированные томаты, промешать, влить красное вино (не забудьте влить бокальчик в себя 😂), довести на сильном огне до кипения, убавить огонь до среднего, немного посолить и щедро поперчить, добавить итальянские травы и, не накрывая крышкой, оставить томиться в течение 30 минут, периодически помешивая. Соус должен ощутимо булькать и выпаривать воду, концентрируя вкус — следите за этим!</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Разогреть духовку до 180 градусов (режим: конвекция) и вернуться к бешамелю. Молоко снова подогреть, чтобы было горячим, лавровый лист и тимьян убрать. В сотейнике растопить сливочное масло, добавить муку, быстро и интенсивно промешать венчиком до однородного состояния и следом медленно начать добавлять горячее молоко. С бешамелем у многих выходит провал, а все потому, что нельзя добавлять молоко в один приём! Механика такая — четверть молока, перемешать, увидеть загущение, добавить еще четверть, еще раз дождаться густоты, и так далее. При постепенном введении жидкости крахмал из муки успевает равномерно набухнуть и связать влагу, образуя гладкую, устойчивую эмульсию. Если же влить всё молоко сразу, гранулы крахмала схватятся снаружи, внутри останется сырой порошок, и вместо шелковистого соуса получится отдельно молоко и отдельно комок муки.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Пармезан и моцареллу натереть на крупной тёрке. Большую часть пармезана (80 грамм) всыпать в соус бешамель, добавить щепотку мускатного ореха, хорошо перемешать. Попробовать на соль, если нужно — досолить.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Всё самое сложное позади, собираем лазанью! Дно и бортики формы хорошо смазать оливковым маслом, выложить небольшое количество соуса бешамель, затем — листы для лазаньи. Следите за тем, что кончики листов были обильно смазаны одним из соусов, иначе потом будет хрустеть на зубах. На листы выложить половину соуса болоньезе, немного тертой моцареллы, затем соус бешамель, опять листы, вторую половину болоньезе, опять листы. Сверху залить остатками бешамеля и от всей души засыпать оставшимся пармезаном и моцареллой.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Отправляем в духовку на 30-35 минут. Перед подачей очень важно дать лазанье настояться и немного “устаканиться” — дайте ей отдохнуть 15-20 минут. Подавайте с зеленым салатом и бокалом правильно охлажденного Primitivo.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0444_01_445_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0444_02_446_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0444_03_447_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0444_04_448_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0444_05_449_photo.webp\" alt=\"\"></figure></div>"},"583":{"id":583,"title":"Фузилли с томленой говядиной","sub":"","cat":"Паста и пицца","img":"thumb/0583_00_583_photo.webp","lq":"data:image/webp;base64,UklGRt4AAABXRUJQVlA4INIAAACwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JaACdIKngugw8bIMiLiHenizQR6W3W3CCCyNFkswA/s3c2jC7HrKmM6ezDy0BwbzD/edbn0N5dmPb0DKhxwMZwm9KZ2I8wPR6vAlVzr4ErzH8muyCNtZA5fLavBtv+1zzfFR6ZQ0Ik3rBKtSCQsvPmtaJcLimRmADfz4vCPg4570J88JD2GY79PMIn33OQr6CFQ5V1fi93pQVdocE7sGmiZlPWdZQN9L7heQA0NdBVDcTgsMAfIawAAA=","w":360,"h":450,"q":"фузилли с томленой говядиной  на 6 порций говядина 800 г бульон говяжий или куриный 500 г морковь 3 шт лук репчатый 1 шт пак чой 2 шт петрушка 8 стеблей розмарин 1 веточка тимьян 3 4 веточки лавровый лист 2 шт соевый соус 3 ст л вурстерширский соус 1 ст л оливковое масло сливочное масло 20 г черный перец крахмал кукурузный 1 ст л с горкой а также крупная паста хорошо удерживающая соус я предпочитаю фузилли 500 г чугунок или сковорода высокая форма для запекания фузилли с томленой говядиной более изящная форма макарон по флотски паста с мясным рагу одно из любимейших блюд моей семьи я повторяю его пару раз в месяц в основе масштабно упрощенный рецепт говядины по бургундски парой любая имеющаяся в данный момент паста под понятие комфортной еды попадает стопроцентно без всяких но сперва томящаяся с травами говядина наполняет дом чудесным ар","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0583_00_583_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRt4AAABXRUJQVlA4INIAAACwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JaACdIKngugw8bIMiLiHenizQR6W3W3CCCyNFkswA/s3c2jC7HrKmM6ezDy0BwbzD/edbn0N5dmPb0DKhxwMZwm9KZ2I8wPR6vAlVzr4ErzH8muyCNtZA5fLavBtv+1zzfFR6ZQ0Ik3rBKtSCQsvPmtaJcLimRmADfz4vCPg4570J88JD2GY79PMIn33OQr6CFQ5V1fi93pQVdocE7sGmiZlPWdZQN9L7heQA0NdBVDcTgsMAfIawAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">говядина 800 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бульон говяжий или куриный ~500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук репчатый 1 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">пак чой 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 8 стеблей</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">розмарин 1 веточка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 3-4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 3 ст л</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">вурстерширский соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 1 ст л с горкой</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">крупная паста, хорошо удерживающая соус - я предпочитаю фузилли 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чугунок (или сковорода+высокая форма для запекания)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Более изящная форма макарон по-флотски - паста с мясным рагу - одно из любимейших блюд моей семьи, я повторяю его пару раз в месяц. В основе - масштабно упрощенный рецепт говядины по-бургундски, парой - любая имеющаяся в данный момент паста. Под понятие комфортной еды попадает стопроцентно, без всяких “но” - сперва томящаяся с травами говядина наполняет дом чудесным ароматом, затем дымящаяся тарелка наполняет вас сытным вкусным обедом. Быстрым, конечно, не назовешь, но к счастью основную работу делает духовка, ваша же задача - купить свежее мясо и иметь в заморозке бульон. Допустимо взять уже нарезанную говядину, если доверяете продавцу (в разных магазинах разные сотрудники по-разному делают нарезку, может повезти, а может и нет). Опциональные ингредиенты отмечены красными звёздочками.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 180 градусов (режим: верх/низ, если духовка очень жарит, то установите 170).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Если купили говядину единым куском, обмыть, обсушить бумажными полотенцами, нарезать небольшими кусочками, стараясь не делать это против волокон. Если сразу купили нарезанную, то дополнительно обсушить бумажными полотенцами (это очень важный шаг, без него говядина не сможет быстро и эффективно зажариться).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Лук и морковь очистить, лук нарезать мелким кубиком, морковь - крупными кружочками. От петрушки отрезать стебли, соединить их с розмарином, тимьяном и лавровым листом с помощью нити. Разогреть бульон в маленьком сотейнике или микроволновке, если берёте из заморозки.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Чугунок или сковороду поставить на сильный огонь (у меня 7 из 9). Добавить 1 ст ложку оливкового масла и 20 г сливочного, дождаться, пока последнее растает и начнет пузыриться. Выложить кусочки говядины в один слой и обжарить с двух сторон до уверенного румянца. Не бойтесь передержать - повторюсь, нужен отчетливый румянец! Повторить столько раз, сколько потребуется. Переложить говядину в глубокую тарелку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">В то же место, где обжаривалось мясо, добавить 1 ст ложку оливкового масла, а затем лук. Обжарить его на среднем огне в течение 3-5 минут (до мягкости). Добавить морковь и продолжать обжаривать в течение 10 минут, периодически помешивая.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Если готовите в сковороде + форме для запекания, то в этой точке переложите овощи в форму и затем собирайте всё в ней.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Добавить обжаренную говядину (вместе с выделенным ею соком), всыпать кукурузный крахмал, перемешать, добавить соевый и вурстерширский соусы, поперчить, влить бульон и довести до кипения. Бульон должен покрыть все кусочки мяса и овощей, если не хватило бульона - долейте немного воды. Положить связку ароматных трав, утопить в бульоне. Накрыть крышкой (или фольгой в два слоя) и убрать в духовку на один час.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Спустя это время обмыть пак чой, крупно нарубить и добавить к говядине, перемешать и снова убрать в духовку ещё на полчаса. Если бульон сильно выкипел - снова добавить немного воды. По окончанию достать один кусочек и проверить, распадается ли мясо на волокна. Если нет, добавить ещё полчаса к приготовлению.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">В финале смешать рагу с отваренной до состояния аль денте пастой, перемешать, посыпать рубленной петрушкой и подавать!</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">🌟</i><span class=\"tx\">томленая говядина вместе с соусом отлично переносят заморозку</span></li></ul></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0583_01_584_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0583_02_585_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0583_03_586_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0583_04_587_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"449\" src=\"thumb/0583_05_588_photo.webp\" alt=\"\"></figure></div>"},"596":{"id":596,"title":"Спагетти аль лимоне","sub":"spaghetti al limone","cat":"Паста и пицца","img":"thumb/0596_00_596_photo.webp","lq":"data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAABwBQCdASoUABkAPu1srFEppaQiqAqpMB2JZgC2yYzQWzv5yheMrwfc/pKYbjq+91gGg3mgAP6x3HjXEVpjKNumF/aBTo/aMjkr7WWFtR17rWH1APfg4oVX6q0hooTE9KHQrPQvUbYTMMn/VvLPm1AVf+T7ws1M4sKtiglSCJwOihlgxBOq3D4JeLXPttEAGNbP8kZqChcgMSbLJ9/f0xHHqLxsXpYYzvL2P4bfGqqO8Bcp7tcyYyt04F53/mUPeQfblGxM/wAAAA==","w":360,"h":450,"q":"спагетти аль лимоне spaghetti al limone на 2 порции спагетти 180 г сливки 30 90 г сливочное масло 45 г лимон 1 шт пекорино романо или пармезан 60 г свежемолотый черный перец спагетти аль лимоне spaghetti al limone","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0596_00_596_photo.webp\" style=\"background:#ece5db url(
