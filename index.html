 к сожалению сделать по настоящему вкусные бургеры задача не из простых ведь как обычно бывает кажущийся простым рецепт на деле очень чувствителен к качеству продуктов и соблюдению технологии как приготовить свой первый в жизни бургер и уйти с кухни с ощущением победителя использовать технолог","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0818_00_818_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhgBAABXRUJQVlA4IAwBAADQBQCdASoUABkAPu1urlIppiQiqAgBMB2JbACsOUE88RIGz1DptDeectfbPv+ZLdDcWdGBCKnAAPfQpH5YihWq/fcEz9/Jg3pxkKzF0sArmww+MynijWjPLINeLCLGaal5PtkO0gVR84iQgnFfOTxWfMPGX5WNghsBp09PE4gEnKrrgwBJphtieDy0P6IJUn8vOrK6T7sye9iwuhI70AJDGSC3rdXzaD6MyLm6QEFA4RwHFK2p34x2hlbndMayYheoUkuYsBMrU07+n/QBIbCVSfbTPA/XMX1PFXSLUV0A/zIQn/DKvMbzZeTJ5ZcEOU2/yN/UEPdTbWr8iozfYMvGvZD1Qh2NtuCEYAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 бургера:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">фарш говяжий 300 г (в идеале — самодельный или свежесделанный у мясника, подойдет шея, лопатка и грудинка, лучший выбор — шея или смесь лопатки и грудинки)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыр 2-4 ломтика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">булочки для бургеров 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соленый огурец 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">красный лук 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">спелый помидор 1 шт</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">а также сотейник с толстым дном и пергаментная бумага</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">классический соус для гамбургеров:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/689\">майонез</a> 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кетчуп 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огуречный рассол 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горчица 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">табаско опционально</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Бургеры — еще один яркий пример еды быстрого приготовления. К сожалению, сделать по-настоящему вкусные бургеры — задача не из простых, ведь как обычно бывает, кажущийся “простым” рецепт на деле очень чувствителен к качеству продуктов и соблюдению технологии. Как приготовить свой первый в жизни бургер и уйти с кухни с ощущением победителя? Использовать технологию smash.</p>\n<p>Технология smash-бургера, как это часто бывает в гастрономии, родилась не из экспериментов, а случайно — и обрела популярность благодаря практичности и вкусу. Истоки ведут в 60-е годы в США, когда рестораны, закусочные и дайнеры искали быстрые и вкусные способы готовить бургеры на гриле. Позднее, в двухтысячных, термин smash был популяризирован сетью бургерных Smashburger, и техника быстро стала гастрономическим мейнстримом.</p>\n<p>В этом способе есть что-то освобождающее. Вместо того чтобы лепить большие аккуратные котлеты и волноваться, прожарятся ли они, не потеряют ли сок, не пересушатся ли, мы идём совсем другим путём: берём шарик фарша и с силой вдавливаем его в раскалённую поверхность. Под прессом жара и веса начинается чудо — котлета буквально прижаривается к сковороде, обретая хрустящую, тёмно-золотистую корочку по всей поверхности. Не краешек, а целиком, сплошь! Это и есть магия smash-бургера: максимальная площадь реакции Майяра, минимум лишней влаги, чистый мясной вкус. Такой бургер не просит ни сложных соусов, ни лишних украшений, он прекрасен сам по себе. Пробуем?</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Фарш разделить на 2 одинаковые порции, не разминая и не тревожа его, быстро сформировать ладонями два круглых шарика. Щедро посолить и поперчить сверху, убрать в холодильник.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Красный лук очистить и нарезать тонкими кольцами, откинуть на дуршлаг и промыть под холодной водой пару минут (это уберёт едкость). Соленый огурец нарезать тонкими кружочками, помидор - средними по толщине. Тщательно смешать все ингредиенты для соуса.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Если готовите на гриле, читайте здесь</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Булочки для бургера разрезать пополам и обжарить срез — можно сделать это на сковороде с добавлением небольшого количества сливочного масла, можно под верхним грилем от духовки (только аккуратнее, не спалите, обычно им хватает одной-двух минут). Отложить.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подготовить кусок пергаментной бумаги и сотейник с толстым дном и удобной ручкой, соль и перец. Достать фарш из холодильника. Стальную или чугунную сковороду разогреть на очень сильном огне (до дымка). Добавить каплю масла и сразу после — шар фарша на раскалённую сковороду приправленной стороной вниз. Посолить, поперчить, и вот он главный момент: положить пергамент на шар из фарша, а затем сильно, ровно прижать фарш прямо к поверхности, как будто “припечатывая”. Должна получиться широкая котлета около 1 см в толщину. Жарим, не трогаем! 1,5–2 минуты, пока низ как следует не зажарится. Убрать сотейник и пергамент, перевернуть котлету одним уверенным движением, положить сверху сыр — и жарить ещё минуту, сыр должен расплавиться.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Собираем бургер. Нижняя булочка, затем немного фрай соуса, затем котлета с сыром, сверху несколько кусочкой соленого огурца, затем один-два кусочка помидора, лук, еще немного соуса и накрываем верхней булочкой. Подаем сразу же, с картофелем фри или зеленым салатом. Вкусно? А теперь проветривать кухню 😅</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0818_01_819_photo.webp\" alt=\"\"></figure></div>"},"820":{"id":820,"title":"Маринованные стейки из говядины","sub":"для гриля или сковороды","cat":"Мясо","img":"thumb/0820_00_820_video.webp","lq":"data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JZgC7AywYYJnUL77QYME2bxyPVYQhd9b2y324L4/AAP6fug53Czzr/ultTJmFEN+x1I6/so2eI2S4W4pdjpaRks2/6LC3Cp8Bywy6TvzYZEUovkpOmLrFJxom8/fC5Ocg0ksiDvgyQktEs4/vTYosORVZqmoumLBMBVJZKVbN6dmpPWIh2AY9U+o2LhPtS0NlstM0+ZrU6t7K0sWIO0ja7/7Ydz5J/B9npGG8liz1mgtdavIpuBS9cWBMSX2v0AylNMpjcfgpwAAA","w":256,"h":320,"q":"маринованные стейки из говядины для гриля или сковороды на два стейка по 500 г оливковое масло 60 г бальзамический уксус 2 ст л соевый соус 2 ст л чеснок гранулированный 1 2 ч л семена фенхеля 1 ч л семена кориандра 1 ч л петрушка 2 ст л тимьян 6 8 веточек листья соль 1 2 ч л крупная свежемолотый черный перец маринованные стейки из говядины для гриля или сковороды ещё пару лет назад когда мы планировали какой то загородный обед и речь заходила о гриле мне в голову приходили лишь два вида мяса свинина и куриное бедро просто быстро без неожиданностей достаточное количество жира в самом мясе и внушительное количество соли в маринаде позволяли не переживать о мастерстве повара мы всё ещё покупаем ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"256\" height=\"320\" src=\"img/0820_00_820_video.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRu4AAABXRUJQVlA4IOIAAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JZgC7AywYYJnUL77QYME2bxyPVYQhd9b2y324L4/AAP6fug53Czzr/ultTJmFEN+x1I6/so2eI2S4W4pdjpaRks2/6LC3Cp8Bywy6TvzYZEUovkpOmLrFJxom8/fC5Ocg0ksiDvgyQktEs4/vTYosORVZqmoumLBMBVJZKVbN6dmpPWIh2AY9U+o2LhPtS0NlstM0+ZrU6t7K0sWIO0ja7/7Ydz5J/B9npGG8liz1mgtdavIpuBS9cWBMSX2v0AylNMpjcfgpwAAA) center/cover\" alt=\"\"><span class=\"vid\">видео</span></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на два стейка по 500 г:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">бальзамический уксус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена фенхеля 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">семена кориандра 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 6-8 веточек (листья)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1/2 ч л (крупная)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Ещё пару лет назад, когда мы планировали какой-то загородный обед и речь заходила о гриле, мне в голову приходили лишь два вида мяса: свинина и куриное бедро. Просто, быстро, без неожиданностей — достаточное количество жира в самом мясе и внушительное количество соли в маринаде позволяли не переживать о мастерстве повара. Мы всё ещё покупаем и жарим это мясо время от времени,но когда мне хочется получить настоящее наслаждение от обеда на террасе — я прошу Вилли пожарить стейки.</p>\n<p>Есть стейки, которые созданы для того, чтобы готовить их как есть — рибаю, стриплойну и вырезке нужно разве что немного соли, перца и не передержать их на огне. Однако иногда кажется неразумным тратить такие деньги на незамысловатый загородный обед. И тогда — ура! — на помощь приходит другая категория стейков: недорогие, плотные, волокнистые куски, вроде хэнгер-стейка, флэт айрона, фланка или скёрта. Их потенциал огромен, ведь мясного вкуса в них больше (помним ведь — чем больше двигалась мышца, тем сильнее в ней развит вкус?), чем в “классике” — нужно лишь немного помочь им раскрыться. И вот здесь на сцену выходит маринад.</p>\n<p class=\"lbl\">NOTES:</p></div><div class=\"note\"><i class=\"bul\">📍</i>важно помнить, что маринад — не маска и не волшебная палочка, скорее рамка, в которую мы помещаем вкус самого мяса, поэтому покупайте самое свежее и лучшее, которое можете себе позволить</div>\n<div class=\"note\"><i class=\"bul\">📍</i>нельзя держать мясо в маринаде слишком долго — под воздействием кислоты белки начинают денатурировать, мясо становится рыхлым, а после обжаривания — резиновым (24 часа — предел)</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Смешать все ингредиенты в небольшой миске с помощью венчика. Переложить каждый стейк в отдельный зип-пакет, распределить маринад и втереть его руками в стейки. Затем помыть руки, закрыть зип-пакет почти полностью, оставив с боку небольшое открытое пространство. Постараться максимально выпустить воздух через это “окошко”, затем окончательно закрыть пакет. Убрать в холодильник и мариновать от 6 до 24 часов (идеал — 12-16).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Перед обжариванием стейки нужно тщательно обсушить бумажными полотенцами и убрать с них все приправы (именно для удобства их последующего снятия мы используем цельные семена и травы, а не размолотые). По обжариванию у меня новость такая — к сожалению, я не смогу подсказать точно, сколько вам нужно будет их жарить, потому что это зависит от:</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">•</i><span class=\"tx\">вида стейка и его размера</span></li><li><i class=\"bul\">•</i><span class=\"tx\">конкретного гриля, который вы используете, и количества и уровня раскаленности углей (а может, вы вообще используете газовый).</span></li></ul>\n<p class=\"lbl\">Ориентируйтесь на:</p>\n<p>💜внешний вид стейка. (поверхность должна быть румяной, зажаристой)<br>💜текстуру стейка на ощупь (чем мягче стейк, тем менее он термически обработан)<br>💜термометр — идеальный вариант. Внутренности стейка должны быть в диапазоне от 55 до 60 градусов для прожарки medium rare (моя рекомендация) и от 65 до 70 градусов для прожарки well done (спорно, но подойдёт для тех, кто категорически не приемлет сырого мяса).</p>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Если вы обжариваете стейки на сковороде, то:</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">•</i><span class=\"tx\">только стальная или чугунная сковорода, максимально раскаленная</span></li><li><i class=\"bul\">•</i><span class=\"tx\">растительное масло</span></li><li><i class=\"bul\">•</i><span class=\"tx\">открытые окна и включенная на всю мощность вытяжка 🥲</span></li></ul>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">После обжарки переложить стейки в глубокую тарелку или кастрюлю и прикрыть крышкой, чтобы мясо “отдохнуло”, это позволит сокам внутри мяса распределиться равномерно и сделает вкус максимально насыщенным.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0820_01_821_photo.webp\" alt=\"\"></figure></div>"},"505":{"id":505,"title":"Лосось в мисо-глазировке","sub":"~25 минут","cat":"Рыба и морепродукты","img":"thumb/0505_00_505_photo.webp","lq":"data:image/webp;base64,UklGRvYAAABXRUJQVlA4IOoAAAAQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JbACdMtB7KkgPdEPF9ajeip/J8G/TM52NhHcNhCJvwAAA/c2y7iLcH6+jYV14w/empstNh+b2d1ndcx3RhSQ/4n34ojXQsc5IxVTNAfWrKnYjHnc0O+s87PwhGP41xzFB0ED0kRKIB0t6Y4IP9FRZYHDF5iYJ1lNajO03Yk+kbi7QBJKLpY7ZhmfmnmMwxtyIMDJEHiHvzK/H7UVSfn6C05toDcjK5fSP0B19wex5JagkLCXae2asBPQW7yBwYgjfHHLzBEayO/DiSw0XDIJQAAA=","w":360,"h":450,"q":"лосось в мисо-глазировке ~25 минут на 3 4 порции лосось 500 г паста мисо 30 г соевый соус 1 ст л имбирь 15 г чеснок 1 зубчик рисовый уксус 1 ст л кунжутное масло 1 ч л растительное масло 1 ч л для смазывания формы коричневый сахар 1 ст л белый перец щепотка лук резанец кунжут черный лосось в мисо глазировке 25 минут рыба в шубке из мисо великолепное решение для тех кому в рыбе не хватает насыщенности вкуса мисо встречается здесь с коричневым сахаром и соевым соусом и начинается как будто бы магия но на самом деле банальная химия реакции майяра карамелизация сахара и вот поверхность рыбы темнеет блестит становится почти лакированной и пахнет так сложносочиненно","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0505_00_505_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvYAAABXRUJQVlA4IOoAAAAQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JbACdMtB7KkgPdEPF9ajeip/J8G/TM52NhHcNhCJvwAAA/c2y7iLcH6+jYV14w/empstNh+b2d1ndcx3RhSQ/4n34ojXQsc5IxVTNAfWrKnYjHnc0O+s87PwhGP41xzFB0ED0kRKIB0t6Y4IP9FRZYHDF5iYJ1lNajO03Yk+kbi7QBJKLpY7ZhmfmnmMwxtyIMDJEHiHvzK/H7UVSfn6C05toDcjK5fSP0B19wex5JagkLCXae2asBPQW7yBwYgjfHHLzBEayO/DiSw0XDIJQAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паста мисо 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">имбирь 15 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 1 зубчик</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рисовый уксус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжутное масло 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">растительное масло 1 ч л + для смазывания формы</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук резанец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжут черный</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Рыба в “шубке” из мисо — великолепное решение для тех, кому в рыбе не хватает насыщенности вкуса. Мисо встречается здесь с коричневым сахаром и соевым соусом, и начинается как будто бы магия, но на самом деле банальная химия. Реакции Майяра + карамелизация сахара, и вот поверхность рыбы темнеет, блестит, становится почти лакированной, и пахнет так сложносочиненно, как будто вы корпели над этим блюдом не один час. Внутри при этом остается всё ещё нежный, сочный, почти кремовый лосось. Идеальный праздничный ужин в День всех влюбленных, я всё сказала.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку до 230 градусов (режим: конвекция). Лосось нарезать на порционные кусочки и тщательно обсушить бумажными полотенцами.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Металлическую форму для запекания немножко смазать растительным маслом или застелить пергаментной бумагой. Имбирь и чеснок очистить и натереть на микроплане.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В небольшой миске смешать мисо, соевый соус с пониженным содержанием соли, имбирь, чеснок, рисовый уксус, кунжутное и растительное масло, коричневый сахар и белый перец, вымешать все в однородную пасту и нанести на лосось. Имейте в виду, может понадобиться не вся получившаяся паста, наносить нужно ощутимым, но не толстым беспросветным слоем.</div></div>\n<p class=\"lbl\">Запекать следующим образом:</p>\n<ul class=\"ings\"><li><i class=\"bul\">🟣</i><span class=\"tx\">8 минут при 230 градусах, затем</span></li><li><i class=\"bul\">🟣</i><span class=\"tx\">3-4 минуты на самом сильном гриле, чтобы получить ароматную корочку. Если ваша духовка известна очень жарким нравом, убавляйте температуру до 210.</span></li></ul>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Перед подачей посыпать лосось мелко нарезанным луком резанцом, черным кунжутом или (я очень люблю) фурикаке.</div></div></div></div>"},"513":{"id":513,"title":"Ароматные жареные креветки","sub":"самый простой способ","cat":"Рыба и морепродукты","img":"thumb/0513_00_513_photo.webp","lq":"data:image/webp;base64,UklGRg4BAABXRUJQVlA4IAIBAACQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JZgCdMoMwdsWMANK4zYEkSr84JmRV0mU5oHKYEh5aspi9AhJgAP20iLpOBqX/+6x5PeI0pgH8iEX6ULwFtC2U3CiQJQBwzHEWlPPuhjiS+/prMxq0ZF4XijGU7VILu0VGZIhx39bRT0rNuPh140Glp3i3CiRiNhbRNfLRgvzwvZI+prOA3qdqLIBDqQAfQAOj3Qzm+8G2XA/y8rUa0wJKb+wlSByWFVgkelQ7kdxnsV9ettbk1L6x48CHORVRLSSOMSSzLei/w0zWh92kskMNEL90XQmG8WZBtD87lG9BK9TR3C5x+lQAAAA=","w":360,"h":450,"q":"ароматные жареные креветки самый простой способ на 6 8 порций креветки 750 г чеснок гранулированный 2 ч л паприка копчёная 2 ч л оливковое масло 2 ст л соль 1 ч л перец белый 1 2 ч л сода пищевая 1 2 ч л сливочное масло 80 г соль щепотка чеснок 2 зубчика лимон 1 шт сок и цедра петрушка горсть ароматные жареные креветки самый простой способ иногда самые выразительные блюда строятся на предельно ясной логике в случае с морепродуктами эта логика классическая жир кислота и свежая зелень сливочное масло даёт креветкам телесность и глубину лимон необходимое напряжение а петрушка финальную свежесть конечно не могу не использовать технический приём из азиатской кухни щепотку пищев","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0513_00_513_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRg4BAABXRUJQVlA4IAIBAACQBgCdASoUABkAPu1qrVCppaQiqAqpMB2JZgCdMoMwdsWMANK4zYEkSr84JmRV0mU5oHKYEh5aspi9AhJgAP20iLpOBqX/+6x5PeI0pgH8iEX6ULwFtC2U3CiQJQBwzHEWlPPuhjiS+/prMxq0ZF4XijGU7VILu0VGZIhx39bRT0rNuPh140Glp3i3CiRiNhbRNfLRgvzwvZI+prOA3qdqLIBDqQAfQAOj3Qzm+8G2XA/y8rUa0wJKb+wlSByWFVgkelQ7kdxnsV9ettbk1L6x48CHORVRLSSOMSSzLei/w0zWh92kskMNEL90XQmG8WZBtD87lG9BK9TR3C5x+lQAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6-8 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">креветки 750 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка копчёная 2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 2 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец белый 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода пищевая 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль щепотка</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (сок и цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Иногда самые выразительные блюда строятся на предельно ясной логике. В случае с морепродуктами эта логика классическая: жир, кислота и свежая зелень. Сливочное масло даёт креветкам телесность и глубину, лимон — необходимое напряжение, а петрушка — финальную свежесть.</p>\n<p>Конечно, не могу не использовать технический приём из азиатской кухни: щепотку пищевой соды в маринаде, которая повышает pH поверхности, помогает удерживать влагу и делает текстуру креветки более упругой, почти бархатной. Но напомню, как важно соблюдать меру, здесь работает принцип “меньше — лучше”.</p>\n<p>Теперь о нюансах. Креветки обязательно обсушить, чтобы они именно жарились, а не тушились. Готовить небольшими партиями и строго в один слой — иначе температура сковороды будет падать, и вместо румяной поверхности будет образовываться лишняя влага. И, уже не первый раз говорю про это, но главный ориентир — форма: во время жарки креветка должна остаться в изгибе С, в плотную О она свернётся уже от остаточного тепла, в самом финале. Следите!</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Креветки очистить (если нужно) и хорошо обсушить бумажными полотенцами — это правда важно, не пренебрегайте. Особенно если креветки вы предварительно размораживали. Сложить в миску, смешать с оливковым маслом, гранулированным чесноком, копчёной паприкой, солью, белым перцем и содой. Оставить на 15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Чеснок очистить и мелко натереть. С лимона снять цедру и выжать сок, отложить. Петрушку вымыть, обсушить и очень мелко нарубить.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Хорошо разогреть широкую сковороду. Выложить креветки в один слой и обжарить по 20–30 секунд с каждой стороны. Они должны только-только порозоветь и слегка закрутиться — не больше. На указанное количество креветок получится 3 партии. Переложить всё в миску.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Убавить огонь под сковородой, добавить сливочное масло, дать ему растаять. Добавить мелко натёртый чеснок, следом вернуть креветки, добавить цедру и сок лимона, аккуратно перемешать, чтобы соус обволок каждую. В самом конце — рубленая петрушка.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Сразу же подавать. Горячими, сочными, с тем самым соусом на дне тарелки.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Ну и чтобы два раза не вставать расскажу, как сделать из этого блюда идеальную пасту: делим ингредиенты на два, в финале добавляем в сковороду к креветкам свежесваренную пасту (идеально подойдет лингвини) и немного “бульона” от варки пасты, несколько раз интенсивно встряхиваем сковородку, создавая эмульсию — и вуаля, наслаждаемся!</div></div></div></div>"},"581":{"id":581,"title":"Фишкейки","sub":"лососевый минимализм","cat":"Рыба и морепродукты","img":"thumb/0581_00_581_photo.webp","lq":"data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABwBgCdASoUABkAPu1osFAppaSiqAqpMB2JbACdMoSAKN2bK4iKZ5JOozdL3d3REgE0w5YUV6ukKJwHFgAA/q1CpsrGxkbDKmoyWR+b/mEDzkys5lkk0QjsKGSNEJ430/2JlppIXZRMvGC3N92Z8Ujrtgweb02+2p2mL6Ej3+duGNeexiv4GB6njHPlpx1DjEIpds3JIdsSWPzVSaLj78mL2wEg0zHR6Yd29ZUxdLgunBXza2Zttqmy8SLOXjdMGeyqG2iIbvJxKG5dylXyKKrWulFtCDkelEbmlC30o5FUDcpLw9ftRwBw528KwLnow6qFc9BphvgAAA==","w":360,"h":450,"q":"фишкейки лососевый минимализм на 3 4 порции филе лосося 500 г оливковое масло 1 ст л желток 1 шт майонез 30 г петрушка 1 ст л укроп 1 ст л соль белый перец лимонная цедра для подачи фишкейки лососевый минимализм","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0581_00_581_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAABwBgCdASoUABkAPu1osFAppaSiqAqpMB2JbACdMoSAKN2bK4iKZ5JOozdL3d3REgE0w5YUV6ukKJwHFgAA/q1CpsrGxkbDKmoyWR+b/mEDzkys5lkk0QjsKGSNEJ430/2JlppIXZRMvGC3N92Z8Ujrtgweb02+2p2mL6Ej3+duGNeexiv4GB6njHPlpx1DjEIpds3JIdsSWPzVSaLj78mL2wEg0zHR6Yd29ZUxdLgunBXza2Zttqmy8SLOXjdMGeyqG2iIbvJxKG5dylXyKKrWulFtCDkelEbmlC30o5FUDcpLw9ftRwBw528KwLnow6qFc9BphvgAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3–4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">филе лосося 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желток 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">майонез 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонная цедра для подачи</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 220 градусов (режим: конвекция).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лосось выложить на смазнный оливковым маслом металлический противень и запекать 8-10 минут. Он должен едва приготовиться: стать матовым снаружи, но сохранить сочность внутри.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Дать рыбе немного остыть, затем разобрать руками на волокна и промять, чтобы получилось подобие фарша.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Добавить желток, майонез, мелко нарезанную зелень, соль и белый перец. Аккуратно перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Сформировать небольшие шарики размером с грецкий орех и слегка приплюснуть.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Хорошо разогреть сковороду. Обжарить фишкейки на среднем огне до румяной корочки, примерно по 2 минуты с каждой стороны.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Дать постоять пару минут перед подачей, посыпать зеленью и лимонной цедрой.</div></div></div></div>"},"597":{"id":597,"title":"Фритто мисто из морепродуктов","sub":"fritto misto di mare","cat":"Рыба и морепродукты","img":"thumb/0597_00_597_photo.webp","lq":"data:image/webp;base64,UklGRjQBAABXRUJQVlA4ICgBAAAQBgCdASoUABkAPu1qr1AppiSiqAqpMB2JbACdMyX87qAGx+G+VEHCK9jzJ2Cz+QIgcbblmhWc4QAA/pT3LHM4MJ8A059tsCyHKIW9+ux9OEyrPJKFSYaFgz6kCyd4pYfukD5B6O9NgmqqOy46lKDXov0T4VDBFx6yPs9Ukb1CAc23tgDIFyksUPJ4vRCwFyqJB1XkR3/Kzt1SaChFVOyUyL+/nB9u+t9MczqRkc+Aw8pF9dIM2lh2oCDU5VZXWBhpLvGLVzeIANIQHAc7j5YFLcZDOBfX9OVHzXmdB0QgdySiIGmI8Bhm8A3c4ai/jU83WH8h5QIr0xhocf0iMOY9YitHGCG2jZ+byFxtUNSsSnHbbmAAFWc7Xyjbr8CduwZrfAmrVkAAAA==","w":360,"h":450,"q":"фритто мисто из морепродуктов fritto misto di mare на 4 порции треска 350 г кальмары 350 г креветки очищенные 350 г цуккини 1 шт для панировки мука 100 г мука семолина 200 г масло рафинированное без запаха подсолнечное рапсовое или арахисовое 1 1 5 л важные правила работы с фритюром прежде мы приступим к рецепту хорошо обсушите морепродукты это пожалуй самое важное правило после нарезки обязательно ещё раз тщательно промокните их бумажными полотенцами лишняя влага мешает панировке держаться вызывает активное разбрызгивание масла и не даёт получить ту самую тонкую хрустящую корочку используйте кухонный термометр фритюр очень не любит работу на глаз оптимальная температура масла 180 185 градусов минимум 175 градусов именно при такой температуре панировка мгновенно схватывается остаётся лёгкой и хрустящей а морепродукты не успевают пересохнуть перед каждой новой партией снова проверяйте температуру масла холодные морепродукты неизбежно охла","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0597_00_597_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRjQBAABXRUJQVlA4ICgBAAAQBgCdASoUABkAPu1qr1AppiSiqAqpMB2JbACdMyX87qAGx+G+VEHCK9jzJ2Cz+QIgcbblmhWc4QAA/pT3LHM4MJ8A059tsCyHKIW9+ux9OEyrPJKFSYaFgz6kCyd4pYfukD5B6O9NgmqqOy46lKDXov0T4VDBFx6yPs9Ukb1CAc23tgDIFyksUPJ4vRCwFyqJB1XkR3/Kzt1SaChFVOyUyL+/nB9u+t9MczqRkc+Aw8pF9dIM2lh2oCDU5VZXWBhpLvGLVzeIANIQHAc7j5YFLcZDOBfX9OVHzXmdB0QgdySiIGmI8Bhm8A3c4ai/jU83WH8h5QIr0xhocf0iMOY9YitHGCG2jZ+byFxtUNSsSnHbbmAAFWc7Xyjbr8CduwZrfAmrVkAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">треска 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кальмары 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">креветки очищенные 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">цуккини 1 шт</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для панировки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука семолина 200 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло рафинированное без запаха, подсолнечное, рапсовое или арахисовое 1-1,5 л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">Важные правила работы с фритюром, прежде мы приступим к рецепту:</p><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Хорошо обсушите морепродукты. Это, пожалуй, самое важное правило. После нарезки обязательно ещё раз тщательно промокните их бумажными полотенцами. Лишняя влага мешает панировке держаться, вызывает активное разбрызгивание масла и не даёт получить ту самую тонкую хрустящую корочку.</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Используйте кухонный термометр. Фритюр очень не любит работу “на глаз”. Оптимальная температура масла: 180–185 градусов (минимум — 175 градусов). Именно при такой температуре панировка мгновенно схватывается, остаётся лёгкой и хрустящей, а морепродукты не успевают пересохнуть.</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Перед каждой новой партией снова проверяйте температуру масла. Холодные морепродукты неизбежно охлаждают фритюр, поэтому между партиями дайте маслу снова прогреться до рабочей температуры.</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Не перегружайте посуду. Жарьте небольшими партиями. Если положить слишком много продуктов одновременно, температура масла резко упадёт, и вместо лёгкой золотистой оболочки вы получите тяжёлую, впитавшую масло панировку.</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">🔘</i><span class=\"tx\">Не бойтесь сильного нагрева. Я жарила практически на максимальной мощности — 8 из 9 на моей плите. Сначала я переживала, что это слишком интенсивно, но только так удавалось поддерживать стабильные 180–185 градусов и получить настоящее fritto misto: тонкую хрустящую корочку снаружи и сочные, нежные морепродукты внутри.</span></li></ul></div></div></aside><div class=\"main\"><p>(составляющие фритто мисто целиком зависят от ваших предпочтений и возможностей, я лишь предлагаю свое видение)</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Креветки очистить (если необходимо), удалить кишечную вену. Кальмаров нарезать кольцами толщиной около сантиметра. Треску обсушить и нарезать кусочками размером примерно 3×4 см.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Самый важный этап: все морепродукты должны быть максимально сухими. После нарезки ещё раз тщательно промокните их бумажными полотенцами.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Смешать два вида муки. Небольшими порциями обвалять морепродукты в панировке, затем переложить в большое сито и несколько раз хорошо встряхнуть. Излишки должны осыпаться — панировка должна быть почти невидимой вуалью</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Если у вас есть вок — поздравляю, он идеально подходит для этого блюда. Если нет, то возьмите кастрюлю или сковороду с высокими стенками и налейте достаточное количество масла, чтобы рыба и морепродукты могли равномерно обжариваться со всех сторон. Разогреть масло до 175-180 градусов (термометр очень поможет!). Подготовить поднос или противень, застеленный бумажными полотенцами.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Жарить небольшими партиями, по очереди:</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">•</i><span class=\"tx\">сначала цуккини (им понадобится около 3-4 минут)</span></li><li><i class=\"bul\">•</i><span class=\"tx\">затем треску (2-3 минуты)</span></li><li><i class=\"bul\">•</i><span class=\"tx\">кальмары (1-2 минуты)</span></li><li><i class=\"bul\">•</i><span class=\"tx\">и наконец креветки (не дольше 1 минуты)</span></li></ul>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Еще раз повторю: не перегружайте кастрюлю — температура масла не должна резко падать!</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Готовые морепродукты перекладывать на бумажные полотенца, сразу же солить мелкой солью (горячий фритюр идеально впитывает соль и нейтрализует “жирный” вкус, поэтому не забывайте!)</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Подавать немедленно, с большим количеством лимона.</div></div></div></div>"},"598":{"id":598,"title":"Поке с лососем","sub":"и соусом понзу","cat":"Рыба и морепродукты","img":"thumb/0598_00_598_photo.webp","lq":"data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAADQBQCdASoUABkAPu1qsFAppaSiqAqpMB2JagCdA/AGQEnf3Mc52E0kIn6XtNxSkyXJCzefXxMAAP6tJaupACsvdz4cB9VO7DHnX/N5BmzWpF/wdhI+qYHXlhaEQFfI2QEWOOGuKyRAw5ykOvURZ1irT0Ch4gZMyFknxsOyaAiP2hjUVZiy6XnjdedHO3dAUExanwZT5gBC5f2dmjhOoKn+r65OnuI3QdvNQa7+7UeHG2lV13OWKY8Qc1/y8sWqwHfNc3pwV8GD0i3eTw4UcOYB+tS9b3KGxm5nPXd+P5ynT6J2MWJ8JvnJxL+Lac+CPAlQBQirqSAAAA==","w":360,"h":449,"q":"поке с лососем и соусом понзу на 2 порции рис для суши 180 г лосось 250 г огурец 1 шт морковь 2 шт маленькие авокадо 1 шт водоросли чука вакаме 100 г эдамаме 60 г лук зеленый 2 3 пера кунжут черный щепотка для соуса понзу соевый соус 60 г лайм 1 шт сок 30 г рисовый уксус 20 г мирин 1 ст л белый перец поке с лососем и соусом понзу","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0598_00_598_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgQBAABXRUJQVlA4IPgAAADQBQCdASoUABkAPu1qsFAppaSiqAqpMB2JagCdA/AGQEnf3Mc52E0kIn6XtNxSkyXJCzefXxMAAP6tJaupACsvdz4cB9VO7DHnX/N5BmzWpF/wdhI+qYHXlhaEQFfI2QEWOOGuKyRAw5ykOvURZ1irT0Ch4gZMyFknxsOyaAiP2hjUVZiy6XnjdedHO3dAUExanwZT5gBC5f2dmjhOoKn+r65OnuI3QdvNQa7+7UeHG2lV13OWKY8Qc1/y8sWqwHfNc3pwV8GD0i3eTw4UcOYB+tS9b3KGxm5nPXd+P5ynT6J2MWJ8JvnJxL+Lac+CPAlQBQirqSAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 2 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">рис для суши 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">огурец 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 2 шт маленькие</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">авокадо 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">водоросли чука (вакаме) 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">эдамаме 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук зеленый 2-3 пера</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кунжут черный щепотка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса понзу:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лайм 1 шт (сок) ~30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">рисовый уксус 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мирин 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Рис тщательно промыть в холодной воде до прозрачности, затем сварить согласно этой инструкции.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лосось нарезать кубиками размером около 1,5-2 см. Смешать все ингредиенты для соуса понзу, добавить 2-3 столовые ложки к рыбе, перемешать и оставить мариноваться на 15-20 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Тем временем подготовить остальные ингредиенты. Огурец нарезать тонкими кружочками, морковь — длинными тонкими лентами при помощи овощечистки. Авокадо разрезать пополам, удалить косточку и нарезать тонкими ломтиками. Эдамаме отварить согласно инструкции и очистить от стручков, если это необходимо (замороженный просто залить кипятком и оставить на несколько минут). Зеленый лук тонко нарезать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Разложить рис по двум глубоким тарелкам. Сверху отдельными секторами выложить маринованный лосось, огурцы, морковь, авокадо, чуку и эдамаме.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Полить поке оставшимся соусом (количество определяйте сами), посыпать зеленым луком и черным кунжутом. Подавать сразу.</div></div></div></div>"},"608":{"id":608,"title":"Белая рыба","sub":"с соусом бер блан","cat":"Рыба и морепродукты","img":"thumb/0608_00_608_photo.webp","lq":"data:image/webp;base64,UklGRtIAAABXRUJQVlA4IMYAAADQBQCdASoUABkAPu1usFIppiSiqAgBMB2JZgCdMtPzGCFaRtsVHMNkszvqHSe/zsWnteyIGVVgAPHb5B4m80alhp5jfNdp+ifdd7OJEWyvi8QKrHlQ0mwCSSrX25QHmJiHR0zVjE0gmMBoLDFoooic17n3yjW0izyWzH1d0DB12CM1iiw3h2gZXfxq7NBAIX5S4IhTuQNSTuHwp9UH/YbKJ5QP//99ZQqnf/Ja1AJX9937DRiRlhloe4UZVxwgBNANgKgAAAA=","w":360,"h":450,"q":"белая рыба с соусом бер блан на 4 порции треска 600 г масло оливковое 1 ст л соль белый перец для соуса beurre blanc сливочное масло 190 г сливки 60 г белое вино 50 г уксус белый винный 25 г лук шалот 1 шт соль белый перец каперсы мелкие 1 ст л петрушка 1 ст л белая рыба с соусом бер блан сегодняшний рецепт для тех кому хочется поужинать быстро но при этом как будто в парижском бистро широко известный ныне французский соус beurre blanc родился не на кухне модного ресторана а в скромном доме на берегах луары и как это часто бывает почти случайно история рассказывает о том что повар собирался приготовить соус беарнез усложнённую версию голландез","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0608_00_608_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRtIAAABXRUJQVlA4IMYAAADQBQCdASoUABkAPu1usFIppiSiqAgBMB2JZgCdMtPzGCFaRtsVHMNkszvqHSe/zsWnteyIGVVgAPHb5B4m80alhp5jfNdp+ifdd7OJEWyvi8QKrHlQ0mwCSSrX25QHmJiHR0zVjE0gmMBoLDFoooic17n3yjW0izyWzH1d0DB12CM1iiw3h2gZXfxq7NBAIX5S4IhTuQNSTuHwp9UH/YbKJ5QP//99ZQqnf/Ja1AJX9937DRiRlhloe4UZVxwgBNANgKgAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">треска 600 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло оливковое 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для соуса beurre blanc:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 190 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белое вино 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый винный 25 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук шалот 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы мелкие 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 1 ст л</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Сегодняшний рецепт для тех, кому хочется поужинать быстро, но при этом как будто в парижском бистро.</p>\n<p>Широко известный ныне французский соус beurre blanc родился не на кухне модного ресторана, а в скромном доме на берегах Луары, и, как это часто бывает, почти случайно. История рассказывает о том, что повар собирался приготовить соус беарнез (усложнённую версию голландеза), но забыл про яйца. Остались вино, уксус, шалот и много сливочного масла — так и появился соус бер блан.</p>\n<p>✍️ Beurre blanc — это эмульсия, то есть система, в которой жир (сливочное масло) распределяется в водной фазе (вино + уксус + соки шалота). Однако в отличие от майонеза или голландеза, здесь нет “страхующих” эмульгаторов — ни желтка, ни горчицы, ни крахмала. Всё держится на хрупком балансе: температуре, размере жировых капель и постоянном движении. Вот почему масло в соус нужно добавлять холодным, маленькими кусочками и постепенно. Пока кусочек тает, вы механически вмешиваете жир в жидкость, разбивая его на мельчайшие капли. Если добавить всё сразу или перегреть — жир просто отделится, и соус (парам парам пам!) будет жирным и плоским.</p>\n<p>Сливки в этом смысле — маленькая профессиональная хитрость. Это не канон (в классическом beurre blanc их нет), но они добавляют системе стабильности: за счёт молочных белков и дополнительной эмульсии соус становится более устойчивым и прощает небольшие ошибки.</p>\n<p>Большой плюс соуса бер блан в том, что он крайне вариантивен. Его можно процедить и получить идеально бархатный белый соус, а можно делать добавки — каперсы, петрушку, укроп или, например, красную икру, для особого праздничного обеда. Рыба здесь может быть практически любая — не обязательно треска и даже не обязательно белая, хотя на мой взгляд именно с белой рыбой баланс получается особенно точным: нежность, деликатный вкус и кисленький шелковистый соус.</p>\n<p>заметки на полях</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Филе достать из холодильника примерно за 20-30 минут, нарезать на порционные кусочки и очень тщательно обсушить бумажным полотенцем. Отставить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Каперсы промыть и обсушить, петрушку промыть, обсушить и мелко нарубить. Очень холодное сливочное масло нарезать на небольшие кусочки. Лук шалот очистить и нарезать мелким-мелким кубиком. В сотейнике соединить белое вино, уксус и шалот, довести до кипения и уварить почти полностью, должны остаться кусочки лука в совсем небольшом количестве жидкости.<br>TIP: параллельно я ставлю на небольшой огонь сковородку для последующего обжаривания рыбы, чтобы она успела должным образом нагреться.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Добавить к луку сливки, довести их до кипения и тоже уварить примерно на треть. Убавить огонь до минимума и начать добавлять холодное сливочное масло небольшими кусочками, постоянно помешивая венчиком. Когда соус станет гладкой блестящей эмульсией, выключить нагрев, хорошо посолить и добавить щепотку белого перца.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Филе рыбы хорошо посолить и поперчить, смазать с обеих сторон оливковым маслом с помощью кисточки. Тщательно разогреть небольшую сковороду на средне-сильном огне, выложить рыбу и обжаривать, не трогая, до уверенной золотистой корочки. Затем аккуратно перевернуть и довести до готовности с другой стороны. Важно: треска готовится молниеносно, если у вас качественная сковорода и стабильный средне-сильный огонь, нужно ориентироваться примерно на минуту-полторы с каждой стороны. Филе может казаться немного прозрачным внутри, когда вы будете перекладывать его на тарелку, но не переживайте — остаточное тепло доготовит рыбу.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Добавить к соусу промытые каперсы и мелко нарезанную петрушку, аккуратно перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Подавать сразу: румяную рыбу выложить на тарелку и щедро полить соусом. Он будет красиво стекать по корочке, собираясь внизу — и это, пожалуй, самая вкусная часть.</div></div></div></div>"},"632":{"id":632,"title":"Запеченная треска","sub":"с артишоками, оливками, каперсами и соусом gremolada","cat":"Рыба и морепродукты","img":"thumb/0632_00_632_photo.webp","lq":"data:image/webp;base64,UklGRjgBAABXRUJQVlA4ICwBAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMtCAH6rF/sECpzS1HLKZGrBpJ50NV+/ZfqTOGikR2wAA/qatS/+X0Jyp2jXmxfjCmlctTAgdkxG44i+DgNcSD/mAOqrbK0DuZ/fUXN3TUffCy846lT3iPvyfqvMp3wc/9qjydAP1s2nRMYHkud66cZAH0Qb/HpI1MKWIWu89cKAtDd76TPZW8RuJFBfAu7ggygn14BY5r9yAVsqm/qeQbPVDzfE6oqH9I1O+sbpxLzfbXUPsMZTs8Sc5jSK+37RbQf/ah0EloS99JiVMmeMJxov1I3psobeNE/bPt2G5tAAIjMRm1xsn1uWh2LCdaRM5VzohI8bwasrUMZ21ESjX4dk4osWGClXD87Cm0HcMAAA=","w":360,"h":450,"q":"запеченная треска с артишоками, оливками, каперсами и соусом gremolada на 4 порции треска 400 г 4 филе помидоры черри 300 г артишоки в масле 200 г сладкий перец желтый 1 шт лук шалот 1 шт оливки каламата 70 г каперсы 30 г орегано или заатар 1 ст л сумах 1 2 ч л петрушка горсть 2 ст л нарезанной чеснок 2 зубчика лимон 1 шт цедра от всего и сок от половинки оливковое масло соль белый перец запеченная треска с артишоками оливками каперсами и соусом gremolada 40 минут я всегда очень внимательно читаю анкеты с обратной связью которые вы спасибо заполняете в конце каждого месяца и постоянно вижу там просьбу которую не могу выполнить больше рецептов рыбы я воспринимаю её болезненно и вот почему в гастрономии есть одно железобетонное правило готовь из хороших продуктов и ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0632_00_632_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRjgBAABXRUJQVlA4ICwBAABwBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACdMtCAH6rF/sECpzS1HLKZGrBpJ50NV+/ZfqTOGikR2wAA/qatS/+X0Jyp2jXmxfjCmlctTAgdkxG44i+DgNcSD/mAOqrbK0DuZ/fUXN3TUffCy846lT3iPvyfqvMp3wc/9qjydAP1s2nRMYHkud66cZAH0Qb/HpI1MKWIWu89cKAtDd76TPZW8RuJFBfAu7ggygn14BY5r9yAVsqm/qeQbPVDzfE6oqH9I1O+sbpxLzfbXUPsMZTs8Sc5jSK+37RbQf/ah0EloS99JiVMmeMJxov1I3psobeNE/bPt2G5tAAIjMRm1xsn1uWh2LCdaRM5VzohI8bwasrUMZ21ESjX4dk4osWGClXD87Cm0HcMAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">треска 400 г (4 филе)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">помидоры черри 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">артишоки в масле 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сладкий перец желтый 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-шалот 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливки каламата 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">орегано или заатар 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сумах 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть (2 ст л нарезанной)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 2 зубчика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (цедра от всего и сок от половинки)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>~ 40 минут</p>\n<p>Я всегда очень внимательно читаю анкеты с обратной связью, которые вы (спасибо!) заполняете в конце каждого месяца, и постоянно вижу там просьбу, которую не могу выполнить: больше рецептов рыбы. Я воспринимаю её болезненно, и вот почему.</p>\n<p>В гастрономии есть одно железобетонное правило: готовь из хороших продуктов — и будет вкусно. Простая истина, которую любят забыть в надежде, что “и так сойдёт”. На мой, в гастрономическом плане достаточно максималистский взгляд, по-настоящему вкусна белая рыба бывает лишь там, где её путь от моря до тарелки занял не больше половины дня. В таком случае ей нужно лишь чуть соли, хорошее оливковое масло (или <a class=\"xref\" href=\"#/r/656\">бёр-нуазетт</a>) и лимон, всё. Там, где есть хороший продукт, часто даже не нужен рецепт.</p>\n<p>И всё же вы просили, а мне нравится, когда вы довольны, так что я, памятуя о своем способе запекать здесь в Германии речную форель (с помидорами черри), решила выкрутить тот свой рецепт на максимум, по-хорошему его усложнить и усовершенствовать. Купила самую безопасную в кулинарном плане белую рыбу и поместила ее в красочные средиземноморские декорации, а чтобы обезопасить себя в плане вкуса сделала к ней еще и соус из оливкового масла, лимона, петрушки и чеснока. Получилось невероятно хорошо, муж попросил внести в постоянный рацион. Такие вот бонусы от ваших просьб!</p></div><div class=\"note\"><i class=\"bul\">📍</i>TIP: если купить помидоры черри на длинных веточках, можно разрезать их на четыре части и выкладывать в противень как есть — будет красивая сервировка</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Филе трески (я купила заморозку и переложила с вечера в холодильник) замариновать в оливковом масле с солью, белым перцем и щепоткой сумаха — пусть постоит, пока готовятся овощи.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Духовку разогреть до 230 градусов (режим: конвекция). Лук шалот очистить и нарезать на тонкие дольки, помидоры черри обмыть и нарезать на половинки, сладкий перец обмыть, очистить от семян и нарезать перышками.</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">На всякий случай уточню, что сладкий перец не присутствовал в изначальном рецепте, но грустно смотрел на меня увядающим взглядом, а потому отправился за компанию, и в итоге прекрасно подошел, но если что имейте ввиду, он опционален.</span></li></ul>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">С артишоков слить масло, оливки и каперсы хорошо промыть прохладной водой и немного обсушить. В противень выложить лук, артишоки, черри, сладкий перец, оливки и каперсы, приправить орегано, сбрызнуть оливковым маслом, посолить, поперчить, тщательно промешать руками и отправить в духовку на 10 минут. Достать, немного раздвинуть овощи и аккуратно положить поверх филе трески. Вернуть в духовку (температуру убавить до 210 градусов) ещё на 10 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">В это время сделать соус: смешать 3 ст. л. оливкового масла с чесноком, натёртым на микроплане, лимонной цедрой, соком половины лимона, мелко нарезанной петрушкой, солью и белым перцем. Перед подачей щедро выложить соус поверх рыбы.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Подавать немедленно, в качестве гарнира прекрасно подойдет простой отварной картофель со сливочным маслом и петрушкой или ароматный жасминовый рис.</div></div></div></div>"},"804":{"id":804,"title":"Печёный картофель","sub":"с лососем и зеленым тахини","cat":"Рыба и морепродукты","img":"thumb/0804_00_804_photo.webp","lq":"data:image/webp;base64,UklGRvwAAABXRUJQVlA4IPAAAACQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACxHzLwDngG9I4CTvLGqg3gTb9bqo+D3iP+3giyfRZOqoQAAP7Z9Z2QRpxc/OjGajJIFqVrF8y5kuzsdRfRWqEXjRIvi8qEAXdDDVM0eIVyjoUNE4XQa7+UKBEupitUUgNMdtR4xtXck7L6WO1F8vuW7Qwao96mZ7sLwoKNmNqITuQ2+8sXsg+Kuxlod/HdkpK++dgqQm2dQMV6GiBthdJFqevQrVLPKt3vDkkHgAEoXVDvatRXs/aF12eq93GMwx6SgZtF2dY8h+9WNAQmGBx5TsgAAAA=","w":360,"h":450,"q":"печёный картофель с лососем и зеленым тахини на 3 4 порции картофель крупный 4 шт лосось 400 г каперсы 4 ч л оливковое масло соль перец лимон укроп зеленый тахини мята 15 веточек петрушка 15 веточек чеснок гранул 1 4 ч л лимон 1 шт сок 50 г кумин 1 ч л тахини 100 г вода теплая 80 г соль 1 2 ч л перец печёный картофель с лососем и зеленым тахини прежде чем мы начнём ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0804_00_804_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRvwAAABXRUJQVlA4IPAAAACQBgCdASoUABkAPu1qq1EppaOiqAqpMB2JbACxHzLwDngG9I4CTvLGqg3gTb9bqo+D3iP+3giyfRZOqoQAAP7Z9Z2QRpxc/OjGajJIFqVrF8y5kuzsdRfRWqEXjRIvi8qEAXdDDVM0eIVyjoUNE4XQa7+UKBEupitUUgNMdtR4xtXck7L6WO1F8vuW7Qwao96mZ7sLwoKNmNqITuQ2+8sXsg+Kuxlod/HdkpK++dgqQm2dQMV6GiBthdJFqevQrVLPKt3vDkkHgAEoXVDvatRXs/aF12eq93GMwx6SgZtF2dY8h+9WNAQmGBx5TsgAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель крупный 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лосось 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">каперсы 4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">укроп</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">зеленый тахини:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мята 15 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 15 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранул. 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1 шт (сок, ~50 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кумин 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тахини 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода теплая 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">прежде чем мы начнём:</p></div><div class=\"note\"><i class=\"bul\">📍</i>картофель выбирайте крупный (весом каждый около 200-250 грамм) с большим содержанием крахмала, то есть тот, что для пюре</div>\n<div class=\"note\"><i class=\"bul\">📍</i>этот текст — всего лишь основа и ориентир) вы можете собирать luxury-версию Крошки-Картошки на свой вкус, можно добавлять любой белок или клетчатку: курицу, говядину, индейку, белую рыбу, креветки, сыры, тофу, грибы и так далее, и так далее</div>\n<div class=\"note\"><i class=\"bul\">📍</i>если вам не очень нравится кунжут, тахини в рецепте прекрасно заменяется греческим йогуртом или сметаной</div>\n<div class=\"note\"><i class=\"bul\">📍</i>а если вообще нет времени и сил готовить соус, меня всегда выручает тот же греческий йогурт или сметана, куда я добавляю немного гранулированного чеснока, ложку соевого соуса, мелко нарубленную зелень и/или любую приправу по настроению</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 200 градусов (режим: конвекция, если конвекции нет, то 220 градусов). Картофель тщательно вымыть и обсушить, наколоть вилкой каждый клубень со всех сторон, обмазать оливковым маслом, присыпать солью и перцем, выложить на противень и отправить в духовку примерно на 50 минут. Проверяйте готовность с помощью ножа, он должен легко протыкать картофель.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">С мяты и петрушки оборвать листочки, обмыть и обсушить, затем сложить в высокий стакан или чашу мини-комбайна. Туда же добавить тахини, лимонный сок, чеснок, кумин, воду, соль и перец, пробить до однородности и убрать в холодильник до сервировки.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">За 15 минут до готовности картофеля на другом уровне духовки разместить противень с филе лосося. Я использую замороженный: предварительно перекладываю на ночь в холодильник, затем обмываю и очень тщательно обсушиваю бумажными полотенцами. Не солю и не перчу, просто запекаю в течение 10-15 минут (в зависимости от толщины филе).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">На готовом картофеле сделать надрез крест-накрест, развернуть и немного надавить пальцами на клубень, “сломав мякоть”. Взбить внутренности с помощью вилки, положить кусочек сливочного масла, посолить, затем столовую ложку зеленого тахини. Сверху выложить разорванное вилкой филе лосося, полить лимонным соком, затем снова зеленым тахини. Сверху — промытые под водой каперсы (по 1 чайной ложке на каждую картофелину, или меньше/больше на ваш вкус). Укроп или другая любая зелень и свежемолотый чёрный перец— в завершении. Наслаждайтесь!</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0804_01_805_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0804_02_806_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0804_03_807_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0804_04_808_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0804_05_809_photo.webp\" alt=\"\"></figure></div>"},"629":{"id":629,"title":"Овощи и сосиски","sub":"обед для тех, кто не любит готовить","cat":"Овощи и гарниры","img":"thumb/0629_00_629_photo.webp","lq":"data:image/webp;base64,UklGRkABAABXRUJQVlA4IDQBAABQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMoMemRhbaI3gYwBnVFd+L+CpYjBzBt9jAO1oMz+PAAD+3JnTEbTtq5NdBqgh4l7Zm8alWOlHZ4rXSF9osrElopjxwN06mWIueruDarXfLlC5TCHc2mkbTH9I/O+jag9aS/gEQ+3Ox8OjaUE69uZKvXKs2slLF1SrFE0BOC8rS+hAJNPWDR5fAGQS1bppxxkFsjajF0Dlgeysp6C/jD5Z1wBesb+SaznuZ77nhrh8PKV0E4rq2dQMA8YeVa9vwhp5wj5n3mOlO9M7iX97BmcFfVqNLUSyOLQEX+/5ZrLHgFgFWbm+sU7NtegYb1EZirxIm+6KJQvKnU45QqtwjpTOVSG8MguAw137S7QkJv5MKNxLSFfCyMgAAA==","w":360,"h":449,"q":"овощи и сосиски обед для тех, кто не любит готовить на 3 4 порции сосиски куриные 500 г картофель средний 3 шт брокколи 150 г сладкий перец 2 шт красный и желтый морковь 2 шт кабачок 1 2 шт лук шалот 2 шт оливковое масло 40 г паприка хлопья 1 ч л чеснок гранулированный 1 2 ч л соевый соус 1 ст л уксус белый винный 1 ст л куркума 1 4 ч л тимьян 6 8 веточек свежемолотый черный перец пармезан петрушка для подложки греческий йогурт 150 г лимон 1 2 шт цедра петрушка горсть соль белый перец овощи и сосиски обед для тех кто не любит готовить 50 минут 20 минут активного времени я выросла в россии девяностых а теперь живу в германии поэтому как бы отчаянно диетологи не трубили про вред сосисок время от времени они лежат в моем холодильнике моя позиция такова нет плохой еды есть неумеренное потребление и сосиски это не грех а инструмент и удовольствие если они вписаны в п","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"799\" src=\"img/0629_00_629_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRkABAABXRUJQVlA4IDQBAABQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JbACdMoMemRhbaI3gYwBnVFd+L+CpYjBzBt9jAO1oMz+PAAD+3JnTEbTtq5NdBqgh4l7Zm8alWOlHZ4rXSF9osrElopjxwN06mWIueruDarXfLlC5TCHc2mkbTH9I/O+jag9aS/gEQ+3Ox8OjaUE69uZKvXKs2slLF1SrFE0BOC8rS+hAJNPWDR5fAGQS1bppxxkFsjajF0Dlgeysp6C/jD5Z1wBesb+SaznuZ77nhrh8PKV0E4rq2dQMA8YeVa9vwhp5wj5n3mOlO9M7iX97BmcFfVqNLUSyOLQEX+/5ZrLHgFgFWbm+sU7NtegYb1EZirxIm+6KJQvKnU45QqtwjpTOVSG8MguAw137S7QkJv5MKNxLSFfCyMgAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 3-4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сосиски куриные 500 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель средний 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">брокколи 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сладкий перец 2 шт (красный и желтый)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кабачок 1/2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук-шалот 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">паприка хлопья 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок гранулированный 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соевый соус 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый винный 1 ст л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">куркума 1/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 6-8 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">свежемолотый черный перец</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для подложки:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">греческий йогурт 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимон 1/2 шт (цедра)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка горсть</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый перец</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>~ 50 минут (20 минут активного времени)</p>\n<p>Я выросла в России девяностых, а теперь живу в Германии, поэтому как бы отчаянно диетологи не трубили про вред сосисок, время от времени они лежат в моем холодильнике. Моя позиция такова: нет плохой еды, есть неумеренное потребление, и сосиски — это не грех, а инструмент и удовольствие, если они вписаны в правильный контекст.</p>\n<p>Когда мне совершенно не хочется готовить, я прибегаю к помощи духовки, которая делает все сама. Мне нужно лишь помыть, очистить и нарезать овощи, сбрызнуть все маслом с парой-тройкой приправ и отправить все в жар. Этот способ позволяет без всяких усилий добавить рациону полезной клетчатки, а в качестве усилителей вкуса я использую соевый соус, пармезан и мой guilty pleasure — сосиски.</p>\n<p>Этот рецепт — метод, а не формула. Здесь в целом можно наплевать на ингредиенты и граммовки и собирать свой собственный противень — любые овощи, любые сосиски (или, скажем, филе куриного бедра как альтернатива), любые приправы. Главное соблюдать три правила: раскалить противень заранее, щедро покрыть ингредиенты маслом и специями, и подавать с чем-то мягким и освежающим вроде сметаны или греческого йогурта. Остальное — дело фантазии и содержимого вашего холодильника.</p></div><div class=\"note\"><i class=\"bul\">📍</i>TIP: на всякий случай скажу, что главная беда сосисок — излишнее количество соли, поэтому я тщательно изучаю этикетки на этот счет и дополнительно не солю овощи.</div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Разогреть духовку вместе с противнем до 230 градусов (режим: верх/низ). Все овощи обмыть и очистить, картофель нарезать небольшими кубиками, морковь — кружочками, кабачок — крупными кубиками (если у вас цуккини — то полумесяцами), лук-шалот — дольками. Перец очистить от семян и нарезать широкими полосками. Брокколи разобрать на небольшие соцветия (я оставляю только сами цветочки). Сосиски порезать толстыми “бочонками”.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В миске смешать масло, соевый соус, уксус, чеснок, куркуму, паприку и черный перец. Добавить овощи с сосисками, хорошо перемешать руками.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Выложить на горячий противень, разложить веточки тимьяна, убавить температуру до 210 градусов и запекать 25–30 минут, пока картофель не станет мягким. В процессе пару раз перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Достать, посыпать свежей петрушкой и тёртым пармезаном, перемешать прямо на противне.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для соуса-подложки смешать йогурт с лимонной цедрой, мелко рубленой петрушкой, солью и белым перцем. Намазать ложкой по тарелке, сверху выложить овощи с сосисками, сбрызнуть оливковым маслом, по желанию добавить ещё немного пармезана и подавать.</div></div></div></div>"},"711":{"id":711,"title":"Картофельное пюре","sub":"[густое, воздушное]","cat":"Овощи и гарниры","img":"","lq":"","w":0,"h":0,"q":"картофельное пюре [густое, воздушное] на 4 порции картофель 1 кг молоко 200 г масло сливочное 140 г соль белый перец мускатный орех картофельное пюре густое воздушное ","html":"<div class=\"spread\"><aside class=\"rail\"><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 4 порции:</p><ul class=\"ings\"><li><i class=\"bul\">🟡</i><span class=\"tx\">картофель 1 кг</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">молоко 200 г</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">масло сливочное 140 г</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">🟡</i><span class=\"tx\">мускатный орех</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Картофель очистить и нарезать на кусочки со стороной 2-4 см (все примерно одинаковые), переложить в дуршлаг и промыть под струей холодной воды.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В большой кастрюле вскипятить воду, переложить картофель, дождаться повторного закипания и варить примерно 10-15 минут (до полной мягкости - это важно для следующего шага).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В сотейнике или маленькой кастрюле смешать молоко, сливочное масло, соль, перец и щепотку мускатного ореха, поставить на средний огонь и дождаться, пока сливочное масло растопится, а соль - растворится.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Картофель размять толкушкой или пропустить через пресс, и с помощью спатулы аккуратно вмешать молочно-сливочную смесь. Попробуйте на соль, если нужно - досолите и подогрейте.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Старайтесь подавать пюре только что приготовленным. Разогреваясь, оно теряет свою роскошную текстуру.</div></div></div></div>"},"712":{"id":712,"title":"Мятый картофель","sub":"запеченный в мундире с травами и пармезаном","cat":"Овощи и гарниры","img":"thumb/0712_00_712_photo.webp","lq":"data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAADwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JaACdMoBOAbTQfFqTivndeewllJLj8xeEWAX0msUfgAD8G2D0LmEvDo4prfJCx2ISC6MvTuMyDc96sPKWMJhfgxR9E7wvnaL1lYHpqFcGk4giSbOIStpvUQQCeZkaYYbWMzDLCWY7z6ZgXQwz8VGhg8xM51V8mew7YpDP2wYY70C4IZC0eBKalw/OWme6NZ/9/HgIB4sKUyQASprIDuMfaK/vnvvVGVb1rZ8jdxdItQWobcCwKY2mXS0L+qAA","w":360,"h":450,"q":"мятый картофель запеченный в мундире с травами и пармезаном  картофель молодой мелкий 1 кг сливочное масло 100 г пармезан 60 г тимьян 4 5 веточек петрушка 4 6 стеблей только листья чеснок 6 8 или больше зубчиков оливковое масло соль перец а также форма для запекания у меня вот такая 34х24 духовка тёрка микроплан мятый картофель запеченный в мундире с травами и пармезаном если бы меня спросили какое у меня есть хобби я бы ответила придумывать новый гарнир из картошки самый излюбленный и скоростной вариант подсмотрела его в московском ресторане smoke bbq нарезать молодой картофель крупными кубиками отварить в кипящей воде с внушительным количеством соли до готовности 10 15 минут затем слить вод","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0712_00_712_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAADwBQCdASoUABkAPu1sq1EppaOiqAqpMB2JaACdMoBOAbTQfFqTivndeewllJLj8xeEWAX0msUfgAD8G2D0LmEvDo4prfJCx2ISC6MvTuMyDc96sPKWMJhfgxR9E7wvnaL1lYHpqFcGk4giSbOIStpvUQQCeZkaYYbWMzDLCWY7z6ZgXQwz8VGhg8xM51V8mew7YpDP2wYY70C4IZC0eBKalw/OWme6NZ/9/HgIB4sKUyQASprIDuMfaK/vnvvVGVb1rZ8jdxdItQWobcCwKY2mXS0L+qAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">картофель молодой мелкий 1 кг</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пармезан 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян 4-5 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка 4-6 стеблей (только листья)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чеснок 6-8 (или больше) зубчиков</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">соль</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">перец</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">форма для запекания, у меня вот такая (34х24)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">духовка</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">тёрка микроплан</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Если бы меня спросили, какое у меня есть хобби, я бы ответила - придумывать новый гарнир из картошки. Самый излюбленный и скоростной вариант (подсмотрела его в московском ресторане Smoke BBQ) - нарезать молодой картофель крупными кубиками, отварить в кипящей воде с внушительным количеством соли до готовности (10-15 минут), затем слить воду, закинуть в кастрюлю кубики сливочного масла, тертый пармезан и нарубленные травы, накрыть крышкой и … очень хорошо потрясти с минуту. Получается дивно - крупные куски картофеля, покрытые тонким слоем сливочно-сырного пюре с ароматом тимьяна и петрушки. Если есть немного свободного времени, этот же рецепт можно перенести в плоскость почти праздничного блюда. Секретный ингредиент - зубчики чеснока к большом количестве, запеченные прямо в кожуре. Нелюбители чеснока, привет! Вообще я в вашей коалиции, но нельзя не признать - чеснок ну очень идет картофелю! Потом можно надрезать кожуру и выдавить чесночную пасту прямо на картошку. Попробуем?</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Молодой картофель промыть, почистить щеткой, уложить в большую кастрюлю, залить холодной водой так, чтобы она покрывала картофель минимум на 3 см, добавить 1 ст ложку крупной морской соли и поставить на сильный огонь. Довести до кипения, затем убавить огонь до среднего и отварить картофель в течение 15-20 минут (в зависимости от величины клубней).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть духовку до 200 градусов (режим: конвекция). Тимьян обмыть и оборвать листочки, петрушку обмыть, отрезать листья и мелко-мелко нарубить, затем смешать травы в небольшой мисочке. Сливочное масло растопить в сотейнике. Пармезан натереть на терке микроплан (должна быть именно крошка, не маленькие тонкие полосочки). В форме для запекания смешать половину сливочного масла с 2 ст ложками оливкового, распределить по дну.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">По одному выкладывать в форму картофель и очень аккуратно надавливать на него дном широкого стакана (или маленькой сковородкой), формируя картофельную лепешку. Заполнить картофелем всю форму, в образовавшееся свободное пространство выложить неочищенные зубчики чеснока. Щедро смазать картофель и чеснок второй половиной сливочного масла, присыпать небольшим количеством соли, половиной трав и - в завершении - тёртым пармезаном.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Запекать в духовке 20-25 минут до золотистой корочки (на последних минутах можно включить гриль). До подачи хранить, накрыв фольгой, в тёплом месте, но лучше есть сразу же! Не забудьте посыпать второй частью травок.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0712_01_713_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0712_02_714_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0712_03_715_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0712_04_716_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0712_05_717_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"502":{"id":502,"title":"Киш с курицей, шпинатом и вялеными томатами","sub":"","cat":"Пироги, тесто и хлеб","img":"thumb/0502_00_502_photo.webp","lq":"data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAAAwBQCdASoUABQAPu1qqFAppaOiqA1RMB2JZAC1F5OAkn36ddSCRvx+cQLjwACwMdMfwAD+Pw2YTd7b7DmbzADy3cPaIXCDr9tVxWQ7VRP9RvMQhhVkarsvVp75DfCa3zBG1CxpBTkzurzuE30YpjTD6uVcmo82f6Nb+t89SHQRyTQINOgFX6+kG87NyvAM8AA=","w":360,"h":360,"q":"киш с курицей, шпинатом и вялеными томатами  на 6 порций куриная грудка 300 г вяленые томаты 90 г шпинат замороженный 90 г яйца 3 шт сливки 30 240 г сыр грюйер 60 г прованские травы мускатный орех белый перец оливковое масло сливочное масло бальзамический уксус соевый соус предварительно испеченная a 662 основа для киша либо отпечь в то время пока будет готовиться начинка киш с курицей шпинатом и вялеными томатами","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"640\" src=\"img/0502_00_502_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpwAAABXRUJQVlA4IJAAAAAwBQCdASoUABQAPu1qqFAppaOiqA1RMB2JZAC1F5OAkn36ddSCRvx+cQLjwACwMdMfwAD+Pw2YTd7b7DmbzADy3cPaIXCDr9tVxWQ7VRP9RvMQhhVkarsvVp75DfCa3zBG1CxpBTkzurzuE30YpjTD6uVcmo82f6Nb+t89SHQRyTQINOgFX6+kG87NyvAM8AA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 6 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">куриная грудка 300 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">вяленые томаты 90 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">шпинат замороженный 90 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">яйца 3 шт</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сливки 30% 240 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сыр грюйер 60 г</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">прованские травы</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">мускатный орех</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">белый перец</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">оливковое масло</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">сливочное масло</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">бальзамический уксус</span></li><li><i class=\"bul\">⏺️</i><span class=\"tx\">соевый соус</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⏺️</i><span class=\"tx\">предварительно испеченная <a class=\"xref\" href=\"#/r/662\">основа для киша</a> (либо отпечь в то время, пока будет готовиться начинка)</span></li></ul></div></div></aside><div class=\"main\"><p>а также</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку разогреть до 170 градусов (режим верх/низ), куриное филе нарезать кубиками со стороной ~1см, вяленые томаты примерно так же, сыр натереть на крупной терке. Шпинат разморозить импульсами по 15 секунд в микроволновке.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Разогреть в сковороде оливковое (1 ст л) и сливочное масло (небольшой кубик), обжарить курицу в течение 2 минут на сильном или очень сильном огне, затем убавить огонь до среднего, добавить томаты, перемешать, всыпать прованские травы, подержать на огне 2 минуты, влить 2 ст ложки соевого соуса и 1 ст л бальзамического уксуса, все хорошо перемешать, выключить огонь, слить лишнюю жидкость, если есть.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Для заливки яйца пробить блендером со сливками, щепоткой белого перца и щепоткой мускатного ореха. Добавить шпинат, хорошо перемешать.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">На основу выложить начинку, равномерно распределить по дну. Залить яично-сливочно-шпинатной массой, засыпать сверху тёртым сыром, присыпать прованскими травами и отправить в духовку.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Выпекать 30-35 минут до золотистой корочки. Готовый киш посыпать петрушкой.</div></div></div></div>"},"578":{"id":578,"title":"Киш с лососем и брокколи","sub":"","cat":"Пироги, тесто и хлеб","img":"thumb/0578_00_578_photo.webp","lq":"data:image/webp;base64,UklGRtQAAABXRUJQVlA4IMgAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JagCdMtB3l2ABBKiu3v5SrTzfuWQ9Ps64qA4AAP4ZysGRLvwR+huII+oIlTUChfL/ysYWhe4vu2pc1n0nN/6PCsN2vAoA6FNGLZhh657KA+8BCejWf3OMB9EeAtB6UnpCaaqN1fTCIPu13F7aGf8H5TqqK4OB0C1WSvt+o2pfSXDaPhR7b7aZZI/J48Qk5WHRmmXTzlRoPVcVJfpBvlDzyRdqIEgN8dgNsA0RDIjAAA==","w":360,"h":450,"q":"киш с лососем и б
