едовик","sub":"медовая карамель, бурная воздушность","cat":"Десерты","img":"thumb/0621_00_621_photo.webp","lq":"data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAACwBQCdASoUABkAPu1urlIppiQiqAgBMB2JbACdL8I4Actgg5nv5cDqlqjY9N/C+WibaQ9ZqdwA/u1ZoWeVqkG6/hIUwX2D1W7B0/aKqn3w4170kcNrupU/zq6B9YnQLYVVl5Y/vpA0idKjd9ReXFxbaqFQMFJ5e/uCnvLzZ8wZ0v1BmGOsHZzd+GZSUjojSsnoxRZS9kB96bkslOiYSqkFclg9Lpz96gXzo69s1Jw3FgXtFTkbcGbnAZeDVjrMD1E6gs4UrrezT5flhhFLFnJMh2oAvKAA","w":360,"h":450,"q":"медовик медовая карамель, бурная воздушность на тортик диаметром 20 см на 8 12 кусочков для коржей мёд гречишный 100 г сахар 200 г сливочное масло 130 г сода 1 ч л яйца 2 шт мука 520 г для крема маскарпоне 350 г сливки 30 350 г сметана 20 400 г сахарная пудра 40 г медовик медовая карамель бурная воздушность когда мы только открыли эклерную в москве я почти каждую неделю слушала интересные истории от случайно зашедших прохожих с улицы новокузнецкой все они как один смотрели на витрину морщились и говорили что у нас на витрине не эклер а какая то фигня фикция потому что настоящий эклер должен быть дальше следовал бесконечный каталог абсолютно рандо ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0621_00_621_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuIAAABXRUJQVlA4INYAAACwBQCdASoUABkAPu1urlIppiQiqAgBMB2JbACdL8I4Actgg5nv5cDqlqjY9N/C+WibaQ9ZqdwA/u1ZoWeVqkG6/hIUwX2D1W7B0/aKqn3w4170kcNrupU/zq6B9YnQLYVVl5Y/vpA0idKjd9ReXFxbaqFQMFJ5e/uCnvLzZ8wZ0v1BmGOsHZzd+GZSUjojSsnoxRZS9kB96bkslOiYSqkFclg9Lpz96gXzo69s1Jw3FgXtFTkbcGbnAZeDVjrMD1E6gs4UrrezT5flhhFLFnJMh2oAvKAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на тортик диаметром 20 см (на 8-12 кусочков):</p><div class=\"iblock\"><p class=\"lbl\">для коржей:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд гречишный 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 130 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода 1 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 520 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для крема:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сметана 20% 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 40 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Когда мы только открыли эклерную в Москве, я почти каждую неделю слушала интересные истории от случайно зашедших прохожих с улицы Новокузнецкой. Все они как один смотрели на витрину, морщились и говорили, что у нас на витрине “не эклер, а какая-то фигня фикция”, потому что настоящий эклер должен быть…<br>(дальше следовал бесконечный каталог абсолютно рандомных вкусовых воспоминаний: хрустящий, шоколадный, белый с плотной глазурью, со сливочным маслом, с белковым кремом…).  Каждый говорил это тоном человека, который знает истину, хотя истины, конечно, не существовало, существовала только гастрономическая память, иногда очень трогательная, но всегда глубоко личная и почему-то очень упрямая.</p>\n<p>Медовик — из той же области: у каждого этот торт свой, единственно верный, “как в детстве”, и ко всем остальным относишься с недоверием. Но если без всех этих лирических отступлений, это просто чудесный в своей скромности торт, который однажды просто появился в быту. Он держался на скромных продуктах и простецкой технике, пережил XIX век, советскую кухню, дефицит и торты из госстандарта, но не потерял при этом способности быть удивительно нежным и уютным. Версий медовиков сегодня миллион, и разойтись они могут куда угодно: двенадцать коржей или шесть, карамелизация до тёмного янтаря или до кремового золота, исключительно сметанный крем или что-то более современное. Каждый собирает свою версию, и это нормально — медовик всегда больше про вкус самого автора, это не константа.</p>\n<p>Мой однажды получился вот таким — спокойным, минималистичным, с небольшим количеством тонких коржей и кремом на маскарпоне, сливках и сметане. Он держит форму, но после пропитки — невероятно нежный; ароматный, но при этом не навязчивый.</p>\n<p>Однако при всей вариативности есть несколько вещей, которые не обсуждаются: мёд должен быть яркий, ароматный, живой, желательно гречишный, потому что он здесь не фон, а смысл; сметана — густая, жирная, настоящая, без кислой водянистости; коржи — раскатанные максимально тонко, потому что в этом и есть медовиковый характер.</p>\n<p>Важный момент, который вы оцените: медовик удивительно хорошо морозится — редкое качество для торта. Если останется кусочек (ну мааало ли), заверните его в плёнку и уберите в морозилку: через несколько дней он будет таким же нежным и ароматным, будто вы только что достали его из холодильника перед подачей.</p>\n<p>Теперь — к рецепту.</p></div><p>+ ягоды для украшения</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Мёд, сахар и сливочное масло положить в сотейник и нагреть на среднем огне — растворить сахар и довести смесь до лёгкого кипения. Яйца объединить венчиком до состояния меланжа, отставить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Всыпать в сотейник соду и уваривать, помешивая, до карамельного цвета (масса станет чуть более густой и красивого янтарного цвета). Снять с огня и дать остыть 5–7 минут (~55-60 градусов). Вмешать яичный меланж, интенсивно размешивая, чтобы яйца не свернулись, затем добавить муку и замесить мягкое тесто. Запаковать в пищевую плёнку и убрать в холодильник на час (максимум на 12 часов).</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть духовку до 180 градусов (режим: конвекция). Подготовить шесть отрезков пергаментной бумаги и разделить тесто на 6 частей. Тут на всякий случай скажу, что можно разделить тесто и на большее количество коржей, если вам больше по нраву тортик, где именно коржи задают вкус.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Раскатать коржи максимально тонко (максимум 2 мм), часто наколоть вилкой и выпекать примерно по 4–6 минут на перевернутом противне до золотистого цвета.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Продолжаем в комментариях</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>Важный момент! Как только вы достанете корж из духовки, он будет мягким, но буквально через десять минут задубеет (особенность теста), поэтому его нужно достаточно оперативно обрезать по диаметру торта, который вы собираете — вам поможет дно от разъемной формы, кондитерское кольцо или на худой конец обычная тарелка. Обрезки от коржей разложить на решетке, чтобы они хорошо подсохли. Коржи полностью остудить.</div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Крем — проще простого: взбить до загустения маскарпоне, сливки и сахарную пудру. На первом этапе всё будет очень жидко, не паникуем, методично взбиваем и ждём загустения. В конце добавить сметану и еще раз взбить. С помощью силиконовой спатулы промешать крем движениями вверх/низ, придавая крему больше воздуха и объема.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Собираем! Немного крема на подложку, положить корж, затем крем и так шесть раз. Для идеального среза мой вам совет — взвешивайте каждый раз порцию крема на весах (подложку устанавливаем на весы, обнуляем, взвешиваем крем, на один корж  по этому рецепту уйдет примерно 185 г крема). Убрать собранный торт в холодильник на 1-12 часов.</div></div>\n<div class=\"note\"><i class=\"bul\">📍</i>NOTE: если хочется классической, строгой геометрии, торт можно выровнять тонким слоем чистового крема (этим, например), но мне нравится его естественная, чуть неровная, “живая” поверхность, где коржи будто дышат под крошкой.</div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Обрезки смолоть в блендере и для совсем идеального результата просеять с помощью сита. Обсыпать охлажденный торт крошкой и украсить ягодами.</div></div></div></div>"},"623":{"id":623,"title":"Павлова","sub":"с малиновой серединкой","cat":"Десерты","img":"thumb/0623_00_623_photo.webp","lq":"data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAAAQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JaACdM1o8C8MBvgPIvGSpJtWxV3zTWXTcUPprHT08BAAA+gdOJVBPi7ctq4dvkA8gHKAOA0h0p41l7BbZuYVf9bUn4pZwxxExcMbQHlOhxBxaagLejsPGmbDXp7D8TnlY3WiDU/No2DeW/D5C5IBkbqwCnnRxxqR9q21R5tn1/Rk0t0SmJI6sa9JAKaUrT12Mu/dDVgWI+1nwk7JWcYWhDw0SXxq4GWjkWF/GR0Q+NcvFq+uUTN8hzaKKn11+B+HxCKT2OUJ61GEzJEDiKyLzsJf2aWp+pSwFDzJ5TphfIAAA","w":360,"h":450,"q":"павлова с малиновой серединкой на 8 пирожных меренга белки 130 г 4 шт с1 сахарная пудра 215 г уксус белый винный 5 г кукурузный крахмал 10 г малиновая начинка малина замороженная 150 г сахар 15 г крем сливочный сыр 150 г сливки 30 300 г сахарная пудра 30 г стручок ванили 1 шт сублимированная малина павлова с малиновой серединкой прежде чем вы скажете что безе это не ваше позвольте мне вмешаться я тоже не люблю безе но ох как люблю хорошо сделанную павлову это не одно и то же безе это взбитые яичные белки с сахаром которые долго сушат при низкой температуре полностью выпаривая влагу безе хрустящее ломкое и абсолютно сухое павлова же десерт сотканный из контрастов безешная к","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0623_00_623_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgYBAABXRUJQVlA4IPoAAAAQBgCdASoUABkAPu1qrFEppaQiqAqpMB2JaACdM1o8C8MBvgPIvGSpJtWxV3zTWXTcUPprHT08BAAA+gdOJVBPi7ctq4dvkA8gHKAOA0h0p41l7BbZuYVf9bUn4pZwxxExcMbQHlOhxBxaagLejsPGmbDXp7D8TnlY3WiDU/No2DeW/D5C5IBkbqwCnnRxxqR9q21R5tn1/Rk0t0SmJI6sa9JAKaUrT12Mu/dDVgWI+1nwk7JWcYWhDw0SXxq4GWjkWF/GR0Q+NcvFq+uUTN8hzaKKn11+B+HxCKT2OUJ61GEzJEDiKyLzsJf2aWp+pSwFDzJ5TphfIAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на 8 пирожных:</p><div class=\"iblock\"><p class=\"lbl\">меренга:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">белки 130 г (4 шт С1)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 215 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">уксус белый винный 5 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">кукурузный крахмал 10 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">малиновая начинка:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">малина замороженная 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 15 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">крем:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">стручок ванили 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сублимированная малина</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Прежде чем вы скажете, что безе — это не ваше, позвольте мне вмешаться. Я тоже не люблю безе, но ох как люблю хорошо сделанную Павлову. Это не одно и то же. Безе — это взбитые яичные белки с сахаром, которые долго сушат при низкой температуре, полностью выпаривая влагу. Безе хрустящее, ломкое и абсолютно сухое. Павлова же — десерт, сотканный из контрастов. Безешная корочка сверху — такая тонкая, что в секунду трескается от одного движения ложки, под ней — влажная, пушистая, почти зефирная сердцевинка-маршмеллоу. Мягкая середина встречается с едва сладким сливочным кремом и с фруктовой кислинкой ягод. Много разных текстур и много оттенков вкуса, чтобы сладость меренги не ощущалась во рту инсулиновой бомбой — вот что такое хорошая Павлова.</p>\n<p>Чтобы съесть такую, скорее всего, придется сделать её самостоятельно, так как мало какая кондитерская поставит вкус выше долгого и стабильного хранения. Вопреки расхожему мнению (основанному, вероятно, на малом количестве ингредиентов), Павлова — десерт непростой, а потому я заклинаю вас не отходить от рецепта ни на шаг.</p>\n<p>ключевые моменты, которые помогут вам сделать всё правильно</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Дежу миксера или просто металлическую миску вымыть и насухо вытереть. Добавить яичные белки и начать взбивать на средней скорости.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Когда белковая масса будет напоминать пенку на плохо сделанном капучино (то есть мелких пузырьков уже много, но пузырьки всё еще видны), начать добавлять сахарную пудру небольшими порциями, например, столовой ложкой (процесс добавления должен занять как минимум 2 минуты). Как только вся пудра будет добавлена, взбивать меренгу ещё около 3-4 минут на средней скорости, пока масса не станет максимально однородной, глянцевой и блестящей. С помощью спатулы вмешать в меренгу сначала уксус (движениями вверх-вниз, как будто спатула обнимает белковую массу), затем крахмал. Перемешивать, пока кусочки крахмала полностью не растворятся.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Духовку установить на 120 градусов (режим: конвекция). Переложить меренгу в кондитерский мешок с насадкой круг.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Противень застелить пергаментной бумагой и сделать для себя насечки, чтобы было удобно отсаживать пирожные (я использую тот же приём, что и с шу — делаю оттиски сахарной пудрой на пергаменте). Отсадить объемные шапочки Павловой в шахматном порядке, с помощью круглой мерной ложки сформировать выемки для начинки, и отправить в духовку на 10 минут. Затем переключить режим на верх/низ, убавить температуру до 95 градусов и выпекать 60-70 минут. После выключения духовки оставить Павловых отдыхать, по меньшей мере на один час, в идеале оставить на ночь.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Для начинки прогреть замороженную малину с сахаром до теплого состояния (нужно дождаться лишь растворения сахара, нагревать и доводить до кипения не нужно), для крема — взбить охлажденные сливки со сливочным сыром, сахарной пудрой и семенами ванили до загустения (не перевзбейте, крем должен оставаться немного пластичным).</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">В центр каждой Павловой положить чайную ложку охлажденной начинки (лучше меньше сока, больше ягод), сверху украсить кремом, ягодами свежей малины и малиной сублимированной. Павлова долго не хранится — под воздействием влаги крем “провалится” в меренгу, так что подавайте сразу же. Если хотите всё же сделать чуть заранее (я бы рекомендовала хранить собранные не больше 5-6 часов), то лучше всего будет собирать пирожные на тех же тарелках, что будете подавать.</div></div></div></div>"},"625":{"id":625,"title":"Шоколадный мусс","sub":"со взбитыми сливками и вишневым компоте","cat":"Десерты","img":"thumb/0625_00_625_photo.webp","lq":"data:image/webp;base64,UklGRgABAABXRUJQVlA4IPQAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JQBOkHdh3ppuP97RumVntk0NwRmMh2E6NnpIAAPuYl9BgGjTMiILDV+p++CRiBXVPXSNofylCPUJ3xExEIX1tkjdH8K/FG6LD6QbPulhJ4uk7rVWx8LBOKv+EcAJneS8shdZBbbgX0IeB0nPbzwiyqdK+LnnerSG+99kG2YcmtbwMwhv8s8ER2qzHAwLBwPZqGPQdQPVamReQMX6P6RQRk+gNj213MuS867jaxqnQTtWEQ1vuXYx5lrBWgmVV7ir19mP+ai/BDHxs67f909Qqp5KaSYxLwFF1gAAA","w":360,"h":450,"q":"шоколадный мусс со взбитыми сливками и вишневым компоте на 8 10 порций шоколад 70 150 г желатин листовой 6 г молоко 120 г сливки 30 400 г для вишневого компоте вишня замороженная 250 г сахар коричневый 25 г крахмал кукурузный 6 г пудра ванили 1 2 ч л сливки 30 150 г какао для посыпки шоколадный мусс со взбитыми сливками и вишневым компоте одна из важных вещей которую стоит держать в голове при планировании меню званого ужина или просто праздничного обеда это баланс мы будем подробно говорить об этом в прямом эфире про организацию поэтому пока лишь обозначу один из моих тезисов less is more иногда можно и нужно не усложнять выбирать самые простые в приготовлении ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0625_00_625_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgABAABXRUJQVlA4IPQAAABwBQCdASoUABkAPu1sqlEppaOiqAqpMB2JQBOkHdh3ppuP97RumVntk0NwRmMh2E6NnpIAAPuYl9BgGjTMiILDV+p++CRiBXVPXSNofylCPUJ3xExEIX1tkjdH8K/FG6LD6QbPulhJ4uk7rVWx8LBOKv+EcAJneS8shdZBbbgX0IeB0nPbzwiyqdK+LnnerSG+99kG2YcmtbwMwhv8s8ER2qzHAwLBwPZqGPQdQPVamReQMX6P6RQRk+gNj213MuS867jaxqnQTtWEQ1vuXYx5lrBWgmVV7ir19mP+ai/BDHxs67f909Qqp5KaSYxLwFF1gAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 8-10 порций:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">шоколад 70% 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желатин листовой 6 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 400 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для вишневого компоте:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вишня замороженная 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар коричневый 25 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 6 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пудра ванили 1/2 ч л</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 150 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">какао для посыпки</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Одна из важных вещей, которую стоит держать в голове при планировании меню званого ужина (или просто праздничного обеда), — это баланс. Мы будем подробно говорить об этом в прямом эфире про организацию, поэтому пока лишь обозначу один из моих тезисов: less is more. Иногда можно — и нужно — не усложнять. Выбирать самые простые в приготовлении блюда и сосредоточиться на другом: хорошем вине, общении и атмосфере за столом.</p>\n<p>Десерт — главный кандидат на подобное упрощение во имя заботы о себе. Всё, что по-настоящему нужно в финале вечера — это лёгкая красивая точка, и шоколадный мусс — один из лучших вариантов.</p>\n<p>Не без нюанса! Классический французский шоколадный мусс делается на сырых взбитых белках. Он воздушный, как облако, невероятно нежный.. и совершенно не универсальный, ведь это не тот десерт, который можно подать всем без исключения гостям. И пусть я из тех людей, кто считает чрезмерные страхи вокруг сальмонеллы преувеличенными и явно устаревшими (мы в 2025 году, в конце концов), однако я безусловно уважаю право своих гостей не разделять мои убеждения. Званый ужин — это про заботу и комфорт всех за столом.</p>\n<p>Поэтому вот вам альтернатива: взбитый шоколадный ганаш. Текстура у него не такая невесомая, как у аутентичного мусса, зато вкус возможно даже глубже и чище, никаких сырых яиц, а уж делается он до смешного просто: несколько ингредиентов, минимум действий, и у вас в холодильнике стоит идеальная база для десерта, который можно собрать за пару минут до подачи. Он прекрасно дружит со взбитыми сливками и любыми добавками — от щепотки морской соли и брызгов хорошего оливкового масла (для гурманов) до ягод, свежих или в виде компоте, как у меня здесь.</p>\n<p>важные замечания, прежде чем вы начнете</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Для вишневого компоте соединить в сотейнике замороженную вишню, коричневый сахар и пудру ванили, перемешать и поставить на небольшой огонь. Когда вишня пустит сок (холодный!), отлить примерно четверть стакана в небольшую мисочку, добавить кукурузный крахмал и перемешать. Влить обратно к вишне, перемешать, довести до кипения, проварить около минуты на среднем огне, затем выключить огонь и переложить компоте в емкость — в контейнер или баночку. Убрать в холодильник до полного остывания.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Шоколад разломать или нарезать на маленькие кусочки и переложить в миску. Желатин замочить в ледяной воде.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">В небольшом сотейнике нагреть молоко до состояния, близкого к кипению, добавить размокшие (не забудьте отжать лишнюю воду) листы желатина и перемешать до растворения, затем вылить на шоколад и засечь одну минуту. По прошествии этого времени перемешать шоколад с молоком и желатином до однородного состояния.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Влить холодные сливки, перемешать и пробить погружным блендером в течение 2-3 минут до блестящей эмульсии. Накрыть крем пленкой в контакт и убрать в холодильник на ночь (или на 8 часов).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">На следующий день взбить шоколадный ганаш венчиками миксера до воздушной текстуры (в течение 1-2 минут, не больше, крем может начать расслаиваться от долгого взбивания, задача только насытить крем воздухом, создав муссовую текстуру). Сразу же разложить по красивым креманкам или мисочкам.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Холодные сливки взбить до стойких уверенных пиков, с помощью кондитерского мешка или ложки отсадить сверху на шоколадный крем. С помощью маленькой ложки, смоченной в кипятке, сделать углубления для вишни. Присыпать половинку креманки какао с помощью мелкого сита, выложить вишню (выбирайте самую красивую), добавить немного сока от компоте и скорее подавать.</div></div></div></div>"},"627":{"id":627,"title":"Шу с кремом earl grey","sub":"французские пирожные с очень популярным в Азии вкусом","cat":"Десерты","img":"thumb/0627_00_627_photo.webp","lq":"data:image/webp;base64,UklGRv4AAABXRUJQVlA4IPIAAABwBQCdASoUABkAPu1ur1KppiQiqAgBMB2JZgCdMoR8jf/i2CSw/iu1tCpMfrFag+AD8AmoAPgsGh81+XHFkgK/Q6msHTetfISpTOhxpgFdqqOA/1mshYGMdGy5nRgtAcH8E/z0JXVqXiZnaWaZLjMhA7ZFd47U+NKmsjxqkLUkjfu2PUE25oHXUG1djTKuabLxsbbE/F4Cn/e0GJmQr/EvcOK+/awMrw8CC2Q87P1+lXVclTRAB+u1aXxOsxeTVMe5jOKCZp4q/h/qS3pXcJv3sGXJeM3LdOWNs28GzuXKTGYx9ASRTT0YRpMbC7cYVbAAAA==","w":360,"h":450,"q":"шу с кремом earl grey французские пирожные с очень популярным в азии вкусом  сливочное масло 65 г коричневый сахар 75 г мука 75 г для крема earl grey молоко 365 г желтки 4 шт крахмал кукурузный 24 г сахар 90 г чай earl grey 1 ст л с горкой масло сливочное 60 г сливки 30 250 г шу с кремом earl grey французские пирожные с очень популярным в азии вкусом на 12 шу a 699 заварное тесто 1 2 от этого рецепта для теста craquelin хватит на 25 30 шт ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0627_00_627_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRv4AAABXRUJQVlA4IPIAAABwBQCdASoUABkAPu1ur1KppiQiqAgBMB2JZgCdMoR8jf/i2CSw/iu1tCpMfrFag+AD8AmoAPgsGh81+XHFkgK/Q6msHTetfISpTOhxpgFdqqOA/1mshYGMdGy5nRgtAcH8E/z0JXVqXiZnaWaZLjMhA7ZFd47U+NKmsjxqkLUkjfu2PUE25oHXUG1djTKuabLxsbbE/F4Cn/e0GJmQr/EvcOK+/awMrw8CC2Q87P1+lXVclTRAB+u1aXxOsxeTVMe5jOKCZp4q/h/qS3pXcJv3sGXJeM3LdOWNs28GzuXKTGYx9ASRTT0YRpMbC7cYVbAAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 65 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 75 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 75 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">для крема earl grey:</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 365 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желтки 4 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 24 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 90 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">чай earl grey 1 ст л с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 250 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p class=\"lbl\">на 12 шу:</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/699\">заварное тесто</a> 1/2 от этого рецепта</span></li></ul>\n<p class=\"lbl\">для теста craquelin:</p>\n<p>(хватит на 25-30 шт)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Чтобы не переутомиться от многосоставного десерта, подготовку удобно начать вечером, накануне дня, когда вы собираетесь печь шу — сделаем тесто краклен и заварной крем earl grey.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">В сотейник налить молоко, всыпать чай и половину сахара (45 грамм), перемешать и нагреть до состояния, близкого к кипению. Накрыть крышкой и дать настояться в течение 30 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Мягкое сливочное масло соединить в миске с сахаром и мукой, вымешать лопаткой, пока оно не соберется в шар. Раскатать между двумя листами пергаментной бумаги до толщины 2 мм и убрать в морозилку (желательно на чём-то ровном, например, на разделочной доске).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Ароматное молоко в сотейнике процедить, хорошо отжав чаинки, и снова нагреть до состояния, близкого к кипению. В миске соединить желтки с оставшимся сахаром и крахмалом, затем тонкой струйкой влить тёплое ароматизированное молоко в яичную смесь, постоянно размешивая. Вернуть в сотейник на средний огонь и довести крем до загустения, энергично работая венчиком (загустеет он только когда дойдет до кипения, после этого держите на огне, непрерывно помешивая, не менее двух минут, чтобы полностью пастеризовать желтки). Снять с огня, переложить в миску, вмешать кубики сливочного масла. Накрыть пищевой плёнкой в контакт и убрать в холодильник.</div></div>\n<p>NEXT DAY<br>(или через 3-4 часа)</p>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Достать из морозилки пласт теста краклен и, работая быстро, вырезать кружочки диаметром 4-4,5 см (лучше всего, конечно, подойдёт профессиональная вырубка). Разложить их на пергаменте и убрать обратно в морозилку. Остатки теста можно собрать, снова раскатать между двух листов пергаментной бумаги и убрать туда же, но уже для следующей партии шу 🙂</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Разогреть духовку до 190 градусов (режим: конвекция). Приготовить заварное тесто по этому рецепту, переложить его, не охлаждая, в кондитерский мешок.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Застелить противень (не переворачиваем противень, оставляем в “классическом” состоянии) пергаментной бумагой и в шахматном порядке отсадить шарики из заварного теста диаметром примерно 4 см. Выложить по кружочку замороженного теста краклен на каждый шарик и сразу же отправить в духовку на 15 минут. Затем, не вынимая шу и не открывая духовку, убавить температуру до 160 градусов и печь еще 15 минут. Готовые шу переложить на решетку и полностью остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">8</span><div class=\"st\">Достать из холодильника миску с заварным кремом и пробить венчиками миксера до гладкости. В другой миске взбить охлажденные сливки до загустения, затем добавить их к заварному крему и ещё раз взбить миксером до полного объединения.</div></div>\n<div class=\"step\"><span class=\"sn\">9</span><div class=\"st\">Наполнить заготовки из заварного теста кремом и убрать в холодильник хотя бы на 15 минут. Присыпать сахарной пудрой и подавать.</div></div><div class=\"outrop\"><div class=\"note\"><i class=\"bul\">⚡️</i>Встречаемся 2 ноября в прямом эфире в 12:00 по Москве, чтобы испечь шу вместе!</div></div></div></div>"},"630":{"id":630,"title":"Печенье с шоколадом","sub":"и мисо-карамелью","cat":"Десерты","img":"thumb/0630_00_630_photo.webp","lq":"data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAADQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JYgCdM2QlyAlA8tJ6lHidCkyXvn02f9DQgnA4qAIoAP2ydtUDaCRE25G8PBz8xHIHl9KkSJjkC3sgtIJ03+Tm7dh1lBFsCn1/+CgBMIh0c/+d2y7S1hkE+wmZbpxz0eUyIWB/ueYfll/5tBZ3OZHXd75DqWGQaTy4tS+YLKZ0c9YugYD2dhKd8r743NVCUIwjvnfN5ZkKDqWLbzgNfaZZP15Q3u2ARYlIdg6xhnrwRDXUFTcWEBNZMF4AAA==","w":360,"h":450,"q":"печенье с шоколадом и мисо-карамелью  сахар 360 г сироп глюкозы 60 г вода 40 г сливки 30 140 г масло сливочное 140 г ваниль пудра 1 2 ч л мисо паста 40 г сливочное масло 115 г коричневый сахар 100 г белый сахар 20 г ваниль пудра 1 2 ч л яйцо с0 1 шт 60 г мука 260 г сода 3 4 ч л fleur de sel 1 2 ч л с горкой горький шоколад 200 г пекан или другие орехи fleur de sel печенье с шоколадом и мисо карамелью 45 минут активного времени на приготовление карамели и теста для печенья единственная причина по которой я задерживаю рецепты и они не выходят согласно расписанию задумка разошлась с реальностью и я не довольна полученным результатом в таких случаях как будто не имею морального права выкладывать рецепт внутри нет удовлетворения и искреннего желания ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0630_00_630_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuAAAABXRUJQVlA4INQAAADQBQCdASoUABkAPu1ur1IppiQiqAgBMB2JYgCdM2QlyAlA8tJ6lHidCkyXvn02f9DQgnA4qAIoAP2ydtUDaCRE25G8PBz8xHIHl9KkSJjkC3sgtIJ03+Tm7dh1lBFsCn1/+CgBMIh0c/+d2y7S1hkE+wmZbpxz0eUyIWB/ueYfll/5tBZ3OZHXd75DqWGQaTy4tS+YLKZ0c9YugYD2dhKd8r743NVCUIwjvnfN5ZkKDqWLbzgNfaZZP15Q3u2ARYlIdg6xhnrwRDXUFTcWEBNZMF4AAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 360 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сироп глюкозы 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 140 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 140 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ваниль пудра 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мисо паста 40 г</span></li></ul></div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочное масло 115 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">коричневый сахар 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">белый сахар 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">ваниль пудра 1/2 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйцо С0 1 шт (60 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 260 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода 3/4 ч л</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">fleur de sel 1/2 ч л с горкой</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">горький шоколад 200 г</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">пекан или другие орехи</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">fleur de sel</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>~ 45 минут (активного времени на приготовление карамели и теста для печенья)</p>\n<p>Единственная причина, по которой я задерживаю рецепты, и они не выходят согласно расписанию — задумка разошлась с реальностью, и я не довольна полученным результатом. В таких случаях как будто не имею морального права выкладывать рецепт, внутри нет удовлетворения и искреннего желания, чтобы вы скорее попробовали. Так что переделывала этих красавчиков трижды, пока не пришла к картинке и ощущению во рту, которые были “вау”. Печеньки выходили то слишком сладкими (это вообще моя боль в отношении печенья как типа десерта), то недостаточно мисо, то вообще залили мне духовку карамелью и задымыли квартиру )) Но вот теперь душенька спокойна, выпускаю рецепт в Клуб!</p>\n<p>Важные детали и красивые фотографии не поместились, потому ушли в комментарии</p>\n<p class=\"lbl\">на 6 гигантских печенек:</p>\n<p class=\"lbl\">для мисо-карамели:</p>\n<p>(на баночку 0,5 л)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Для мисо-карамели смешать в сотейнике с толстым дном сироп глюкозы, сахар и воду, поставить на средний огонь. Параллельно налить в другой сотейник сливки, добавить пудру ванили, перемешать венчиком, чтобы пудра разошлась, поставить на слабый огонь и довести до горячего состояния.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Когда сахар полностью растворится, а вода выпарится, смесь начнёт темнеть. Дожидаемся красивого янтарного оттенка, снимаем с огня и интенсивно, но при этом аккуратно, партиями, обернув руку, которая держит венчик, полотенцем (чтобы не обжечься паром), вливаем сливки в карамель. Вернуть на слабый огонь и проварить еще около 5 минут, непрерывно помешивая. Затем добавить пасту мисо, мягкое сливочное масло, перемешать, чтобы все ингредиенты объединились и дальше на ваше усмотрение: можно немного остудить карамель и перелить её в банку, а можно застелить квадратную/прямоугольную форму пергаментной бумагой, промазать маслом, залить карамель и убрать в холодильник минимум на 24 часа — потом можно будет нарезать на мягкие ириски.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Для печенья предварительно нарубить крупно качественный горький шоколад, переложить кусочки в отдельную посуду, чтобы в тесто не попала шоколадная стружка. Муку просеять с содой. Смешать в миске мягкое сливочное масло, коричневый и белый сахар, а также пудру ванили и соль, перемешать спатулой. Добавить яйцо, снова перемешать до однородной массы. Всыпать муку, вымешать тесто, затем добавить кусочки шоколада, хорошо перемешать и разделить на 6 шариков (каждый по 125 грамм). Убрать в холодильник по меньшей мере на 1 час, в идеале на ночь.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Разогреть духовку до 170 градусов (конвекция). Противень застелить пергаментной бумагой и выложить шарики теста на хорошем удалении друг от друга. Выпекать 14-15 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Достать горячие печенья из духовки и с помощью дна стакана или крышки от банки аккуратно и не сильно прижать сверху, сформировав плоскую поверхность. Выложить по чайной ложке карамели на каждое печенье и отправить в духовку на минуту, чтобы карамель красиво растеклась. Вытащить, оставить противень в покое на 3-5 минут, затем переложить печенья на решетку с помощью лопатки, посыпать рубленными орешками и хлопьями соли и охладить. Любоваться…….</div></div></div></div>"},"695":{"id":695,"title":"Шоколадные эклеры","sub":"éclairs au chocolat","cat":"Десерты","img":"thumb/0695_00_695_photo.webp","lq":"data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JQBYj5gjAM6vMegEHJTHoeQ7+u6sMKNQ2CGKo6dNAAOEqgol/8JM0PpZg5gqNfNML3C26ji+HfLhuSiPkzqw+Zsk7g2dNpCJ8rmy3eRsaYMRRHxL0GNOoIiZ/zEAZ7FeaVBcejFJJCtaFO7KZzH7HPKPVRzdaAJEctGeBjS5nFSslswotmukAhXbwq2UUpxi8e5TmmtkH1q8XQrBphBL8yqbYjE7MpQqFbLfa5GZrlp015/LlQxdV/tu84n5Xpf4ihH9Vgdrp07qbN72egDAhKJwUISJgWeYJ6cosD0JoK9AIb7BCud/AAbBsAA==","w":360,"h":450,"q":"шоколадные эклеры éclairs au chocolat на 12 классических эклеров или 20 мини эклеров a 699 заварное тесто a 700 шоколадный заварной крем a 706 шоколадная глазурь для эклеров сусальное золото шоколадные эклеры clairs au chocolat","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0695_00_695_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADQBQCdASoUABkAPu1sq1EppaOiqAqpMB2JQBYj5gjAM6vMegEHJTHoeQ7+u6sMKNQ2CGKo6dNAAOEqgol/8JM0PpZg5gqNfNML3C26ji+HfLhuSiPkzqw+Zsk7g2dNpCJ8rmy3eRsaYMRRHxL0GNOoIiZ/zEAZ7FeaVBcejFJJCtaFO7KZzH7HPKPVRzdaAJEctGeBjS5nFSslswotmukAhXbwq2UUpxi8e5TmmtkH1q8XQrBphBL8yqbYjE7MpQqFbLfa5GZrlp015/LlQxdV/tu84n5Xpf4ihH9Vgdrp07qbN72egDAhKJwUISJgWeYJ6cosD0JoK9AIb7BCud/AAbBsAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">на 12 классических эклеров (или ~20 мини-эклеров):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/699\">заварное тесто</a></span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/700\">шоколадный заварной крем</a></span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\"><a class=\"xref\" href=\"#/r/706\">шоколадная глазурь для эклеров</a></span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сусальное золото</span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Духовку заранее разогреть до 190 градусов (режим: верх/низ). К моменту установки противня с эклерами она должна быть включена как минимум полчаса.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Перевернутый (!) противень слегка сбрызнуть водой и приклеить сверху пергаментную бумагу. Если есть перфорированный коврик, то так же на перевернутый противень кладем коврик.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Охлажденное тесто переложить в кондитерский мешок с насадкой “французская звезда” и отсадить на противне будущие эклеры. Для новичков я рекомендую делать мини-эклеры - они менее капризны в духовке и легче наполняются кремом/глазируются. Длина полосок из теста для мини-эклеров должна быть ~8 см, длина классических эклеров - 12 см.</div></div>\n<p>☄️Важно следить за тем, чтобы в мешке с тестом не было воздушных карманов - перекладывать тесто в мешок нужно одной сплошной массой. Не кладите в мешок слишком много теста, заполните его на 1/3, затем положите кондитерский мешок на стол и распластайте крем по всему объему мешка, убирая воздушные карманы. Соберите тесто снова и отсаживайте.</p>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Отсаженные основы с помощью маленького сита присыпать сахарной пудрой (деликатно, засыпать сильно не нужно) и отправить в духовку на 10 минут. По прошествию этого времени убавить нагрев до 160 и держать в духовке еще 45-55 минут в зависимости от вида эклеров. Они должны стать румяными и твердыми на ощупь.</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Готовые основы достать из духовки, переложить на решетку (снимать с перфорированного коврика лучше с помощью острого ножа) и полностью охладить.</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">С помощью маленькой насадки или маленьким ножом сделать в дне эклеров небольшие дырочки (1 посередине для мини-эклера, 3 для классического эклера). Перенести шоколадный крем в кондитерский мешок, срезать кончик по диагонали, образовав острие и наполнить эклеры кремом. Если крем очень твердый и неподатливый, разомните его теплыми ладонями прямо в мешке. Убрать эклеры в холодильник.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Шоколадную глазурь поставить в микроволновку три раза по 30 секунд. Вытащить и пробить с помощью погружного блендера до однородного гладкого состояния. Глазировать эклеры, держа основу, наполненную кремом, параллельно столу. Опустить в глазурь, поднять, дождаться пока излишки глазури стекут, перевернуть эклер. Для особо роскошного вида декорировать кусочком сусального золота посередине эклера.</div></div><div class=\"outrop\"><p>☄️Глазировать эклеры можно и просто растопленным шоколадом или готовой шоколадной глазурью. Это повлияет на вкусовые качества, но существенно облегчит создание десерта.</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0695_01_696_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0695_02_697_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0695_03_698_photo.webp\" alt=\"\"></figure></div>"},"700":{"id":700,"title":"Заварной крем шоколадный","sub":"crème pâtissière au chocolat","cat":"Десерты","img":"thumb/0700_00_700_photo.webp","lq":"data:image/webp;base64,UklGRr4AAABXRUJQVlA4ILIAAABwBQCdASoUABkAPu1srVCppaQiqAqpMB2JZADClRGAOS3vuYuN6SW0SfRNGn0EzkZVMUIAAP7jAhZ/zmbUrGs2bog0XytQd4okRrPwhwkzJKuNehYql1lcyngHzpSaB15+IehdgkTzKHsfAWCjAgSFGUamXfQxKQCEK0vC6ZL3kTyLKVa5PVwS14pWc9ziGs3XEk6HPG0Rke86LA3XAwgJJmkRzJTUGlToxR71V0VNwAAA","w":360,"h":450,"q":"заварной крем шоколадный crème pâtissière au chocolat  желтки 3 шт 60 г молоко 350 г сливки 33 80 г сахар 50 г крахмал кукурузный 20 г шоколад тёмный 70 г шоколад молочный 70 г масло слив 80 г заварной крем шоколадный cr me p tissi re au chocolat","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0700_00_700_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRr4AAABXRUJQVlA4ILIAAABwBQCdASoUABkAPu1srVCppaQiqAqpMB2JZADClRGAOS3vuYuN6SW0SfRNGn0EzkZVMUIAAP7jAhZ/zmbUrGs2bog0XytQd4okRrPwhwkzJKuNehYql1lcyngHzpSaB15+IehdgkTzKHsfAWCjAgSFGUamXfQxKQCEK0vC6ZL3kTyLKVa5PVwS14pWc9ziGs3XEk6HPG0Rke86LA3XAwgJJmkRzJTUGlToxR71V0VNwAAA) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">желтки 3 шт (60 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 33% 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">крахмал кукурузный 20 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шоколад тёмный 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">шоколад молочный 70 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло слив. 80 г</span></li></ul></div></div></aside><div class=\"main\"><p>[крем должен стабилизироваться по меньшей мере 4 часа, поэтому готовить нужно заранее]</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Молоко соединить со сливками в небольшой кастрюле или сотейнике и поставить на средний огонь. В одной миске с помощью венчика соединить желтки с сахаром и крахмалом до однородности, в другой - смешать два вида шоколада. Сливочное масло нарезать небольшими кубиками.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Когда смесь на огне достигнет температуры ~60 градусов (пойдет пар), тонкой струйкой вылить ее в желтки с сахаром и крахмалом, непрерывно помешивая венчиком. После полного объединения, вернуть смесь в сотейник на средний огонь, довести до кипения (обязательно помешивая венчиком или спатулой, крем будет ощутимо густеть) и проварить в течение 3 минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Вылить горячий заварной крем на шоколад, дать постоять одну минуту и затем интенсивно перемешать до однородной текстуры. Накрыть пленкой “в контакт” и охладить крем в холодильнике или морозилке до ~50-40 градусов.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Вмешать в крем кусочки сливочного масла, пробивая погружным блендером. Хранить крем в холодильнике с пленкой “в контакт” не более 72 часов.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"257\" height=\"320\" src=\"thumb/0700_01_701_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0700_02_702_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0700_03_703_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0700_04_704_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/0700_05_705_photo.webp\" alt=\"\"></figure></div>"},"706":{"id":706,"title":"Шоколадная глазурь для эклеров","sub":"glaçage au chocolat","cat":"Десерты","img":"thumb/0706_00_706_video.webp","lq":"data:image/webp;base64,UklGRrYAAABXRUJQVlA4IKoAAAAQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYwCqXA42w5ev/tMfOBf7pS0/a3WcjxuAAP1OzFC37x9eSMFrp0/GDdw3OnhPlUvPckJBWyXXypLN2bD+Fj+UreYoKZQM7cE46+EEeck7UNTTUJM3FpSJfMI+ogDm3Ff3kv7hCpJp2jXR7T0bbpXzP15889hlVQHSuVyUYo/df2a/4WKwce3r5WgDwh3oZ1bYAA==","w":256,"h":320,"q":"шоколадная глазурь для эклеров glaçage au chocolat  сливки 33 120 г молоко 100 г сахар 144 г какао 48 г желатин листовой 10 г шоколадная глазурь для эклеров gla age au chocolat для тех кто готов заморочиться и у кого есть микроволновая печь и погружной блендер ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"256\" height=\"320\" src=\"img/0706_00_706_video.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRrYAAABXRUJQVlA4IKoAAAAQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYwCqXA42w5ev/tMfOBf7pS0/a3WcjxuAAP1OzFC37x9eSMFrp0/GDdw3OnhPlUvPckJBWyXXypLN2bD+Fj+UreYoKZQM7cE46+EEeck7UNTTUJM3FpSJfMI+ogDm3Ff3kv7hCpJp2jXR7T0bbpXzP15889hlVQHSuVyUYo/df2a/4WKwce3r5WgDwh3oZ1bYAA==) center/cover\" alt=\"\"><span class=\"vid\">видео</span></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 33% 120 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">молоко 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 144 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">какао 48 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">желатин листовой 10 г</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>(для тех, кто готов заморочиться, и у кого есть микроволновая печь и погружной блендер)</p></div><p>(если гранулированный, то 10 г + 60 г ледяной воды)</p>\n<p>[глазурь должна стабилизироваться по меньшей мере 12 часов, лучше делать заранее]</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Желатин замочить в холодной воде. В сотейнике соединить молоко, сливки и сахар, поставить на средний огонь и, помешивая, довести до кипения (добиться полного растворения сахара).</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Добавить какао, тщательно перемешать, проварить в течение трех минут.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Убрать с огня, добавить желатин, пробить все погружным блендером до глянцевого блеска.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Перелить в контейнер, подходящий под глазировку эклеров и убрать в холодильник, ничем не накрывая. Хранить не более 2 недель.</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0706_01_707_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"256\" height=\"320\" src=\"thumb/0706_02_708_video.webp\" alt=\"\"><span class=\"vid\">видео</span></figure></div>"},"783":{"id":783,"title":"Мамин торт","sub":"бисквитный торт с творожным кремом и малиной","cat":"Десерты","img":"thumb/0783_00_783_photo.webp","lq":"data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADwBQCdASoUABkAPu1qq1EppaOiqAqpMB2JbACxDL01AKmvMte5g0Nx8bzYtBcSF2sHU7FKzt1EAAD+059zhlw7nzdhJB/em9g6Jr8af8qvxyF/Ztb/jFBIp7aHgE/XQUCY6BamV/jNd5YSpwq6mnB3UY8b7Q8ertOzGmq4IVchS2wcm+bW4JES/AAZOKeMSvQgF+xJ0TfUzyVF4S3Yv8U/6AcpzoOA2Zu4WGfFNw63rbJWnMHCW2c/weaUX1ohyfCUW1g/rItEzn5J0r/4lt4DryKsGIyOfBbSQSD5Y47AiP04hf5SB2xyjJ5TdAWWd2CCrhWiIAbvLialx5umHCgNJ5YAAA==","w":360,"h":450,"q":"мамин торт бисквитный торт с творожным кремом и малиной черновой крем для начинки творог 9 250 г сливочный сыр 330 г сахарная пудра 60 г стручок ванили 1 шт сливки 30 300 г малина 250 г чистовой крем для декора сливочный сыр 200 г маскарпоне 200 г сахарная пудра 40 г сливки 30 150 200 г клубника голубика мамин торт бисквитный торт с творожным кремом и малиной социальное давление на женщин в особенности матерей в последние годы приобрело совершенно нездоровую силу поэтому в публичном пространстве я стараюсь никогда не использовать фразу которую сейчас скажу я считаю что мама должна кормить уточню сразу с оговорками отбросив любое проявление перфекционизма не инстаграмабл тарелочки не пер","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0783_00_783_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRhABAABXRUJQVlA4IAQBAADwBQCdASoUABkAPu1qq1EppaOiqAqpMB2JbACxDL01AKmvMte5g0Nx8bzYtBcSF2sHU7FKzt1EAAD+059zhlw7nzdhJB/em9g6Jr8af8qvxyF/Ztb/jFBIp7aHgE/XQUCY6BamV/jNd5YSpwq6mnB3UY8b7Q8ertOzGmq4IVchS2wcm+bW4JES/AAZOKeMSvQgF+xJ0TfUzyVF4S3Yv8U/6AcpzoOA2Zu4WGfFNw63rbJWnMHCW2c/weaUX1ohyfCUW1g/rItEzn5J0r/4lt4DryKsGIyOfBbSQSD5Y47AiP04hf5SB2xyjJ5TdAWWd2CCrhWiIAbvLialx5umHCgNJ5YAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><p class=\"lbl\">черновой крем (для начинки):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">творог 9% 250 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 330 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">стручок ванили 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 300 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">малина 250 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">чистовой крем (для декора):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливочный сыр 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">маскарпоне 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 40 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 150-200 г</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">клубника</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">голубика</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Социальное давление на женщин, в особенности матерей, в последние годы приобрело совершенно нездоровую силу, поэтому в публичном пространстве я стараюсь никогда не использовать фразу, которую сейчас скажу. Я считаю, что мама должна кормить. Уточню сразу: с оговорками! Отбросив любое проявление перфекционизма, не инстаграмабл-тарелочки, не первое-второе-десерт-и-компот и не во вред своему ментальному и физическому здоровью. Просто иметь отточенный навык накормить ребенка. Мне в этом плане несказанно повезло, моя мама не только выполняла эту свою функцию, но и выполняла её блестяще (задав, правда, такую высокую планку, что избавляться от нее приходилось в кабинете психотерапевта). Вершиной маминой кулинарной любви были торты, которые она пекла мне на дни рождения. Это длилось не очень долго: когда мне было пять, семья превратилась из обычной в обеспеченную, мама стала заказывать торты в модной кондитерской - большие, белоснежные, с белковыми лебедями и масляными розочками. Тогда, конечно, эти торты производили на гостей праздника вау-эффект, однако, повзрослев, вспоминала я не их, а “лохматые” смешные тортики, которые мама собирала на нашей крошечной кухне. У неё даже был фирменный стиль! Она оформляла торты на манер “аппликации”, приклеивала на крем ягоды, листья и цветы, украшая так не только верхушку, но и бока. Торт этого месяца для нашего Клуба - оммаж моей чудесной маме. Собранные и переработанные знания и воспоминания меня как мамы, меня как кондитера и меня как маленькой девочки, которая видит перед собой не только поднос с красивым тортом и горящими свечами, но и полные любви блестящие мамины глаза.</p>\n<p class=\"lbl\">на торт 2 кг (8-12 порций):</p>\n<ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">шифоновый бисквит, охлажденный и разрезанный на три коржа</span></li></ul></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Приготовить крем для начинки. Для этого в миске как в рецепте сырников нужно пробить творог со сливочным сыром, ванилью и сахарной пудрой с помощью погружного блендера до однородной консистенции. Влить хорошо охлажденные сливки и взбить до загустения.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Для сборки торта я использую поворотный столик, силиконовую спатулу и скребок. Я не люблю работать с кондитерским мешком, на своих мастер-классах тоже всегда показывала, как собирать торт с помощью спатулы. Если нет поворотного столика, подойдет комбо из подложки и скользящей поверхности кухонной столешницы (в идеале, конечно, из камня), но со столиком безусловно проще и быстрее. Техника - на видео в комментариях, опишу важные моменты:</div></div>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">я не пропитываю коржи, потому что сахар в этом торте используется по самому возможному минимуму</span></li></ul>\n<ul class=\"ings\"><li><i class=\"bul\">✨</i><span class=\"tx\">в конце наношу оставшийся крем тонким слоем на всю поверхность торта, убираю излишки и убираю торт в холодильник для стабилизации (минимум - 4 часа, в идеале - 8 часов/ночь)</span></li></ul>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Для чистового крема смешать все ингредиенты в миске до загустения. Здесь важно не перевзбить крем - он не должен напоминать взбитое масло. Как только венчики стали оставлять на креме характерный узор, выключите миксер и промешайте крем спатулой снизу вверх. Если крем не растекается, держит форму, то всё ок, можно покрывать торт. Если кажется, что жидковат, взбейте еще немного. Кстати, на видео в конце показываю простую технику, как украсить торт, если у вас не получается выровнять бока - для этого нужен поворотный столик и ложка.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для декора непосредственно перед праздником помыть ягоды, клубнику нарезать дольками и очень хорошо обсушить бумажными полотенцами. Выложить узор из ягод. Для красоты и сохранности ягод можно покрыть их нейтральным гелем, но торт сразу потеряет “домашний” вайб (а ягоды в любом случае будут потихоньку заветриваться даже с гелем).</div></div>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Готово! Остались лишь свечи и ваши полные любви глаза 😍</div></div></div></div>"},"843":{"id":843,"title":"Granita al limone","sub":"освежающий сицилийский десерт","cat":"Десерты","img":"thumb/0843_00_843_photo.webp","lq":"data:image/webp;base64,UklGRs4AAABXRUJQVlA4IMIAAADQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYgCdM0xlvgv9e6hRPz0XY8CEC+ODdLLuZfUagFAAAP7w1h8/uxpwlsvABBkxEo8p4Rwd9MqgyjcsEvx3KitaYpYxFN9RexmZ9JKqpRRgs2CdRpiU6lTv6mRNKAmmTKVrjtpludeFfw5LgnYSFJ4w3/6aK8eyDsk6CiN88HOtODd1+fy4HH3lRHckj3nYpmt47yEKAjjAtLc0Wr/XYB58rzdIM6/JCUUAAA==","w":360,"h":450,"q":"granita al limone освежающий сицилийский десерт  вода 350 г сахар 200 г сироп глюкозы 50 г лимонный сок 200 г 5 6 лимонов granita al limone освежающий сицилийский десерт вот где где а на сицилии знают толк в умении переживать жару не терпеть но превращать в повод для гастрономического счастья именно здесь в палермо и катании родилась granita al limone лимонная гранита кислая и сладкая с ароматом свежесрезанной цедры и текстурой напоминающей мелкий снежок ключ к настоящей граните в трёх вещах лимонах с","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"800\" src=\"img/0843_00_843_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRs4AAABXRUJQVlA4IMIAAADQBQCdASoUABkAPu1qrlCppaQiqAqpMB2JYgCdM0xlvgv9e6hRPz0XY8CEC+ODdLLuZfUagFAAAP7w1h8/uxpwlsvABBkxEo8p4Rwd9MqgyjcsEvx3KitaYpYxFN9RexmZ9JKqpRRgs2CdRpiU6lTv6mRNKAmmTKVrjtpludeFfw5LgnYSFJ4w3/6aK8eyDsk6CiN88HOtODd1+fy4HH3lRHckj3nYpmt47yEKAjjAtLc0Wr/XYB58rzdIM6/JCUUAAA==) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сироп глюкозы 50 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 200 г (5-6 лимонов)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>Вот где-где, а на Сицилии знают толк в умении переживать жару. Не терпеть, но превращать в повод для гастрономического счастья. Именно здесь, в Палермо и Катании, родилась granita al limone. Лимонная гранита — кислая и сладкая, с ароматом свежесрезанной цедры и текстурой, напоминающей мелкий снежок. Ключ к настоящей граните — в трёх вещах: лимонах, сиропе и терпении.</p>\n<p>С лимонами всё просто и сложно одновременно: они должны быть ароматными, с яркой цедрой, мощно пахнущей эфирными маслами. Если вы в Италии — ищите знаменитые лимоны с побережья Амальфи или Сицилии. Если в России и рядом — берите узбекские, чуть шершавые, с плотной кожурой и душистым запахом. Если в Европе, то просто самые пахучие, желательно с пометкой “био”.</p>\n<p>Теперь немного науки. Почему у граниты такая приятная снежная текстура? Всё дело в управлении кристаллизацией воды. Вода, как мы знаем, замерзает и образует лёд, но если добавить к ней сахар и (особенно!) глюкозный сироп, структура поменяется: сахар замедлит замерзание, а глюкоза поможет избежать крупных кристаллов. Ну а дальше терпение и немного любви, потому что перемешивать граниту каждый час в течение дня — это почти медитативный ритуал и это, конечно, очень по-итальянски: не спешить, наслаждаться процессом, заботиться о деталях. Если у вас есть мороженица, то задача значительно упрощается.</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Лимоны поместить в миску с горячей водой (или отправить в микроволновку на 15-30 секунд). В сотейнике или кастрюле смешать сироп глюкозы, сахар, воду и цедру одного лимона, снятую с помощью микроплана. Перемешать и поставить на средне-сильный огонь. Дождаться полного растворения сахара, процедить и немного остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Выжать лимоны, отмерить нужное количество и добавить к остывшему сиропу, тщательно перемешать, перелить в подходящий для морозилки контейнер и отправить замораживаться.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Дальше — терпение и перемешивание. У всех разные морозилки, поэтому я напишу здесь ориентировочное время, которое может корректироваться в зависимости от ваших обстоятельств. Главный смысл в том, что мы должны каждый час с помощью венчика перемешивать содержимое контейнера, раздробляя кристаллы лимонного льда, таким образом создавая ту самую граниту. В идеале начать утром, в течение дня перемешивать и морозить всю ночь, тогда утром следующего дня десерт готов. Замороженную граниту финально хорошенько процарапать с помощью вилки.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Сформировать шарик с помощью ложки для мороженого, украсить цедрой лимона и скорее подавать. Если вам не чужды интересные сочетания, то посоветую также добавить сверху каплю оливкового масла и щепотку fleur de sel!</div></div></div></div>"},"9001":{"id":9001,"title":"Торт «Вуди Аллен»","sub":"медовые коржи, творожный крем, малина и голубика","cat":"Десерты","img":"thumb/9001_00_9001_photo.webp","lq":"data:image/webp;base64,UklGRpYAAABXRUJQVlA4IIoAAAAQBQCdASoUABkAPu1opU2ppqMiMBgMATAdiWUAyFwQ78VX4fj+RwVwoqftYNC2o24AAP7qZhpCtqfRV8WED0cIH2KBcNXWp5T3JjX1cKdQogty76XDJbAO2D1VlxO1lBgT8qSdO6HdRjvgFWC3mmD3SoKP3QE5KwZsISSNt7Yny+UeXAz8FPzoAAA=","w":360,"h":456,"q":"торт «вуди аллен» медовые коржи, творожный крем, малина и голубика на торт 2 кг 8 12 порций коржи 4 шт по 18 см небольшое количество теста останется из него можно будет сделать печеньки сахар 200 г яйца 2 шт масло сливочное 30 г мёд 100 г сода пищевая 2 г мука 350 400 г крем черновой начинка творог 180 г сыр сливочный 350 г сахарная пудра 80 г сахар ванильный 10 г сливки 30 250 50 г крем чистовой покрытие сыр сливочный 400 г сахарная пудра 60 г сливки 30 150 50 г голубика малина и по желанию a 9002 малиновый гель ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"810\" src=\"img/9001_00_9001_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRpYAAABXRUJQVlA4IIoAAAAQBQCdASoUABkAPu1opU2ppqMiMBgMATAdiWUAyFwQ78VX4fj+RwVwoqftYNC2o24AAP7qZhpCtqfRV8WED0cIH2KBcNXWp5T3JjX1cKdQogty76XDJbAO2D1VlxO1lBgT8qSdO6HdRjvgFWC3mmD3SoKP3QE5KwZsISSNt7Yny+UeXAz8FPzoAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><p class=\"lbl solo\">на торт 2 кг (8-12 порций):</p><div class=\"iblock\"><p class=\"lbl\">коржи 4 шт по 18 см (небольшое количество теста останется, из него можно будет сделать печеньки):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 200 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">яйца 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">масло сливочное 30 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мёд 100 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сода пищевая 2 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">мука 350-400 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">крем черновой (начинка):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">творог 180 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыр сливочный 350 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 80 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар ванильный 10 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 250 + 50 г</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">крем чистовой (покрытие):</p><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">сыр сливочный 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахарная пудра 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сливки 30% 150 + 50 г</span></li></ul></div><div class=\"idiv\">+</div><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">голубика</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">малина и по желанию <a class=\"xref\" href=\"#/r/9002\">малиновый гель</a></span></li></ul></div></div></aside><div class=\"main\"><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Сначала — медовые коржи. В небольшой миске смешать яйца с сахаром и взбить венчиком до светлой пены (без фанатизма). Добавить мёд и сливочное масло, нарезанное кубиками, поставить на водяную баню и, помешивая венчиком, растопить. Следом добавить соду, перемешать венчиком и продолжать нагревать, пока масса не увеличится в объёме примерно в 2 раза. Снять с водяной бани и немного остудить.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Просеянную муку (по нижней границе) поделить на две части. Первую часть добавить в немного охлаждённую медовую массу, тщательно перемешать. Вторую часть муки выложить горкой на рабочую поверхность, вылить в центр тесто и вымесить. Удобнее всего делать это с помощью шпателя, соскребая тесто с рабочей поверхности, всё больше и больше объединяя с мукой. Смотрите за консистенцией и подбавляйте муку, если нужно, но помните, что муки не должно быть слишком много, это отразится на вкусе коржей. Тесто должно быть с одной стороны достаточно пластичным, а с другой — не забитым, ведь после охлаждения оно ещё затвердеет. Разделить тесто на 4 части приблизительно по 190 г, плотно завернуть в пищевую плёнку и убрать в холодильник от получаса до двенадцати часов. Больше хранить такое тесто не рекомендуется, чем быстрее испечёте — тем лучше.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Разогреть духовку до 180 °C (режим: конвекция). Раскатать четыре шарика теста в круги примерным диаметром 18-19 см, часто наколоть вилкой и выпекать около 8 минут (каждый шарик стоит раскатывать на листе пергаментной бумаги, на котором далее выпекать и обрезать). Очень важно следить за коржами, когда печёте впервые, ведь все духовки справятся с задачей за разное время. Коржи должны немного подняться и хорошо зарумяниться. После готовности дать постоять около минуты и вырезать коржи ножом (в качестве трафарета можно использовать кольцо или тарелку нужного диаметра). Не мешкайте — остывая, коржи будут моментально твердеть, и сделать красивый ровный круг будет сложнее.</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Для чернового крема смешать творог со сливочным сыром, сахарной пудрой и ванильным сахаром, перемешать миксером до однородности. Добавить первое количество сливок и взбить крем до загустения. Перемешать спатулой снизу вверх, чтобы избежать комочков. Если крем вышел очень густым, то добавить дополнительные сливки и еще раз взбить до загустения.</div></div>\n<p class=\"lbl\">СБОРКА ТОРТА:</p>\n<div class=\"step\"><span class=\"sn\">5</span><div class=\"st\">Вымыть ягоды и хорошо их обсушить. На тарелку или подложку положить каплю крема - это “клей” для торта. Выложить бисквит, на него нанести ровным слоем 1/3 часть крема для начинки, выложить голубику. Накрыть вторым коржом, нанести 1/3 часть крема и и сделать бортик из крема с помощью кондитерского мешка. Внутрь кольца выложить <a class=\"xref\" href=\"#/r/9002\">малиновый гель</a> и малину. Накрыть третьим коржом, нанести оставшуюся 1/3 часть крема, выложить голубику и закрыть четвертым коржом. Оставшийся крем тонким слоем нанести на всю поверхность торта, убрать излишки и отправить торт в холодильник для стабилизации (минимум - 4 часа, в идеале - 8 часов/ночь).</div></div>\n<div class=\"step\"><span class=\"sn\">6</span><div class=\"st\">Для чистового крема смешать все ингредиенты в миске до загустения. Здесь важно не перевзбить крем - он не должен напоминать взбитое масло. Как только венчики стали оставлять на креме характерный узор, выключите миксер и промешайте крем спатулой снизу вверх. Если крем не растекается, держит форму, то всё ок, можно покрывать торт. Если кажется, что жидковат, взбейте еще немного.</div></div>\n<div class=\"step\"><span class=\"sn\">7</span><div class=\"st\">Покрыть торт чистовым кремом, выровнять, убрать в холодильник на полчаса, затем украсить ободком из малины и голубики. Посмотреть сборку на примере <a class=\"xref\" href=\"#/r/783\">Маминого торта</a> можно здесь</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"448\" src=\"thumb/9001_01_9001_photo.webp\" alt=\"\"></figure></div>"},"9002":{"id":9002,"title":"Малиновая начинка","sub":"для сырников, тартов, профитролей, эклеров и других десертов","cat":"Десерты","img":"thumb/9002_00_9002_photo.webp","lq":"data:image/webp;base64,UklGRq4AAABXRUJQVlA4IKIAAADwBACdASoUABkAPu1srlIppaQiqAgBMB2JQBbZAiER+bz3pfTd6tsVJFbDOWH0yjAA/tMFuwm0FeyLRUJMWO+5nJol1c0LkBDsWQmE20j8aufgdYioFdC8gUALGTmnuqjfGsl8NeNhPdVQd3A+xodinJ/F3TPeopaYOpRiN6l8ukdTcYnXjTbPqECk0+QyDoMmHapm1LpTz+SDh7g1WPQAAAA=","w":360,"h":453,"q":"малиновая начинка для сырников, тартов, профитролей, эклеров и других десертов  пюре малины 400 г пектин nh plus 10 г просто nh 14 г сахар 60 г лимонный сок 8 г ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"805\" src=\"img/9002_00_9002_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRq4AAABXRUJQVlA4IKIAAADwBACdASoUABkAPu1srlIppaQiqAgBMB2JQBbZAiER+bz3pfTd6tsVJFbDOWH0yjAA/tMFuwm0FeyLRUJMWO+5nJol1c0LkBDsWQmE20j8aufgdYioFdC8gUALGTmnuqjfGsl8NeNhPdVQd3A+xodinJ/F3TPeopaYOpRiN6l8ukdTcYnXjTbPqECk0+QyDoMmHapm1LpTz+SDh7g1WPQAAAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">пюре малины 400 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">пектин NH plus 10 г (просто NH 14 г)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сахар 60 г</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лимонный сок 8 г</span></li></ul></div></div></aside><div class=\"main\"><p>Смешать сахар с пектином так, чтобы пектин максимально равномерно распределился. Пюре малины (его можно сделать самостоятельно по рецепту из Бакского чизкейка) нагреть в сотейнике до теплого состояния (ориентир - пар). Непрерывно помешивая венчиком, понемногу всыпать сахар с пектином, довести до кипения, дать побулькать полминуты, выключить нагрев, влить лимонный сок, перемешать и:</p><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">быстро разлить по формочкам для заморозки и убрать в морозилку (быстро застывает, работать надо шустро!)</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">перелить в высокий стакан для погружного блендера и убрать в холодильник (после полного застывания гель нужно пробить блендером до великолепной мягкой текстуры)</div></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"449\" src=\"thumb/9002_01_9002_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"450\" src=\"thumb/9002_02_9002_photo.webp\" alt=\"\"></figure></div>"},"557":{"id":557,"title":"Куриный бульон","sub":"","cat":"Соусы и бульоны","img":"thumb/0557_00_557_photo.webp","lq":"data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAABwBQCdASoUABQAPu1ur1IppiQiqAgBMB2JbAC/U1/H0AGuKOGvZ7W67bKtw5s120ZaBMYAAM45eFajGTT8eJrlKyy5LKfGEi07czcyGF8ABRUsDmXXomvH7juZ+vQRfR0ucuCTk+c39si7ZQeuGRRBN8miK35QdXy06nFtJRec/RAheiiiA2Vyn4tEJPPa9bLwxDek/63tdGhhu/3g3K3F1/KPWw1ghe7vvAJ5vKIbfIGuUfwThLDRvwAXTYOiRU8nLNes4ZCVQHyTg6HHcbVOEVlLzgnqgAA=","w":360,"h":360,"q":"куриный бульон   цельная курица 1500 гр лук 1 шт морковь 2 шт сельдерей 2 стебля тимьян 3 4 веточки петрушка 6 8 веточек лавровый лист 3 шт черный перец горошком 10 15 шт по вашему вкусу вода 3 л а также большая кастрюля даже две мелкое сито или марля я процеживаю бульон через хранящуюся на кухне исключительно для этих вещей сумочку для взвешивания овощей контейнеры для заморозки бульона если делаете заготовки а я советую куриный бульон простота необходимое условие прекрасного л н толстой с куриным бульоном меня связывают совершенно особенные отношения я буквально им одержима мне кажется это какая то точка 0 начало начал константа и абсолют куриный бульон как будто олицетворяет собой то за чем я однажды сунулась в гастрономию его приготовление это один из простейших способов почувствовать себя хорошо ","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"640\" height=\"640\" src=\"img/0557_00_557_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRuQAAABXRUJQVlA4INgAAABwBQCdASoUABQAPu1ur1IppiQiqAgBMB2JbAC/U1/H0AGuKOGvZ7W67bKtw5s120ZaBMYAAM45eFajGTT8eJrlKyy5LKfGEi07czcyGF8ABRUsDmXXomvH7juZ+vQRfR0ucuCTk+c39si7ZQeuGRRBN8miK35QdXy06nFtJRec/RAheiiiA2Vyn4tEJPPa9bLwxDek/63tdGhhu/3g3K3F1/KPWw1ghe7vvAJ5vKIbfIGuUfwThLDRvwAXTYOiRU8nLNes4ZCVQHyTg6HHcbVOEVlLzgnqgAA=) center/cover\" alt=\"\"></figure><div class=\"ingcol\"><div class=\"iblock\"><ul class=\"ings\"><li><i class=\"bul\">⭐️</i><span class=\"tx\">цельная курица ~ 1500 гр</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лук - 1 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">морковь - 2 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">сельдерей - 2 стебля</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">тимьян - 3-4 веточки</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">петрушка - 6-8 веточек</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">лавровый лист - 3 шт</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">черный перец горошком - 10-15 шт (по вашему вкусу)</span></li><li><i class=\"bul\">⭐️</i><span class=\"tx\">вода 3 л</span></li></ul></div><div class=\"iblock\"><p class=\"lbl\">а также:</p><ul class=\"ings\"><li><i class=\"bul\">💥</i><span class=\"tx\">большая кастрюля (даже две)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">мелкое сито или марля (я процеживаю бульон через хранящуюся на кухне исключительно для этих вещей сумочку для взвешивания овощей)</span></li><li><i class=\"bul\">💥</i><span class=\"tx\">контейнеры для заморозки бульона, если делаете заготовки (а я советую!)</span></li></ul></div></div></aside><div class=\"main\"><div class=\"introp\"><p>“Простота - необходимое условие прекрасного”<br>Л.Н.Толстой</p>\n<p>С куриным бульоном меня связывают совершенно особенные отношения. Я буквально им одержима. Мне кажется, это какая-то точка 0, начало начал, константа и абсолют. Куриный бульон как будто олицетворяет собой то, за чем я однажды сунулась в гастрономию. Его приготовление - это один из простейших способов почувствовать себя хорошо и лучший способ начать или возобновить самостоятельное приготовление еды. Это про уют, заботу, комфорт и воспоминания. Столько смыслов в этом простейшем блюде, столько бессознательного. Лучшее лекарство имени наших бабушек, вершина comfort food, согревающий, ароматный, золотистый…</p>\n<p>Как у любого блюда, чей возраст на планете перевалил за пару сотен, у него есть такая же пара сотен вариаций и ипостасей. Что ж, хочу представить вам мою версию, самую-самую любимую. Это рецепт выходного дня, он требует совсем немного внимания и усилий, однако много времени и любви. Отнеситесь к этому рецепту как к медитации, к сеансу эскапизма и бытовой магии.</p>\n<p>На 2 литра бульона<br>(для меня данный рецепт идеален, однако если вы любите очень-очень насыщенный бульон, заливайте курицу двумя литрами питьевой воды, в итоге получится ~литр бульона)</p></div><div class=\"step\"><span class=\"sn\">1</span><div class=\"st\">Курицу обмыть, обсушить бумажными полотенцами, разделать, крупно нарубить, сложить в большую кастрюлю, залить тремя литрами питьевой воды и поставить на сильный огонь. Когда вода закипит, убавить огонь до среднего, шумовкой или ложкой снять образовавшуюся пену.</div></div>\n<div class=\"step\"><span class=\"sn\">2</span><div class=\"st\">Лук разрезать на две половинки и очистить, морковь очистить и вместе с сельдереем крупно нарубить, добавить в кастрюлю к курице. Туда же уложить тимьян, петрушку, лавровый лист и перец горошком, убавить огонь, держать на плите один час.</div></div>\n<div class=\"step\"><span class=\"sn\">3</span><div class=\"st\">Затем еще убавить огонь и держать на плите еще два часа. Крышкой не накрываем, будет понемногу выкипать (так и должно быть).</div></div>\n<div class=\"step\"><span class=\"sn\">4</span><div class=\"st\">Извлечь куриное мясо, кости и овощи. Бульон тщательно процедить, заправить солью и перцем. Я не люблю жирные бульоны, поэтому охлаждаю готовый и с помощью ложки снимаю и утилизирую верхний слой жира, и уже дальше использую бульон в своих целях - либо замораживаю, либо готовлю суп.</div></div><div class=\"outrop\"><p>❓зачем нужно рубить курицу<br>❓почему я не сливаю “первый бульон”<br>❓можно ли варить бульон из куриного супового набора<br>❓зачем варить так долго<br>❓можно ли взять другие овощи</p>\n<p>Эти и другие вопросы обсуждаем завтра в прямом эфире в 12:00 по Москве у меня на кухне, ссылка будет следующим сообщением💜</p></div></div></div>\n<div class=\"gallery\"><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_01_558_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_02_559_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_03_560_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_04_561_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_05_562_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_06_563_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_07_564_photo.webp\" alt=\"\"></figure><figure class=\"\"><img loading=\"lazy\" decoding=\"async\" width=\"360\" height=\"360\" src=\"thumb/0557_08_565_photo.webp\" alt=\"\"></figure></div>"},"566":{"id":566,"title":"Говяжий бульон","sub":"","cat":"Соусы и бульоны","img":"thumb/0566_00_566_photo.webp","lq":"data:image/webp;base64,UklGRgABAABXRUJQVlA4IPQAAACwBQCdASoUABwAPu1oq0+ppiOiMBgIATAdiWwArAHc3YIjVwI+drtPgLJQZSID36k70tJ7lQAA/LCZeP0vStYddTvWlXSBEHIVIG2GUkPyZYDsfg2Rw1WqnxaOrobuVJPv2cnDEkSuZTga9abcpRdYBKNSdoAOU0FUjtoUgP9z7zfOomeR2Sx3XkzizZFKXltBdJx8hMLSUsogv4EoF4lYvlVlncyJDyT24y5AmDh0X/ABrsfcH32ITqIS2av1iH4ZCmpNZ1RoM64+v3+c0AXnppiQQr6clRmwvxDmuLI4g994JsEGDesbfWHk/VpuHMDc1sAA","w":360,"h":503,"q":"говяжий бульон   фарш говяжий 400 500 г томатная паста 50 г лук 1 шт морковь 3 шт сельдерей 2 шт тимьян 3 4 веточки петрушка 6 8 стеблей лавровый лист 3 шт черный перец горошком 10 15 шт по вашему вкусу вода 3 л соль а также большая кастрюля даже две мелкое сито или марля я процеживаю бульон через хранящуюся на кухне исключительно для этих вещей сумочку для взвешивания овощей контейнеры для заморозки говяжий бульон только чистый сердцем может сделать хороший суп л в бетховен вы полагаю уже поняли что я очень люблю бульоны некоторые женщины чувствуют себя некомфортно когда выходят из дома без парфюма а я чувствую себя некомфортно когда в моей морозилке нет бульона в подавляющем большинстве случаев я храню там пару тройку килограммовых брусочков куриного он универсален варится быстро","html":"<div class=\"spread\"><aside class=\"rail\"><figure class=\"hero\"><img fetchpriority=\"high\" decoding=\"async\" width=\"572\" height=\"800\" src=\"img/0566_00_566_photo.webp\" style=\"background:#ece5db url(data:image/webp;base64,UklGRgABAABXRUJQVlA4IPQAAACwBQCdASoUABwAPu1oq0+ppiOiMBgIATAdiWwArAHc3YIjVwI+drtPgLJQZSID36k70tJ7lQAA/LCZeP0vStYddTvWlXSBEHIVIG2GUkPyZYDsfg2Rw1WqnxaOrobuVJPv2cnDEkSuZTga9abcpRdYBKNSdoAOU0FUjtoUgP9z7zfOom
